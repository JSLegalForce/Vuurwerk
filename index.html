volwassenen. Een jongen in een rode jas houdt een doos met F2 vast; voor zijn voeten staat een open zwarte sporttas met vuurwerk.\" width=\"806\" height=\"388\" loading=\"eager\" decoding=\"async\"></figure><div class=\"cq-fb\" hidden><section class=\"cq-res\"><span class=\"cq-ric\" aria-hidden=\"true\"></span><div><h3 class=\"cq-rh\"></h3><p>Je bent als boa bevoegd om het bezit en gebruik van F2- en F3-vuurwerk op te sporen, voor zover je daarvoor bent aangewezen.</p><p>Voor het F2-vuurwerk kun je dus binnen je bevoegdheid optreden.</p><p>Van de andere voorwerpen kun je de categorie op dit moment niet vaststellen. De situatie is rustig en je vermoedt dat het om zwaarder vuurwerk gaat. Je kunt de politie ter plaatse laten komen voor ondersteuning en eventuele verdere opsporing.</p></div></section><section class=\"cq-blok cq-onth\"><span class=\"cq-bic\" data-i=\"lamp\"></span><div><h3>Onthoud</h3><ul><li>Beschrijf wat je ziet, maar stel geen categorie vast die je niet kunt onderbouwen.</li><li>Bij twijfel of een vermoeden van zwaarder vuurwerk kun je de politie ter plaatse laten komen voor ondersteuning en eventuele verdere opsporing.</li></ul></div></section></div></div></div></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0003245/2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet milieubeheer</a> <span class=\"bb-toel\">art. 9.2.2.1a</span></li><li><a href=\"https://wetten.overheid.nl/BWBR0002063/2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet op de economische delicten</a> <span class=\"bb-toel\">art. 1a onder 1° en art. 17</span></li><li><a href=\"https://wetten.overheid.nl/BWBR0041447/2026-09-08\" target=\"_blank\" rel=\"noopener\">Regeling domeinlijsten buitengewoon opsporingsambtenaar</a> <span class=\"bb-toel\">Domein I, onderdeel 9</span></li></ol></div>"},{"kind":"kader","titel":"Wat doe ik nu?","html":"<div class=\"vpp vp-h6 vp-cq\"><div class=\"cq\" data-juist=\"A\"><div class=\"h6-body\"><div class=\"h6-links\"><div class=\"cq-kop\"><span class=\"cq-nr ml-geel\">5</span><span class=\"cq-van\">Vraag 4 van 4</span></div><h2 class=\"vp-t\">Wat doe ik nu?</h2><p class=\"cq-sub\">Welke combinatie van bevoegdheden en handelingen past het beste bij deze situatie?</p><section class=\"cq-taak\"><span class=\"ml-sic\" data-i=\"document\"></span><div><h3>Situatie</h3><p>Je bent bevoegd voor het F2-vuurwerk. In de tas zitten ook andere voorwerpen die sterk lijken op vuurwerk, maar waarvan je de categorie niet kunt vaststellen. De situatie is rustig en je wilt de situatie correct afhandelen.</p><p class=\"cq-vraag\">Wat is nu de beste volgorde van handelen?</p></div></section><div class=\"cq-opts\" role=\"radiogroup\" aria-label=\"Antwoordmogelijkheden\"><button type=\"button\" class=\"cq-opt\" data-ok=\"1\"><span class=\"cq-radio\" aria-hidden=\"true\"></span><span class=\"cq-l\">A</span><span class=\"cq-t\"><span>Ik houd de jongen staande om zijn identiteit vast te stellen. Zo nodig vorder ik inzage in zijn identiteitsbewijs. Ik neem het F2-vuurwerk in beslag, maak een kennisgeving van inbeslagneming en leg mijn bevindingen vast in een proces-verbaal. Voor de overige voorwerpen schakel ik de politie in.</span></span></button><button type=\"button\" class=\"cq-opt\" data-ok=\"0\" data-kop=\"Bijna goed.\"><span class=\"cq-radio\" aria-hidden=\"true\"></span><span class=\"cq-l\">B</span><span class=\"cq-t\"><span>Ik vorder direct inzage in zijn identiteitsbewijs en neem daarna al het vuurwerk in beslag. Vervolgens laat ik de politie bepalen om welke categorie de overige voorwerpen gaan.</span></span></button><button type=\"button\" class=\"cq-opt\" data-ok=\"0\" data-kop=\"Niet juist.\"><span class=\"cq-radio\" aria-hidden=\"true\"></span><span class=\"cq-l\">C</span><span class=\"cq-t\"><span>Ik gebruik de onderzoeksbevoegdheid op grond van de WED en onderzoek zelf alle voorwerpen in de tas, zodat ik kan vaststellen om welke categorie vuurwerk het gaat. Daarna neem ik al het vuurwerk in beslag.</span></span></button><button type=\"button\" class=\"cq-opt\" data-ok=\"0\" data-kop=\"Niet juist.\"><span class=\"cq-radio\" aria-hidden=\"true\"></span><span class=\"cq-l\">D</span><span class=\"cq-t\"><span>Ik houd de jongen staande en neem het F2-vuurwerk in beslag. Een aparte kennisgeving van inbeslagneming is niet nodig; een vermelding in het proces-verbaal is voldoende. De overige voorwerpen laat ik liggen.</span></span></button></div><div class=\"cq-acties\"><button type=\"button\" class=\"btn btn-primary cq-check\" disabled><span>Controleer antwoord</span></button></div></div><div class=\"h6-rechts\"><figure class=\"cq-foto\"><img src=\"assets/images/06-04-wat-doe-ik-nu.webp?v=vw261004c\" alt=\"Een boa in handhavingsuniform, van achteren gezien, staat ’s avonds op een plein bij een groep jongvolwassenen. Een jongen in een rode jas houdt een doos met F2 vast; voor zijn voeten staat een open zwarte sporttas met vuurwerk.\" width=\"805\" height=\"381\" loading=\"eager\" decoding=\"async\"></figure><div class=\"cq-fb\" hidden><section class=\"cq-res\"><span class=\"cq-ric\" aria-hidden=\"true\"></span><div><h3 class=\"cq-rh\"></h3><div class=\"cq-fbx\" data-voor=\"A\"><p class=\"cq-alleen-goed\">Je gebruikt de verschillende bevoegdheden voor het doel waarvoor ze zijn bedoeld.</p><ul><li>Staande houden om de identiteit van de verdachte vast te stellen: art. 52 Sv.</li><li>Vorderen van inzage in een identiteitsbewijs, als dat redelijkerwijs noodzakelijk is voor de taakuitoefening van de boa: art. 8 lid 2 Politiewet 2012.</li><li>Inbeslagneming van daarvoor vatbare voorwerpen in het belang van de opsporing: art. 18 WED.</li><li>Van de inbeslagneming maak je een kennisgeving van inbeslagneming: art. 94 lid 3 Sv.</li><li>Je legt hetgeen je hebt opgespoord, verricht en bevonden vast in een proces-verbaal: art. 152 Sv.</li></ul><p>Van de andere voorwerpen kun je de categorie niet vaststellen. Omdat je vermoedt dat het mogelijk om zwaarder vuurwerk gaat, kun je de politie ter plaatse laten komen voor ondersteuning en eventuele verdere opsporing.</p></div><div class=\"cq-fbx\" data-voor=\"B\" hidden><p>Je kunt de identiteit van de verdachte vaststellen en zo nodig inzage in zijn identiteitsbewijs vorderen. Het probleem zit bij het in beslag nemen van al het aangetroffen vuurwerk.</p><p>Van een deel van de voorwerpen kun je de categorie niet vaststellen. Neem daarom niet automatisch alles zelf in beslag. Omdat je vermoedt dat het mogelijk om zwaarder vuurwerk gaat, kun je de politie ter plaatse laten komen voor ondersteuning en eventuele verdere opsporing.</p></div><div class=\"cq-fbx\" data-voor=\"C\" hidden><p>De WED kent onderzoeksbevoegdheden, maar bevoegd zijn betekent niet dat je onbekend of mogelijk zwaarder vuurwerk zelf verder moet onderzoeken.</p><p>Van deze voorwerpen kun je de categorie niet vaststellen. De situatie is rustig. Je kunt de politie ter plaatse laten komen voor ondersteuning en eventuele verdere opsporing.</p></div><div class=\"cq-fbx\" data-voor=\"D\" hidden><p>Het staande houden en het in beslag nemen van het F2-vuurwerk passen bij de situatie.</p><p>De fout zit in de afhandeling van de inbeslagneming. Van de inbeslagneming maak je een kennisgeving van inbeslagneming. Alleen vermelden in het proces-verbaal is niet voldoende.</p><p>Daarnaast moet je de overige aangetroffen voorwerpen niet negeren. Leg vast wat je hebt waargenomen en wat er met deze voorwerpen is gebeurd.</p></div></div></section><section class=\"cq-blok cq-onth\"><span class=\"cq-bic\" data-i=\"lamp\"></span><div><h3>Onthoud</h3><ul><li>Staande houden → art. 52 Sv.</li><li>Inzage identiteitsbewijs vorderen → art. 8 lid 2 Politiewet 2012.</li><li>Inbeslagneming → art. 18 WED.</li><li>Kennisgeving van inbeslagneming → art. 94 lid 3 Sv.</li><li>Proces-verbaal → art. 152 Sv.</li><li>Bij onbekend of vermoedelijk zwaarder vuurwerk kun je de politie ter plaatse laten komen voor ondersteuning en eventuele verdere opsporing.</li></ul></div></section></div></div></div></div></div>"},{"kind":"kader","titel":"Wat zet ik in het proces-verbaal?","html":"<div class=\"vpp vp-h6 vp-pv\"><div class=\"h6-body\"><figure class=\"h6-foto\"><img src=\"assets/images/06-05-proces-verbaal.webp?v=vw261004c\" alt=\"Een boa in handhavingsuniform, van achteren gezien, staat ’s avonds op een plein bij een groep jongvolwassenen. Een jongen in een rode jas houdt een doos met F2 vast; op de grond staat een open zwarte tas met vuurwerk.\" width=\"809\" height=\"747\" loading=\"eager\" decoding=\"async\"></figure><div class=\"h6-links\"><div class=\"cq-kop\"><span class=\"cq-nr ml-geel\">6</span><span class=\"cq-van\">Praktijk <span class=\"pv-streep\">|</span> Proces-verbaal</span></div><h2 class=\"vp-t\">Wat zet ik in het proces-verbaal?</h2><p class=\"cq-sub\">Leg feitelijk vast wat je zelf zag, hoorde en aantrof.</p><section class=\"cq-blok pv-op\"><span class=\"cq-bic\" data-i=\"document\"></span><div><h3>Neem in elk geval op</h3><ul><li>datum, tijd en plaats;</li><li>wat je zelf zag en hoorde;</li><li>wie welke handelingen verrichtte;</li><li>wat op de doos stond, bijvoorbeeld “F2” en “geschikt voor particulier gebruik”;</li><li>dat er daarnaast andere voorwerpen lagen die sterk op vuurwerk leken, maar waarvan je de categorie niet kon vaststellen;</li><li>waar de voorwerpen lagen of uit welke tas/doos ze kwamen.</li></ul></div></section><section class=\"cq-blok pv-niet\"><span class=\"pv-x\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6 6 18\"/></svg></span><div><h3>Schrijf niet op</h3><ul><li>gok niet naar de categorie van andere voorwerpen;</li><li>schrijf niet op dat iets F3 of zwaarder is als je dat niet zelf kunt vaststellen;</li><li>Maak duidelijk onderscheid tussen wat je zelf hebt waargenomen en wat anderen hebben verklaard of meegedeeld.</li></ul></div></section><section class=\"cq-blok pv-denk\"><span class=\"cq-bic\" data-i=\"lijst\"></span><div><h3>Denk aan</h3><ul><li>beschrijf aantallen, kleur, vorm en verpakking;</li><li>noteer of voorwerpen verpakt of los lagen;</li><li>leg vast welke tekst of etiketten je zag;</li><li>Maak een foto van wat je aantrof en voeg deze als bijlage bij je proces-verbaal.</li></ul></div></section><section class=\"cq-blok cq-info\"><span class=\"cq-ii\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 11v6M12 7h.01\"/></svg></span><div><h3>Feitcodes en lokale afspraken</h3><p>Naar verwachting zijn op 1 december 2026 de feitcodes voor het bezit en gebruik van F2- en F3-vuurwerk bekend. Kijk ook welke afspraken binnen jouw gemeente gelden over de afhandeling van in beslag genomen vuurwerk. Met deze informatie kun je de overtredingsgegevens correct invullen.</p></div></section></div></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0001903/2026-07-01\" target=\"_blank\" rel=\"noopener\">Wetboek van Strafvordering</a> <span class=\"bb-toel\">art. 152</span></li><li><a href=\"https://wetten.overheid.nl/BWBR0003245/2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet milieubeheer</a> <span class=\"bb-toel\">art. 9.2.2.1a</span></li></ol></div>"},{"kind":"theory","titel":"Voorbeeld proces-verbaal","html":"<h2 class=\"ptitle\">Voorbeeld proces-verbaal</h2><div class=\"main\"><div class=\"pvr\"><h4><span class=\"pvr-n\">1</span>Aanleiding</h4><p>Op zaterdag 21 november 2026 omstreeks 21.05 uur bevond ik, verbalisant [naam], mij in uniform en in surveillance op [plaats], samen met collega [naam]. Ik hoorde een harde knal en zag direct daarna rook opstijgen bij een groep van vier personen.</p></div><div class=\"pvr\"><h4><span class=\"pvr-n\">2</span>Eigen waarneming</h4><p>Ik zag dat een man in een rode jas, later genoemd [naam], een lege kartonnen huls op de grond gooide. Daarna zag ik dat hij een doos pakte uit een open zwarte sporttas die direct voor zijn voeten stond. Gedurende mijn waarneming zag ik niet dat een ander de tas aanraakte. Op die doos las ik de opdrukken «F2» en «Geschikt voor particulier gebruik». In de tas zag ik [aantal] gesloten dozen met op het etiket «F2», elk ongeveer [afmetingen].</p></div><div class=\"pvr\"><h4><span class=\"pvr-n\">3</span>Verdachte en identiteitsvaststelling</h4><p>Op grond van deze waarnemingen ontstond bij mij het redelijk vermoeden dat [naam] vuurwerk van categorie F2 bezat in strijd met artikel 9.2.2.1a, eerste lid, Wet milieubeheer. Om [tijd] uur heb ik hem staande gehouden (artikel 52 Sv) en zijn identiteit vastgesteld: [identiteitsgegevens].</p></div><div class=\"pvr\"><h4><span class=\"pvr-n\">4</span>Inbeslagneming</h4><p>Ik heb de doos uit zijn hand en de [aantal] dozen met «F2» uit de tas in beslag genomen (artikel 18 WED). Ik heb een kennisgeving van inbeslagneming opgemaakt (artikel 94 Sv) en hem een bewijs van ontvangst gegeven. Het vuurwerk is geregistreerd onder [registratienummer].</p></div><div class=\"pvr\"><h4><span class=\"pvr-n\">5</span>Overige voorwerpen</h4><p>In de tas zag ik daarnaast [aantal] voorwerpen zonder verpakking of etiket, elk ongeveer [afmetingen]. Van deze voorwerpen kon ik de categorie niet vaststellen. Ik heb ze niet aangeraakt.</p></div><div class=\"pvr\"><h4><span class=\"pvr-n\">6</span>Overdracht aan politie</h4><p>Om [tijd] uur heb ik de situatie en de overige voorwerpen overgedragen aan [politie-eenheid].</p></div><div class=\"pvr\"><h4><span class=\"pvr-n\">7</span>Foto’s / bijlagen</h4><p>Ik heb foto’s gemaakt van de tas, de dozen met «F2» en de overige voorwerpen. Deze foto’s zijn als bijlage bij dit proces-verbaal gevoegd.</p></div><p class=\"pvr-slot\">Waarvan door mij is opgemaakt dit proces-verbaal, dat ik sloot en ondertekende op [datum] te [plaats].</p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0001903/2026-07-01\" target=\"_blank\" rel=\"noopener\">Wetboek van Strafvordering</a> <span class=\"bb-toel\">art. 52, 94 en 152</span></li><li><a href=\"https://wetten.overheid.nl/BWBR0002063/2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet op de economische delicten</a> <span class=\"bb-toel\">art. 18</span></li><li><a href=\"https://wetten.overheid.nl/BWBR0003245/2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet milieubeheer</a> <span class=\"bb-toel\">art. 9.2.2.1a</span></li></ol></div>"},{"kind":"figuur","titel":"De vier vragen op straat","html":"<div class=\"figcap\">De vier vragen op straat</div><figure class=\"illu\"><svg viewBox=\"0 0 560 60\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>De vier vragen op straat</title><desc>Vier vragen na elkaar: wat tref ik aan, is dit strafbaar, ben ik bevoegd, wat doe ik nu. Is alles helder, handel dan binnen je bevoegdheid en taak. Twijfel je, overleg of schakel de politie in. Veiligheid weegt altijd mee. Leg feiten vast, geen aannames.</desc></svg></figure>"}],"titel":"Praktijkcasus: van melding tot proces-verbaal","type":"samenvatting","vragen":[]}],"totaalVragen":16,"version":"0.9.2"};window.__ICONS__={"megafoon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 11v2a1 1 0 0 0 1 1h2l3.5 3.5V6.5L6 10H4a1 1 0 0 0-1 1Z\"/><path d=\"M12 8a4 4 0 0 1 0 8\"/></svg>","balans":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3v18M7 21h10\"/><path d=\"M12 6 5 8m7-2 7 2\"/><path d=\"M5 8 2.5 13a3 3 0 0 0 5 0L5 8Zm14 0-2.5 5a3 3 0 0 0 5 0L19 8Z\"/></svg>","wet":"<svg viewBox=\"0 0 24 24\" fil x=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17h.01\"/></svg>","ster":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg>","praktijk":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg>"};</script>

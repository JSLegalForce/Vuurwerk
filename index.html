ass=\"ptitle\">Vooruitblik: Onbekend en zwaar illegaal vuurwerk<\/h2><div class=\"main\"><p>Je weet nu hoe je van mogen naar doen gaat. Maar wat als het vuurwerk gevaarlijk kan zijn?<\/p><p>In het volgende onderwerp komen veiligheid en bevoegdheid samen.<\/p><\/div>"}],"titel":"Wat mag je als boa doen?","type":"content","vragen":[{"artikel":"Art. 52 Sv","juist":2,"kernregel":"Staande houden: alleen een verdachte (artikel 52 Sv).","opties":["Ja, een boa mag iedereen staande houden.","Ja, als hij in de buurt van vuurwerk staat.","Nee, je kunt wel aanspreken. Staande houden kan bij een verdachte.","Nee, staande houden mag alleen de politie."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is C. Artikel 52 Sv geeft iedere opsporingsambtenaar de bevoegdheid om de identiteit van de verdachte vast te stellen en hem daartoe staande te houden. Zonder verdenking kun je alleen aanspreken. [[1]]","voetnoten":["Wetboek van Strafvordering (geldend vanaf 1 juli 2026)."],"vraag":"Je spreekt een jongere aan die naast een tas staat. Je hebt nog geen aanwijzing voor een strafbaar feit. Mag je hem staande houden?","wet":"Wetboek van Strafvordering"},{"artikel":"Art. 23 WED","juist":0,"kernregel":"Vervoermiddelen onderzoeken: artikel 23 WED.","opties":["Artikel 23 WED.","Artikel 26 WED.","Artikel 52 Sv.","Artikel 18 WED."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is A. Artikel 23 WED geeft opsporingsambtenaren de bevoegdheid vervoermiddelen en hun lading te onderzoeken, voor zover redelijkerwijs nodig voor de vervulling van hun taak. [[1]]","voetnoten":["Wet op de economische delicten (geldend vanaf 1 augustus 2026)."],"vraag":"De jongeren leggen een tas met vuurwerk in de kofferbak van een auto. Je wilt de lading onderzoeken. Welk artikel hoort daarbij?","wet":"Wet op de economische delicten"},{"artikel":"Art. 24a WED","juist":3,"kernregel":"Medewerking vorderen: artikel 24a WED.","opties":["Artikel 24 WED.","Artikel 26 WED.","Artikel 27 Sv.","Artikel 24a WED."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is D. Artikel 24a WED: een ieder is verplicht aan de opsporingsambtenaren alle medewerking te verlenen die deze redelijkerwijs kunnen vorderen bij de uitoefening van hun bevoegdheden. Artikel 24 WED gaat over regels voor het stilhouden en over versperringen. [[1]]","voetnoten":["Wet op de economische delicten (geldend vanaf 1 augustus 2026)."],"vraag":"De bestuurder weigert de kofferbak te openen. Op welk artikel baseer je dat hij moet meewerken?","wet":"Wet op de economische delicten"},{"artikel":"Art. 18 WED","juist":1,"kernregel":"Inbeslagneming en uitlevering vorderen: artikel 18 WED.","opties":["Artikel 26 WED; uitlevering is daar een aparte bevoegdheid.","Artikel 18 WED; je kunt daartoe uitlevering vorderen.","Artikel 23 WED; dat artikel gaat over alle voorwerpen.","Artikel 24 WED; dat artikel gaat over versperringen."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is B. Artikel 18, eerste lid, WED: opsporingsambtenaren zijn bevoegd tot inbeslagneming van daarvoor vatbare voorwerpen. «Zij kunnen daartoe hun uitlevering vorderen.» Uitlevering vorderen is dus een middel om tot inbeslagneming te komen. [[1]]","voetnoten":["Wet op de economische delicten (geldend vanaf 1 augustus 2026)."],"vraag":"Je wilt verpakt F2-vuurwerk van een verdachte in beslag nemen. Wat is de WED-grondslag, en hoe vorder je afgifte?","wet":"Wet op de economische delicten"},{"artikel":"Art. 26 WED","juist":2,"kernregel":"Artikel 26 WED maakt weigeren strafbaar; het is geen bevoegdheid.","opties":["Dat jij het vuurwerk dan met geweld mag afpakken.","Dat de vordering dan vervalt.","Dat het opzettelijk niet voldoen zelf een economisch delict is.","Dat jij hem dan altijd moet aanhouden."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is C. Artikel 26 WED: «Het opzettelijk niet voldoen aan een vordering, krachtens enig voorschrift van deze wet gedaan door een opsporingsambtenaar, is een economisch delict.» Het is geen extra bevoegdheid. [[1]]","voetnoten":["Wet op de economische delicten (geldend vanaf 1 augustus 2026)."],"vraag":"Je vordert uitlevering van het vuurwerk. De verdachte weigert opzettelijk. Wat regelt artikel 26 WED?","wet":"Wet op de economische delicten"},{"artikel":"Art. 94 Sv","juist":0,"kernregel":"Na inbeslagneming: kennisgeving van inbeslagneming.","opties":["Een kennisgeving van inbeslagneming.","Een aangifte namens de verdachte.","Een verzoek aan de burgemeester.","Een bewijs van ontheffing."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is A. Van de inbeslagneming van een voorwerp wordt door de opsporingsambtenaar een kennisgeving van inbeslagneming opgemaakt (art. 94 lid 3 Sv). Zoveel mogelijk wordt een bewijs van ontvangst afgegeven. [[1]]","voetnoten":["Wetboek van Strafvordering (geldend vanaf 1 juli 2026)."],"vraag":"Je neemt op straat twee verpakkingen met «F2» in beslag. Wat maak je daarna op?","wet":"Wetboek van Strafvordering"},{"artikel":"Art. 54 Sv","juist":1,"kernregel":"Buiten heterdaad: niet zelfstandig aanhouden; eerst bevel of overleg.","opties":["Je mag hem nu zelf aanhouden, net als bij heterdaad.","Buiten heterdaad houd je in beginsel aan op bevel van de (hulp)officier van justitie.","Aanhouden kan nooit, want vuurwerk is een overtreding.","Je mag hem aanhouden als hij weigert zijn naam te geven."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is B. Dit is geen heterdaad meer (art. 128 Sv). Buiten heterdaad kan alleen worden aangehouden bij verdenking van een misdrijf waarvoor voorlopige hechtenis is toegelaten (art. 54 en 67 Sv), en in beginsel op bevel van de officier van justitie of hulpofficier. Alleen als dat bevel niet kan worden afgewacht, mag de opsporingsambtenaar zelf handelen. Overleg dus eerst. [[1]]","voetnoten":["Wetboek van Strafvordering (geldend vanaf 1 juli 2026)."],"vraag":"Een collega zag gisteren dat een jongen opzettelijk F3-vuurwerk afstak. Vandaag zie je de jongen op straat. Wat is juist?","wet":"Wetboek van Strafvordering"}]},{"icoon":"waarschuwing","id":"m6","kader":"Veiligheid en bevoegdheid","nr":6,"pages":[{"kind":"lo","titel":"Leerdoelen","html":"<h2 class=\"ptitle\">Leerdoelen<\/h2><p class=\"pintro\">Centrale vraag: zelf optreden of politie inschakelen?<\/p><ul class=\"lo\"><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je dat praktijktermen geen wettelijke categorieën zijn;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>herken je situaties met onbekend, zwaar, aangepast of zelfgemaakt vuurwerk;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>ken je het verschil tussen bevoegd zijn, veilig kunnen handelen en de afgesproken taakverdeling;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je wanneer je niet zelf verder gaat en de politie inschakelt.<\/span><\/li><\/ul>"},{"kind":"casus","titel":"Een tas zonder etiketten","html":"<span class=\"q-soort\">Voorbeeld<\/span><h2 class=\"ptitle\">Een tas zonder etiketten<\/h2><p class=\"lees\">Je ziet een tas op de grond. Er zit vuurwerk in. Niets heeft een verpakking of etiket. Een paar stukken zijn groot, met tape omwikkeld, en zien er zelfgemaakt uit.<\/p><p class=\"lees\">De eigenaar is weg. Omstanders kijken toe. Wat doe je?<\/p>"},{"kind":"theory","titel":"Praktijkterm is geen wettelijke categorie","html":"<h2 class=\"ptitle\">Praktijkterm is geen wettelijke categorie<\/h2><div class=\"main\"><p>Op straat hoor je woorden als «zwaar illegaal vuurwerk», «nitraten», «Cobra’s», «mortieren» of «lawinepijlen». Het Handhavingsplan beschrijft acties waarbij «zwaar illegaal vuurwerk, zoals mortieren, nitraatbommen en lawinepijlen» in beslag werd genomen.<\/p><p><b>Een praktijkterm is geen wettelijke categorie.<\/b> De wet kent alleen de categorieën F1, F2, F3 en F4 en begrippen als professioneel vuurwerk.<\/p><p>Noem een nitraat dus niet automatisch F3, F4 of een andere categorie. Beschrijf in je proces-verbaal wat je ziet.<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Handhavingsplan jaarwisseling, Ministerie van Justitie en Veiligheid, maart 2026 (beleid) – https://www.rijksoverheid.nl/documenten/2026/03/16/tk-bijlage-geactualiseerd-handhavingsplan-jaarwisseling-feb-2026<\/li><li>Vuurwerkbesluit, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0013360/2026-08-01<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Aangepast of zelfgemaakt vuurwerk","html":"<span class=\"q-soort\">Wet<\/span><h2 class=\"ptitle\">Aangepast of zelfgemaakt vuurwerk<\/h2><div class=\"main\"><p>Soms is vuurwerk aangepast, samengevoegd of zelf gemaakt. Dat is extra gevaarlijk, omdat niemand weet hoe het werkt.<\/p><p>Het Vuurwerkbesluit verbiedt het vervaardigen of bewerken van vuurwerk zonder omgevingsvergunning (artikel 1.2.3). Niet in een categorie ingedeelde pyrotechnische artikelen gelden voor enkele verboden als professioneel vuurwerk (artikel 1.2.2, achtste lid).<\/p><p>Voor zulk vuurwerk geldt dus het Vuurwerkbesluit. Dat valt niet onder domein I, onderdeel 9 (zie onderwerp 4). Schakel de politie in.<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Vuurwerkbesluit, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0013360/2026-08-01<\/li><li>Regeling domeinlijsten buitengewoon opsporingsambtenaar, bijlage, Domein I, onderdeel 9, zoals gewijzigd bij Stcrt. 2026, 31362 (in werking 8 september 2026) – https://zoek.officielebekendmakingen.nl/stcrt-2026-31362.html<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Onbekend vuurwerk: wat weet je wel en niet?","html":"<h2 class=\"ptitle\">Onbekend vuurwerk: wat weet je wel en niet?<\/h2><div class=\"main\"><p>Bij onbekend vuurwerk heb je de categorie nog niet betrouwbaar vastgesteld. Je weet dus ook niet hoe gevaarlijk het is.<\/p><p>Je weet wel wat je ziet: de vorm, de grootte, de hoeveelheid en waar het ligt. Dat schrijf je op.<\/p><p>Wat je niet weet, vul je niet zelf in.<\/p><\/div>"},{"kind":"theory","titel":"Bevoegd is niet hetzelfde als veilig","html":"<span class=\"q-soort\">Veiligheid<\/span><h2 class=\"ptitle\">Bevoegd is niet hetzelfde als veilig<\/h2><div class=\"main\"><p><b>Bevoegd zijn betekent niet automatisch dat het veilig is om zelf te handelen.<\/b><\/p><p>De WED geeft opsporingsambtenaren zelfs de bevoegdheid om zaken te onderzoeken en daarvoor verpakkingen te openen (artikel 21 WED). Maar bij onbekend of mogelijk zwaar vuurwerk kan dat gevaarlijk zijn.<\/p><p>Het Handhavingsplan zegt: «(…) tegelijkertijd geldt als uitgangspunt binnen het huidige en toekomstige boa-bestel dat boa’s niet worden ingezet in situaties met een hoge mate van gevaarzetting.»<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wet op de economische delicten, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0002063/2026-08-01<\/li><li>Handhavingsplan jaarwisseling, Ministerie van Justitie en Veiligheid, maart 2026 (beleid) – https://www.rijksoverheid.nl/documenten/2026/03/16/tk-bijlage-geactualiseerd-handhavingsplan-jaarwisseling-feb-2026<\/li><\/ol><\/div>"},{"kind":"figuur","titel":"Drie aparte vragen","html":"<div class=\"figcap\">Drie aparte vragen<\/div><figure class=\"illu\"><svg viewBox=\"0 0 560 60\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>Drie aparte vragen<\/title><desc>Drie vragen die je los van elkaar beantwoordt: ben ik juridisch bevoegd, kan ik veilig handelen en wat is de afgesproken taakverdeling. Alle drie bepalen samen wat je doet.<\/desc><\/svg><\/figure>"},{"kind":"kaart","titel":"Wanneer stop je met zelf onderzoeken?","html":"<h2 class=\"ptitle\">Wanneer stop je met zelf onderzoeken?<\/h2><div class=\"kaart k-letop\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17h.01\"/><\/svg><\/span><span class=\"kaart-lab\">Let op<\/span><\/div><div class=\"kaart-t\">Wanneer stop je met zelf onderzoeken?<\/div><div class=\"kaart-b\"><p>Twijfel je aan de veiligheid? Ga dan niet zelf verder.<\/p><ul class=\"opsom\"><li>Raak onbekend of mogelijk zwaar vuurwerk niet aan.<\/li><li>Maak het niet open en haal het niet uit elkaar.<\/li><li>Houd afstand en vraag omstanders weg te blijven.<\/li><li>Schakel de politie in en meld wat je hebt gezien.<\/li><\/ul><p>Deze opleiding noemt bewust geen afstanden in meters. Volg de instructies van je werkgever en de politie.<\/p><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Handhavingsplan jaarwisseling, Ministerie van Justitie en Veiligheid, maart 2026 (beleid) – https://www.rijksoverheid.nl/documenten/2026/03/16/tk-bijlage-geactualiseerd-handhavingsplan-jaarwisseling-feb-2026<\/li><\/ol><\/div>"},{"kind":"casus","titel":"Zelf optreden of politie inschakelen?","html":"<span class=\"q-soort\">Voorbeeld<\/span><h2 class=\"ptitle\">Zelf optreden of politie inschakelen?<\/h2><p class=\"lees\">Terug naar de tas zonder etiketten. Je bent misschien bevoegd. Maar is het veilig? En wat is er afgesproken met de politie?<\/p><p class=\"lees\">Denk na over de drie vragen voordat je verdergaat.<\/p>"},{"kind":"casus","titel":"Zelf optreden of politie inschakelen? — betekenis","html":"<span class=\"q-soort\">Voorbeeld<\/span><h2 class=\"ptitle\">Zelf optreden of politie inschakelen? — betekenis<\/h2><div class=\"kaart k-voorbeeld\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3v18M7 21h10\"/><path d=\"M12 6 5 8m7-2 7 2\"/><path d=\"M5 8 2.5 13a3 3 0 0 0 5 0L5 8Zm14 0-2.5 5a3 3 0 0 0 5 0L19 8Z\"/><\/svg><\/span><span class=\"kaart-lab\">Voorbeeld<\/span><\/div><div class=\"kaart-t\">Betekenis voor de praktijk<\/div><div class=\"kaart-b\"><p><b>Bevoegd?<\/b> Je weet niet of het F2 of F3 is. Het kan ook F4 of zelfgemaakt vuurwerk zijn. Je bevoegdheid is dus onzeker.<\/p><p><b>Veilig?<\/b> Nee, niet zeker. Het vuurwerk is onbekend en mogelijk zwaar.<\/p><p><b>Taakverdeling?<\/b> Volgens het Handhavingsplan is de politie verantwoordelijk voor zwaar of crimineel vuurwerk.<\/p><p>Conclusie: niet zelf onderzoeken, afstand houden, omstanders op afstand houden en de politie inschakelen.<\/p><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Handhavingsplan jaarwisseling, Ministerie van Justitie en Veiligheid, maart 2026 (beleid) – https://www.rijksoverheid.nl/documenten/2026/03/16/tk-bijlage-geactualiseerd-handhavingsplan-jaarwisseling-feb-2026<\/li><\/ol><\/div>"},{"kind":"onthoud","titel":"Kort samengevat","html":"<h2 class=\"ptitle\">Kort samengevat<\/h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-t\">Onbekend en zwaar vuurwerk<\/div><div class=\"kaart-b\"><ul class=\"punten\"><li>Praktijktermen als «nitraten» zijn geen wettelijke categorieën.<\/li><li>Aangepast of zelfgemaakt vuurwerk is extra gevaarlijk.<\/li><\/ul><\/div><\/div>"},{"kind":"onthoud","titel":"Kort samengevat","html":"<h2 class=\"ptitle\">Kort samengevat<\/h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-t\">Zelf optreden of politie?<\/div><div class=\"kaart-b\"><ul class=\"punten\"><li>Bevoegd zijn betekent niet automatisch dat het veilig is om zelf te handelen.<\/li><li>Boa’s worden niet ingezet in situaties met een hoge mate van gevaarzetting.<\/li><li>Bij twijfel: niet zelf verder, maar politie inschakelen.<\/li><\/ul><\/div><\/div>"},{"kind":"theory","titel":"Vooruitblik: Taakverdeling tussen boa en politie","html":"<h2 class=\"ptitle\">Vooruitblik: Taakverdeling tussen boa en politie<\/h2><div class=\"main\"><p>Je weet nu dat bevoegdheid en veiligheid niet hetzelfde zijn. Er is nog een derde vraag: wat is er afgesproken?<\/p><p>Daarover gaat het volgende onderwerp.<\/p><\/div>"}],"titel":"Onbekend en zwaar illegaal vuurwerk","type":"content","vragen":[{"artikel":"Werkwijze","juist":0,"kernregel":"Bevoegd, veilig en taakverdeling zijn drie aparte vragen.","opties":["Ben ik bevoegd? Kan ik veilig handelen? Wat is de afgesproken taakverdeling?","Wie is de eigenaar? Hoeveel is het waard? Waar is het gekocht?","Is het donker? Zijn er omstanders? Is er een camera in de buurt?","Is het legaal? Is het zwaar? Is het duur geweest om te kopen?"],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is A. Bevoegdheid, veiligheid en taakverdeling zijn drie aparte vragen. Samen bepalen ze wat je doet.","voetnoten":[],"vraag":"Welke drie vragen beoordeel je los van elkaar bij onbekend of zwaar vuurwerk?","wet":"—"},{"artikel":"Werkwijze","juist":3,"kernregel":"Bevoegd is niet hetzelfde als veilig.","opties":["Omdat je bevoegd bent, onderzoek je het zelf verder.","Omdat het zelfgemaakt is, ben je nooit meer bevoegd.","Je maakt het open om te zien wat erin zit.","Bevoegd zijn betekent niet dat het veilig is om zelf te handelen."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is D. Bevoegd zijn betekent niet automatisch dat het veilig is om zelf te handelen. Het Handhavingsplan gaat ervan uit dat boa’s niet worden ingezet in situaties met een hoge mate van gevaarzetting. [[1]]","voetnoten":["Handhavingsplan jaarwisseling, Ministerie van Justitie en Veiligheid, maart 2026."],"vraag":"Je bent bevoegd, maar het vuurwerk is groot, met tape omwikkeld en zonder etiket. Wat is juist?","wet":"—"},{"artikel":"Art. 21 WED","juist":1,"kernregel":"Een bevoegdheid is geen plicht. Veiligheid gaat voor.","opties":["Ja, de wet verplicht je om het te onderzoeken.","Nee, een bevoegdheid is geen plicht; veiligheid gaat voor.","Ja, maar alleen als er geen omstanders zijn.","Nee, artikel 21 WED geldt niet bij vuurwerk."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is B. Een bevoegdheid is geen verplichting. Bij onbekend of mogelijk zwaar vuurwerk maak je het niet open. Je houdt afstand en schakelt de politie in. [[1]]","voetnoten":["Wet op de economische delicten (geldend vanaf 1 augustus 2026)."],"vraag":"Artikel 21 WED geeft opsporingsambtenaren de bevoegdheid om verpakkingen te openen. Betekent dit dat je onbekend vuurwerk moet openmaken?","wet":"Wet op de economische delicten"},{"artikel":"Werkwijze","juist":2,"kernregel":"Leg vast wat je ziet. Vul niet zelf in wat je niet weet.","opties":["De categorie die je denkt dat het is.","Of het vuurwerk legaal of verboden is.","De vorm, de grootte, de hoeveelheid en waar het ligt.","Waar en wanneer het vuurwerk is gekocht."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is C. Je legt vast wat je waarneemt. Wat je niet weet, vul je niet zelf in.","voetnoten":[],"vraag":"Bij onbekend vuurwerk weet je de categorie niet. Wat leg je wél vast?","wet":"—"}]},{"icoon":"document","id":"m7","kader":"Handhavingsplan","nr":7,"pages":[{"kind":"lo","titel":"Leerdoelen","html":"<h2 class=\"ptitle\">Leerdoelen<\/h2><p class=\"pintro\">Wat je na dit onderwerp kunt.<\/p><ul class=\"lo\"><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>ken je het verschil tussen bevoegdheid en taakverdeling;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je wat het Handhavingsplan jaarwisseling is;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je wat het Handhavingsplan zegt over de inzet van boa’s;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>kun je kiezen tussen zelf afhandelen, overleggen en politie inschakelen;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je hoe een overdracht aan de politie verloopt.<\/span><\/li><\/ul>"},{"kind":"theory","titel":"Mogen en doen zijn twee dingen","html":"<h2 class=\"ptitle\">Mogen en doen zijn twee dingen<\/h2><div class=\"main\"><p><b>Juridische bevoegdheid<\/b> is wat je volgens de actuele wet mág.<\/p><p><b>Taakverdeling<\/b> is wat in de praktijk van jou wordt verwacht.<\/p><p>Je kunt dus bevoegd zijn voor iets, terwijl de afspraak is dat de politie het oppakt. En andersom: een afspraak geeft je geen bevoegdheid die je niet hebt.<\/p><\/div>"},{"kind":"figuur","titel":"Bevoegdheid naast taakverdeling","html":"<div class=\"figcap\">Bevoegdheid naast taakverdeling<\/div><figure class=\"illu\"><svg viewBox=\"0 0 560 60\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>Bevoegdheid naast taakverdeling<\/title><desc>Twee aparte vragen naast elkaar: bevoegdheid is wat je juridisch mag, taakverdeling is wat van je wordt verwacht. Samen bepalen ze wat je op straat doet.<\/desc><\/svg><\/figure>"},{"kind":"theory","titel":"Het Handhavingsplan jaarwisseling","html":"<span class=\"q-soort\">Beleid<\/span><h2 class=\"ptitle\">Het Handhavingsplan jaarwisseling<\/h2><div class=\"main\"><p>Het Handhavingsplan jaarwisseling is van het Ministerie van Justitie en Veiligheid. De eerste versie verscheen in november 2025. De geactualiseerde versie is van maart 2026.<\/p><p>Het plan beschrijft preventie, handhaving en opsporing rond de jaarwisseling, en de rol van gemeenten, politie, OM en boa’s.<\/p><p>Let op: het plan is geschreven vóór de wijziging van de domeinlijst op 8 september 2026. Handhavingsplan = taakverdeling en prioriteiten op dat moment. Actuele wet en domeinlijst = jouw juridische bevoegdheid.<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Handhavingsplan jaarwisseling, Ministerie van Justitie en Veiligheid, maart 2026 (beleid) – https://www.rijksoverheid.nl/documenten/2026/03/16/tk-bijlage-geactualiseerd-handhavingsplan-jaarwisseling-feb-2026<\/li><li>Regeling domeinlijsten buitengewoon opsporingsambtenaar, bijlage, Domein I, onderdeel 9, zoals gewijzigd bij Stcrt. 2026, 31362 (in werking 8 september 2026) – https://zoek.officielebekendmakingen.nl/stcrt-2026-31362.html<\/li><\/ol><\/div>"},{"kind":"kader","titel":"Tekst uit het Handhavingsplan: inzet van boa’s","html":"<h2 class=\"ptitle\">Tekst uit het Handhavingsplan: inzet van boa’s<\/h2><div class=\"kaart k-kader law-card\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span class=\"kaart-lab\">Handhavingsplan<\/span><\/div><div class=\"kaart-t\">Handhavingsplan jaarwisseling, maart 2026 — hoofdstuk 7<\/div><div class=\"kaart-b\"><p class=\"law-intro\">Het plan beschrijft de inzet van boa’s zo:<\/p><div class=\"law-quote\"><div class=\"law-quote-head\"><span class=\"law-quote-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/><\/svg><\/span><span>Tekst Handhavingsplan<\/span><\/div><p class=\"wet law-text\">«De inzet van boa’s blijft gericht op preventie, toezicht en het beperken van overlast in de openbare ruimte. Bij ernstigere overtredingen of signalen van illegale handel werken boa’s samen met de politie, die verantwoordelijk blijft voor de opsporing van zwaar of crimineel vuurwerk.»<\/p><\/div><div class=\"law-grid\"><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>In gewone taal<\/span><\/div><p>Boa’s richten zich op preventie, toezicht en overlast. Gaat het om ernstigere feiten of om illegale handel? Dan werk je samen met de politie. Zwaar of crimineel vuurwerk is voor de politie.<\/p><\/section><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>Wat betekent dit voor jou als boa?<\/span><\/div><p>Kleinere situaties in de openbare ruimte kun je volgens deze lijn vaak zelf oppakken, als je bevoegd bent. Bij zwaar of crimineel vuurwerk schakel je de politie in.<\/p><\/section><\/div><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Handhavingsplan jaarwisseling, Ministerie van Justitie en Veiligheid, maart 2026 (beleid) – https://www.rijksoverheid.nl/documenten/2026/03/16/tk-bijlage-geactualiseerd-handhavingsplan-jaarwisseling-feb-2026<\/li><\/ol><\/div>"},{"kind":"kader","titel":"Tekst uit het Handhavingsplan: gevaar en openbare orde","html":"<h2 class=\"ptitle\">Tekst uit het Handhavingsplan: gevaar en openbare orde<\/h2><div class=\"kaart k-kader law-card\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span class=\"kaart-lab\">Handhavingsplan<\/span><\/div><div class=\"kaart-t\">Handhavingsplan jaarwisseling, maart 2026 — actie 3<\/div><div class=\"kaart-b\"><p class=\"law-intro\">Over gevaar en openbare orde zegt het plan:<\/p><div class=\"law-quote\"><div class=\"law-quote-head\"><span class=\"law-quote-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/><\/svg><\/span><span>Tekst Handhavingsplan<\/span><\/div><p class=\"wet law-text\">«(…) tegelijkertijd geldt als uitgangspunt binnen het huidige en toekomstige boa-bestel dat boa’s niet worden ingezet in situaties met een hoge mate van gevaarzetting. (…) In situaties waarin de openbare orde in het geding is, zullen boa's sowieso geen rol hebben tijdens de jaarwisseling en blijft de verantwoordelijkheid primair bij de politie.»<\/p><\/div><div class=\"law-grid\"><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>In gewone taal<\/span><\/div><p>Boa’s worden niet ingezet waar het erg gevaarlijk is. Is de openbare orde tijdens de jaarwisseling in het geding? Dan ligt de verantwoordelijkheid bij de politie.<\/p><\/section><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>Wat betekent dit voor jou als boa?<\/span><\/div><p>Gevaarlijke situaties en ordeverstoringen laat je aan de politie. Jij meldt, houdt afstand en legt vast wat je hebt gezien.<\/p><\/section><\/div><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Handhavingsplan jaarwisseling, Ministerie van Justitie en Veiligheid, maart 2026 (beleid) – https://www.rijksoverheid.nl/documenten/2026/03/16/tk-bijlage-geactualiseerd-handhavingsplan-jaarwisseling-feb-2026<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Lokale afspraken","html":"<span class=\"q-soort\">Beleid<\/span><h2 class=\"ptitle\">Lokale afspraken<\/h2><div class=\"main\"><p>Het Handhavingsplan zegt ook: «Uiteindelijk is het aan het lokaal gezag om de handhaving tijdens de jaarwisseling vorm te geven en de beschikbare capaciteit zo effectief mogelijk in te zetten.»<\/p><p>Jouw gemeente en de politie kunnen dus eigen afspraken maken. Vraag je leidinggevende naar de lokale afspraken voor de jaarwisseling.<\/p><p>Let op: het Handhavingsplan is beleid. Het bepaalt niet jouw juridische bevoegdheid. Dat doen de wet en de domeinlijst.<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Handhavingsplan jaarwisseling, Ministerie van Justitie en Veiligheid, maart 2026 (beleid) – https://www.rijksoverheid.nl/documenten/2026/03/16/tk-bijlage-geactualiseerd-handhavingsplan-jaarwisseling-feb-2026<\/li><\/ol><\/div>"},{"kind":"figuur","titel":"Zelf afhandelen, overleggen of politie inschakelen","html":"<div class=\"figcap\">Zelf afhandelen, overleggen of politie inschakelen<\/div><figure class=\"illu\"><svg viewBox=\"0 0 560 60\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>Zelf afhandelen, overleggen of politie inschakelen<\/title><desc>Drie routes: zelf afhandelen bij een eenvoudige situatie binnen je bevoegdheid; overleggen bij twijfel; politie inschakelen bij zwaar of crimineel vuurwerk, gevaar of ordeverstoring.<\/desc><\/svg><\/figure>"},{"kind":"casus","titel":"Situatie 1: zelf afhandelen","html":"<span class=\"q-soort\">Voorbeeld<\/span><h2 class=\"ptitle\">Situatie 1: zelf afhandelen<\/h2><p class=\"lees\">Een man steekt op een woensdagavond in oktober een fontein af in een woonstraat. Op de verpakking staat «F2». Er zijn geen andere bijzonderheden.<\/p><p class=\"lees\">Je bent bevoegd (domein I, onderdeel 9). De situatie is overzichtelijk en niet gevaarlijk. Dit past bij preventie, toezicht en overlast. Je kunt dit zelf afhandelen.<\/p><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wet milieubeheer, art. 9.2.2.1a, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0003245/2026-08-01 (ingevoerd bij de Wet veilige jaarwisseling, Stb. 2026, 7).<\/li><li>Regeling domeinlijsten buitengewoon opsporingsambtenaar, bijlage, Domein I, onderdeel 9, zoals gewijzigd bij Stcrt. 2026, 31362 (in werking 8 september 2026) – https://zoek.officielebekendmakingen.nl/stcrt-2026-31362.html<\/li><li>Handhavingsplan jaarwisseling, Ministerie van Justitie en Veiligheid, maart 2026 (beleid) – https://www.rijksoverheid.nl/documenten/2026/03/16/tk-bijlage-geactualiseerd-handhavingsplan-jaarwisseling-feb-2026<\/li><\/ol><\/div>"},{"kind":"casus","titel":"Situatie 2: overleggen","html":"<span class=\"q-soort\">Voorbeeld<\/span><h2 class=\"ptitle\">Situatie 2: overleggen<\/h2><p class=\"lees\">In een park vind je een tas met verschillend vuurwerk. Een deel is verpakt F2, een deel ligt los zonder etiket. Niemand is in de buurt.<\/p><p class=\"lees\">Je twijfelt over de veiligheid en over wat het losse vuurwerk is. Overleg met je leidinggevende of de politie voordat je iets aanraakt.<\/p><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Handhavingsplan jaarwisseling, Ministerie van Justitie en Veiligheid, maart 2026 (beleid) – https://www.rijksoverheid.nl/documenten/2026/03/16/tk-bijlage-geactualiseerd-handhavingsplan-jaarwisseling-feb-2026<\/li><\/ol><\/div>"},{"kind":"casus","titel":"Situatie 3: politie inschakelen","html":"<span class=\"q-soort\">Voorbeeld<\/span><h2 class=\"ptitle\">Situatie 3: politie inschakelen<\/h2><p class=\"lees\">Bij een station zie je een groep met groot, zwaar vuurwerk. Er wordt geroepen en er zijn veel mensen. De sfeer wordt grimmig.<\/p><p class=\"lees\">Dit is mogelijk zwaar vuurwerk en de openbare orde is in het geding. Volgens het Handhavingsplan is dit aan de politie. Jij meldt, houdt afstand en legt vast.<\/p><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Handhavingsplan jaarwisseling, Ministerie van Justitie en Veiligheid, maart 2026 (beleid) – https://www.rijksoverheid.nl/documenten/2026/03/16/tk-bijlage-geactualiseerd-handhavingsplan-jaarwisseling-feb-2026<\/li><\/ol><\/div>"},{"kind":"lijst","titel":"Zo verloopt een overdracht","html":"<h2 class=\"ptitle\">Zo verloopt een overdracht<\/h2><div class=\"main\"><p>Een goede overdracht zorgt dat er niets verloren gaat. Geef in elk geval door:<\/p><ul class=\"opsom\"><li>wat je zelf hebt gezien en gedaan;<\/li><li>welke bevoegdheden je al hebt gebruikt, met grondslag;<\/li><li>wie de betrokkenen zijn, voor zover bekend;<\/li><li>waar het vuurwerk is en of het veilig is gesteld;<\/li><li>wat je in beslag hebt genomen.<\/li><\/ul><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wetboek van Strafvordering, geldend vanaf 1 juli 2026 – https://wetten.overheid.nl/BWBR0001903/2026-07-01<\/li><\/ol><\/div>"},{"kind":"onthoud","titel":"Kort samengevat","html":"<h2 class=\"ptitle\">Kort samengevat<\/h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-t\">Mogen en doen<\/div><div class=\"kaart-b\"><ul class=\"punten\"><li>Juridische bevoegdheid is wat je volgens de wet mág. Taakverdeling is wat van je wordt verwacht.<\/li><li>Een afspraak geeft je geen extra bevoegdheid.<\/li><\/ul><\/div><\/div>"},{"kind":"onthoud","titel":"Kort samengevat","html":"<h2 class=\"ptitle\">Kort samengevat<\/h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-t\">Het Handhavingsplan<\/div><div class=\"kaart-b\"><ul class=\"punten\"><li>Boa’s: preventie, toezicht en overlast in de openbare ruimte.<\/li><li>Politie: zwaar of crimineel vuurwerk, gevaarlijke situaties en ordeverstoringen.<\/li><li>Oudere passages over bevoegdheden zijn achterhaald. Kijk naar de actuele domeinlijst.<\/li><\/ul><\/div><\/div>"},{"kind":"theory","titel":"Vooruitblik: Van melding tot proces-verbaal","html":"<h2 class=\"ptitle\">Vooruitblik: Van melding tot proces-verbaal<\/h2><div class=\"main\"><p>Je hebt nu alle onderdelen gehad. In het laatste onderwerp brengen we alles samen in één praktijkcasus.<\/p><p>Daarna maak je de eindtoets.<\/p><\/div>"}],"titel":"Taakverdeling tussen boa en politie","type":"content","vragen":[{"artikel":"Werkwijze","juist":2,"kernregel":"Bevoegdheid = mogen. Taakverdeling = wat van je wordt verwacht.","opties":["Bevoegdheid is wat de politie mag. Taakverdeling is wat de boa mag.","Er is geen verschil. Het zijn twee woorden voor hetzelfde.","Bevoegdheid is wat je juridisch mag. Taakverdeling is wat van je wordt verwacht.","Bevoegdheid geldt overdag. Taakverdeling geldt tijdens de jaarwisseling."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is C. Juridische bevoegdheid is wat je volgens de actuele wet mag. Taakverdeling is wat in de praktijk van jou wordt verwacht, bijvoorbeeld volgens het Handhavingsplan en lokale afspraken.","voetnoten":[],"vraag":"Wat is het verschil tussen juridische bevoegdheid en taakverdeling?","wet":"—"},{"artikel":"Handhavingsplan","juist":0,"kernregel":"Boa: preventie, toezicht, overlast. Politie: zwaar of crimineel vuurwerk.","opties":["Op preventie, toezicht en het beperken van overlast in de openbare ruimte.","Op de opsporing van zwaar en crimineel vuurwerk.","Op het handhaven van de openbare orde bij ongeregeldheden.","Op de controle van vuurwerkimporteurs aan de grens."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is A. Het Handhavingsplan: de inzet van boa’s blijft gericht op preventie, toezicht en het beperken van overlast in de openbare ruimte. De politie blijft verantwoordelijk voor de opsporing van zwaar of crimineel vuurwerk. [[1]]","voetnoten":["Handhavingsplan jaarwisseling, Ministerie van Justitie en Veiligheid, maart 2026."],"vraag":"Waarop is de inzet van boa’s volgens het Handhavingsplan jaarwisseling gericht?","wet":"—"},{"artikel":"Werkwijze","juist":3,"kernregel":"Openbare orde in het geding of zwaar vuurwerk: politie.","opties":["Je handelt het zelf af, omdat jij er als eerste was.","Je laat het aan omstanders over om de politie te bellen.","Je wacht af of het vanzelf rustiger wordt.","De politie is verantwoordelijk. Jij meldt, houdt afstand en legt vast."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is D. Volgens het Handhavingsplan hebben boa’s geen rol als de openbare orde tijdens de jaarwisseling in het geding is; de verantwoordelijkheid ligt dan primair bij de politie. Ook zwaar of crimineel vuurwerk is voor de politie. [[1]]","voetnoten":["Handhavingsplan jaarwisseling, Ministerie van Justitie en Veiligheid, maart 2026."],"vraag":"Bij een station zie je een groep met zwaar vuurwerk. De sfeer wordt grimmig en de openbare orde raakt in het geding. Wat past bij het Handhavingsplan?","wet":"—"},{"artikel":"Werkwijze","juist":1,"kernregel":"Een afspraak geeft je geen extra bevoegdheid.","opties":["De afspraak gaat voor. Je bent dan toch bevoegd.","Een afspraak geeft je geen bevoegdheid die je niet hebt.","Je bent bevoegd als je leidinggevende akkoord geeft.","Je bent bevoegd als de politie niet kan komen."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is B. Taakverdeling gaat over wat van je wordt verwacht. Het maakt je niet bevoegd voor iets waarvoor je volgens de wet niet bevoegd bent.","voetnoten":[],"vraag":"Een afspraak in je gemeente zegt dat jij iets oppakt, maar je bent er volgens de wet niet voor bevoegd. Wat geldt?","wet":"—"}]},{"icoon":"list","id":"m8","kader":"Terugblik","nr":8,"pages":[{"kind":"lo","titel":"Leerdoelen","html":"<h2 class=\"ptitle\">Leerdoelen<\/h2><p class=\"pintro\">Wat je na dit onderwerp kunt.<\/p><ul class=\"lo\"><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>kun je een vuurwerksituatie van begin tot eind doorlopen;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>stel je daarbij steeds de vier vragen;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je wat er in het proces-verbaal moet komen;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>ben je voorbereid op de eindtoets.<\/span><\/li><\/ul>"},{"kind":"theory","titel":"Terugblik","html":"<h2 class=\"ptitle\">Terugblik<\/h2><div class=\"main\"><p>In de vorige onderwerpen kwam dit na elkaar aan bod: soorten vuurwerk, de wet, bevoegdheid, bevoegdheden, onbekend en zwaar vuurwerk en de taakverdeling.<\/p><p>In dit onderwerp breng je alles samen in één casus. Er komt geen nieuwe juridische inhoud bij.<\/p><\/div>"},{"kind":"casus","titel":"De casus: een knal op de parkeerplaats","html":"<span class=\"q-soort\">Voorbeeld<\/span><h2 class=\"ptitle\">De casus: een knal op de parkeerplaats<\/h2><p class=\"lees\">Het is 22 november, 21.00 uur. Je loopt surveillance en hoort een harde knal. Op een parkeerplaats staan vier jongeren.<\/p><p class=\"lees\">Eén jongere heeft vuurwerk in zijn hand. Op de grond staat een tas met verschillende soorten vuurwerk. Een deel zit in een verpakking, een deel niet.<\/p><p class=\"lees\">We lopen deze situatie in tien stappen door.<\/p>"},{"kind":"theory","titel":"Stap 1 – Wat neem je waar?","html":"<h2 class=\"ptitle\">Stap 1 – Wat neem je waar?<\/h2><div class=\"main\"><p>Begin met kijken en luisteren, vanaf een veilige afstand.<\/p><p>Een knal. Vier jongeren. Eén jongere met vuurwerk in zijn hand. Een tas met verpakt en los vuurwerk.<\/p><p>Schrijf dit op zoals je het ziet. Nog zonder conclusie.<\/p><\/div>"},{"kind":"theory","titel":"Stap 2 – Is er mogelijk sprake van een strafbaar feit?","html":"<h2 class=\"ptitle\">Stap 2 – Is er mogelijk sprake van een strafbaar feit?<\/h2><div class=\"main\"><p>Nu stel je de vraag: «Is dit strafbaar?»<\/p><p>Bezit en gebruik van F2- en F3-vuurwerk zijn verboden voor anderen dan personen met gespecialiseerde kennis (artikel 9.2.2.1a, eerste lid, Wm). Het is november: een ontheffing voor de jaarwisseling speelt hier niet.<\/p><p>Er is dus mogelijk een strafbaar feit, als het om F2 of F3 gaat.<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wet milieubeheer, art. 9.2.2.1a, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0003245/2026-08-01 (ingevoerd bij de Wet veilige jaarwisseling, Stb. 2026, 7).<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Stap 3 – Welk vuurwerk kan dit zijn?","html":"<h2 class=\"ptitle\">Stap 3 – Welk vuurwerk kan dit zijn?<\/h2><div class=\"main\"><p>Op een verpakking in de tas lees je «F2». Dat is informatie, geen bewijs.<\/p><p>Het losse vuurwerk heeft geen etiket. Dat is onbekend vuurwerk: de categorie is nog niet betrouwbaar vastgesteld.<\/p><\/div>"},{"kind":"theory","titel":"Stap 4 – Welke informatie heb je nog nodig?","html":"<h2 class=\"ptitle\">Stap 4 – Welke informatie heb je nog nodig?<\/h2><div class=\"main\"><p>Wie heeft wat in bezit? Van wie is de tas? Wat is de identiteit van de jongeren? Wat is het losse vuurwerk?<\/p><p>Het vaststellen van die informatie kan onderdeel zijn van je onderzoek.<\/p><\/div>"},{"kind":"theory","titel":"Stap 5 – Ben je hiervoor opsporingsbevoegd?","html":"<h2 class=\"ptitle\">Stap 5 – Ben je hiervoor opsporingsbevoegd?<\/h2><div class=\"main\"><p>Nu stel je de vraag: «Ben ik bevoegd?»<\/p><p>Artikel 9.2.2.1a Wm jo. artikel 1a WED staat in domein I, onderdeel 9. Voor het F2-vuurwerk ben je dus in beginsel bevoegd, als dit past binnen je functie en taakomschrijving.<\/p><p>Voor het losse, onbekende vuurwerk is dat onzeker: het kan ook F4 of zelfgemaakt zijn.<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Regeling domeinlijsten buitengewoon opsporingsambtenaar, bijlage, Domein I, onderdeel 9, zoals gewijzigd bij Stcrt. 2026, 31362 (in werking 8 september 2026) – https://zoek.officielebekendmakingen.nl/stcrt-2026-31362.html<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Stap 6 – Welke bevoegdheden kun je toepassen?","html":"<h2 class=\"ptitle\">Stap 6 – Welke bevoegdheden kun je toepassen?<\/h2><div class=\"main\"><p>De jongere met het vuurwerk is verdachte. Je kunt hem staande houden om zijn identiteit vast te stellen (artikel 52 Sv).<\/p><p>Je kunt van hem vorderen dat hij het verpakte F2-vuurwerk afgeeft en het in beslag nemen (artikel 18 WED; ook artikel 95 Sv). Voldoet hij opzettelijk niet aan de vordering? Dan is dat een economisch delict (artikel 26 WED).<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wetboek van Strafvordering, geldend vanaf 1 juli 2026 – https://wetten.overheid.nl/BWBR0001903/2026-07-01<\/li><li>Wet op de economische delicten, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0002063/2026-08-01<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Stap 7 – Is het veilig om zelf verder te handelen?","html":"<h2 class=\"ptitle\">Stap 7 – Is het veilig om zelf verder te handelen?<\/h2><div class=\"main\"><p>Het verpakte F2-vuurwerk is overzichtelijk. Het losse vuurwerk is onbekend.<\/p><p>Raak het losse vuurwerk niet aan, maak het niet open en haal het niet uit elkaar. Houd afstand en vraag omstanders weg te blijven.<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Handhavingsplan jaarwisseling, Ministerie van Justitie en Veiligheid, maart 2026 (beleid) – https://www.rijksoverheid.nl/documenten/2026/03/16/tk-bijlage-geactualiseerd-handhavingsplan-jaarwisseling-feb-2026<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Stap 8 – Moet de politie worden ingeschakeld?","html":"<h2 class=\"ptitle\">Stap 8 – Moet de politie worden ingeschakeld?<\/h2><div class=\"main\"><p>Voor het onbekende, mogelijk zware vuurwerk: ja. Volgens het Handhavingsplan is de politie verantwoordelijk voor zwaar of crimineel vuurwerk.<\/p><p>Het verpakte F2-vuurwerk en de identiteit van de verdachte kun je binnen je bevoegdheid zelf afhandelen, als dat veilig is.<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Handhavingsplan jaarwisseling, Ministerie van Justitie en Veiligheid, maart 2026 (beleid) – https://www.rijksoverheid.nl/documenten/2026/03/16/tk-bijlage-geactualiseerd-handhavingsplan-jaarwisseling-feb-2026<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Stap 9 – Wat neem je in beslag of draag je over?","html":"<h2 class=\"ptitle\">Stap 9 – Wat neem je in beslag of draag je over?<\/h2><div class=\"main\"><p>Het verpakte F2-vuurwerk neem je in beslag (artikel 18 WED). Maak een kennisgeving van inbeslagneming en geef zo mogelijk een bewijs van ontvangst (artikel 94, derde lid, Sv).<\/p><p>Het losse vuurwerk en de tas draag je over aan de politie. Geef door wat je hebt gezien en gedaan.<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wet op de economische delicten, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0002063/2026-08-01<\/li><li>Wetboek van Strafvordering, geldend vanaf 1 juli 2026 – https://wetten.overheid.nl/BWBR0001903/2026-07-01<\/li><\/ol><\/div>"},{"kind":"lijst","titel":"Stap 10 – Wat komt in het proces-verbaal?","html":"<h2 class=\"ptitle\">Stap 10 – Wat komt in het proces-verbaal?<\/h2><div class=\"main\"><p>Beschrijf eerst de feiten. Pas daarna volgt de juridische kwalificatie. Zet deze twaalf onderdelen erin:<\/p><ul class=\"opsom\"><li><b>Aanleiding<\/b> — waarom kwam je in actie?<\/li><li><b>Plaats en tijd<\/b>;<\/li><li><b>Eigen waarneming<\/b> — wat zag en hoorde je zelf?<\/li><li><b>Gedraging verdachte<\/b>;<\/li><li><b>Aangetroffen voorwerpen<\/b> — soort, aantal, plaats;<\/li><li><b>Verpakking/etiket<\/b> — letterlijk overnemen;<\/li><li><b>Categorie<\/b> — alleen als die betrouwbaar is vastgesteld, en hoe;<\/li><li><b>Toegepaste bevoegdheid<\/b>;<\/li><li><b>Wettelijke grondslag<\/b> per bevoegdheid;<\/li><li><b>Vordering en reactie<\/b> — wat vorderde je, hoe reageerde de persoon?<\/li><li><b>Inbeslagneming<\/b> — wat, hoeveel, waar gebleven;<\/li><li><b>Onderbouwing juridische conclusie<\/b> — waarom dit feit?<\/li><\/ul><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wetboek van Strafvordering, geldend vanaf 1 juli 2026 – https://wetten.overheid.nl/BWBR0001903/2026-07-01<\/li><li>Wet op de economische delicten, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0002063/2026-08-01<\/li><\/ol><\/div>"},{"kind":"kaart","titel":"Stap 10 – Zo niet","html":"<h2 class=\"ptitle\">Stap 10 – Zo niet<\/h2><div class=\"kaart k-letop\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17h.01\"/><\/svg><\/span><span class=\"kaart-lab\">Let op<\/span><\/div><div class=\"kaart-t\">Alleen een conclusie is niet genoeg<\/div><div class=\"kaart-b\"><p>Een <b>slecht<\/b> voorbeeld: «Ik zag dat verdachte illegaal vuurwerk bij zich had. Het vuurwerk is in beslag genomen.»<\/p><p>Wat is er mis? Er staat alleen een conclusie. Je leest niet wat de boa zag, wat op de verpakking stond, welke bevoegdheden zijn gebruikt, op welke grondslag, en hoe de categorie is vastgesteld.<\/p><\/div><\/div>"},{"kind":"theory","titel":"Stap 10 – Zo wel","html":"<h2 class=\"ptitle\">Stap 10 – Zo wel<\/h2><div class=\"main\"><p>«Op [datum] omstreeks 21.00 uur bevond ik, verbalisant, mij in surveillance op de parkeerplaats aan de [straat] te [plaats]. Ik hoorde daar een harde knal, waarna ik ter plaatse ging. Ik zag vier personen staan. Ik zag dat één van hen, later genoemd [naam], een voorwerp in zijn hand hield. Op de verpakking van dat voorwerp las ik de tekst «F2». Op de grond zag ik een tas. Daarin zag ik [aantal] verpakkingen met op het etiket de aanduiding «F2» en [aantal] losse voorwerpen zonder verpakking of etiket.<\/p><p>Op grond van mijn waarneming heb ik [naam] aangemerkt als verdachte van overtreding van artikel 9.2.2.1a, eerste lid, Wet milieubeheer. Ik heb hem staande gehouden (artikel 52 Sv) en zijn identiteit vastgesteld aan de hand van [identiteitsbewijs]. Ik heb van hem de uitlevering gevorderd van de verpakkingen met de aanduiding «F2» (artikel 18 WED). Hij gaf deze aan mij af. Ik heb deze in beslag genomen; van de inbeslagneming is een kennisgeving opgemaakt. De losse voorwerpen heb ik niet aangeraakt. Om [tijd] heb ik de situatie overgedragen aan [politie-eenheid].»<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wetboek van Strafvordering, geldend vanaf 1 juli 2026 – https://wetten.overheid.nl/BWBR0001903/2026-07-01<\/li><li>Wet op de economische delicten, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0002063/2026-08-01<\/li><\/ol><\/div>"},{"kind":"onthoud","titel":"Kort samengevat","html":"<h2 class=\"ptitle\">Kort samengevat<\/h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-t\">2. Welke soorten vuurwerk zijn er?<\/div><div class=\"kaart-b\"><ul class=\"punten\"><li>Er zijn vier categorieën: F1, F2, F3 en F4. Het etiket is informatie, geen bewijs.<\/li><li>«Onbekend vuurwerk» is geen wettelijke categorie.<\/li><\/ul><\/div><\/div>"},{"kind":"onthoud","titel":"Kort samengevat","html":"<h2 class=\"ptitle\">Kort samengevat<\/h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-t\">3. Wat zegt de wet?<\/div><div class=\"kaart-b\"><ul class=\"punten\"><li>Artikel 9.2.2.1a Wm: bezit, gebruik en verkoop van F2 en F3 verboden voor anderen dan personen met gespecialiseerde kennis.<\/li><li>Overtreding is een economisch delict (artikel 1a WED). Let op de ontheffing van de burgemeester.<\/li><\/ul><\/div><\/div>"},{"kind":"onthoud","titel":"Kort samengevat","html":"<h2 class=\"ptitle\">Kort samengevat<\/h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-t\">4. Wanneer ben jij als boa bevoegd?<\/div><div class=\"kaart-b\"><ul class=\"punten\"><li>Domein I, onderdeel 9: artikel 9.2.2.1a Wm jo. artikel 1a WED, sinds 8 september 2026.<\/li><li>Een feit zien is iets anders dan bevoegd zijn. Voor F4 (Vuurwerkbesluit) ben je op grond van onderdeel 9 niet bevoegd.<\/li><\/ul><\/div><\/div>"},{"kind":"onthoud","titel":"Kort samengevat","html":"<h2 class=\"ptitle\">Kort samengevat<\/h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-t\">5. Wat mag je als boa doen?<\/div><div class=\"kaart-b\"><ul class=\"punten\"><li>Staande houden: art. 52 Sv. Aanhouden: art. 53 Sv (heterdaad), art. 54 Sv (buiten heterdaad, in beginsel op bevel). Vervoermiddel: art. 23 WED. Medewerking: art. 24a WED. Beslag en uitlevering: art. 18 WED.<\/li><li>Artikel 26 WED: opzettelijk niet voldoen aan een vordering is een economisch delict.<\/li><\/ul><\/div><\/div>"},{"kind":"onthoud","titel":"Kort samengevat","html":"<h2 class=\"ptitle\">Kort samengevat<\/h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-t\">6. Onbekend en zwaar illegaal vuurwerk<\/div><div class=\"kaart-b\"><ul class=\"punten\"><li>Praktijktermen zijn geen wettelijke categorieën.<\/li><li>Bevoegd zijn betekent niet automatisch dat het veilig is om zelf te handelen.<\/li><\/ul><\/div><\/div>"},{"kind":"onthoud","titel":"Kort samengevat","html":"<h2 class=\"ptitle\">Kort samengevat<\/h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-t\">7. Taakverdeling tussen boa en politie<\/div><div class=\"kaart-b\"><ul class=\"punten\"><li>Bevoegdheid is wat je mág. Taakverdeling is wat van je wordt verwacht.<\/li><li>Zwaar of crimineel vuurwerk, gevaar en ordeverstoring: politie.<\/li><\/ul><\/div><\/div>"},{"kind":"theory","titel":"Beslishulp: de vier vragen op straat","html":"<h2 class=\"ptitle\">Beslishulp: de vier vragen op straat<\/h2><div class=\"main\"><p>De beslishulp zet de vier vragen op een rij. Je kunt hiermee elke vuurwerksituatie stap voor stap doorlopen.<\/p><\/div>"},{"kind":"figuur","titel":"Beslishulp: de vier vragen op straat","html":"<div class=\"figcap\">Beslishulp: de vier vragen op straat<\/div><figure class=\"illu\"><svg viewBox=\"0 0 560 60\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>Beslishulp: de vier vragen op straat<\/title><desc>Vier vragen na elkaar: wat tref ik aan, is dit strafbaar, ben ik bevoegd, wat doe ik nu. Is alles duidelijk, handel dan volgens de taakverdeling. Twijfel je, overleg dan of schakel de politie in.<\/desc><\/svg><\/figure>"},{"kind":"theory","titel":"Klaar voor de eindtoets","html":"<h2 class=\"ptitle\">Klaar voor de eindtoets<\/h2><div class=\"main\"><p>Met de vier vragen ben je voorbereid op de eindtoets. Daarin komen de soorten vuurwerk, de wet, bevoegdheid, bevoegdheden, veiligheid en taakverdeling terug.<\/p><p>Twijfel je? Kijk dan terug in de onderwerpen en bij de bronvermelding.<\/p><\/div>"}],"titel":"Van melding tot proces-verbaal","type":"samenvatting","vragen":[]}],"totaalVragen":30,"version":"0.9"};window.__ICONS__={"megafoon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 11v2a1 1 0 0 0 1 1h2l3.5 3.5V6.5L6 10H4a1 1 0 0 0-1 1Z\"/><path d=\"M12 8a4 4 0 0 1 0 8\"/></svg>","balans":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3v18M7 21h10\"/><path d=\"M12 6 5 8m7-2 7 2\"/><path d=\"M5 8 2.5 13a3 3 0 0 0 5 0L5 8Zm14 0-2.5 5a3 3 0 0 0 5 0L19 8Z\"/></svg>","wet":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 3h9l3 3v15H6z\"/><path d=\"M9 8h6M9 12h6M9 16h4\"/></svg>","oog":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z\"/><circle cx=\"12\" cy=\"12\" r=\"2.5\"/></svg>","book":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/></svg>","document":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg>","list":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M8 6h12M8 12h12M8 18h12\"/><circle cx=\"4\" cy=\"6\" r=\"1\"/><circle cx=\"4\" cy=\"12\" r=\"1\"/><circle cx=\"4\" cy=\"18\" r=\"1\"/></svg>","target":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"8\"/><circle cx=\"12\" cy=\"12\" r=\"4\"/><circle cx=\"12\" cy=\"12\" r=\"1\"/></svg>","vink":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg>","kruis":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"/></svg>","waarschuwing":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17h.01\"/></svg>","ster":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg>","praktijk":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg>"};</script>

2 WED).<\/li><li>Lees een wettekst in vijf stappen: wettekst, gewone taal, betekenis voor jou, voorbeeld en let op.<\/li><\/ul><\/div><\/div>"},{"kind":"theory","titel":"Vooruitblik: Wanneer ben jij als boa bevoegd?","html":"<h2 class=\"ptitle\">Vooruitblik: Wanneer ben jij als boa bevoegd?<\/h2><div class=\"main\"><p>Je weet nu welke regels bij vuurwerk horen. Maar mag jij daar als boa ook iets mee?<\/p><p>In het volgende onderwerp gaat het om de derde vraag: «Ben ik bevoegd?»<\/p><\/div>"}],"titel":"Wat zegt de wet?","type":"content","vragen":[{"artikel":"Art. 9.2.2.1a Wm","juist":1,"kernregel":"Het verbod van artikel 9.2.2.1a lid 1 Wm geldt voor F2 en F3.","opties":["Ja, want sinds 1 augustus 2026 is al het vuurwerk verboden.","Nee, het verbod van lid 1 gaat over F2 en F3, niet over F1.","Ja, want vuurwerk buiten de jaarwisseling is altijd verboden.","Nee, maar alleen omdat het in een tuin gebeurt."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is B. Artikel 9.2.2.1a, eerste lid, Wm verbiedt bezit en gebruik van vuurwerk van de categorieën F2 en F3 voor anderen dan personen met gespecialiseerde kennis. F1 valt daar niet onder. [[1]]","voetnoten":["Artikel 9.2.2.1a Wet milieubeheer (geldend vanaf 1 augustus 2026)."],"vraag":"Op 15 oktober steekt een vrouw in haar tuin vuurwerk af. Op de verpakking staat de aanduiding «F1». Valt dit onder het verbod van artikel 9.2.2.1a, eerste lid, Wm?","wet":"Wet milieubeheer"},{"artikel":"Art. 9.2.2.1a lid 4 Wm","juist":2,"kernregel":"F2 is niet altijd verboden: controleer de ontheffing.","opties":["Je legt het afsteken meteen stil, want F2 is verboden.","Je doet niets, want op oudejaarsavond is alles toegestaan.","Je vraagt naar de ontheffing van de burgemeester.","Je neemt direct al het vuurwerk in beslag."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is C. De burgemeester kan ontheffing verlenen voor aangewezen F2-vuurwerk tijdens de jaarwisseling (artikel 9.2.2.1a, vierde lid, Wm). Een afschrift van de ontheffing moet op het afsteekterrein aanwezig zijn (artikel 2.3.2a Vuurwerkbesluit). [[1]]","voetnoten":["Artikel 9.2.2.1a Wet milieubeheer (geldend vanaf 1 augustus 2026)."],"vraag":"Het is 31 december, 20.00 uur. Een vereniging steekt op een afgezet sportveld F2-vuurwerk af. Wat doe je eerst?","wet":"Wet milieubeheer"},{"artikel":"Art. 1a en 2 WED","juist":0,"kernregel":"Opzettelijk: misdrijf. Anders: overtreding (artikel 2 WED).","opties":["Een economisch delict dat een misdrijf is.","Een gewone overtreding van de APV.","Een economisch delict dat altijd een overtreding is.","Geen strafbaar feit, alleen een bestuurlijke boete."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is A. Artikel 9.2.2.1a Wm staat in artikel 1a, onder 1°, WED. Volgens artikel 2, eerste lid, WED zijn deze economische delicten misdrijven voor zover zij opzettelijk zijn begaan. Anders zijn het overtredingen. [[1]]","voetnoten":["Wet op de economische delicten (geldend vanaf 1 augustus 2026)."],"vraag":"Een overtreding van artikel 9.2.2.1a Wm is met opzet gepleegd. Wat is het dan volgens de WED?","wet":"Wet op de economische delicten"},{"artikel":"Art. 9.2.2.1a Wm","juist":3,"kernregel":"Een oude verpakkingstekst maakt bezit niet toegestaan.","opties":["Ja, die tekst maakt het bezit altijd toegestaan.","Ja, als hij het vuurwerk vóór 1 augustus 2026 kocht.","Nee, maar alleen als hij jonger is dan 16 jaar.","Nee, het verbod van artikel 9.2.2.1a Wm geldt toch."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is D. Sinds 1 augustus 2026 is het bezit van F2-vuurwerk verboden voor anderen dan personen met gespecialiseerde kennis. Een oude tekst op de verpakking verandert dat niet. [[1]]","voetnoten":["Artikel 9.2.2.1a Wet milieubeheer (geldend vanaf 1 augustus 2026)."],"vraag":"Een jongere heeft F2-vuurwerk met op de verpakking «Geschikt voor particulier gebruik». Hij zegt: «Dit mag, het staat erop.» Klopt dat?","wet":"Wet milieubeheer"}]},{"icoon":"wet","id":"m4","kader":"Opsporingsbevoegdheid","nr":4,"pages":[{"kind":"lo","titel":"Leerdoelen","html":"<h2 class=\"ptitle\">Leerdoelen<\/h2><p class=\"pintro\">Centrale vraag: ben ik als boa bevoegd om voor dit feit op te treden?<\/p><ul class=\"lo\"><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je waar jouw opsporingsbevoegdheid vandaan komt;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>ken je onderdeel 9 van domein I;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je dat opname in de domeinlijst niet betekent dat je in elke situatie alles mag;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>ken je het verschil tussen een strafbaar feit zien en daarvoor bevoegd zijn;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>kun je de zes controlevragen voor bevoegdheid toepassen.<\/span><\/li><\/ul>"},{"kind":"casus","titel":"Ben ik bevoegd?","html":"<span class=\"q-soort\">Voorbeeld<\/span><h2 class=\"ptitle\">Ben ik bevoegd?<\/h2><p class=\"lees\">Je staat weer bij de jongeren op het plein. Je denkt dat er misschien een strafbaar feit is gepleegd.<\/p><p class=\"lees\">Maar voordat je iets doet, stel je jezelf één vraag: ben ik als boa bevoegd om voor dit feit op te treden?<\/p>"},{"kind":"theory","titel":"Zien is iets anders dan bevoegd zijn","html":"<h2 class=\"ptitle\">Zien is iets anders dan bevoegd zijn<\/h2><div class=\"main\"><p>Je kunt een strafbaar feit zien. Dat heet constateren. Maar dat betekent nog niet dat jij er ook voor bevoegd bent.<\/p><p>Een boa is opsporingsbevoegd voor de feiten die in zijn akte of aanwijzing staan. Vaak verwijst die naar een domein. Niet voor alle feiten dus.<\/p><p>Ben je niet bevoegd? Schakel dan de politie in.<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wetboek van Strafvordering, geldend vanaf 1 juli 2026 – https://wetten.overheid.nl/BWBR0001903/2026-07-01<\/li><\/ol><\/div>"},{"kind":"kader","titel":"Wettekst: de buitengewoon opsporingsambtenaar","html":"<h2 class=\"ptitle\">Wettekst: de buitengewoon opsporingsambtenaar<\/h2><div class=\"kaart k-kader law-card\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span class=\"kaart-lab\">Juridisch kader<\/span><\/div><div class=\"kaart-t\">Artikel 142 · Wetboek van Strafvordering<\/div><div class=\"kaart-b\"><p class=\"law-intro\">Artikel 142 Sv regelt wie buitengewoon opsporingsambtenaar (boa) is en voor welke feiten.<\/p><div class=\"law-quote\"><div class=\"law-quote-head\"><span class=\"law-quote-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/><\/svg><\/span><span>Wettekst<\/span><\/div><p class=\"wet law-text\">«1 Met de opsporing van strafbare feiten zijn als buitengewoon opsporingsambtenaar belast:<br>a. de personen aan wie door Onze Minister van Veiligheid en Justitie, onderscheidenlijk het College van procureurs-generaal een akte van opsporingsbevoegdheid is verleend;<br>b. de meerderjarige personen, behorend tot door Onze Minister van Veiligheid en Justitie aangewezen categorieën of eenheden;<br>(…)<br>2 De opsporingsbevoegdheid, bedoeld in het eerste lid, onder a en b, strekt zich uit tot de in de akte of aanwijzing aangeduide strafbare feiten. De akte of aanwijzing kan daartoe verwijzen naar een bij regeling van Onze Minister van Justitie en Veiligheid vastgesteld domein. Een domein kan alle strafbare feiten omvatten.»<\/p><\/div><div class=\"law-grid\"><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>In gewone taal<\/span><\/div><p>Je bent boa door een akte van opsporingsbevoegdheid of een aanwijzing. Je bevoegdheid geldt alleen voor de feiten die daarin staan. De akte kan verwijzen naar een domein.<\/p><\/section><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>Wat betekent dit voor jou als boa?<\/span><\/div><p>Kijk in je akte welk domein voor jou geldt. In deze opleiding gaat het om domein I, Openbare ruimte.<\/p><\/section><\/div><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wetboek van Strafvordering, geldend vanaf 1 juli 2026 – https://wetten.overheid.nl/BWBR0001903/2026-07-01<\/li><\/ol><\/div>"},{"kind":"kader","titel":"Domein I, onderdeel 9","html":"<h2 class=\"ptitle\">Domein I, onderdeel 9<\/h2><div class=\"kaart k-kader law-card\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span class=\"kaart-lab\">Juridisch kader<\/span><\/div><div class=\"kaart-t\">Regeling domeinlijsten buitengewoon opsporingsambtenaar<\/div><div class=\"kaart-b\"><p class=\"law-intro\">Per 8 september 2026 luidt onderdeel 9 van domein I zoals hieronder. De wijziging staat in de Staatscourant 2026, 31362.<\/p><div class=\"law-quote\"><div class=\"law-quote-head\"><span class=\"law-quote-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/><\/svg><\/span><span>Wettekst<\/span><\/div><p class=\"wet law-text\">«De boa Openbare ruimte is belast met de opsporing van de strafbare feiten in de volgende wettelijke voorschriften voor zover noodzakelijk voor een goede uitoefening van de functie en de daaraan gekoppelde taakomschrijving, tenzij de wet zich daartegen verzet.<br>(…)<br>9. Artikel 9.2.2.1a Wet Milieubeheer juncto artikel 1a Wet op de economische delicten;»<\/p><\/div><div class=\"law-grid\"><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>In gewone taal<\/span><\/div><p>Een boa in domein I mag feiten van artikel 9.2.2.1a Wm opsporen. Maar alleen voor zover dat nodig is voor zijn functie en taakomschrijving. En niet als de wet zich daartegen verzet.<\/p><\/section><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>Wat betekent dit voor jou als boa?<\/span><\/div><p>Volgens de toelichting kunnen boa’s zo blijven optreden tegen het afsteken en het voorhanden hebben van vuurwerk. Past dit ook binnen jouw eigen functie en taakomschrijving? Controleer dat bij je werkgever.<\/p><\/section><\/div><div class=\"law-definition\"><span class=\"law-definition-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><p><strong>Juncto<\/strong> (jo.) betekent: in samenhang met.<\/p><\/div><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Regeling domeinlijsten buitengewoon opsporingsambtenaar, bijlage, Domein I, onderdeel 9, zoals gewijzigd bij Stcrt. 2026, 31362 (in werking 8 september 2026) – https://zoek.officielebekendmakingen.nl/stcrt-2026-31362.html<\/li><\/ol><\/div>"},{"kind":"kaart","titel":"Domeinlijst is niet: alles mag","html":"<h2 class=\"ptitle\">Domeinlijst is niet: alles mag<\/h2><div class=\"kaart k-letop\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17h.01\"/><\/svg><\/span><span class=\"kaart-lab\">Let op<\/span><\/div><div class=\"kaart-t\">Domeinlijst is niet: alles mag<\/div><div class=\"kaart-b\"><p>Opname in de domeinlijst betekent niet dat iedere boa in iedere situatie alles mag doen.<\/p><p>Je bevoegdheid geldt «voor zover noodzakelijk voor een goede uitoefening van de functie en de daaraan gekoppelde taakomschrijving».<\/p><p>En voor elke bevoegdheid die je wilt gebruiken, moet je apart nagaan of aan de wettelijke voorwaarden is voldaan.<\/p><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Regeling domeinlijsten buitengewoon opsporingsambtenaar, bijlage, Domein I, onderdeel 9, zoals gewijzigd bij Stcrt. 2026, 31362 (in werking 8 september 2026) – https://zoek.officielebekendmakingen.nl/stcrt-2026-31362.html<\/li><\/ol><\/div>"},{"kind":"kaart","titel":"Let op: oudere teksten zijn achterhaald","html":"<h2 class=\"ptitle\">Let op: oudere teksten zijn achterhaald<\/h2><div class=\"kaart k-letop\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17h.01\"/><\/svg><\/span><span class=\"kaart-lab\">Let op<\/span><\/div><div class=\"kaart-t\">Let op: oudere teksten zijn achterhaald<\/div><div class=\"kaart-b\"><p>Het Handhavingsplan jaarwisseling (maart 2026) schrijft over domein I-boa’s: «Boa’s in domein I richten zich nu op het afsteken van vuurwerk buiten de toegestane tijden op basis van het Vuurwerkbesluit en treden op bij overlast door vuurwerk in de openbare ruimte, zoals vastgelegd in de APV. Ze zijn niet bevoegd voor het handhaven op het bezit of vervoer van vuurwerk.»<\/p><p>Die passage is geschreven vóór de wijziging van de domeinlijst. Sinds 8 september 2026 staat artikel 9.2.2.1a Wm jo. artikel 1a WED in domein I.<\/p><p>Gebruik oudere passages dus niet als bewijs van jouw actuele bevoegdheid. Kijk altijd naar de geldende domeinlijst.<\/p><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Handhavingsplan jaarwisseling, Ministerie van Justitie en Veiligheid, maart 2026 (beleid) – https://www.rijksoverheid.nl/documenten/2026/03/16/tk-bijlage-geactualiseerd-handhavingsplan-jaarwisseling-feb-2026<\/li><li>Regeling domeinlijsten buitengewoon opsporingsambtenaar, bijlage, Domein I, onderdeel 9, zoals gewijzigd bij Stcrt. 2026, 31362 (in werking 8 september 2026) – https://zoek.officielebekendmakingen.nl/stcrt-2026-31362.html<\/li><\/ol><\/div>"},{"kind":"theory","titel":"En F4 of ander professioneel vuurwerk?","html":"<span class=\"q-soort\">Domein<\/span><h2 class=\"ptitle\">En F4 of ander professioneel vuurwerk?<\/h2><div class=\"main\"><p>De regels over F4 en ander professioneel vuurwerk staan in het Vuurwerkbesluit, bijvoorbeeld artikel 1.2.2. Dat besluit is gebaseerd op artikel 9.2.2.1 Wm. Een overtreding is strafbaar via artikel 9.2.2.1 Wm jo. artikel 1a WED.<\/p><p>Domein I, onderdeel 9 noemt alleen artikel 9.2.2.1a Wm. Artikel 9.2.2.1 Wm staat daar niet. Op grond van onderdeel 9 ben je dus <b>niet<\/b> opsporingsbevoegd voor F4-feiten.<\/p><p>Tref je mogelijk F4 of ander professioneel vuurwerk aan? Schakel de politie in. Het Handhavingsplan zegt ook dat de politie verantwoordelijk blijft voor zwaar of crimineel vuurwerk.<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Regeling domeinlijsten buitengewoon opsporingsambtenaar, bijlage, Domein I, onderdeel 9, zoals gewijzigd bij Stcrt. 2026, 31362 (in werking 8 september 2026) – https://zoek.officielebekendmakingen.nl/stcrt-2026-31362.html<\/li><li>Vuurwerkbesluit, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0013360/2026-08-01<\/li><li>Wet op de economische delicten, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0002063/2026-08-01<\/li><li>Handhavingsplan jaarwisseling, Ministerie van Justitie en Veiligheid, maart 2026 (beleid) – https://www.rijksoverheid.nl/documenten/2026/03/16/tk-bijlage-geactualiseerd-handhavingsplan-jaarwisseling-feb-2026<\/li><\/ol><\/div>"},{"kind":"kader","titel":"WED: wie spoort economische delicten op?","html":"<h2 class=\"ptitle\">WED: wie spoort economische delicten op?<\/h2><div class=\"kaart k-kader law-card\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span class=\"kaart-lab\">Juridisch kader<\/span><\/div><div class=\"kaart-t\">Artikel 17 · WED<\/div><div class=\"kaart-b\"><p class=\"law-intro\">De bijzondere bevoegdheden van de WED gelden voor «de opsporingsambtenaren». Artikel 17 WED zegt wie dat zijn.<\/p><div class=\"law-quote\"><div class=\"law-quote-head\"><span class=\"law-quote-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/><\/svg><\/span><span>Wettekst<\/span><\/div><p class=\"wet law-text\">«1 Met de opsporing van economische delicten zijn belast:<br>1°. de bij of krachtens artikel 141 van het Wetboek van Strafvordering aangewezen ambtenaren;<br>2°. de door Onze Minister van Veiligheid en Justitie, in overeenstemming met Onze andere Ministers, wie het aangaat, aangewezen ambtenaren;<br>3°. de ambtenaren van de rijksbelastingdienst, bevoegd inzake douane.<br>2 Alle met de opsporing van economische delicten belaste ambtenaren zijn tevens belast met de opsporing van de economische delicten, genoemd in de artikelen 26, 33 en 34. 3 Artikel 142, tweede en vierde lid, van het Wetboek van Strafvordering is van overeenkomstige toepassing op de in het eerste lid, onder 2° en 3°, bedoelde opsporingsambtenaren.<br>4 Van een besluit als bedoeld in het eerste lid, onder 2°, wordt mededeling gedaan door plaatsing in de Staatscourant.»<\/p><\/div><div class=\"law-grid\"><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>In gewone taal<\/span><\/div><p>Met de opsporing van economische delicten zijn onder meer ambtenaren belast die de minister daarvoor aanwijst (lid 1 onder 2°). Zij mogen ook het weigeren van een vordering (art. 26 WED) opsporen (lid 2).<\/p><\/section><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>Wat betekent dit voor jou als boa?<\/span><\/div><p>De Beleidsregels boa zeggen: «Voor economische delicten wordt de titel verleend door de Minister van Justitie en Veiligheid, in overeenstemming met de minister wie het aangaat, op grond van artikel 17, eerste lid, onder 2°, van de Wet op de Economische Delicten.» Is jouw akte afgegeven voor art. 9.2.2.1a Wm jo. art. 1a WED? Dan ben je voor dat economische delict WED-opsporingsambtenaar en gelden de bevoegdheden van art. 18 tot en met 24a WED.<\/p><\/section><\/div><div class=\"law-definition\"><span class=\"law-definition-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><p><strong>Drie dingen apart<\/strong>: (A) opsporingsbevoegd zijn voor het feit; (B) een concrete WED-bevoegdheid gebruiken, met de voorwaarden van dat artikel; (C) of dit nodig is voor je functie en taakomschrijving.<\/p><\/div><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wet op de economische delicten, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0002063/2026-08-01<\/li><li>Beleidsregels buitengewoon opsporingsambtenaar, geldend vanaf 1 mei 2026 – https://wetten.overheid.nl/BWBR0039766<\/li><li>Regeling domeinlijsten buitengewoon opsporingsambtenaar, bijlage, Domein I, onderdeel 9, zoals gewijzigd bij Stcrt. 2026, 31362 (in werking 8 september 2026) – https://zoek.officielebekendmakingen.nl/stcrt-2026-31362.html<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Wanneer ben jij als boa bevoegd?","html":"<span class=\"q-soort\">Domein<\/span><h2 class=\"ptitle\">Wanneer ben jij als boa bevoegd?<\/h2><div class=\"main\"><p>Een veelgemaakte denkfout is: «Vuurwerk staat in mijn domein, dus ik ben voor alle vuurwerkfeiten bevoegd.» Dat klopt niet.<\/p><p>Domein I noemt één concreet feit: overtreding van artikel 9.2.2.1a Wm jo. artikel 1a WED. Dat gaat over F2 en F3. Andere vuurwerkregels, zoals die voor F4 in het Vuurwerkbesluit, vallen daar niet onder.<\/p><p>Loop daarom altijd de zeven stappen op de volgende pagina door.<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Regeling domeinlijsten buitengewoon opsporingsambtenaar, bijlage, Domein I, onderdeel 9, zoals gewijzigd bij Stcrt. 2026, 31362 (in werking 8 september 2026) – https://zoek.officielebekendmakingen.nl/stcrt-2026-31362.html<\/li><li>Wet milieubeheer, art. 9.2.2.1a, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0003245/2026-08-01 (ingevoerd bij de Wet veilige jaarwisseling, Stb. 2026, 7).<\/li><\/ol><\/div>"},{"kind":"figuur","titel":"Zeven stappen: ben ik bevoegd en mag ik dit doen?","html":"<div class=\"figcap\">Zeven stappen: ben ik bevoegd en mag ik dit doen?<\/div><figure class=\"illu\"><svg viewBox=\"0 0 560 60\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>Zeven stappen: ben ik bevoegd en mag ik dit doen?<\/title><desc>Zeven stappen: welk concreet strafbaar feit vermoed ik, welke wettelijke bepaling is overtreden, staat dat feit in mijn domeinlijst, past optreden binnen mijn functie en taakomschrijving, welke concrete bevoegdheid wil ik toepassen, voldoe ik aan de voorwaarden van die bevoegdheid, is zelf handelen verantwoord en veilig.<\/desc><\/svg><\/figure>"},{"kind":"casus","titel":"Je weet de categorie nog niet","html":"<span class=\"q-soort\">Voorbeeld<\/span><h2 class=\"ptitle\">Je weet de categorie nog niet<\/h2><p class=\"lees\">Je vindt in de tas vuurwerk zonder verpakking. Je weet niet welke categorie het is.<\/p><p class=\"lees\">Kun je dan al zeggen of je bevoegd bent? En mag je verder onderzoeken om daarachter te komen?<\/p>"},{"kind":"casus","titel":"Je weet de categorie nog niet — betekenis","html":"<span class=\"q-soort\">Voorbeeld<\/span><h2 class=\"ptitle\">Je weet de categorie nog niet — betekenis<\/h2><div class=\"kaart k-voorbeeld\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3v18M7 21h10\"/><path d=\"M12 6 5 8m7-2 7 2\"/><path d=\"M5 8 2.5 13a3 3 0 0 0 5 0L5 8Zm14 0-2.5 5a3 3 0 0 0 5 0L19 8Z\"/><\/svg><\/span><span class=\"kaart-lab\">Voorbeeld<\/span><\/div><div class=\"kaart-t\">Betekenis voor de praktijk<\/div><div class=\"kaart-b\"><p>Voor opsporing heb je een <b>verdenking<\/b> nodig: een redelijk vermoeden van schuld aan een strafbaar feit (artikel 27 Sv). Je hoeft de categorie dus nog niet zeker te weten.<\/p><p>Het vaststellen van de categorie kan onderdeel zijn van het onderzoek. Maar trek geen juridische conclusie die je nog niet kunt onderbouwen.<\/p><p>Schrijf op wat je ziet en wat je nog niet weet. En let op je veiligheid: onbekend vuurwerk kan gevaarlijk zijn.<\/p><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wetboek van Strafvordering, geldend vanaf 1 juli 2026 – https://wetten.overheid.nl/BWBR0001903/2026-07-01<\/li><\/ol><\/div>"},{"kind":"onthoud","titel":"Kort samengevat","html":"<h2 class=\"ptitle\">Kort samengevat<\/h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-t\">Bevoegdheid<\/div><div class=\"kaart-b\"><ul class=\"punten\"><li>Een strafbaar feit zien is iets anders dan daarvoor bevoegd zijn.<\/li><li>Sinds 8 september 2026 staat artikel 9.2.2.1a Wm jo. artikel 1a WED in domein I, onderdeel 9.<\/li><\/ul><\/div><\/div>"},{"kind":"onthoud","titel":"Kort samengevat","html":"<h2 class=\"ptitle\">Kort samengevat<\/h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-t\">In de praktijk<\/div><div class=\"kaart-b\"><ul class=\"punten\"><li>Je bevoegdheid geldt voor zover nodig voor je functie en taakomschrijving.<\/li><li>Oudere passages over domein I zijn achterhaald. Kijk naar de geldende domeinlijst.<\/li><li>Voor F4 en ander professioneel vuurwerk is jouw bevoegdheid niet bevestigd. Schakel bij twijfel de politie in.<\/li><\/ul><\/div><\/div>"},{"kind":"theory","titel":"Vooruitblik: Wat mag je als boa doen?","html":"<h2 class=\"ptitle\">Vooruitblik: Wat mag je als boa doen?<\/h2><div class=\"main\"><p>Je weet nu hoe je bepaalt of je bevoegd bent. In het volgende onderwerp kijken we naar wat je dan mag doen.<\/p><p>Dan gaat het om de vierde vraag: «Wat doe ik nu?»<\/p><\/div>"}],"titel":"Wanneer ben jij als boa bevoegd?","type":"content","vragen":[{"artikel":"Art. 142 Sv","juist":2,"kernregel":"Constateren is iets anders dan opsporingsbevoegd zijn.","opties":["Ja. Als je een strafbaar feit ziet, ben je altijd bevoegd.","Ja, maar alleen als er getuigen zijn die het ook zagen.","Nee. Je controleert of het feit onder jouw bevoegdheid valt.","Nee. Een boa is nooit bevoegd bij vuurwerkfeiten."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is C. Een strafbaar feit zien heet constateren. Een boa is alleen bevoegd voor de feiten in zijn akte of aanwijzing, vaak via een domein (artikel 142, tweede lid, Sv). [[1]]","voetnoten":["Wetboek van Strafvordering (geldend vanaf 1 juli 2026)."],"vraag":"Je ziet dat iemand een strafbaar feit pleegt. Betekent dit dat jij als boa bevoegd bent om op te treden?","wet":"Wetboek van Strafvordering"},{"artikel":"Domein I, onderdeel 9","juist":0,"kernregel":"Domein I, onderdeel 9: art. 9.2.2.1a Wm jo. art. 1a WED.","opties":["Artikel 9.2.2.1a Wet milieubeheer juncto artikel 1a WED.","Het volledige Vuurwerkbesluit, inclusief F4-vuurwerk.","Alleen overlast door vuurwerk op grond van de APV.","Alleen artikel 1.2.4 van het Vuurwerkbesluit."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is A. Bij regeling van 28 augustus 2026 (Stcrt. 2026, 31362) luidt onderdeel 9 van Domein I: «Artikel 9.2.2.1a Wet Milieubeheer juncto artikel 1a Wet op de economische delicten». In werking sinds 8 september 2026. [[1]]","voetnoten":["Regeling domeinlijsten buitengewoon opsporingsambtenaar, Domein I, onderdeel 9 (Stcrt. 2026, 31362)."],"vraag":"Wat staat sinds 8 september 2026 in domein I, onderdeel 9?","wet":"Regeling domeinlijsten boa"},{"artikel":"Werkwijze","juist":3,"kernregel":"Gebruik oude passages niet als bewijs van actuele bevoegdheid.","opties":["Dat klopt. Het Handhavingsplan gaat altijd voor de wet.","Dat klopt, maar alleen buiten de jaarwisseling.","Dat klopt niet. Een Handhavingsplan geldt nooit voor boa’s.","Die passage is achterhaald door de wijziging van 8 september 2026."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is D. Die passage is geschreven vóór de wijziging van de domeinlijst. Sinds 8 september 2026 staat artikel 9.2.2.1a Wm jo. artikel 1a WED in domein I. Voor bevoegdheid kijk je naar de geldende domeinlijst. [[1]]","voetnoten":["Regeling domeinlijsten buitengewoon opsporingsambtenaar, Domein I, onderdeel 9 (Stcrt. 2026, 31362)."],"vraag":"Een collega wijst op het Handhavingsplan (maart 2026): «Domein I-boa’s zijn niet bevoegd voor bezit van vuurwerk.» Wat is juist?","wet":"—"},{"artikel":"Art. 27 Sv","juist":1,"kernregel":"Een redelijk vermoeden is genoeg om te beginnen; zekerheid volgt uit onderzoek.","opties":["Je mag pas iets doen als de categorie al vaststaat.","Voor opsporing is een redelijk vermoeden van schuld nodig, geen zekerheid.","Je gaat ervan uit dat het de zwaarste categorie is.","Je gaat ervan uit dat het de lichtste categorie is."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is B. Verdachte is degene tegen wie een redelijk vermoeden van schuld bestaat (artikel 27 Sv). Het vaststellen van de categorie kan onderdeel zijn van het onderzoek. Let wel op je veiligheid. [[1]]","voetnoten":["Wetboek van Strafvordering (geldend vanaf 1 juli 2026)."],"vraag":"Je vindt vuurwerk zonder etiket. Je weet de categorie niet. Wat is juist?","wet":"Wetboek van Strafvordering"},{"artikel":"Domein I","juist":2,"kernregel":"Bevoegd voor zover nodig voor functie en taakomschrijving.","opties":["Voor het bezit van F2-vuurwerk in de openbare ruimte.","Voor het afsteken van F3-vuurwerk op straat.","Voor alles wat buiten je functie en taakomschrijving valt.","Voor het gebruik van F2-vuurwerk door een jongere."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is C. Domein I geldt «voor zover noodzakelijk voor een goede uitoefening van de functie en de daaraan gekoppelde taakomschrijving, tenzij de wet zich daartegen verzet». Opname in de domeinlijst betekent niet dat je alles mag. [[1]]","voetnoten":["Regeling domeinlijsten buitengewoon opsporingsambtenaar, Domein I, onderdeel 9 (Stcrt. 2026, 31362)."],"vraag":"Je bent domein I-boa. Waar geldt jouw opsporingsbevoegdheid voor onderdeel 9 in elk geval niet automatisch voor?","wet":"Regeling domeinlijsten boa"},{"artikel":"Domein I, onderdeel 9","juist":1,"kernregel":"Domein I, onderdeel 9 dekt niet alle vuurwerkfeiten.","opties":["Ja, want alle vuurwerk valt onder onderdeel 9.","Nee, onderdeel 9 noemt alleen art. 9.2.2.1a Wm; F4 valt onder het Vuurwerkbesluit.","Ja, maar alleen tijdens de jaarwisseling.","Nee, want F4 is nooit strafbaar."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is B. Artikel 9.2.2.1a Wm gaat over F2 en F3. De regels voor F4 staan in het Vuurwerkbesluit (bijv. art. 1.2.2) en zijn strafbaar via art. 9.2.2.1 Wm jo. art. 1a WED. Dat feit staat niet in domein I, onderdeel 9. Schakel de politie in. [[1]]","voetnoten":["Regeling domeinlijsten buitengewoon opsporingsambtenaar, Domein I, onderdeel 9 (Stcrt. 2026, 31362)."],"vraag":"Je bent domein I-boa. In een kofferbak zie je een doos met op het etiket «F4». Ben je op grond van domein I, onderdeel 9 opsporingsbevoegd voor dit feit?","wet":"Regeling domeinlijsten boa"}]},{"icoon":"list","id":"m5","kader":"Bevoegdheden","nr":5,"pages":[{"kind":"lo","titel":"Leerdoelen","html":"<h2 class=\"ptitle\">Leerdoelen<\/h2><p class=\"pintro\">Wat je na dit onderwerp kunt.<\/p><ul class=\"lo\"><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>ken je de vijf stappen van situatie tot vervolg;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>ken je het verschil tussen aanspreken, staande houden en aanhouden;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>ken je de WED-bevoegdheden: vervoermiddelen onderzoeken, medewerking vorderen, uitlevering vorderen en inbeslagneming;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je wat artikel 26 WED betekent;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je wat er in het proces-verbaal moet staan.<\/span><\/li><\/ul>"},{"kind":"figuur","titel":"Van mogen naar doen: vijf stappen","html":"<div class=\"figcap\">Van mogen naar doen: vijf stappen<\/div><figure class=\"illu\"><svg viewBox=\"0 0 560 60\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>Van mogen naar doen: vijf stappen<\/title><desc>Vijf stappen: situatie, wat wil je doen, mag dat, wettelijke grondslag, wat doe je vervolgens. Daarna leg je alles vast in het proces-verbaal.<\/desc><\/svg><\/figure>"},{"kind":"figuur","titel":"Bevoegdhedenkaart","html":"<div class=\"figcap\">Bevoegdhedenkaart<\/div><figure class=\"illu\"><svg viewBox=\"0 0 560 60\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>Bevoegdhedenkaart<\/title><desc>Staande houden: artikel 52 Sv. Aanhouden: artikel 53 en 54 Sv. Vervoermiddel onderzoeken: artikel 23 WED. Medewerking vorderen: artikel 24a WED. Uitlevering vorderen en in beslag nemen: artikel 18 WED. Niet voldoen aan een vordering: artikel 26 WED.<\/desc><\/svg><\/figure>"},{"kind":"kaart","titel":"Let op: artikelnummers gecontroleerd","html":"<h2 class=\"ptitle\">Let op: artikelnummers gecontroleerd<\/h2><div class=\"kaart k-letop\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17h.01\"/><\/svg><\/span><span class=\"kaart-lab\">Let op<\/span><\/div><div class=\"kaart-t\">Let op: artikelnummers gecontroleerd<\/div><div class=\"kaart-b\"><p>In een eerder overzicht stonden uitlevering vorderen en in beslag nemen bij artikel 26 WED, en medewerking vorderen bij artikel 24 WED.<\/p><p>Volgens de geldende wettekst staan <b>inbeslagneming en uitlevering vorderen in artikel 18 WED<\/b> en <b>medewerking vorderen in artikel 24a WED<\/b>. Artikel 24 WED gaat over regels voor het stilhouden en over versperringen.<\/p><p><b>Artikel 26 WED<\/b> is geen bevoegdheid. Het maakt het opzettelijk niet voldoen aan een vordering zelf tot een economisch delict.<\/p><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wet op de economische delicten, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0002063/2026-08-01<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Aanspreken, staande houden, aanhouden","html":"<h2 class=\"ptitle\">Aanspreken, staande houden, aanhouden<\/h2><div class=\"main\"><p><b>Aanspreken<\/b> is een gewoon gesprek. Je hebt er geen bijzondere bevoegdheid voor nodig. De persoon mag gewoon doorlopen.<\/p><p><b>Staande houden<\/b> betekent: je laat een verdachte stoppen om zijn identiteit vast te stellen. Daarvoor heb je artikel 52 Sv nodig.<\/p><p><b>Aanhouden<\/b> is zwaarder: je neemt iemand zijn vrijheid af en brengt hem over naar de plaats voor verhoor. Daarvoor gelden de artikelen 53 en 54 Sv.<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wetboek van Strafvordering, geldend vanaf 1 juli 2026 – https://wetten.overheid.nl/BWBR0001903/2026-07-01<\/li><\/ol><\/div>"},{"kind":"kader","titel":"Wettekst: staande houden","html":"<h2 class=\"ptitle\">Wettekst: staande houden<\/h2><div class=\"kaart k-kader law-card\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span class=\"kaart-lab\">Juridisch kader<\/span><\/div><div class=\"kaart-t\">Artikel 52 en 27a · Wetboek van Strafvordering<\/div><div class=\"kaart-b\"><p class=\"law-intro\">Staande houden gebeurt op grond van artikel 52 Sv. Artikel 27a Sv zegt hoe je de identiteit vaststelt.<\/p><div class=\"law-quote\"><div class=\"law-quote-head\"><span class=\"law-quote-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/><\/svg><\/span><span>Wettekst<\/span><\/div><p class=\"wet law-text\">«Iedere opsporingsambtenaar is bevoegd de identiteit van de verdachte vast te stellen op de wijze, bedoeld in artikel 27a, eerste lid, eerste volzin, en hem daartoe staande te houden.»<br><br>«1 De verdachte wordt ten behoeve van het vaststellen van zijn identiteit gevraagd naar zijn naam, voornamen, geboorteplaats en geboortedatum, het adres waarop hij in de basisregistratie personen is ingeschreven en het adres van zijn feitelijke verblijfplaats. Het vaststellen van zijn identiteit omvat tevens een onderzoek van een identiteitsbewijs als bedoeld in artikel 1 van de Wet op de identificatieplicht. In de gevallen, bedoeld in artikel 55c, tweede en derde lid, omvat het vaststellen van zijn identiteit tevens het nemen van een of meer foto’s en vingerafdrukken.» <em>(fragment)<\/em><\/p><\/div><div class=\"law-grid\"><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>In gewone taal<\/span><\/div><p>Je mag een verdachte laten stoppen om te vragen naar zijn naam, voornamen, geboorteplaats, geboortedatum en adressen. Je mag ook zijn identiteitsbewijs bekijken.<\/p><\/section><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>Wat betekent dit voor jou als boa?<\/span><\/div><p>Staande houden mag alleen bij een <b>verdachte<\/b>. Heb je nog geen redelijk vermoeden van een strafbaar feit? Dan kun je alleen aanspreken.<\/p><\/section><\/div><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wetboek van Strafvordering, geldend vanaf 1 juli 2026 – https://wetten.overheid.nl/BWBR0001903/2026-07-01<\/li><\/ol><\/div>"},{"kind":"kader","titel":"Wie is verdachte?","html":"<h2 class=\"ptitle\">Wie is verdachte?<\/h2><div class=\"kaart k-kader law-card\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span class=\"kaart-lab\">Juridisch kader<\/span><\/div><div class=\"kaart-t\">Artikel 27 · Wetboek van Strafvordering<\/div><div class=\"kaart-b\"><p class=\"law-intro\">Staande houden en aanhouden hangen af van het begrip verdachte.<\/p><div class=\"law-quote\"><div class=\"law-quote-head\"><span class=\"law-quote-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/><\/svg><\/span><span>Wettekst<\/span><\/div><p class=\"wet law-text\">«1 Als verdachte wordt vóórdat de vervolging is aangevangen, aangemerkt degene te wiens aanzien uit feiten of omstandigheden een redelijk vermoeden van schuld aan een strafbaar feit voortvloeit.» <em>(fragment)<\/em><\/p><\/div><div class=\"law-grid\"><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>In gewone taal<\/span><\/div><p>Iemand is verdachte als uit feiten of omstandigheden een redelijk vermoeden volgt dat hij een strafbaar feit heeft gepleegd.<\/p><\/section><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>Wat betekent dit voor jou als boa?<\/span><\/div><p>Je eigen waarneming telt. Zie je iemand F2-vuurwerk afsteken? Dan kan dat een redelijk vermoeden opleveren. Een gevoel of vooroordeel is niet genoeg.<\/p><\/section><\/div><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wetboek van Strafvordering, geldend vanaf 1 juli 2026 – https://wetten.overheid.nl/BWBR0001903/2026-07-01<\/li><\/ol><\/div>"},{"kind":"casus","titel":"Staande houden — situatie","html":"<span class=\"q-soort\">Voorbeeld<\/span><h2 class=\"ptitle\">Staande houden — situatie<\/h2><p class=\"lees\">Je ziet een jongere een vuurpijl afsteken. Op de verpakking die hij weggooit, lees je «F2». Hij loopt weg.<\/p><p class=\"lees\">Je wilt weten wie hij is.<\/p>"},{"kind":"kaart","titel":"Staande houden — vijf stappen","html":"<h2 class=\"ptitle\">Staande houden — vijf stappen<\/h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/><\/svg><\/span><span class=\"kaart-lab\">Van mogen naar doen<\/span><\/div><div class=\"kaart-t\">Vijf stappen<\/div><div class=\"kaart-b\"><p>Bij elke bevoegdheid volg je dezelfde vijf stappen.<\/p><ul class=\"opsom\"><li><b>Situatie<\/b> — jongere steekt mogelijk F2-vuurwerk af en loopt weg.<\/li><li><b>Wat wil je doen?<\/b> — hem laten stoppen en zijn identiteit vaststellen.<\/li><li><b>Mag dat?<\/b> — ja, als hij verdachte is van een feit waarvoor jij opsporingsbevoegd bent.<\/li><li><b>Wettelijke grondslag<\/b> — artikel 52 Sv, met artikel 27a Sv.<\/li><li><b>Wat doe je vervolgens?<\/b> — identiteit vaststellen, vastleggen, en beslissen over verdere afhandeling.<\/li><\/ul><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wetboek van Strafvordering, geldend vanaf 1 juli 2026 – https://wetten.overheid.nl/BWBR0001903/2026-07-01<\/li><li>Regeling domeinlijsten buitengewoon opsporingsambtenaar, bijlage, Domein I, onderdeel 9, zoals gewijzigd bij Stcrt. 2026, 31362 (in werking 8 september 2026) – https://zoek.officielebekendmakingen.nl/stcrt-2026-31362.html<\/li><\/ol><\/div>"},{"kind":"kader","titel":"Wettekst: aanhouden op heterdaad","html":"<h2 class=\"ptitle\">Wettekst: aanhouden op heterdaad<\/h2><div class=\"kaart k-kader law-card\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span class=\"kaart-lab\">Juridisch kader<\/span><\/div><div class=\"kaart-t\">Artikel 53 en 128 · Wetboek van Strafvordering<\/div><div class=\"kaart-b\"><p class=\"law-intro\">Aanhouden op heterdaad is geregeld in artikel 53 Sv. Wat heterdaad is, staat in artikel 128 Sv.<\/p><div class=\"law-quote\"><div class=\"law-quote-head\"><span class=\"law-quote-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/><\/svg><\/span><span>Wettekst<\/span><\/div><p class=\"wet law-text\">«1 In geval van ontdekking op heterdaad van een strafbaar feit is een ieder bevoegd de verdachte aan te houden.<br>2 De opsporingsambtenaar die een verdachte bij ontdekking op heterdaad aanhoudt, brengt deze ten spoedigste over naar de plaats voor verhoor ter voorgeleiding aan de hulpofficier van justitie of de officier van justitie.»<br><br>«1 Ontdekking op heeter daad heeft plaats, wanneer het strafbare feit ontdekt wordt, terwijl het begaan wordt of terstond nadat het begaan is.<br>2 Het geval van ontdekking op heeter daad wordt niet langer aanwezig geacht dan kort na het feit dier ontdekking.»<\/p><\/div><div class=\"law-grid\"><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>In gewone taal<\/span><\/div><p>Heterdaad betekent: het feit wordt ontdekt terwijl het gebeurt of meteen daarna. Dan mag je de verdachte aanhouden. Je brengt hem zo snel mogelijk naar de plaats voor verhoor, voor de (hulp)officier van justitie.<\/p><\/section><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>Wat betekent dit voor jou als boa?<\/span><\/div><p>Aanhouden is een zware maatregel. Vaak is staande houden en proces-verbaal opmaken genoeg. Of en hoe jij aanhoudt, hangt ook af van je instructie en de middelen die jou zijn toegekend.<\/p><\/section><\/div><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wetboek van Strafvordering, geldend vanaf 1 juli 2026 – https://wetten.overheid.nl/BWBR0001903/2026-07-01<\/li><\/ol><\/div>"},{"kind":"kaart","titel":"Aanhouden op heterdaad — vijf stappen","html":"<h2 class=\"ptitle\">Aanhouden op heterdaad — vijf stappen<\/h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/><\/svg><\/span><span class=\"kaart-lab\">Van mogen naar doen<\/span><\/div><div class=\"kaart-t\">Vijf stappen<\/div><div class=\"kaart-b\"><p>Bij elke bevoegdheid volg je dezelfde vijf stappen.<\/p><ul class=\"opsom\"><li><b>Situatie<\/b> — je betrapt iemand op het afsteken van F2-vuurwerk.<\/li><li><b>Wat wil je doen?<\/b> — hem aanhouden.<\/li><li><b>Mag dat?<\/b> — ja, bij ontdekking op heterdaad (artikel 53 Sv). Is aanhouden nodig? Vaak is staande houden genoeg.<\/li><li><b>Wettelijke grondslag<\/b> — artikel 53 Sv.<\/li><li><b>Wat doe je vervolgens?<\/b> — ten spoedigste overbrengen voor voorgeleiding aan de (hulp)officier van justitie.<\/li><\/ul><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wetboek van Strafvordering, geldend vanaf 1 juli 2026 – https://wetten.overheid.nl/BWBR0001903/2026-07-01<\/li><\/ol><\/div>"},{"kind":"kader","titel":"Wettekst: aanhouden buiten heterdaad","html":"<h2 class=\"ptitle\">Wettekst: aanhouden buiten heterdaad<\/h2><div class=\"kaart k-kader law-card\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span class=\"kaart-lab\">Juridisch kader<\/span><\/div><div class=\"kaart-t\">Artikel 54 en 67 · Wetboek van Strafvordering<\/div><div class=\"kaart-b\"><p class=\"law-intro\">Buiten heterdaad gelden strengere regels.<\/p><div class=\"law-quote\"><div class=\"law-quote-head\"><span class=\"law-quote-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/><\/svg><\/span><span>Wettekst<\/span><\/div><p class=\"wet law-text\">«1 Buiten het geval van ontdekking op heterdaad is de opsporingsambtenaar op bevel van de officier van justitie bevoegd de verdachte van een misdrijf waarvoor voorlopige hechtenis is toegelaten, aan te houden teneinde hem ten spoedigste voor te geleiden aan de hulpofficier van justitie of de officier van justitie.<br>2 Het bevel tot aanhouding kan door de officier van justitie mondeling of schriftelijk worden gegeven. Indien het mondeling wordt gegeven, wordt het nadien in het proces-verbaal vermeld.<br>3 Indien het bevel van de officier van justitie niet kan worden afgewacht, komt de in het eerste lid bedoelde bevoegdheid toe aan de hulpofficier van justitie. De hulpofficier van justitie geeft van de aanhouding onverwijld schriftelijk of mondeling kennis aan de officier van justitie. Het tweede lid is van overeenkomstige toepassing.<br>4 Indien het bevel van de officier van justitie of de hulpofficier van justitie niet kan worden afgewacht, is de opsporingsambtenaar bevoegd de verdachte aan te houden teneinde hem ten spoedigste voor te geleiden aan de hulpofficier van justitie of de officier van justitie.» <em>(fragment)<\/em><br><br>«1 Een bevel tot voorlopige hechtenis kan worden gegeven in geval van verdenking van:<br>a. een misdrijf waarop naar de wettelijke omschrijving een gevangenisstraf van vier jaren of meer is gesteld;» <em>(fragment)<\/em><\/p><\/div><div class=\"law-grid\"><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>In gewone taal<\/span><\/div><p>Buiten heterdaad mag alleen worden aangehouden bij verdenking van een misdrijf waarvoor voorlopige hechtenis is toegelaten. De opsporingsambtenaar houdt aan op bevel van de officier van justitie. Kan dat bevel niet worden afgewacht, dan beslist de hulpofficier. Alleen als ook díe niet kan worden afgewacht, mag de opsporingsambtenaar zelf aanhouden.<\/p><\/section><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>Wat betekent dit voor jou als boa?<\/span><\/div><p>Opzettelijke overtreding van artikel 9.2.2.1a Wm is een misdrijf met een maximale gevangenisstraf van zes jaar (art. 2 en 6 WED). Daarvoor is voorlopige hechtenis toegelaten (art. 67 lid 1 onder a Sv). Maar dat betekent <b>niet<\/b> dat je buiten heterdaad zelfstandig mag aanhouden. Neem eerst contact op met de (hulp)officier van justitie of de politie.<\/p><\/section><\/div><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wetboek van Strafvordering, geldend vanaf 1 juli 2026 – https://wetten.overheid.nl/BWBR0001903/2026-07-01<\/li><li>Wet op de economische delicten, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0002063/2026-08-01<\/li><\/ol><\/div>"},{"kind":"kaart","titel":"Let op: heterdaad en buiten heterdaad","html":"<h2 class=\"ptitle\">Let op: heterdaad en buiten heterdaad<\/h2><div class=\"kaart k-letop\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17h.01\"/><\/svg><\/span><span class=\"kaart-lab\">Let op<\/span><\/div><div class=\"kaart-t\">Let op: heterdaad en buiten heterdaad<\/div><div class=\"kaart-b\"><p><b>Op heterdaad<\/b> (art. 53 Sv): je mag de verdachte aanhouden.<\/p><p><b>Buiten heterdaad<\/b> (art. 54 Sv): alleen bij een misdrijf waarvoor voorlopige hechtenis is toegelaten, en in beginsel op bevel van de officier van justitie of hulpofficier. Zonder opzet is het een overtreding: dan kun je buiten heterdaad niet aanhouden.<\/p><p>Twijfel je? Houd de verdachte niet vast, maar leg vast wat je weet en overleg.<\/p><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wetboek van Strafvordering, geldend vanaf 1 juli 2026 – https://wetten.overheid.nl/BWBR0001903/2026-07-01<\/li><li>Wet op de economische delicten, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0002063/2026-08-01<\/li><\/ol><\/div>"},{"kind":"kader","titel":"Wettekst: vervoermiddelen onderzoeken","html":"<h2 class=\"ptitle\">Wettekst: vervoermiddelen onderzoeken<\/h2><div class=\"kaart k-kader law-card\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span class=\"kaart-lab\">Juridisch kader<\/span><\/div><div class=\"kaart-t\">Artikel 23 · WED<\/div><div class=\"kaart-b\"><p class=\"law-intro\">Artikel 23 WED geeft opsporingsambtenaren de bevoegdheid om vervoermiddelen te onderzoeken.<\/p><div class=\"law-quote\"><div class=\"law-quote-head\"><span class=\"law-quote-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/><\/svg><\/span><span>Wettekst<\/span><\/div><p class=\"wet law-text\">«1 De opsporingsambtenaren zijn bevoegd in het belang van de opsporing vervoermiddelen te onderzoeken met het oog op de naleving van de voorschriften, bedoeld in de artikelen 1 en 1a, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is.<br>2 Zij zijn bevoegd in het belang van de opsporing vervoermiddelen waarmee naar hun redelijk oordeel zaken worden vervoerd op hun lading te onderzoeken met het oog op de naleving van de voorschriften, bedoeld in de artikelen 1 en 1a, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is.<br>4 Zij zijn bevoegd met het oog op de uitoefening van deze bevoegdheden van de bestuurder van een voertuig of van de schipper van een vaartuig te vorderen dat deze zijn vervoermiddel stilhoudt en naar een door hen aangewezen plaats overbrengt, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is.» <em>(fragment)<\/em><\/p><\/div><div class=\"law-grid\"><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>In gewone taal<\/span><\/div><p>Lid 4: je mag vorderen dat de bestuurder stilhoudt. Lid 1 en 2: je mag het vervoermiddel en de lading onderzoeken. Steeds alleen voor zover dat redelijkerwijs nodig is voor de opsporing.<\/p><\/section><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>Wat betekent dit voor jou als boa?<\/span><\/div><p>Houd vier handelingen uit elkaar: stilhouden (art. 23 lid 4), onderzoeken (art. 23 lid 1 en 2), medewerking vorderen, bijvoorbeeld de bestuurder de kofferbak laten openen (art. 24a), en weigeren (art. 26). Onderzoek niet meer dan nodig en let op je veiligheid.<\/p><\/section><\/div><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wet op de economische delicten, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0002063/2026-08-01<\/li><\/ol><\/div>"},{"kind":"casus","titel":"Vervoermiddelen onderzoeken — situatie","html":"<span class=\"q-soort\">Voorbeeld<\/span><h2 class=\"ptitle\">Vervoermiddelen onderzoeken — situatie<\/h2><p class=\"lees\">Je ziet dat de jongeren een tas met vuurwerk in de kofferbak van een auto leggen. De bestuurder wil wegrijden.<\/p><p class=\"lees\">Je wilt weten wat er in de auto ligt.<\/p>"},{"kind":"kaart","titel":"Vervoermiddelen onderzoeken — vijf stappen","html":"<h2 class=\"ptitle\">Vervoermiddelen onderzoeken — vijf stappen<\/h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/><\/svg><\/span><span class=\"kaart-lab\">Van mogen naar doen<\/span><\/div><div class=\"kaart-t\">Vijf stappen<\/div><div class=\"kaart-b\"><p>Bij elke bevoegdheid volg je dezelfde vijf stappen.<\/p><ul class=\"opsom\"><li><b>Situatie<\/b> — er ligt mogelijk F2- of F3-vuurwerk in een auto.<\/li><li><b>Wat wil je doen?<\/b> — de auto laten stilhouden en de lading onderzoeken.<\/li><li><b>Mag dat?<\/b> — ja, in het belang van de opsporing en voor zover redelijkerwijs nodig, voor een feit waarvoor jij bevoegd bent (onderwerp 4).<\/li><li><b>Wettelijke grondslag<\/b> — artikel 23 WED (stilhouden: lid 4; onderzoek: lid 1 en 2).<\/li><li><b>Wat doe je vervolgens?<\/b> — bevindingen vastleggen; bij aangetroffen vuurwerk: inbeslagneming overwegen (artikel 18 WED).<\/li><\/ul><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wet op de economische delicten, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0002063/2026-08-01<\/li><\/ol><\/div>"},{"kind":"kader","titel":"Wettekst: medewerking vorderen","html":"<h2 class=\"ptitle\">Wettekst: medewerking vorderen<\/h2><div class=\"kaart k-kader law-card\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span class=\"kaart-lab\">Juridisch kader<\/span><\/div><div class=\"kaart-t\">Artikel 24a · WED<\/div><div class=\"kaart-b\"><p class=\"law-intro\">Iedereen moet meewerken als een opsporingsambtenaar een WED-bevoegdheid gebruikt.<\/p><div class=\"law-quote\"><div class=\"law-quote-head\"><span class=\"law-quote-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/><\/svg><\/span><span>Wettekst<\/span><\/div><p class=\"wet law-text\">«1 Een ieder is verplicht aan de opsporingsambtenaren binnen de door hen gestelde redelijke termijn alle medewerking te verlenen die deze redelijkerwijs kunnen vorderen bij de uitoefening van de hen krachtens deze titel toekomende bevoegdheden.<br>2 Zij die uit hoofde van ambt, beroep of wettelijk voorschrift verplicht zijn tot geheimhouding, kunnen het verlenen van medewerking weigeren, voor zover dit uit hun geheimhoudingsplicht voortvloeit.<br>3 De opsporingsambtenaren zijn bevoegd op kosten van de overtreder door feitelijk handelen op te treden tegen hetgeen in strijd met de in het eerste lid bedoelde verplichting is of wordt gedaan, gehouden of nagelaten, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is.»<\/p><\/div><div class=\"law-grid\"><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>In gewone taal<\/span><\/div><p>Iedereen moet binnen een redelijke termijn meewerken aan wat jij redelijkerwijs vraagt. Iemand met een geheimhoudingsplicht mag weigeren voor zover die plicht dat vraagt.<\/p><\/section><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>Wat betekent dit voor jou als boa?<\/span><\/div><p>Artikel 24a geeft geen nieuwe onderzoeksbevoegdheid. Het verplicht mensen mee te werken aan een bevoegdheid die je al hebt, zoals het onderzoek van artikel 23. Je kunt de bestuurder dus vorderen de kofferbak te openen voor dat onderzoek. Artikel 24 WED gaat níet over medewerking, maar over regels voor het stilhouden en over versperringen.<\/p><\/section><\/div><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wet op de economische delicten, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0002063/2026-08-01<\/li><\/ol><\/div>"},{"kind":"kaart","titel":"Medewerking vorderen — vijf stappen","html":"<h2 class=\"ptitle\">Medewerking vorderen — vijf stappen<\/h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/><\/svg><\/span><span class=\"kaart-lab\">Van mogen naar doen<\/span><\/div><div class=\"kaart-t\">Vijf stappen<\/div><div class=\"kaart-b\"><p>Bij elke bevoegdheid volg je dezelfde vijf stappen.<\/p><ul class=\"opsom\"><li><b>Situatie<\/b> — de bestuurder wil de kofferbak niet openen.<\/li><li><b>Wat wil je doen?<\/b> — vorderen dat hij de kofferbak opent.<\/li><li><b>Mag dat?<\/b> — ja, bij de uitoefening van een WED-bevoegdheid, voor zover redelijkerwijs nodig.<\/li><li><b>Wettelijke grondslag<\/b> — artikel 24a WED.<\/li><li><b>Wat doe je vervolgens?<\/b> — duidelijk vorderen en vastleggen. Werkt hij opzettelijk niet mee? Zie artikel 26 WED.<\/li><\/ul><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wet op de economische delicten, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0002063/2026-08-01<\/li><\/ol><\/div>"},{"kind":"kader","titel":"Wettekst: inbeslagneming en uitlevering vorderen","html":"<h2 class=\"ptitle\">Wettekst: inbeslagneming en uitlevering vorderen<\/h2><div class=\"kaart k-kader law-card\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span class=\"kaart-lab\">Juridisch kader<\/span><\/div><div class=\"kaart-t\">Artikel 18 · WED<\/div><div class=\"kaart-b\"><p class=\"law-intro\">Artikel 18 WED geeft de bevoegdheid tot inbeslagneming. De tweede zin geeft de bevoegdheid om uitlevering te vorderen.<\/p><div class=\"law-quote\"><div class=\"law-quote-head\"><span class=\"law-quote-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/><\/svg><\/span><span>Wettekst<\/span><\/div><p class=\"wet law-text\">«1 De opsporingsambtenaren zijn in het belang van de opsporing bevoegd tot inbeslagneming van daarvoor vatbare voorwerpen voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is. Zij kunnen daartoe hun uitlevering vorderen.<br>2 Voor inbeslagneming van voorwerpen ter verbeurdverklaring uit hoofde van artikel 7, onder e, behoeven zij evenwel de machtiging van de officier van justitie.»<\/p><\/div><div class=\"law-grid\"><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>In gewone taal<\/span><\/div><p>Je mag voorwerpen in beslag nemen die daarvoor vatbaar zijn, als dat nodig is voor de opsporing. Je mag daarvoor eisen dat iemand het voorwerp aan jou afgeeft. Dat heet uitlevering vorderen.<\/p><\/section><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>Wat betekent dit voor jou als boa?<\/span><\/div><p>Uitlevering vorderen is dus geen losse bevoegdheid. Het is een middel om tot inbeslagneming te komen.<\/p><\/section><\/div><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wet op de economische delicten, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0002063/2026-08-01<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Inbeslagneming","html":"<h2 class=\"ptitle\">Inbeslagneming<\/h2><div class=\"main\"><p><b>Aantreffen<\/b> is iets anders dan <b>in beslag nemen<\/b>. Aantreffen is: je ziet of vindt het vuurwerk. In beslag nemen is: je neemt het vuurwerk onder je beheer voor het strafrechtelijk onderzoek.<\/p><p>Vatbaar voor inbeslagneming zijn onder meer voorwerpen die kunnen dienen om de waarheid aan de dag te brengen, en voorwerpen waarvan verbeurdverklaring of onttrekking aan het verkeer kan worden bevolen (artikel 94 Sv).<\/p><p>Grondslagen: artikel 18 WED. Bij staande houden of aanhouden ook artikel 95 Sv (voorwerpen die de verdachte met zich voert). Van elke inbeslagneming maak je een kennisgeving van inbeslagneming (artikel 94, derde lid, Sv).<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wet op de economische delicten, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0002063/2026-08-01<\/li><li>Wetboek van Strafvordering, geldend vanaf 1 juli 2026 – https://wetten.overheid.nl/BWBR0001903/2026-07-01<\/li><\/ol><\/div>"},{"kind":"kaart","titel":"Inbeslagneming — vijf stappen","html":"<h2 class=\"ptitle\">Inbeslagneming — vijf stappen<\/h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/><\/svg><\/span><span class=\"kaart-lab\">Van mogen naar doen<\/span><\/div><div class=\"kaart-t\">Vijf stappen<\/div><div class=\"kaart-b\"><p>Bij elke bevoegdheid volg je dezelfde vijf stappen.<\/p><ul class=\"opsom\"><li><b>Situatie<\/b> — de jongere heeft een tas met verpakt F2-vuurwerk bij zich.<\/li><li><b>Wat wil je doen?<\/b> — eerst uitlevering vorderen, daarna in beslag nemen.<\/li><li><b>Mag dat?<\/b> — ja, als het vuurwerk vatbaar is voor inbeslagneming en dit redelijkerwijs nodig is.<\/li><li><b>Wettelijke grondslag<\/b> — artikel 18 WED (en artikel 95 Sv bij staande houden).<\/li><li><b>Wat doe je vervolgens?<\/b> — kennisgeving van inbeslagneming opmaken, bewijs van ontvangst geven, veilig laten afvoeren en vastleggen in het proces-verbaal.<\/li><\/ul><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wet op de economische delicten, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0002063/2026-08-01<\/li><li>Wetboek van Strafvordering, geldend vanaf 1 juli 2026 – https://wetten.overheid.nl/BWBR0001903/2026-07-01<\/li><\/ol><\/div>"},{"kind":"kader","titel":"Wettekst: niet voldoen aan een vordering","html":"<h2 class=\"ptitle\">Wettekst: niet voldoen aan een vordering<\/h2><div class=\"kaart k-kader law-card\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span class=\"kaart-lab\">Juridisch kader<\/span><\/div><div class=\"kaart-t\">Artikel 26 · WED<\/div><div class=\"kaart-b\"><p class=\"law-intro\">Wat als iemand niet meewerkt aan jouw vordering?<\/p><div class=\"law-quote\"><div class=\"law-quote-head\"><span class=\"law-quote-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/><\/svg><\/span><span>Wettekst<\/span><\/div><p class=\"wet law-text\">«Het opzettelijk niet voldoen aan een vordering, krachtens enig voorschrift van deze wet gedaan door een opsporingsambtenaar, is een economisch delict.»<\/p><\/div><div class=\"law-grid\"><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>In gewone taal<\/span><\/div><p>Werkt iemand opzettelijk niet mee aan een vordering die jij op grond van de WED doet? Dan pleegt hij daarmee zelf een economisch delict.<\/p><\/section><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>Wat betekent dit voor jou als boa?<\/span><\/div><p>Maak je vordering duidelijk en leg vast wat je hebt gevorderd en hoe de persoon reageerde. Artikel 26 WED geeft je geen extra bevoegdheid. Het maakt weigeren strafbaar.<\/p><\/section><\/div><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wet op de economische delicten, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0002063/2026-08-01<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Veiligstellen is geen aparte bevoegdheid","html":"<span class=\"q-soort\">Bevoegdheid<\/span><h2 class=\"ptitle\">Veiligstellen is geen aparte bevoegdheid<\/h2><div class=\"main\"><p>Het woord «veiligstellen» hoor je vaak. Maar het is geen aparte wettelijke bevoegdheid. Benoem steeds welke handeling je doet, met welk doel en op welke grondslag.<\/p><ul class=\"opsom\"><li><b>Voorwerp onder je nemen<\/b> voor het onderzoek: dat is inbeslagneming (art. 18 WED; art. 95 Sv; bij heterdaad ook art. 96 lid 1 Sv).<\/li><li><b>Voorkomen dat voorwerpen worden weggemaakt<\/b>, in afwachting van een doorzoeking: art. 96 lid 2 Sv, alleen in de situaties van art. 96 lid 1 Sv.<\/li><li><b>Afstand houden en omstanders vragen weg te blijven<\/b>: dat is geen opsporingsbevoegdheid, maar een veiligheidsmaatregel. Is dwang nodig? Schakel de politie in.<\/li><\/ul><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wet op de economische delicten, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0002063/2026-08-01<\/li><li>Wetboek van Strafvordering, geldend vanaf 1 juli 2026 – https://wetten.overheid.nl/BWBR0001903/2026-07-01<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Proces-verbaal","html":"<h2 class=\"ptitle\">Proces-verbaal<\/h2><div class=\"main\"><p>Wat je doet, leg je vast in een proces-verbaal. Het proces-verbaal gaat naar de officier van justitie.<\/p><p>Noteer bij elke bevoegdheid die je gebruikt: wat je deed, waarom, en op welke wettelijke grondslag. In onderwerp 8 oefen je het volledige proces-verbaal.<\/p><p>Schrijf niet alleen: «Verdachte had illegaal vuurwerk.» Beschrijf wat je zag, las, onderzocht, vorderde en in beslag nam, en hoe je conclusie is onderbouwd.<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wetboek van Strafvordering, geldend vanaf 1 juli 2026 – https://wetten.overheid.nl/BWBR0001903/2026-07-01<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Overdracht aan de politie","html":"<h2 class=\"ptitle\">Overdracht aan de politie<\/h2><div class=\"main\"><p>Soms draag je een zaak over aan de politie. Bijvoorbeeld als het gevaarlijk is, als het om zwaar of crimineel vuurwerk gaat, of als je niet bevoegd bent.<\/p><p>Het Handhavingsplan zegt dat de politie verantwoordelijk blijft voor de opsporing van zwaar of crimineel vuurwerk. Meer daarover in onderwerp 7.<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Handhavingsplan jaarwisseling, Ministerie van Justitie en Veiligheid, maart 2026 (beleid) – https://www.rijksoverheid.nl/documenten/2026/03/16/tk-bijlage-geactualiseerd-handhavingsplan-jaarwisseling-feb-2026<\/li><\/ol><\/div>"},{"kind":"kaart","titel":"Let op: redelijkerwijs nodig","html":"<h2 class=\"ptitle\">Let op: redelijkerwijs nodig<\/h2><div class=\"kaart k-letop\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17h.01\"/><\/svg><\/span><span class=\"kaart-lab\">Let op<\/span><\/div><div class=\"kaart-t\">Let op: redelijkerwijs nodig<\/div><div class=\"kaart-b\"><p>De WED-bevoegdheden gelden steeds «voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is».<\/p><p>Stel je dus steeds de vraag: is wat ik doe nodig? En kan het ook lichter?<\/p><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wet op de economische delicten, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0002063/2026-08-01<\/li><\/ol><\/div>"},{"kind":"onthoud","titel":"Kort samengevat","html":"<h2 class=\"ptitle\">Kort samengevat<\/h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-t\">Bevoegdheden<\/div><div class=\"kaart-b\"><ul class=\"punten\"><li>Staande houden: art. 52 Sv. Aanhouden op heterdaad: art. 53 Sv. Buiten heterdaad: art. 54 Sv, in beginsel op bevel van de (hulp)officier.<\/li><li>Vervoermiddelen onderzoeken: artikel 23 WED. Medewerking vorderen: artikel 24a WED.<\/li><li>Inbeslagneming en uitlevering vorderen: artikel 18 WED. Artikel 26 WED maakt opzettelijk niet voldoen aan een vordering strafbaar.<\/li><\/ul><\/div><\/div>"},{"kind":"onthoud","titel":"Kort samengevat","html":"<h2 class=\"ptitle\">Kort samengevat<\/h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-t\">Vastleggen en overdragen<\/div><div class=\"kaart-b\"><ul class=\"punten\"><li>Aantreffen is iets anders dan in beslag nemen. Veiligstellen is geen aparte bevoegdheid.<\/li><li>Houd in het proces-verbaal waarneming, informatie, onderzoek, bevoegdheden en conclusie uit elkaar.<\/li><li>Zwaar of crimineel vuurwerk: de politie is verantwoordelijk.<\/li><\/ul><\/div><\/div>"},{"kind":"theory","titel":"Vooruitblik: Onbekend en zwaar illegaal vuurwerk","html":"<h2 cl

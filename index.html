en</b>.</li><li><b>Artikel 2 WED</b> bepaalt of het een misdrijf of een overtreding is.</li></ul></div></section><div class=\"ed-twee\"><section class=\"ed-k ed-mis\"><span class=\"ed-k-ic\" aria-hidden=\"true\">✓</span><div><span class=\"ed-k-lab\">Opzettelijk begaan</span><h3>Misdrijf</h3></div></section><section class=\"ed-k ed-ovt\"><span class=\"ed-k-ic\" aria-hidden=\"true\">✕</span><div><span class=\"ed-k-lab\">Niet opzettelijk begaan</span><h3>Overtreding</h3></div></section></div><section class=\"ed-vb\"><span class=\"ed-ic\" data-i=\"boa\"></span><div><h3>Voorbeelden voor de boa</h3><p class=\"ed-voorw\">Dit geldt alleen als het bezit of gebruik voor die persoon verboden is. Voor een persoon met gespecialiseerde kennis is het niet verboden. Voor aangewezen F2 kan ook een ontheffing van de burgemeester gelden.</p><ol><li><span>Iemand zonder gespecialiseerde kennis steekt bewust F2 of F3 af. Er geldt geen ontheffing.</span><b class=\"ed-tag\">Misdrijf</b></li><li><span>Iemand zonder gespecialiseerde kennis heeft bewust F2 of F3 in bezit. Er geldt geen ontheffing.</span><b class=\"ed-tag\">Misdrijf</b></li></ol><p class=\"ed-noot\">De persoon hoeft niet te weten dat het bezit of afsteken verboden is. Het gaat erom dat hij de gedraging bewust verricht.</p></div></section><section class=\"ed-letop\"><span class=\"ed-lo-ic\" aria-hidden=\"true\">!</span><div><h3>Let op</h3><p>De feitcodes en de wijze van afhandeling moeten nog worden vastgesteld. In de basis geldt het bovenstaande.</p></div></section></div></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0003245/2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet milieubeheer</a> <span class=\"bb-toel\">art. 9.2.2.1a</span></li><li><a href=\"https://wetten.overheid.nl/BWBR0002063/2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet op de economische delicten</a> <span class=\"bb-toel\">art. 1a onder 1° en art. 2</span></li></ol></div>"}],"titel":"Wat zegt de wet?","type":"content","vragen":[{"vraag":"15 oktober. Een vrouw steekt in haar tuin F1-vuurwerk af. Valt dit onder het verbod voor F2 en F3?","beeld":{"src":"assets/images/02-q1-f1-tuin.webp","alt":"Een vrouw steekt 's avonds in haar tuin een sterretje af. Op tafel staat een doos met F1-vuurwerk.","w":770,"h":667,"pos":"50% 88%"},"opties":["Ja, vuurwerk mag alleen tijdens de jaarwisseling.","Nee, F1 valt niet onder het verbod voor F2 en F3.","Ja, sinds 1 augustus 2026 is al het vuurwerk verboden.","Ja, vuurwerk mag niet in een tuin worden afgestoken."],"juist":1,"uitleg":"Het verbod van artikel 9.2.2.1a lid 1 Wet milieubeheer gaat over F2 en F3. F1 valt niet onder dit verbod. [[1]]","uitlegFout":"Kijk goed naar de categorie. Op de verpakking staat F1. Het verbod van artikel 9.2.2.1a lid 1 Wet milieubeheer gaat over F2 en F3. [[1]]","fbGoed":"Goed!","fbFout":"Niet helemaal.","soort":"Praktijkcasus","artikel":"Art. 9.2.2.1a Wm","wet":"Wet milieubeheer","voetnoten":["Wet milieubeheer, art. 9.2.2.1a."],"stijl":"v2","groot":true},{"vraag":"31 december, 20.00 uur. Op een afgezet sportveld steekt een vereniging vuurwerk af. Op de dozen staat «F2». Wat doe je eerst?","opties":["Je legt het afsteken meteen stil, want F2 is verboden.","Je vraagt naar de ontheffing. Een afschrift hoort op het terrein te zijn.","Je doet niets, want op oudejaarsavond mag alles.","Je neemt direct al het vuurwerk in beslag."],"juist":1,"uitleg":"Controleer eerst of er een geldige ontheffing is. De burgemeester kan ontheffing verlenen voor het afsteken van aangewezen F2 tijdens de jaarwisseling (art. 9.2.2.1a lid 4 Wm). Een afschrift van de ontheffing moet op het afsteekterrein aanwezig zijn (art. 2.3.2a lid 1 onder e Vuurwerkbesluit). Pas daarna weet je of het verbod hier geldt. [[1]]","soort":"Praktijkcasus","artikel":"Art. 9.2.2.1a lid 4 Wm","wet":"—","voetnoten":["Wet milieubeheer, art. 9.2.2.1a lid 4; Vuurwerkbesluit, art. 2.3.2a."],"beeld":{"src":"assets/images/02-q2-f2-sportveld.webp","alt":"Een afgezet sportveld op oudejaarsavond met verlichting. Op een bank staat een doos met F2-vuurwerk.","w":782,"h":671,"pos":"50% 70%"},"stijl":"v2","groot":true},{"vraag":"Je controleert een auto op een parkeerplaats. In de kofferbak liggen dozen met F2-vuurwerk. De bestuurder zegt: “Die zijn van mij. Ik ga ze hier straks afsteken.” Er geldt geen ontheffing. Hoe kwalificeer je het bezit van het F2-vuurwerk?","beeld":{"src":"assets/images/02-q3-f2-kofferbak.webp","alt":"Een man bij de open achterklep van een auto op een parkeerplaats in de avond. In de kofferbak liggen dozen vuurwerk; op één doos staat F2.","w":619,"h":536,"pos":"50% 60%"},"opties":["Als een APV-overtreding.","Als een economisch delict dat als misdrijf wordt aangemerkt.","Als een economisch delict dat altijd een overtreding is.","Het bezit is niet strafbaar; alleen het afsteken kan strafbaar zijn."],"juist":1,"uitleg":"De bestuurder weet dat het F2-vuurwerk in zijn auto ligt en zegt dat het van hem is. Het bezit wordt dus bewust verricht. Als dit bezit voor hem verboden is, is sprake van een economisch delict. Wordt het feit opzettelijk begaan, dan wordt het op grond van de WED als misdrijf aangemerkt. [[1]]","uitlegFout":"Kijk goed naar wat de bestuurder zelf zegt. Hij weet dat het F2-vuurwerk in zijn auto ligt en zegt dat het van hem is. Het bezit wordt dus bewust verricht. Verboden bezit van F2 is een economisch delict. Als dit feit opzettelijk wordt begaan, wordt het op grond van de WED als misdrijf aangemerkt. [[1]]","fbGoed":"Goed!","fbFout":"Niet helemaal.","soort":"Praktijkcasus","artikel":"Art. 9.2.2.1a Wm; art. 1a en 2 WED","wet":"Wet op de economische delicten","voetnoten":["Wet milieubeheer, art. 9.2.2.1a; Wet op de economische delicten, art. 1a en 2."],"stijl":"v2","groot":true}]},{"icoon":"schild","id":"m3","kader":"Wettelijk bevoegd","nr":3,"pages":[{"kind":"kader","titel":"Domein I, onderdeel 9","html":"<div class=\"d9p\"><header class=\"d9-kop\"><div class=\"d9-kop-tekst\"><span class=\"d9-chip\"><span data-i=\"wet\"></span>Wettelijk bevoegd</span><h2 class=\"d9-t\">Domein I, onderdeel 9</h2><p class=\"d9-sub\">Regeling domeinlijsten buitengewoon opsporingsambtenaar</p><p class=\"d9-intro\">Sinds 8 september 2026 staat artikel 9.2.2.1a Wet milieubeheer in onderdeel 9 van domein I.</p><p class=\"d9-intro\">Daarmee kan de boa Openbare ruimte strafbare feiten uit dit artikel opsporen, voor zover dit nodig is voor de functie en taakomschrijving.</p></div><div class=\"d9-boek\" aria-hidden=\"true\"></div></header><figure class=\"d9-foto\"><img src=\"assets/images/03-01-boa-kofferbak.webp?v=vw260927b\" alt=\"Twee boa’s in handhavingsuniform spreken op een parkeerplaats een jongeman aan bij de open kofferbak van een auto. In de kofferbak liggen dozen vuurwerk; op één doos staat F2.\" width=\"579\" height=\"560\" loading=\"eager\" decoding=\"async\"></figure><div class=\"d9-rest\"><section class=\"d9-boa\"><div class=\"d9-boa-h\"><span class=\"d9-ic\" data-i=\"document\"></span><h3>Wat betekent dit voor jou als boa?</h3><span class=\"d9-badge\">Art. 9.2.2.1a Wm + art. 1a WED</span></div><div class=\"d9-boa-b\"><p>Verwijst je akte naar domein I? Dan ben je bevoegd om overtredingen van artikel 9.2.2.1a Wet milieubeheer op te sporen, voor zover dit binnen jouw functie en taakomschrijving valt.</p><p>In deze cursus richten we ons op het bezit en gebruik van F2 en F3.</p></div></section><div class=\"d9-twee\"><section class=\"d9-k d9-wel\"><div class=\"d9-k-h\"><span class=\"d9-k-ic\" aria-hidden=\"true\">✓</span><div><h3>Wél</h3><p class=\"d9-k-sub\">Je kunt optreden tegen:</p></div></div><ul><li>het verboden bezit van F2 en F3;</li><li>het verboden gebruik (afsteken) van F2 en F3.</li></ul><p class=\"d9-k-noot\">Daarbij geldt steeds: het moet passen binnen jouw akte, functie en taakomschrijving.</p></section><section class=\"d9-k d9-niet\"><div class=\"d9-k-h\"><span class=\"d9-k-ic\" aria-hidden=\"true\">✕</span><div><h3>Niet</h3><p class=\"d9-k-sub\">Onderdeel 9 betekent niet dat:</p></div></div><ul><li>je automatisch bevoegd bent voor alle vuurwerkfeiten;</li><li>je automatisch iedere opsporingsbevoegdheid of ieder dwangmiddel mag gebruiken;</li><li>je altijd zelf moet optreden als een situatie onveilig is.</li></ul></section></div></div><p class=\"d9-onthoud\"><span class=\"d9-o-ic\" data-i=\"lamp\"></span><span><b>Onthoud:</b> Bevoegd zijn is niet hetzelfde als altijd zelf optreden. Kijk naar je akte, je taak, je bevoegdheden en de veiligheid.</span></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0041447/2026-09-08\" target=\"_blank\" rel=\"noopener\">Regeling domeinlijsten buitengewoon opsporingsambtenaar</a> <span class=\"bb-toel\">Domein I, onderdeel 9</span></li></ol></div>"},{"kind":"kader","titel":"Artikel 17 WED: wanneer mag je de WED-bevoegdheden gebruiken?","html":"<div class=\"w17p\"><header class=\"w17-kop\"><div class=\"w17-kop-tekst\"><span class=\"w17-chip\"><span data-i=\"wet\"></span>Wettelijk bevoegd</span><h2 class=\"w17-t\">Artikel 17 WED: wanneer mag je de WED-bevoegdheden gebruiken?</h2><p class=\"w17-intro\">Artikel 17 WED bepaalt wie economische delicten mag opsporen.</p></div><div class=\"w17-boek\" aria-hidden=\"true\"></div></header><div class=\"w17-body\"><ol class=\"w17-stappen\"><li class=\"w17-stap\"><span class=\"w17-nr\" aria-hidden=\"true\">1</span><div class=\"w17-stap-b\"><h3>Het feit</h3><p>Overtreding van artikel 9.2.2.1a Wet milieubeheer is een economisch delict.</p></div><span class=\"w17-ic\" data-i=\"vuurwerk\"></span></li><li class=\"w17-stap\"><span class=\"w17-nr\" aria-hidden=\"true\">2</span><div class=\"w17-stap-b\"><h3>Jouw aanwijzing</h3><p>Als jouw akte verwijst naar domein I, kan onderdeel 9 jou bevoegdheid geven om dit feit op te sporen, voor zover dit nodig is voor jouw functie en taakomschrijving.</p></div><span class=\"w17-ic\" data-i=\"akte\"></span></li><li class=\"w17-stap\"><span class=\"w17-nr\" aria-hidden=\"true\">3</span><div class=\"w17-stap-b\"><h3>De WED-bevoegdheden</h3><p>Ben je voor dit economische delict bevoegd als opsporingsambtenaar? Dan kun je bij de opsporing ook de bevoegdheden uit de WED gebruiken, maar alleen als aan de voorwaarden van die specifieke bevoegdheid is voldaan.</p></div><span class=\"w17-ic\" data-i=\"wet\"></span></li></ol><div class=\"w17-rechts\"><section class=\"w17-boa\"><div class=\"w17-boa-h\"><span class=\"w17-boa-ic\" data-i=\"boa\"></span><h3>Wat betekent dit voor jou als boa?</h3></div><div class=\"w17-boa-b\"><p class=\"w17-boa-kern\">Niet iedere boa mag automatisch de WED-bevoegdheden gebruiken.</p><p class=\"w17-boa-lab\">Controleer eerst:</p><ul class=\"w17-check\"><li>Ben ik bevoegd voor dit economische delict?</li><li>Valt het optreden binnen mijn functie en taakomschrijving?</li><li>Aan welke voorwaarden moet de bevoegdheid die ik wil gebruiken voldoen?</li></ul></div></section><p class=\"w17-onthoud\"><span class=\"w17-o-ic\" data-i=\"lamp\"></span><span><b>Onthoud:</b> Eerst bepaal je of jij het economische delict mag opsporen. Daarna kijk je welke WED-bevoegdheid je in die situatie mag gebruiken.</span></p></div></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0002063/2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet op de economische delicten</a> <span class=\"bb-toel\">art. 17</span></li><li><a href=\"https://wetten.overheid.nl/BWBR0041447/2026-09-08\" target=\"_blank\" rel=\"noopener\">Regeling domeinlijsten buitengewoon opsporingsambtenaar</a> <span class=\"bb-toel\">Domein I, onderdeel 9</span></li></ol></div>"}],"titel":"Wanneer ben jij als boa bevoegd?","type":"content","vragen":[{"vraag":"Je bent boa in domein I. Je taak is vooral parkeertoezicht. Je ziet iemand een doos met «F2» afsteken. Wat is juist?","opties":["Je bent altijd bevoegd, want onderdeel 9 staat in domein I.","Je bent nooit bevoegd, want vuurwerk is geen parkeerfeit.","Je gaat na of opsporen past bij je functie en taakomschrijving.","Je bent alleen bevoegd tijdens de jaarwisseling."],"juist":2,"uitleg":"Onderdeel 9 staat in domein I. Daarmee kan een boa bevoegd zijn om overtredingen van artikel 9.2.2.1a Wet milieubeheer op te sporen, zoals verboden bezit, gebruik of verkoop van F2 en F3.\n\nMaar die bevoegdheid geldt voor zover dit nodig is voor een goede uitoefening van de functie en de daaraan gekoppelde taakomschrijving.\n\nJe bent dus niet automatisch bevoegd omdat onderdeel 9 in domein I staat. Maar je bent ook niet automatisch onbevoegd omdat je normaal vooral parkeertoezicht doet. Ga na wat binnen jouw functie en taakomschrijving valt. [[1]]","soort":"Praktijkcasus","artikel":"Domein I, onderdeel 9","wet":"Regeling domeinlijsten","voetnoten":[{"t":"Regeling domeinlijsten buitengewoon opsporingsambtenaar","url":"https://wetten.overheid.nl/BWBR0041447/2026-09-08","toel":"Domein I, onderdeel 9"}],"beeld":{"src":"assets/images/03-q1-parkeertoezicht.webp","alt":"Twee boa’s in handhavingsuniform doen parkeercontrole in een straat met geparkeerde auto’s. De voorste boa kijkt op een tablet bij een parkeerautomaat; op de achtergrond staat een parkeerbord.","w":760,"h":729,"pos":"50% 40%"},"fbGoed":"Juist!","fbGoedSub":"Je gaat na of het opsporen van dit feit past bij je functie en taakomschrijving.","stijl":"v2","groot":true,"layout":"breed"},{"vraag":"Bij een controle zie je in een kofferbak een doos met «F4». Je bent boa in domein I en hebt geen opdracht van de officier van justitie. Geeft onderdeel 9 jou bevoegdheid voor dit F4-feit?","opties":["Ja, al het vuurwerk valt onder onderdeel 9.","Nee. Onderdeel 9 gaat over art. 9.2.2.1a Wm (F2 en F3), niet over feiten uit het Vuurwerkbesluit over F4.","Ja, maar alleen op 31 december.","Nee, want F4-vuurwerk is nooit strafbaar."],"juist":1,"uitleg":"Art. 9.2.2.1a Wm noemt F4 niet. Regels over F4 staan in het Vuurwerkbesluit (bijv. art. 1.2.2) en zijn strafbaar via art. 9.2.2.1 Wm en art. 1a WED. Dat feit staat niet in onderdeel 9. Een opdracht van de officier voor een concreet onderzoek of project (onderdeel 21) kan dat veranderen. [[1]]","soort":"Praktijkcasus","artikel":"—","wet":"—","kernregel":"Eerst het feit, dan de bevoegdheid.","voetnoten":["Regeling domeinlijsten boa, Domein I, onderdelen 9 en 21."]},{"vraag":"Een collega wijst op het Handhavingsplan (maart 2026): «Boa’s in domein I zijn niet bevoegd voor bezit van vuurwerk.» Wat is juist?","opties":["Dat klopt: het Handhavingsplan gaat voor de domeinlijst.","Dat klopt, maar alleen buiten de jaarwisseling.","Die passage is ouder dan de domeinlijst van 8 september 2026. Voor bevoegdheid kijk je naar de geldende domeinlijst.","Een handhavingsplan geldt nooit voor boa’s."],"juist":2,"uitleg":"Het Handhavingsplan is beleid en geeft of neemt geen bevoegdheid. Sinds 8 september 2026 staat art. 9.2.2.1a Wm jo. art. 1a WED in domein I, onderdeel 9. Dat omvat ook het bezit. [[1]]","soort":"Praktijkcasus","artikel":"—","wet":"—","kernregel":"Beleid is geen bevoegdheidsgrondslag.","voetnoten":["Regeling domeinlijsten boa, Domein I, onderdeel 9, zoals gewijzigd bij Stcrt. 2026, 31362."]},{"vraag":"Je ziet een jongen iets afsteken. Er is een harde knal. Een verpakking vind je niet. Welke uitspraak is juist?","opties":["Je mag pas iets doen als de categorie zeker vaststaat.","Je gaat ervan uit dat het F2 was, want dan ben je bevoegd.","Je gaat ervan uit dat het F4 was.","Voor een verdenking is een redelijk vermoeden genoeg. Leg vast waarop dat vermoeden rust en gok niet naar de categorie."],"juist":3,"uitleg":"Voor een verdenking is een redelijk vermoeden van schuld genoeg (art. 27 Sv). Je beschrijft wat je hebt waargenomen en welke feiten dat vermoeden ondersteunen.\n\nProbeer eerst voldoende bewijs te verzamelen voor het bezit en het afsteken van vuurwerk (artikel 9.2.2.1a Wet milieubeheer).\n\nAls je onvoldoende feiten en omstandigheden hebt om op te kunnen treden in verband met het bezit of afsteken van vuurwerk, kun je ook denken aan andere strafbare feiten of overtredingen, zoals:\n\n• baldadigheid (art. 424 Sr);\n• geluidsoverlast (overtreding APV);\n• achterlaten van zwerfafval (overtreding Afvalstoffenverordening);\n• hinderlijk gedrag bij publiek toegankelijke plaatsen (overtreding APV).\n\nHierdoor kun je toch passend optreden, ook als het bezit of afsteken van vuurwerk niet te bewijzen is. [[1]]","soort":"Praktijkcasus","artikel":"Art. 27 Sv","wet":"Wetboek van Strafvordering","voetnoten":[{"t":"Wetboek van Strafvordering, artikel 27","url":"https://wetten.overheid.nl/BWBR0001903/2026-07-01"}],"beeld":{"src":"assets/images/03-q4-jongen-knal.webp","alt":"Twee boa’s in handhavingsuniform spreken ’s avonds op een plein een jongen aan. De jongen heeft niets in zijn handen; er is geen vuurwerk te zien.","w":861,"h":379},"stijl":"v2","fbGoed":"Juist!","fbGoedSub":"Juist beantwoord"}]},{"icoon":"route","id":"m4","kader":"Wettelijk bevoegd","nr":4,"pages":[{"kind":"kader","titel":"Bevoegdheid, verplichting of strafbaarstelling?","html":"<div class=\"bvp\"><header class=\"bv-kop\"><h2 class=\"bv-titel\">Bevoegdheid, verplichting of strafbaarstelling?</h2><p class=\"bv-intro\">Hier zie je welke WED-bevoegdheden je als boa hebt, wat degene tot wie een vordering is gericht moet doen en wanneer het niet voldoen aan een vordering zelf strafbaar is.</p></header><div class=\"bv-kols\"><section class=\"bv-kol bv-bev\" aria-labelledby=\"bv-h1\"><div class=\"bv-h\"><span class=\"bv-h-ic\" data-i=\"schild\"></span><div><h3 id=\"bv-h1\">Bevoegdheid</h3><p>Wat jij mag doen als boa</p></div></div><ul class=\"bv-lijst\"><li class=\"bv-r\"><span class=\"bv-ic\" data-i=\"hand\"></span><div class=\"bv-t\"><h4>Staande houden</h4><p>Iemand staande houden om zijn identiteit vast te stellen.</p></div><span class=\"bv-art\">art. 52 Sv</span></li><li class=\"bv-r\"><span class=\"bv-ic\" data-i=\"slot\"></span><div class=\"bv-t\"><h4>Aanhouden op heterdaad</h4><p>Een verdachte aanhouden bij ontdekking op heterdaad.</p></div><span class=\"bv-art\">art. 53 Sv</span></li><li class=\"bv-r\"><span class=\"bv-ic\" data-i=\"tas\"></span><div class=\"bv-t\"><h4>Inbeslagneming / uitlevering vorderen</h4><p>Voorwerpen in beslag nemen of de uitlevering daarvan vorderen.</p></div><span class=\"bv-art\">art. 18 WED</span></li><li class=\"bv-r\"><span class=\"bv-ic\" data-i=\"document\"></span><div class=\"bv-t\"><h4>Inzage van gegevens en bescheiden vorderen</h4><p>Inzage vorderen van gegevens en bescheiden die nodig zijn voor het onderzoek.</p></div><span class=\"bv-art\">art. 19 WED</span></li><li class=\"bv-r\"><span class=\"bv-ic\" data-i=\"locatie\"></span><div class=\"bv-t\"><h4>Plaatsen betreden</h4><p>Plaatsen betreden voor de opsporing van een economisch delict.</p><p class=\"bv-lo\">Let op: voor het binnentreden van een woning gelden aanvullende regels.</p></div><span class=\"bv-art\">art. 20 WED</span></li><li class=\"bv-r\"><span class=\"bv-ic\" data-i=\"zoeken\"></span><div class=\"bv-t\"><h4>Zaken onderzoeken en monsters nemen</h4><p>Zaken onderzoeken, monsters nemen en indien nodig verpakkingen openen.</p></div><span class=\"bv-art\">art. 21 WED</span></li><li class=\"bv-r\"><span class=\"bv-ic\" data-i=\"bus\"></span><div class=\"bv-t\"><h4>Vervoermiddel stilhouden en onderzoeken</h4><p>Een vervoermiddel stilhouden en het vervoermiddel en de lading onderzoeken.</p></div><span class=\"bv-art\">art. 23 WED</span></li><li class=\"bv-r\"><span class=\"bv-ic\" data-i=\"mensen\"></span><div class=\"bv-t\"><h4>Medewerking vorderen</h4><p>De medewerking vorderen die redelijkerwijs nodig is voor de uitoefening van de WED-bevoegdheden.</p></div><span class=\"bv-art\">art. 24a lid 1 WED</span></li></ul></section><section class=\"bv-kol bv-pl\" aria-labelledby=\"bv-h2\"><div class=\"bv-h\"><span class=\"bv-h-ic\" data-i=\"mensen\"></span><div><h3 id=\"bv-h2\">Verplichting</h3><p>Wat degene tot wie de vordering is gericht moet doen</p></div></div><div class=\"bv-regel\"><p>Degene tot wie een vordering op grond van de WED is gericht, is verplicht de medewerking te verlenen die redelijkerwijs nodig is voor de uitoefening van deze bevoegdheden.</p><span class=\"bv-art\">art. 24a lid 1 WED</span></div><p class=\"bv-vb-lab\">Voorbeelden van die medewerking</p><ul class=\"bv-lijst bv-vb\"><li class=\"bv-r\"><span class=\"bv-ic\" data-i=\"akte\"></span><div class=\"bv-t\"><h4>Identificeren</h4><p>Meewerken aan het vaststellen van de identiteit als dat in de concrete situatie rechtsgeldig wordt gevorderd.</p></div></li><li class=\"bv-r\"><span class=\"bv-ic\" data-i=\"document\"></span><div class=\"bv-t\"><h4>Gegevens en bescheiden verstrekken</h4><p>De gevorderde gegevens en bescheiden beschikbaar stellen.</p></div></li><li class=\"bv-r\"><span class=\"bv-ic\" data-i=\"locatie\"></span><div class=\"bv-t\"><h4>Toegang verlenen</h4><p>Toegang verlenen als een bevoegde opsporingsambtenaar op grond van de WED rechtmatig toegang vordert.</p></div></li><li class=\"bv-r\"><span class=\"bv-ic\" data-i=\"zoeken\"></span><div class=\"bv-t\"><h4>Zaken laten onderzoeken</h4><p>Meewerken aan het onderzoeken van zaken en het nemen van monsters.</p></div></li></ul><figure class=\"bv-foto\"><img src=\"assets/images/03-q4-jongen-knal.webp?v=vw260927j\" alt=\"\" width=\"861\" height=\"379\" loading=\"lazy\" decoding=\"async\"></figure></section><section class=\"bv-kol bv-str\" aria-labelledby=\"bv-h3\"><div class=\"bv-h\"><span class=\"bv-h-ic\" data-i=\"hamer\"></span><div><h3 id=\"bv-h3\">Strafbaarstelling</h3><p>Wat zelf een strafbaar feit is</p></div></div><div class=\"bv-strk\"><span class=\"bv-str-ic\" aria-hidden=\"true\">✕</span><h4>Opzettelijk niet voldoen aan een WED-vordering</h4><p>Het opzettelijk niet voldoen aan een vordering die krachtens de WED door een opsporingsambtenaar wordt gedaan, is een economisch delict.</p><span class=\"bv-art\">art. 26 WED</span></div><figure class=\"bv-foto bv-hamer\"><img src=\"assets/images/04-01-rechtershamer.webp?v=vw260927j\" alt=\"\" width=\"460\" height=\"401\" loading=\"lazy\" decoding=\"async\"></figure></section></div><div class=\"bv-onthoud\"><p><span class=\"bv-o-ic\" data-i=\"wet\"></span><span>WED-bevoegdheden gebruik je alleen als je bevoegd bent tot opsporing van het betreffende economische delict. Daarna kijk je per bevoegdheid naar de wettelijke voorwaarden.</span></p><p><span class=\"bv-o-ic\" data-i=\"schild\"></span><span>Een bevoegdheid is geen plicht. Beoordeel altijd of het gebruik van de bevoegdheid in de concrete situatie nodig is en aan de wettelijke voorwaarden voldoet.</span></p></div></div>"},{"kind":"kader","titel":"Staande houden","html":"<div class=\"vpp\"><header class=\"vp-kop\"><div class=\"vp-kop-t\"><span class=\"vp-chip\"><span data-i=\"schild\"></span>Bevoegdheid</span><h2 class=\"vp-t\">Staande houden</h2><span class=\"vp-art\">Art. 52 Sv</span></div><p class=\"vp-intro\">Staande houden betekent: je laat een verdachte stoppen om zijn identiteit vast te stellen.</p></header><div class=\"vp-body\"><figure class=\"vp-foto\"><img src=\"assets/images/h4-staande-houden.webp?v=vw260928a\" alt=\"Een boa in handhavingsuniform spreekt ’s avonds op een plein een jongen aan.\" loading=\"eager\" decoding=\"async\"></figure><div class=\"vp-rechts\"><section class=\"vp-kaart vp-wet\"><h3><span class=\"vp-ic\" data-i=\"boek\"></span>Wat zegt de wet?</h3><div class=\"vp-wt wet\"><p>«Iedere opsporingsambtenaar is bevoegd de identiteit van de verdachte vast te stellen op de wijze, bedoeld in artikel 27a, eerste lid, eerste volzin, en hem daartoe staande te houden.»</p></div></section><p class=\"vp-bron\"><span class=\"vp-bron-l\">Bron</span><a href=\"https://wetten.overheid.nl/jci1.3:c:BWBR0001903&artikel=52&z=2026-07-01&g=2026-07-01\" target=\"_blank\" rel=\"noopener\">Wetboek van Strafvordering, artikel 52</a></p><section class=\"vp-kaart vp-bet\"><h3><span class=\"vp-ic\" data-i=\"boa\"></span>Wat betekent dit voor jou als boa?</h3><p>Je mag iemand staande houden als hij verdachte is. Verdachte is iemand tegen wie uit feiten of omstandigheden een redelijk vermoeden van schuld volgt (art. 27 Sv).</p><p>Je houdt hem staande om zijn identiteit vast te stellen: je vraagt naar naam, voornamen, geboorteplaats, geboortedatum en adressen (art. 27a Sv).</p></section><section class=\"vp-kaart vp-vb\"><h3><span class=\"vp-ic\" data-i=\"hand\"></span>Voorbeeld uit de praktijk</h3><p>Je ziet op een plein iemand F2-vuurwerk afsteken. Op grond van wat je ziet, heb je een redelijk vermoeden dat hij een strafbaar feit pleegt. Je houdt hem staande om zijn identiteit vast te stellen.</p></section><p class=\"vp-onthoud\"><span class=\"vp-o-ic\" data-i=\"lamp\"></span><span><b>Onthoud:</b> Staande houden mag alleen bij een verdachte. Is er nog geen redelijk vermoeden van schuld? Dan kun je iemand alleen aanspreken.</span></p></div></div></div>"},{"kind":"kader","titel":"Vorderen van inzage in een identiteitsbewijs","html":"<div class=\"vpp vp-id\"><header class=\"vp-kop\"><div class=\"vp-kop-t\"><span class=\"vp-chip\"><span data-i=\"schild\"></span>Bevoegdheid</span><h2 class=\"vp-t\">Vorderen van inzage in een identiteitsbewijs</h2><span class=\"vp-art\">Art. 8 lid 2 Politiewet 2012</span></div><p class=\"vp-intro\">Staande houden en het vorderen van inzage in een identiteitsbewijs zijn twee verschillende bevoegdheden. Hier zie je hoe ze in de praktijk op elkaar aansluiten.</p></header><div class=\"vp-body\"><figure class=\"vp-foto\"><img src=\"assets/images/h4-inzage-identiteitsbewijs.webp?v=vw260930a\" alt=\"Een boa in handhavingsuniform, van achteren gezien, bekijkt ’s avonds op een plein het identiteitsbewijs van een jongeman.\" width=\"668\" height=\"570\" loading=\"eager\" decoding=\"async\"></figure><div class=\"vp-rechts\"><section class=\"vp-kaart vp-st\"><h3><span class=\"vp-nr\">1</span><span class=\"vp-h3t\">Staande houden <span class=\"vp-nw\">(art. 52 Sv)</span></span><span class=\"vp-ic\" data-i=\"persoon\"></span></h3><p>Je houdt een verdachte tijdelijk staande om zijn identiteit vast te stellen. Je vraagt hem naar zijn persoonsgegevens (art. 27a Sv). Dit zijn:</p><ul class=\"vp-lijst\"><li>naam en voornamen</li><li>geboorteplaats</li><li>geboortedatum</li><li>adres</li><li>woon- of verblijfplaats</li></ul></section><section class=\"vp-kaart vp-idk\"><h3><span class=\"vp-nr\">2</span><span class=\"vp-h3t\">Inzage in een identiteitsbewijs vorderen <span class=\"vp-nw\">(art. 8 lid 2 Politiewet 2012)</span></span><span class=\"vp-ic\" data-i=\"akte\"></span></h3><p>Dit is een aparte bevoegdheid. Wil je de opgegeven identiteit controleren aan de hand van een identiteitsbewijs? Dan mag je als boa op grond van artikel 8 lid 2 Politiewet 2012 inzage in een identiteitsbewijs vorderen, als dat redelijkerwijs noodzakelijk is voor de uitoefening van je taak.</p></section><section class=\"vp-kaart vp-vb\"><h3><span class=\"vp-ic\" data-i=\"vuurwerk\"></span>Voorbeeld uit de praktijk</h3><p>Je ziet dat iemand verboden vuurwerk afsteekt. Je houdt hem als verdachte staande (art. 52 Sv) en vraagt naar zijn persoonsgegevens, zoals naam, geboortedatum en adres.</p><p>Je wilt hiervoor een bekeuring uitschrijven. Om zijn identiteit betrouwbaar vast te stellen, vorder je op grond van artikel 8 lid 2 Politiewet 2012 inzage in zijn identiteitsbewijs.</p></section><div class=\"vp-onthoud vp-onthoud-l\"><span class=\"vp-o-ic\" data-i=\"lamp\"></span><div><p class=\"vp-o-t\">Onthoud</p><p class=\"vp-o-k\">Staande houden en het vorderen van inzage in een identiteitsbewijs zijn twee verschillende bevoegdheden.</p><ul class=\"vp-o-lijst\"><li><b>Art. 52 Sv:</b> een verdachte tijdelijk staande houden om zijn identiteit vast te stellen en hem vragen naar zijn persoonsgegevens.</li><li><b>Art. 8 lid 2 Politiewet 2012:</b> inzage in een identiteitsbewijs vorderen als dat redelijkerwijs noodzakelijk is voor de uitoefening van je taak.</li></ul></div></div></div></div></div>"},{"kind":"kader","titel":"Aanhouden op heterdaad","html":"<div class=\"vpp vp-hd\"><header class=\"vp-kop\"><div class=\"vp-kop-t\"><span class=\"vp-chip\"><span data-i=\"wet\"></span>Wettelijk bevoegd</span><h2 class=\"vp-t\">Aanhouden op heterdaad</h2></div><p class=\"vp-intro\">Heterdaad: je ontdekt het feit terwijl het gebeurt of meteen daarna.</p></header><div class=\"vp-body\"><div class=\"vp-links\"><figure class=\"vp-foto\"><img src=\"assets/images/h4-heterdaad-aanhouden.webp?v=vw260928c\" alt=\"Twee boa’s in uniform met HANDHAVING op de rug en het boa-embleem op de arm houden ’s avonds op een plein een jongen aan die probeert weg te rennen.\" loading=\"eager\" decoding=\"async\"></figure><div class=\"vp-bronnen\"><span class=\"vp-bron-l\">Bronnen</span><a href=\"https://wetten.overheid.nl/jci1.3:c:BWBR0001903&artikel=53\" target=\"_blank\" rel=\"noopener\"><span class=\"vp-bn\">1</span>Wetboek van Strafvordering, artikel 53</a><a href=\"https://wetten.overheid.nl/jci1.3:c:BWBR0001903&artikel=128\" target=\"_blank\" rel=\"noopener\"><span class=\"vp-bn\">2</span>Wetboek van Strafvordering, artikel 128</a></div></div><div class=\"vp-rechts\"><section class=\"vp-kaart vp-wet\"><h3><span class=\"vp-ic\" data-i=\"boek\"></span>Wat zegt de wet?</h3><div class=\"vp-wt wet\"><p class=\"vp-wa\">Art. 53 Sv</p><p><b class=\"vp-lid\">1</b>«In geval van ontdekking op heterdaad van een strafbaar feit is een ieder bevoegd de verdachte aan te houden.»</p><p><b class=\"vp-lid\">2</b>«De opsporingsambtenaar die een verdachte bij ontdekking op heterdaad aanhoudt, brengt deze ten spoedigste over naar de plaats voor verhoor ter voorgeleiding aan de hulpofficier van justitie of de officier van justitie.»</p><p class=\"vp-wa\">Art. 128 Sv</p><p><b class=\"vp-lid\">1</b>«Ontdekking op heeter daad heeft plaats, wanneer het strafbare feit ontdekt wordt, terwijl het begaan wordt of terstond nadat het begaan is.»</p></div></section><section class=\"vp-kaart vp-bet\"><h3><span class=\"vp-ic\" data-i=\"boa\"></span>Wat betekent dit voor jou als boa?</h3><p>Bij heterdaad mag iedereen de verdachte aanhouden. Als jij als opsporingsambtenaar de verdachte aanhoudt, breng je hem zo snel mogelijk naar de plaats voor verhoor, voor de (hulp)officier van justitie.</p></section><section class=\"vp-kaart vp-vb\"><h3><span class=\"vp-ic\" data-i=\"mensen\"></span>Voorbeeld uit de praktijk</h3><p>Je ziet iemand vuurwerk afsteken op een plek waar dat verboden is. Als je hem hierop aanspreekt, rent hij weg. Als je besluit hem aan te houden, mag je dat doen omdat je het strafbare feit zelf hebt ontdekt terwijl het gebeurde of meteen daarna.</p><p><b>Proportionaliteit en veiligheid:</b> de aanhouding moet in verhouding staan tot het feit en de situatie. Wegrennen geeft je op zichzelf geen recht om geweld te gebruiken. Geweld mag alleen als je daartoe bevoegd bent, als het echt nodig is en niet meer dan nodig. Let op je veiligheid en vraag zo nodig collega’s of de politie om hulp.</p></section><p class=\"vp-onthoud\"><span class=\"vp-o-ic\" data-i=\"lamp\"></span><span><b>Onthoud:</b> Bij ontdekking op heterdaad van een strafbaar feit is een ieder bevoegd de verdachte aan te houden.</span></p></div></div></div>"},{"kind":"kader","titel":"Inbeslagneming en uitlevering vorderen","html":"<div class=\"vpp\"><header class=\"vp-kop\"><div class=\"vp-kop-t\"><span class=\"vp-chip\"><span data-i=\"schild\"></span>Bevoegdheid</span><h2 class=\"vp-t\">Inbeslagneming en uitlevering vorderen</h2><span class=\"vp-art\">Art. 18 WED</span></div><p class=\"vp-intro\">Bij de opsporing van een economisch delict kun je voorwerpen in beslag nemen of vorderen dat iemand ze afgeeft.</p></header><div class=\"vp-body\"><figure class=\"vp-foto\"><img src=\"assets/images/03-01-boa-kofferbak.webp?v=vw260927m\" alt=\"Twee boa’s in handhavingsuniform bij de open kofferbak van een auto met dozen vuurwerk; op één doos staat F2.\" loading=\"eager\" decoding=\"async\"></figure><div class=\"vp-rechts\"><section class=\"vp-kaart vp-wet\"><h3><span class=\"vp-ic\" data-i=\"boek\"></span>Wat zegt de wet?</h3><div class=\"vp-wt wet\"><p><b class=\"vp-lid\">1</b>«De opsporingsambtenaren zijn in het belang van de opsporing bevoegd tot inbeslagneming van daarvoor vatbare voorwerpen voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is. Zij kunnen daartoe hun uitlevering vorderen.»</p></div></section><p class=\"vp-bron\"><span class=\"vp-bron-l\">Bron</span><a href=\"https://wetten.overheid.nl/jci1.3:c:BWBR0002063&artikel=18&z=2026-08-01&g=2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet op de economische delicten, artikel 18</a></p><section class=\"vp-kaart vp-bet\"><h3><span class=\"vp-ic\" data-i=\"boa\"></span>Wat betekent dit voor jou als boa?</h3><p>Ben je bevoegd tot opsporing van het economische delict? Dan kun je daarvoor vatbare voorwerpen in beslag nemen als dat redelijkerwijs nodig is voor jouw taak. Je kunt ook vorderen dat iemand deze voorwerpen aan jou uitlevert.</p></section><section class=\"vp-kaart vp-vb\"><h3><span class=\"vp-ic\" data-i=\"tas\"></span>Voorbeeld uit de praktijk</h3><p>Bij een controle op een parkeerplaats tref je in een kofferbak meerdere dozen met «F2» aan. Er geldt geen ontheffing en de eigenaar heeft geen gespecialiseerde kennis. Je vordert dat hij de dozen aan je afgeeft en neemt ze in beslag.</p></section><p class=\"vp-onthoud\"><span class=\"vp-o-ic\" data-i=\"lamp\"></span><span><b>Onthoud:</b> Aantreffen is nog geen inbeslagneming. Benoem steeds wat je doet en op welke grond, bijvoorbeeld inbeslagneming (art. 18 WED).</span></p></div></div></div>"},{"kind":"kader","titel":"Inzage van gegevens en bescheiden vorderen","html":"<div class=\"vpp vp-inz\"><header class=\"vp-kop\"><div class=\"vp-kop-t\"><span class=\"vp-chip\"><span data-i=\"schild\"></span>Bevoegdheid</span><h2 class=\"vp-t\">Inzage van gegevens en bescheiden vorderen</h2><span class=\"vp-art\">Art. 19 WED</span></div><p class=\"vp-intro\">Voor de opsporing kun je vorderen dat iemand je gegevens en bescheiden laat zien, zoals papieren of digitale administratie.</p></header><div class=\"vp-body\"><figure class=\"vp-foto\"><img src=\"assets/images/h4-inzage-gegevens.webp?v=vw260928d\" alt=\"Een boa in handhavingsuniform leest bij de open kofferbak van een auto een factuur. Naast hem staat een jongeman. In de kofferbak staat een doos met vuurwerk.\" loading=\"eager\" decoding=\"async\"></figure><div class=\"vp-rechts\"><section class=\"vp-kaart vp-wet\"><h3><span class=\"vp-ic\" data-i=\"boek\"></span>Wat zegt de wet?</h3><div class=\"vp-wt wet\"><p><b class=\"vp-lid\">1</b>«De opsporingsambtenaren zijn in het belang van de opsporing bevoegd inzage te vorderen van gegevens en bescheiden, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is.»</p><p><b class=\"vp-lid\">2</b>«Zij zijn bevoegd van de gegevens en bescheiden kopieën te maken.»</p></div></section><p class=\"vp-bron\"><span class=\"vp-bron-l\">Bron</span><a href=\"https://wetten.overheid.nl/jci1.3:c:BWBR0002063&artikel=19&z=2026-08-01&g=2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet op de economische delicten, artikel 19</a></p><section class=\"vp-kaart vp-bet\"><h3><span class=\"vp-ic\" data-i=\"boa\"></span>Wat betekent dit voor jou als boa?</h3><p>Ben je bevoegd tot opsporing van het economische delict en past het binnen jouw functie en taak? Dan mag je vorderen dat iemand je gegevens en bescheiden laat zien, voor zover dat redelijkerwijs nodig is voor jouw taak. Denk aan facturen, pakbonnen, vrachtbrieven of een digitale voorraadlijst.</p><p>Je mag er ook kopieën van maken.</p></section><section class=\"vp-kaart vp-vb\"><h3><span class=\"vp-ic\" data-i=\"document\"></span>Voorbeeld uit de praktijk</h3><p>Je treft een doos met verboden vuurwerk aan in de kofferbak van een auto. Je vordert inzage in de factuur om vast te stellen om welke categorie vuurwerk het gaat.</p></section><p class=\"vp-onthoud\"><span class=\"vp-o-ic\" data-i=\"lamp\"></span><span><b>Onthoud:</b> Vorder alleen inzage in de gegevens en bescheiden die je nodig hebt voor het onderzoek naar het economische delict.</span></p></div></div></div>"},{"kind":"kader","titel":"Plaatsen betreden","html":"<div class=\"vpp vp-pb\"><header class=\"vp-kop\"><div class=\"vp-kop-t\"><span class=\"vp-chip\"><span data-i=\"schild\"></span>Bevoegdheid</span><h2 class=\"vp-t\">Plaatsen betreden</h2><span class=\"vp-art\">Art. 20 WED</span></div><p class=\"vp-intro\">Voor de opsporing heb je toegang tot plaatsen, als dat nodig is voor je taak.<br>Dit kan bijvoorbeeld een terrein, loods, garage of andere afgesloten ruimte zijn.</p></header><div class=\"vp-body\"><figure class=\"vp-foto\"><img src=\"assets/images/h4-plaatsen-betreden.webp?v=vw260928e\" alt=\"Een boa in handhavingsuniform rent ’s avonds achter twee mannen aan een verlichte loods in.\" loading=\"eager\" decoding=\"async\"></figure><div class=\"vp-rechts\"><section class=\"vp-kaart vp-wet\"><h3><span class=\"vp-ic\" data-i=\"boek\"></span>Wat zegt de wet?</h3><div class=\"vp-wt wet\"><p>«De opsporingsambtenaren hebben in het belang van de opsporing toegang tot elke plaats, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is.»</p></div></section><p class=\"vp-bron\"><span class=\"vp-bron-l\">Bron</span><a href=\"https://wetten.overheid.nl/jci1.3:c:BWBR0002063&artikel=20&z=2026-08-01&g=2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet op de economische delicten, artikel 20</a></p><section class=\"vp-kaart vp-bet\"><h3><span class=\"vp-ic\" data-i=\"boa\"></span>Wat betekent dit voor jou als boa?</h3><p>Ben je bevoegd tot opsporing van het economische delict? Dan mag je een loods of andere afgesloten ruimte betreden als dat redelijkerwijs nodig is voor jouw taak. Bij vuurwerk gaat het voor jou om het opsporen van een <b>eenvoudig bezit of gebruik</b> van <b>verboden vuurwerk</b> (bijvoorbeeld F2 of F3).</p></section><section class=\"vp-kaart vp-vb\"><h3><span class=\"vp-ic\" data-i=\"locatie\"></span>Voorbeeld uit de praktijk</h3><p>Je ziet twee mannen die met vermoedelijk vuurwerk een loods inrennen.<br>Je mag de loods betreden om te controleren of zij daadwerkelijk vuurwerk bij zich hebben (eenvoudig bezit of gebruik).</p></section><p class=\"vp-onthoud\"><span class=\"vp-o-ic\" data-i=\"lamp\"></span><span><b>Onthoud:</b> Toegang tot een plaats heb je alleen voor zover dat redelijkerwijs nodig is voor de uitvoering van je taak. In dit geval mag je de loods betreden om te controleren of de mannen vuurwerk bij zich hebben.</span></p></div></div></div>"},{"kind":"kader","titel":"Zaken onderzoeken en monsters nemen","html":"<div class=\"vpp vp-zo\"><header class=\"vp-kop\"><div class=\"vp-kop-t\"><span class=\"vp-chip\"><span data-i=\"schild\"></span>Bevoegdheid</span><h2 class=\"vp-t\">Zaken onderzoeken en monsters nemen</h2><span class=\"vp-art\">Art. 21 WED</span></div><p class=\"vp-intro\">Je kunt zaken onderzoeken en daarvan monsters nemen. Daarvoor mag je ook verpakkingen openen.</p></header><div class=\"vp-body\"><figure class=\"vp-foto\"><img src=\"assets/images/h4-zaken-onderzoeken.webp?v=vw260929a\" alt=\"Een boa in handhavingsuniform zit ’s avonds in een woonwijk geknield bij een geopende kartonnen doos met vuurwerk.\" loading=\"eager\" decoding=\"async\"></figure><div class=\"vp-rechts\"><section class=\"vp-kaart vp-wet\"><h3><span class=\"vp-ic\" data-i=\"boek\"></span>Wat zegt de wet?</h3><div class=\"vp-wt wet\"><p><b class=\"vp-lid\">1</b>«De opsporingsambtenaren zijn bevoegd in het belang van de opsporing zaken te onderzoeken, aan opneming te onderwerpen en daarvan monsters te nemen, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is.»</p><p><b class=\"vp-lid\">2</b>«Zij zijn bevoegd daartoe verpakkingen te openen.»</p></div></section><p class=\"vp-bron\"><span class=\"vp-bron-l\">Bron</span><a href=\"https://wetten.overheid.nl/jci1.3:c:BWBR0002063&artikel=21&z=2026-08-01&g=2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet op de economische delicten, artikel 21</a></p><section class=\"vp-kaart vp-bet\"><h3><span class=\"vp-ic\" data-i=\"boa\"></span>Wat betekent dit voor jou als boa?</h3><p>Ben je bevoegd tot opsporing van het economische delict? Dan mag je een zaak onderzoeken als dat redelijkerwijs nodig is voor jouw taak. Is die zaak verpakt? Dan mag je voor dat onderzoek ook de verpakking openen.</p><p>Bij vuurwerk kan het bijvoorbeeld gaan om een gesloten pakket waarvan je wilt vaststellen wat erin zit en om welke categorie vuurwerk het gaat.</p></section><section class=\"vp-kaart vp-vb\"><h3><span class=\"vp-ic\" data-i=\"locatie\"></span>Voorbeeld uit de praktijk</h3><p>Je treft bij een persoon een gesloten pakket aan. Je hebt concrete aanwijzingen dat daarin vuurwerk zit, maar kunt aan de buitenkant niet vaststellen om welk vuurwerk het gaat.<br>Als dit redelijkerwijs nodig is voor de opsporing, mag je het pakket op grond van artikel 21 WED onderzoeken en daarvoor de verpakking openen.</p></section><p class=\"vp-onthoud\"><span class=\"vp-o-ic\" data-i=\"lamp\"></span><span><b>Onthoud:</b> Een verpakking mag je niet zomaar openen. Het onderzoeken van de zaak en het openen van de verpakking moet redelijkerwijs nodig zijn voor jouw opsporingstaak.</span></p></div></div></div>"},{"kind":"kader","titel":"Vervoermiddel stilhouden en onderzoeken","html":"<div class=\"vpp vp-vm\"><header class=\"vp-kop\"><div class=\"vp-kop-t\"><span class=\"vp-chip\"><span data-i=\"schild\"></span>Bevoegdheid</span><h2 class=\"vp-t\">Vervoermiddel stilhouden en onderzoeken</h2><span class=\"vp-art\">Art. 23 WED</span></div><p class=\"vp-intro\">Je kunt vorderen dat een vervoermiddel stilhoudt, en het vervoermiddel en de lading onderzoeken.</p></header><div class=\"vp-body\"><figure class=\"vp-foto\"><img src=\"assets/images/h4-vervoermiddel.webp?v=vw260929b\" alt=\"Twee boa’s in handhavingsuniform bij een scooter in een woonwijk. In de geopende topkoffer ligt vuurwerk.\" loading=\"eager\" decoding=\"async\"></figure><div class=\"vp-rechts\"><section class=\"vp-kaart vp-wet\"><h3><span class=\"vp-ic\" data-i=\"boek\"></span>Wat zegt de wet?</h3><div class=\"vp-wt wet\"><p><b class=\"vp-lid\">1</b>«De opsporingsambtenaren zijn bevoegd in het belang van de opsporing vervoermiddelen te onderzoeken met het oog op de naleving van de voorschriften, bedoeld in de artikelen 1 en 1a, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is.»</p><p><b class=\"vp-lid\">2</b>«Zij zijn bevoegd in het belang van de opsporing vervoermiddelen waarmee naar hun redelijk oordeel zaken worden vervoerd op hun lading te onderzoeken (…).»</p><p><b class=\"vp-lid\">4</b>«Zij zijn bevoegd met het oog op de uitoefening van deze bevoegdheden van de bestuurder van een voertuig of van de schipper van een vaartuig te vorderen dat deze zijn vervoermiddel stilhoudt en naar een door hen aangewezen plaats overbrengt, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is.»</p></div></section><p class=\"vp-bron\"><span class=\"vp-bron-l\">Bron</span><a href=\"https://wetten.overheid.nl/jci1.3:c:BWBR0002063&artikel=23&z=2026-08-01&g=2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet op de economische delicten, artikel 23</a></p><section class=\"vp-kaart vp-bet\"><h3><span class=\"vp-ic\" data-i=\"boa\"></span>Wat betekent dit voor jou als boa?</h3><p>Ben je bevoegd tot opsporing van het economisch delict en past het binnen jouw functie en taak? Dan mag je vorderen dat de bestuurder zijn vervoermiddel stilhoudt (lid 4). Je mag het vervoermiddel onderzoeken (lid 1), en de lading als je redelijk oordeel is dat er zaken mee worden vervoerd (lid 2).</p><p>Steeds alleen voor zover dat redelijkerwijs nodig is voor jouw taak.</p></section><section class=\"vp-kaart vp-vb\"><h3><span class=\"vp-ic\" data-i=\"locatie\"></span>Voorbeeld uit de praktijk</h3><p>Je ziet een scooter rijden waarvan je vermoedt dat er vuurwerk wordt vervoerd. Je vordert de bestuurder te stoppen en over te brengen naar een veilige plek. Vervolgens onderzoek je de scooter en de topkoffer. In de topkoffer tref je dozen met F3-vuurwerk aan.</p></section><p class=\"vp-onthoud\"><span class=\"vp-o-ic\" data-i=\"lamp\"></span><span><b>Onthoud:</b> Stilhouden en onderzoeken mag alleen voor zover dat redelijkerwijs nodig is. Kies een veilige plek om te controleren.</span></p></div></div></div>"},{"kind":"kader","titel":"Medewerking vorderen","html":"<div class=\"vpp vp-mw\"><header class=\"vp-kop\"><div class=\"vp-kop-t\"><span class=\"vp-chip\"><span data-i=\"schild\"></span>Bevoegdheid</span><h2 class=\"vp-t\">Medewerking vorderen</h2><span class=\"vp-art\">Art. 24a lid 1 WED</span></div><p class=\"vp-intro\">Gebruik je een WED-bevoegdheid? Dan kun je de medewerking vorderen die daarvoor redelijkerwijs nodig is.</p></header><div class=\"vp-body\"><figure class=\"vp-foto\"><img src=\"assets/images/h4-medewerking.webp?v=vw260929c\" alt=\"Twee boa’s in handhavingsuniform spreken ’s avonds in een woonwijk de bestuurder van een scooter met een gesloten topkoffer aan.\" loading=\"eager\" decoding=\"async\"></figure><div class=\"vp-rechts\"><section class=\"vp-kaart vp-wet\"><h3><span class=\"vp-ic\" data-i=\"boek\"></span>Wat zegt de wet?</h3><div class=\"vp-wt wet\"><p><b class=\"vp-lid\">1</b>«Een ieder is verplicht aan de opsporingsambtenaren binnen de door hen gestelde redelijke termijn alle medewerking te verlenen die deze redelijkerwijs kunnen vorderen bij de uitoefening van de hen krachtens deze titel toekomende bevoegdheden.»</p></div></section><p class=\"vp-bron\"><span class=\"vp-bron-l\">Bron</span><a href=\"https://wetten.overheid.nl/jci1.3:c:BWBR0002063&artikel=24a&z=2026-08-01&g=2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet op de economische delicten, artikel 24a</a></p><section class=\"vp-kaart vp-bet\"><h3><span class=\"vp-ic\" data-i=\"boa\"></span>Wat betekent dit voor jou als boa?</h3><p>Artikel 24a geeft je geen nieuwe onderzoeksbevoegdheid. Het verplicht iemand om mee te werken als jij een WED-bevoegdheid uitoefent.</p><p>Bijvoorbeeld: je wilt op grond van artikel 23 WED een scooter en de lading onderzoeken. De topkoffer zit op slot. Dan kun je van de bestuurder vorderen dat hij de topkoffer opent, als dat redelijkerwijs nodig is voor jouw onderzoek.</p></section><section class=\"vp-kaart vp-vb\"><h3><span class=\"vp-ic\" data-i=\"locatie\"></span>Voorbeeld uit de praktijk</h3><p>Je hebt een scooter stilgehouden en wilt de topkoffer onderzoeken. De topkoffer zit op slot.</p><p>Je vordert van de bestuurder dat hij de topkoffer opent, zodat jij je bevoegdheid uit artikel 23 WED kunt uitoefenen.</p></section><p class=\"vp-onthoud\"><span class=\"vp-o-ic\" data-i=\"lamp\"></span><span><b>Onthoud:</b> Artikel 24a WED staat <b>niet op zichzelf</b>. Je vordert medewerking bij de uitoefening van een WED-bevoegdheid.</span></p></div></div></div>"}],"titel":"Wat kun je als boa doen?","type":"content","vragen":[{"vraag":"Je spreekt een jongen aan die naast een tas staat. Je hebt nog geen aanwijzing voor een strafbaar feit. Mag je hem staande houden?","opties":["Ja, een boa mag iedereen staande houden.","Ja, als hij in de buurt van vuurwerk staat.","Nee, je kunt wel aanspreken. Staande houden kan bij een verdachte.","Nee, staande houden mag alleen de politie."],"juist":2,"uitleg":"Art. 52 Sv geeft de bevoegdheid om de identiteit van de verdachte vast te stellen en hem daartoe staande te houden. Zonder redelijk vermoeden (art. 27 Sv) kun je alleen aanspreken. [[1]]","soort":"Praktijkcasus","artikel":"Art. 52 Sv","wet":"Wetboek van Strafvordering","voetnoten":["Wetboek van Strafvordering, art. 27 en 52."],"beeld":{"src":"assets/images/04-q1-staande-houden-tas.webp","alt":"Een boa in handhavingsuniform, van achteren gezien, spreekt ’s avonds in een woonstraat een jongen aan. Naast de jongen staat een gesloten zwarte tas.","w":679,"h":610,"pos":"50% 72%"},"groot":true,"stijl":"v2"},{"vraag":"Je vermoedt dat er vuurwerk in een voertuig ligt. Welke bevoegdheid kun je gebruiken om het voertuig te onderzoeken?","opties":["Art. 23 WED – het vervoermiddel onderzoeken.","Art. 19 WED – inzage in gegevens en bescheiden vorderen.","Art. 20 WED – een plaats betreden.","Art. 52 Sv – de verdachte staande houden."],"juist":0,"uitleg":"Art. 23 WED geeft je de bevoegdheid om een vervoermiddel te onderzoeken (lid 1) en de lading als je redelijk oordeel is dat er zaken mee worden vervoerd (lid 2). Steeds alleen voor zover dat redelijkerwijs nodig is voor jouw taak. Art. 19 WED gaat over inzage in gegevens en bescheiden, art. 20 WED over het betreden van plaatsen en art. 52 Sv over het staande houden van een verdachte. [[1]]","soort":"Praktijkcasus","artikel":"Art. 23 WED","wet":"Wet op de economische delicten","voetnoten":["Wet op de economische delicten, art. 23."],"beeld":{"src":"assets/images/04-q2-voertuig-onderzoeken.webp","alt":"Een boa in handhavingsuniform spreekt ’s avonds in een woonstraat een jongen aan naast een geparkeerde personenauto.","w":676,"h":612,"pos":"50% 45%"},"groot":true,"stijl":"v2"},{"vraag":"Je hebt twee dozen met «F2» in beslag genomen. Wat moet je daarna doen?","opties":["De inbeslaggenomen dozen registreren en bewaren; een kennisgeving aan de hulpofficier is niet nodig.","Een kennisgeving van inbeslagneming maken, zo mogelijk een bewijs van ontvangst geven en de kennisgeving zo snel mogelijk naar de hulpofficier sturen.","Een proces-verbaal van inbeslagneming maken en de dozen daarna direct overdragen aan de hulpofficier.","De dozen veiligstellen en alleen in het proces-verbaal vermelden dat ze in beslag zijn genomen."],"juist":1,"uitleg":"Van elke inbeslagneming maakt de opsporingsambtenaar een kennisgeving. Zoveel mogelijk krijgt de betrokkene een bewijs van ontvangst. De kennisgeving gaat zo spoedig mogelijk naar de hulpofficier van justitie (art. 94 lid 3 Sv). [[1]]","soort":"Praktijkcasus","artikel":"Art. 94 Sv","wet":"Wetboek van Strafvordering","voetnoten":["Wetboek van Strafvordering, art. 94."],"beeld":{"src":"assets/images/04-q3-inbeslagneming-f2.webp","alt":"Een boa in handhavingsuniform, van achteren gezien, staat ’s avonds in een woonstraat bij de open kofferbak van een auto met dozen F2-vuurwerk. Bij de auto staat een jongeman.","w":675,"h":613,"pos":"50% 68%"},"groot":true,"stijl":"v2"},{"vraag":"Je zag gisteren dat een jongen opzettelijk F3-vuurwerk afstak. Vandaag zie je deze jongen op straat. Wat kun je doen?","opties":["Je kunt hem staande houden om zijn identiteit vast te stellen.","Je kunt hem aanhouden, omdat je het strafbare feit zelf hebt gezien.","Je kunt hem aanhouden, omdat het opzettelijk afsteken van F3-vuurwerk een misdrijf is.","Je kunt hem niet meer staande houden, omdat het strafbare feit gisteren heeft plaatsgevonden."],"juist":0,"uitleg":"Het strafbare feit is gisteren gepleegd. Er is geen sprake meer van heterdaad (art. 128 Sv). Opzettelijk afsteken van F3-vuurwerk is een misdrijf waarvoor voorlopige hechtenis is toegelaten. Voor aanhouden buiten heterdaad gelden de voorwaarden van art. 54 Sv. [[1]]","soort":"Praktijkcasus","artikel":"Art. 52 Sv","wet":"Wetboek van Strafvordering","voetnoten":["Wetboek van Strafvordering, art. 52, 54, 67 en 128."],"beeld":{"src":"assets/images/04-q4-jongen-op-straat.webp","alt":"Een boa in handhavingsuniform, van achteren gezien, spreekt ’s avonds in een woonstraat een jongen aan. Achter hem staan twee andere jongens.","w":672,"h":612,"pos":"50% 40%"},"groot":true,"stijl":"v2","kernregel":"Je kunt de jongen wel als verdachte staande houden (art. 52 Sv) om zijn identiteit vast te stellen. Voor staande houden is heterdaad geen vereiste."}]},{"icoon":"waarschuwing","id":"m5","kader":"Veiligheid en taak","nr":5,"pages":[{"kind":"kaart","titel":"Veiligheid: stop met zelf onderzoeken","html":"<div class=\"vpp vp-vh\"><div class=\"vh-body\"><div class=\"vh-links\"><h2 class=\"vp-t\">Veiligheid: stop met zelf onderzoeken</h2><section class=\"vh-warn\"><div class=\"vh-lab\"><span class=\"vh-wic\" data-i=\"waarschuwing\"></span>Veiligheid</div><h3>Onbekend of mogelijk zwaar vuurwerk</h3><p>Een <b>bevoegdheid is geen plicht</b>. Art. 21 WED kan je de bevoegdheid geven om zaken te onderzoeken en verpakkingen te openen. Maar bij onbekend of mogelijk zwaar vuurwerk doe je dat <b>niet zelf</b>.</p></section><div class=\"vh-grid\"><section class=\"vh-k\"><span class=\"vh-ic\" data-i=\"hand\"></span><div><h3>Raak het niet aan.</h3><p>Laat het vuurwerk liggen.</p></div></section><section class=\"vh-k\"><span class=\"vh-ic\" data-i=\"kruis\"></span><div><h3>Open het niet.</h3><p>Maak verpakkingen niet open en haal niets uit elkaar.</p></div></section><section class=\"vh-k\"><span class=\"vh-ic\" data-i=\"omstanders\"></span><div><h3>Houd afstand.</h3><p>Houd ook omstanders uit de buurt.</p></div></section><section class=\"vh-k\"><span class=\"vh-ic\"><svg class=\"vh-tel\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z\"/></svg></span><div><h3>Schakel de politie in.</h3><p>Meld wat je ziet en volg de instructies.</p></div></section></div><p class=\"vh-info\"><span class=\"vh-iic\" aria-hidden=\"true\">i</span><span><b>Veiligheid gaat voor.</b> Deze cursus noemt bewust geen vaste veiligheidsafstand. Volg de geldende instructies van je werkgever en de politie.</span></p></div><figure class=\"vh-foto\"><img src=\"assets/images/05-01-veiligheid-afstand.webp?v=vw261002c\" alt=\"Een boa in handhavingsuniform, van achteren gezien, staat ’s avonds in een woonstraat op afstand van een afgezette, gesloten doos met mogelijk zwaar vuurwerk.\" width=\"699\" height=\"710\" loading=\"eager\" decoding=\"async\"></figure></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0002063/2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet op de economische delicten</a> <span class=\"bb-toel\">art. 21</span></li></ol></div>"},{"kind":"theory","titel":"Taak en beleid: wat wordt van jou verwacht?","html":"<div class=\"vpp vp-tb\"><div class=\"tb-body\"><div class=\"tb-links\"><span class=\"vp-chip\"><span data-i=\"schild\"></span>Taak/beleid</span><h2 class=\"vp-t\">Taak en beleid: wat wordt van jou verwacht?</h2><p class=\"tb-intro\">Je hebt als boa een <b>taak bij de aanpak van vuurwerk</b>. Wat je precies moet doen, staat niet in de wet. Dat staat in je taakomschrijving, in afspraken van je werkgever en in beleid.</p><section class=\"tb-k\"><span class=\"tb-ic\" data-i=\"document\"></span><div><h3>Je taak staat niet in de wet.</h3><p>Wat jij moet doen, staat in je taakomschrijving, in afspraken van je werkgever en in beleid.</p></div></section><section class=\"tb-k\"><span class=\"tb-ic\" data-i=\"mensen\"></span><div><h3>In het Handhavingsplan staat de inzet van boa’s.</h3><p>Handhavingsplan jaarwisseling (maart 2026) geeft aan dat de inzet van boa’s gericht is op preventie, toezicht en het beperken van overlast in de openbare ruimte.</p></div></section><section class=\"tb-k\"><span class=\"tb-ic\" data-i=\"hamer\"></span><div><h3>De gemeentelijke boa richt zich op de strafrechtelijke handhaving.</h3><p>In aanloop naar de jaarwisseling richt de gemeentelijke boa zich op de strafrechtelijke handhaving van kleinschalig bezit en het gebruik van vuurwerk.</p></div></section><section class=\"tb-k\"><span class=\"tb-ic\" data-i=\"waarschuwing\"></span><div><h3>Lokale afspraken vullen dit in.</h3><p>Lokale afspraken kunnen dit invullen. Maar beleid maakt je nooit bevoegd voor iets waarvoor de wet je geen bevoegdheid geeft.</p></div></section></div><figure class=\"tb-foto\"><img src=\"assets/images/05-02-taak-beleid-jaarwisseling.webp?v=vw261003a\" alt=\"Een boa in handhavingsuniform, van achteren gezien, houdt tijdens de jaarwisseling toezicht op een druk, feestelijk verlicht plein met vuurwerk in de lucht.\" width=\"688\" height=\"664\" loading=\"eager\" decoding=\"async\"></figure></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://www.rijksoverheid.nl/documenten/rapporten/2026/03/16/tk-bijlage-geactualiseerd-handhavingsplan-jaarwisseling-feb-2026\" target=\"_blank\" rel=\"noopener\">Handhavingsplan jaarwisseling</a> <span class=\"bb-toel\">Ministerie van Justitie en Veiligheid, maart 2026 (beleid, geen bevoegdheidsgrondslag)</span></li><li><a href=\"https://zoek.officielebekendmakingen.nl/stb-2026-168.html\" target=\"_blank\" rel=\"noopener\">Besluit veilige jaarwisseling</a> <span class=\"bb-toel\">Stb. 2026, 168, nota van toelichting (officiële toelichting, geen bevoegdheidsgrondslag)</span></li><li><a href=\"https://wetten.overheid.nl/BWBR0039766/2026-09-01\" target=\"_blank\" rel=\"noopener\">Beleidsregels buitengewoon opsporingsambtenaar</a> <span class=\"bb-toel\">(beleid, geen bevoegdheidsgrondslag)</span></li></ol></div>"},{"kind":"kaart","titel":"Politie: wanneer schakel je in?","html":"<div class=\"vpp vp-pl\"><div class=\"pl-body\"><div class=\"pl-links\"><span class=\"vp-chip\"><span data-i=\"lamp\"></span>Politie</span><h2 class=\"vp-t\">Politie: wanneer schakel je in?</h2><p class=\"pl-intro\">Je hebt als boa een taak bij de aanpak van vuurwerk in de openbare ruimte. Je treedt op tegen kleinschalig bezit en gebruik van verboden F2- en F3-vuurwerk. Soms is het nodig om de politie in te schakelen, bijvoorbeeld voor overleg, ondersteuning of om een situatie over te dragen.</p><section class=\"pl-hoofd\"><div class=\"pl-lab\"><span data-i=\"afspraak\"></span>Politie</div><h3 class=\"pl-ht\">Overleg, ondersteuning of overdracht</h3><div class=\"pl-kaarten\"><section class=\"pl-k pl-rood\"><span class=\"pl-ic\" data-i=\"waarschuwing\"></span><div><h3>Er is gevaar of mogelijk zwaar vuurwerk.</h3><p>Bij gevaar, of als je vermoedt dat het om zwaar of onbekend vuurwerk gaat, schakel je de politie in.</p></div></section><section class=\"pl-k pl-groen\"><span class=\"pl-ic\" data-i=\"mensen\"></span><div><h3>De openbare orde is in het geding.</h3><p>Volgens het Handhavingsplan hebben boa’s dan tijdens de jaarwisseling geen rol.</p></div></section><section class=\"pl-k pl-geel\"><span class=\"pl-ic\" data-i=\"megafoon\"></span><div><h3>Signalen van zwaar of crimineel vuurwerk.</h3><p>Bij signalen van zwaar of crimineel vuurwerk of van illegale handel blijft de politie verantwoordelijk voor de opsporing daarvan (Handhavingsplan).</p></div></section></div><div class=\"pl-blokken\"><section class=\"pl-b pl-blauw\"><span class=\"pl-ic\" data-i=\"lijst\"></span><div><h3>Welke taak heeft de boa?</h3><ul><li>Preventie en voorlichting.</li><li>Toezicht houden in de openbare ruimte.</li><li>Optreden bij kleinschalig bezit en gebruik van vuurwerk (binnen jouw bevoegdheden).</li><li>Overlast beperken.</li></ul></div></section><section class=\"pl-b pl-paars\"><span class=\"pl-ic\" data-i=\"omstanders\"></span><div><h3>Wanneer schakel je de politie in?</h3><ul><li>Bij gevaar of (vermoeden van) zwaar vuurwerk.</li><li>Bij criminele handel of georganiseerde activiteiten.</li><li>Als de openbare orde in het geding is.</li><li>Als je ondersteuning nodig hebt.</li><li>Als je de situatie wilt overdragen.</li></ul></div></section></div><p class=\"pl-twijfel\"><span class=\"pl-tic\" data-i=\"ballon\"></span><span><b>Twijfel je?</b>Overleg eerst met je leidinggevende of de politie.</span></p></section></div><figure class=\"pl-foto\"><img src=\"assets/images/05-03-politie-boa-jaarwisseling.webp?v=vw261003b\" alt=\"Een boa in handhavingsuniform en een politieagent staan tijdens de jaarwisseling met elkaar te overleggen op een druk, feestelijk verlicht plein met vuurwerk in de lucht.\" width=\"469\" height=\"468\" loading=\"eager\" decoding=\"async\"></figure></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://www.rijksoverheid.nl/documenten/rapporten/2026/03/16/tk-bijlage-geactualiseerd-handhavingsplan-jaarwisseling-feb-2026\" target=\"_blank\" rel=\"noopener\">Handhavingsplan jaarwisseling</a> <span class=\"bb-toel\">Ministerie van Justitie en Veiligheid, maart 2026 (beleid, geen bevoegdheidsgrondslag)</span></li></ol></div>"},{"kind":"kader","titel":"Mogelijk zwaar illegaal vuurwerk","html":"<div class=\"vpp vp-zv\"><div class=\"zv-body\"><div class=\"zv-links\"><div class=\"zv-labels\"><span class=\"vp-chip zv-chip\"><span data-i=\"schild\"></span>Praktijk</span><span class=\"zv-sub\">Praktijksituatie</span></div><h2 class=\"vp-t\">Mogelijk zwaar illegaal vuurwerk</h2><section class=\"zv-sit\"><span class=\"zv-ic\" data-i=\"mensen\"></span><div><h3>Situatie</h3><p>Tijdens toezicht zie je bij een groep jongeren een open tas. In de tas liggen meerdere nitraten. Je vermoedt dat het om zwaar illegaal vuurwerk gaat.</p></div></section><h3 class=\"zv-kop\">Wat kun je doen?</h3><section class=\"zv-k zv-blauw\"><span class=\"zv-nr\">1</span><span class=\"zv-ic\" data-i=\"wet\"></span><div><h3>Ken de grens van je bevoegdheid</h3><p>Voor deze vuurwerktaak ben je als boa bevoegd voor het bezit en gebruik van F2- en F3-vuurwerk. Nitraten vallen daar niet onder.</p></div></section><section class=\"zv-k zv-rood\"><span class=\"zv-nr\">2</span><span class=\"zv-ic\" data-i=\"schild\"></span><div><h3>Denk aan je veiligheid</h3><p>Bij onbekend of mogelijk zwaar illegaal vuurwerk is het verstandig om afstand te houden en het vuurwerk niet zelf verder te onderzoeken.</p></div></section><section class=\"zv-k zv-geel\"><span class=\"zv-nr\">3</span><span class=\"zv-ic\" data-i=\"ballon\"></span><div><h3>Overleg met de politie</h3><p>Bij vermoedelijk zwaar illegaal vuurwerk is het advies om de politie in te schakelen. Bespreek wat je hebt gezien en stem af wie de situatie verder afhandelt.</p></div></section><section class=\"zv-k zv-paars\"><span class=\"zv-nr\">4</span><span class=\"zv-ic\" data-i=\"document\"></span><div><h3>Zorg voor een goede overdracht</h3><p>Als de politie de situatie overneemt, geef dan kort door:</p><ul><li>wat je hebt gezien;</li><li>waar het vuurwerk ligt;</li><li>wie erbij betrokken zijn;</li><li>wat je zelf al hebt gedaan.</li></ul></div></section><p class=\"zv-onthoud\"><span class=\"zv-oic\" data-i=\"megafoon\"></span><span><b class=\"zv-ot\">Onthoud</b><b>Geen F2 of F3? Controleer je bevoegdheid. Bij onbekend of mogelijk zwaar illegaal vuurwerk: denk aan je veiligheid en overleg met de politie.</b></span></p></div><figure class=\"zv-foto\"><img src=\"assets/images/05-04-zwaar-illegaal-vuurwerk.webp?v=vw261004a\" alt=\"Een boa in handhavingsuniform, van achteren gezien, staat ’s avonds op afstand van een groep jongeren bij een open tas met mogelijk zwaar illegaal vuurwerk.\" width=\"757\" height=\"650\" loading=\"eager\" decoding=\"async\"></figure></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://www.rijksoverheid.nl/documenten/rapporten/2026/03/16/tk-bijlage-geactualiseerd-handhavingsplan-jaarwisseling-feb-2026\" target=\"_blank\" rel=\"noopener\">Handhavingsplan jaarwisseling</a> <span class=\"bb-toel\">Ministerie van Justitie en Veiligheid, maart 2026 (beleid, geen bevoegdheidsgrondslag)</span></li></ol></div>"}],"titel":"Wanneer doe je het niet zelf?","type":"content","vragen":[{"vraag":"Je bent bevoegd. Het vuurwerk is groot, met tape omwikkeld en heeft geen etiket. Wat is juist?","opties":["Omdat je bevoegd bent, onderzoek je het zelf verder.","Je maakt het open om de categorie te zien.","Bevoegd zijn betekent niet dat zelf handelen veilig is. Afstand houden en de politie inschakelen.","Omdat het zelfgemaakt is, ben je nooit bevoegd."],"juist":2,"uitleg":"Een bevoegdheid is geen plicht. Bij onbekend of mogelijk zwaar vuurwerk raak je niets aan en maak je niets open. Je houdt afstand, houdt omstanders weg en schakelt de politie in. [[1]]","soort":"Praktijkcasus","artikel":"—","wet":"—","kernregel":"Veiligheid gaat voor.","voetnoten":["Wet op de economische delicten, art. 21; Handhavingsplan jaarwisseling, maart 2026 (beleid)."]},{"vraag":"In je gemeente is afgesproken dat boa’s ook zwaar vuurwerk in beslag nemen. Voor dat feit ben jij volgens je akte niet bevoegd. Wat geldt?","opties":["De afspraak gaat voor: je bent dan toch bevoegd.","Je bent bevoegd als je leidinggevende akkoord geeft.","Een afspraak of beleid geeft je geen bevoegdheid die je volgens de wet niet hebt.","Je bent bevoegd als de politie niet kan komen."],"juist":2,"uitleg":"Taak en beleid gaan over wat van je wordt verwacht. Ze maken je niet bevoegd. Je bevoegdheid volgt uit je akte en de domeinlijst. [[1]]","soort":"Praktijkcasus","artikel":"—","wet":"—","kernregel":"Beleid is geen bevoegdheidsgrondslag.","voetnoten":["Wetboek van Strafvordering, art. 142."]}]},{"icoon":"pv","id":"m6","kader":"Praktijk","nr":6,"pages":[{"kind":"kader","titel":"De melding","html":"<div class=\"vpp vp-h6 vp-ml\"><div class=\"h6-body\"><div class=\"h6-links\"><div class=\"h6-labels\"><span class=\"vp-chip h6-chip\"><span data-i=\"schild\"></span>Praktijk</span><span class=\"h6-sub\">Praktijksituatie</span></div><h2 class=\"vp-t\">De melding</h2><section class=\"ml-sit\"><span class=\"ml-sic\" data-i=\"mensen\"></span><div><h3>Situatie</h3><p>Zaterdag 21 november, 21.05 uur. Je bent met je collega op het plein.<br>Je hoort een harde knal en ziet rook bij een groep van vier jongvolwassenen.</p></div></section><div class=\"ml-info\"><div class=\"ml-i\"><span class=\"ml-iic\" data-i=\"locatie\"></span><div><b>Locatie</b><span>Plein in het centrum<br>Openbare ruimte</span></div></div><div class=\"ml-i\"><span class=\"ml-iic\" data-i=\"mensen\"></span><div><b>Personen</b><span>Vier jongvolwassenen<br>Circa 20 jaar</span></div></div><div class=\"ml-i\"><span class=\"ml-iic\" data-i=\"klok\"></span><div><b>Tijd / omstandigheden</b><span>Zaterdag 21 november<br>21.05 uur, donker</span></div></div><div class=\"ml-i\"><span class=\"ml-iic\" data-i=\"schild\"></span><div><b>Veiligheid</b><span>De situatie is rustig.</span></div></div></div><div class=\"ml-casus\"><p>Een jongen in een rode jas gooit een lege kartonnen huls op de grond. Daarna pakt hij een doos uit een open zwarte sporttas die voor zijn voeten staat. Niemand anders raakt de tas aan.</p><p>In de tas zie je verpakt en los vuurwerk. Het is rustig; niemand loopt weg.</p><p>Je lost de situatie op met de vier vragen die je in dit hoofdstuk gaat doorlopen:</p></div><ol class=\"ml-vragen\"><li class=\"ml-v ml-blauw\"><span class=\"ml-nr\">1</span><span class=\"ml-vic\" data-i=\"oog\"></span><div><b>Wat tref ik aan?</b><span>Wat kun je op basis van je waarnemingen vaststellen?</span></div></li><li class=\"ml-v ml-rood\"><span class=\"ml-nr\">2</span><span class=\"ml-vic\" data-i=\"wet\"></span><div><b>Is dit strafbaar?</b><span>Welk mogelijk strafbaar feit kun je verder onderzoeken?</span></div></li><li class=\"ml-v ml-geel\"><span class=\"ml-nr\">3</span><span class=\"ml-vic\" data-i=\"schild\"></span><div><b>Ben ik hiervoor bevoegd?</b><span>Mag ik als boa dit strafbare feit opsporen?</span></div></li><li class=\"ml-v ml-paars\"><span class=\"ml-nr\">4</span><span class=\"ml-vic\" data-i=\"route\"></span><div><b>Wat doe ik nu?</b><span>Hoe handel je de situatie af en wat leg je vast in het proces-verbaal?</span></div></li></ol></div><figure class=\"h6-foto\"><img src=\"assets/images/06-01-melding-plein.webp?v=vw261004b\" alt=\"Een boa in handhavingsuniform, van achteren gezien, staat ’s avonds op een plein bij een groep jongvolwassenen. Een jongen in een rode jas houdt een doos met F2 vast; voor zijn voeten staat een open zwarte sporttas met vuurwerk.\" width=\"812\" height=\"688\" loading=\"eager\" decoding=\"async\"></figure></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://www.rijksoverheid.nl/documenten/rapporten/2026/03/16/tk-bijlage-geactualiseerd-handhavingsplan-jaarwisseling-feb-2026\" target=\"_blank\" rel=\"noopener\">Handhavingsplan jaarwisseling</a> <span class=\"bb-toel\">Ministerie van Justitie en Veiligheid, maart 2026 (beleid, geen bevoegdheidsgrondslag)</span></li></ol></div>"},{"kind":"kader","titel":"Wat tref ik aan?","html":"<div class=\"vpp vp-h6 vp-cq\"><div class=\"cq\" data-juist=\"B\"><div class=\"h6-body\"><div class=\"h6-links\"><div class=\"cq-kop\"><span class=\"cq-nr ml-blauw\">2</span><span class=\"cq-van\">Vraag 1 van 4</span></div><h2 class=\"vp-t\">Wat tref ik aan?</h2><p class=\"cq-sub\">Wat kun je op basis van je eigen waarnemingen vaststellen?</p><section class=\"cq-taak\"><span class=\"ml-sic\" data-i=\"zoeken\"></span><div><h3>Jouw taak</h3><p>Kijk goed naar de situatie. Welke feiten kun je op dit moment op basis van je eigen waarneming vaststellen?<br>Kies het beste antwoord.</p></div></section><div class=\"cq-opts\" role=\"radiogroup\" aria-label=\"Antwoordmogelijkheden\"><button type=\"button\" class=\"cq-opt\" data-ok=\"0\"><span class=\"cq-radio\" aria-hidden=\"true\"></span><span class=\"cq-l\">A</span><span class=\"cq-t\"><b>Ik stel vast dat er F2-vuurwerk en zwaar illegaal vuurwerk in de tas zit.</b></span></button><button type=\"button\" class=\"cq-opt\" data-ok=\"1\"><span class=\"cq-radio\" aria-hidden=\"true\"></span><span class=\"cq-l\">B</span><span class=\"cq-t\"><b>Ik stel vast dat er F2-vuurwerk in de tas zit. Daarnaast zie ik andere voorwerpen die sterk lijken op vuurwerk, maar waarvan ik de categorie niet kan vaststellen.</b></span></button><button type=\"button\" class=\"cq-opt\" data-ok=\"0\"><span class=\"cq-radio\" aria-hidden=\"true\"></span><span class=\"cq-l\">C</span><span class=\"cq-t\"><b>Ik stel vast dat de jongen F2-vuurwerk bezit.</b><span>De andere voorwerpen zijn niet relevant zolang ik niet weet tot welke categorie ze behoren.</span></span></button><button type=\"button\" class=\"cq-opt\" data-ok=\"0\"><span class=\"cq-radio\" aria-hidden=\"true\"></span><span class=\"cq-l\">D</span><span class=\"cq-t\"><b>Ik stel vast dat er F2-vuurwerk en vermoedelijk ander illegaal vuurwerk in de tas zit.</b><span>De precieze categorie kan later worden vastgesteld.</span></span></button></div><div class=\"cq-acties\"><button type=\"button\" class=\"btn btn-primary cq-check\" disabled><span>Controleer antwoord</span></button></div></div><div class=\"h6-rechts\"><figure class=\"cq-foto\"><img src=\"assets/images/06-02-wat-tref-ik-aan.webp?v=vw261004b\" alt=\"Een boa in handhavingsuniform, van achteren gezien, staat ’s avonds op een plein bij een groep jongvolwassenen. Een jongen in een rode jas houdt een doos met F2 vast; voor zijn voeten staat een open zwarte sporttas met vuurwerk.\" width=\"799\" height=\"410\" loading=\"eager\" decoding=\"async\"></figure><div class=\"cq-fb\" hidden><section class=\"cq-res\"><span class=\"cq-ric\" aria-hidden=\"true\"></span><div><h3 class=\"cq-rh\"></h3><p>Op basis van je eigen waarneming kun je vaststellen dat er F2-vuurwerk in de tas zit. Daarnaast zie je andere voorwerpen die sterk lijken op vuurwerk, maar waarvan je de categorie niet kunt vaststellen.</p></div></section><section class=\"cq-blok cq-vast\"><span class=\"cq-bic\" data-i=\"document\"></span><div><h3>Leg ook dit vast</h3><p>Leg van de andere voorwerpen de waarneembare kenmerken vast, zoals:</p><ul><li>aantal, vorm, grootte en kleur;</li><li>eventuele opschriften en verpakking;</li><li>de plaats waar je de voorwerpen aantrof.</li></ul></div></section><section class=\"cq-blok cq-onth\"><span class=\"cq-bic\" data-i=\"lamp\"></span><div><h3>Onthoud</h3><p>Je hoeft niet te weten tot welke categorie iets precies behoort om het goed te beschrijven.<br>Schrijf op wat je waarneemt. Trek geen conclusie die je op dat moment nog niet kunt onderbouwen.</p></div></section></div></div></div></div></div>"},{"kind":"kader","titel":"Is dit strafbaar?","html":"<div class=\"vpp vp-h6 vp-cq\"><div class=\"cq\" data-juist=\"B\"><div class=\"h6-body\"><div class=\"h6-links\"><div class=\"cq-kop\"><span class=\"cq-nr ml-rood\">3</span><span class=\"cq-van\">Vraag 2 van 4</span></div><h2 class=\"vp-t\">Is dit strafbaar?</h2><p class=\"cq-sub\">Welk mogelijk strafbaar feit kun je op basis van je waarnemingen verder onderzoeken?</p><section class=\"cq-taak\"><span class=\"ml-sic\" data-i=\"document\"></span><div><h3>Situatie</h3><p>Je hebt vastgesteld dat in de tas een doos met de aanduiding “F2” zit. Daarnaast zie je andere voorwerpen die sterk op vuurwerk lijken, maar waarvan je de categorie niet kunt vaststellen.</p><p class=\"cq-vraag\">Wat kun je op dit moment juridisch verder onderzoeken?</p></div></section><div class=\"cq-opts\" role=\"radiogroup\" aria-label=\"Antwoordmogelijkheden\"><button type=\"button\" class=\"cq-opt\" data-ok=\"0\" data-kop=\"Niet juist.\"><span class=\"cq-radio\" aria-hidden=\"true\"></span><span class=\"cq-l\">A</span><span class=\"cq-t\"><span>Alleen het afsteken van vuurwerk, omdat je een harde knal hebt gehoord.</span></span></button><button type=\"button\" class=\"cq-opt\" data-ok=\"1\"><span class=\"cq-radio\" aria-hidden=\"true\"></span><span class=\"cq-l\">B</span><span class=\"cq-t\"><span>Het bezit van het vuurwerk waarop je de aanduiding “F2” hebt waargenomen. Het bezit van F2-vuurwerk is voor anderen dan personen met gespecialiseerde kennis verboden.</span></span></button><button type=\"button\" class=\"cq-opt\" data-ok=\"0\" data-kop=\"Niet juist.\"><span class=\"cq-radio\" aria-hidden=\"true\"></span><span class=\"cq-l\">C</span><span class=\"cq-t\"><span>Het bezit van F3-vuurwerk, omdat de andere voorwerpen groter lijken dan het F2-vuurwerk.</span></span></button><button type=\"button\" class=\"cq-opt\" data-ok=\"0\" data-kop=\"Niet juist.\"><span class=\"cq-radio\" aria-hidden=\"true\"></span><span class=\"cq-l\">D</span><span class=\"cq-t\"><span>Nog geen enkel strafbaar feit. Je moet eerst van ieder voorwerp exact weten tot welke categorie het behoort.</span></span></button></div><div class=\"cq-acties\"><button type=\"button\" class=\"btn btn-primary cq-check\" disabled><span>Controleer antwoord</span></button></div></div><div class=\"h6-rechts\"><figure class=\"cq-foto\"><img src=\"assets/images/01-q3-verpakkingen.webp?v=vw261005a\" alt=\"Een open sporttas op een stenen rand; ervoor staan een doos met de aanduiding F2, andere dozen en enkele losse vuurwerkachtige voorwerpen zonder zichtbaar etiket.\" width=\"780\" height=\"438\" loading=\"eager\" decoding=\"async\"></figure><div class=\"cq-fb\" hidden><section class=\"cq-res\"><span class=\"cq-ric\" aria-hidden=\"true\"></span><div><h3 class=\"cq-rh\"></h3><div class=\"cq-fbx\" data-voor=\"A\" hidden><p>De knal en de rook zijn een reden om goed op te letten, maar je hebt niet gezien wie welk vuurwerk afstak. Ga uit van wat je wel zelf hebt waargenomen: een doos met de aanduiding “F2” in de tas.</p><p>Dat geeft aanleiding om het bezit van F2-vuurwerk verder te onderzoeken.</p></div><div class=\"cq-fbx\" data-voor=\"B\"><p>Op de verpakking heb je de aanduiding “F2” waargenomen. Dat geeft aanleiding om het bezit van F2-vuurwerk verder te onderzoeken.</p><p>Artikel 9.2.2.1a, eerste lid, Wet milieubeheer verbiedt het bezit en gebruik van vuurwerk van de categorieën F2 en F3 voor anderen dan personen met gespecialiseerde kennis.</p><p>Overtreding van dit voorschrift is aangewezen als economisch delict in de Wet op de economische delicten.</p><p>Van de andere voorwerpen kun je de categorie nog niet vaststellen. Trek daarover dus nog geen conclusie.</p></div><div class=\"cq-fbx\" data-voor=\"C\" hidden><p>Uit de grootte van een voorwerp kun je niet afleiden tot welke categorie het behoort. Van de andere voorwerpen kun je de categorie nog niet vaststellen. Trek daarover dus nog geen conclusie.</p><p>Wat je wel kunt onderzoeken, is het bezit van het vuurwerk waarop je de aanduiding “F2” hebt waargenomen.</p></div><div class=\"cq-fbx\" data-voor=\"D\" hidden><p>Je hoeft niet van ieder voorwerp de categorie te kennen om verder te kunnen. Op de verpakking heb je de aanduiding “F2” waargenomen.</p><p>Dat geeft aanleiding om het bezit van F2-vuurwerk verder te onderzoeken. Van de andere voorwerpen stel je nog geen categorie vast.</p></div></div></section><section class=\"cq-blok cq-onth\"><span class=\"cq-bic\" data-i=\"lamp\"></span><div><h3>Onthoud</h3><ul><li>Ga uit van wat je daadwerkelijk waarneemt.</li><li>Een aanduiding “F2” is relevante informatie voor je onderzoek.</li><li>Van de overige voorwerpen stel je geen categorie vast als je dat niet kunt onderbouwen.</li><li>Eerst bepaal je welk mogelijk strafbaar feit aan de orde is. Daarna controleer je of jij als boa daarvoor bevoegd bent.</li></ul></div></section></div></div></div></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0003245/2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet milieubeheer</a> <span class=\"bb-toel\">art. 9.2.2.1a</span></li><li><a href=\"https://wetten.overheid.nl/BWBR0002063/2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet op de economische delicten</a> <span class=\"bb-toel\">art. 1a</span></li></ol></div>"},{"kind":"kader","titel":"Ben ik hiervoor bevoegd?","html":"<div class=\"vpp vp-h6 vp-cq\"><div class=\"cq\" data-juist=\"C\"><div class=\"h6-body\"><div class=\"h6-links\"><div class=\"cq-kop\"><span class=\"cq-nr ml-geel\">4</span><span class=\"cq-van\">Vraag 3 van 4</span></div><h2 class=\"vp-t\">Ben ik hiervoor bevoegd?</h2><p class=\"cq-sub\">Mag ik als boa voor al het aangetroffen vuurwerk optreden?</p><div class=\"cq-opts\" role=\"radiogroup\" aria-label=\"Antwoordmogelijkheden\"><button type=\"button\" class=\"cq-opt\" data-ok=\"0\"><span class=\"cq-radio\" aria-hidden=\"true\"></span><span class=\"cq-l\">A</span><span class=\"cq-t\"><b>Ja, ik ben bevoegd voor al het vuurwerk in de tas.</b><span>Zolang ik vermoed dat het verboden vuurwerk is, mag ik voor alle voorwerpen opsporingshandelingen verrichten.</span></span></button><button type=\"button\" class=\"cq-opt\" data-ok=\"0\"><span class=\"cq-radio\" aria-hidden=\"true\"></span><span class=\"cq-l\">B</span><span class=\"cq-t\"><b>Nee, ik mag helemaal niet optreden.</b><span>Omdat ik van een deel van de voorwerpen de categorie niet kan vaststellen, mag ik het vuurwerk niet in beslag nemen en geen proces-verbaal opmaken.</span></span></button><button type=\"button\" class=\"cq-opt\" data-ok=\"1\"><span class=\"cq-radio\" aria-hidden=\"true\"></span><span class=\"cq-l\">C</span><span class=\"cq-t\"><b>Ik ben bevoegd voor het F2-vuurwerk waarvoor ik ben aangewezen. Van de andere voorwerpen kan ik de categorie niet vaststellen.</b><span>De situatie is rustig en ik vermoed dat het om zwaarder vuurwerk gaat. Ik kan de politie ter plaatse laten komen voor ondersteuning en eventuele verdere opsporing.</span></span></button><button type=\"button\" class=\"cq-opt\" data-ok=\"0\"><span class=\"cq-radio\" aria-hidden=\"true\"></span><span class=\"cq-l\">D</span><span class=\"cq-t\"><b>Ik ben alleen bevoegd als ik zeker weet dat al het vuurwerk F2 of F3 is.</b><span>Zolang ik de categorie niet exact kan vaststellen, mag ik niet optreden.</span></span></button></div><div class=\"cq-acties\"><button type=\"button\" class=\"btn btn-primary cq-check\" disabled><span>Controleer antwoord</span></button></div></div><div class=\"h6-rechts\"><figure class=\"cq-foto\"><img src=\"assets/images/06-03-ben-ik-bevoegd.webp?v=vw261004b\" alt=\"Een boa in handhavingsuniform, van achteren gezien, staat ’s avonds op een plein bij een groep jong

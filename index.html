<script>window.__DATA__={"aantalOnderwerpen":5,"drempel":70,"eindtoets":[{"thema":"Herkennen","vraag":"Je treft in een open sporttas een doos vuurwerk aan. Op het etiket staat duidelijk ‘F3’. Wat kun je op dit moment het beste vaststellen en vastleggen?","opties":["Ik stel vast dat het vuurwerk daadwerkelijk tot categorie F3 behoort, omdat dit op de verpakking staat. Ik leg dit als feit vast.","Ik noteer alleen dat er vuurwerk in de tas lag. De aanduiding ‘F3’ is pas bruikbaar nadat de inhoud verder is onderzocht.","Ik leg vast dat ik op de verpakking de aanduiding ‘F3’ heb gelezen en betrek dit bij mijn verdere onderzoek. Bij F2 en F3 kun je in beginsel uitgaan van de aanduiding, zolang de verpakking, het vuurwerk en de overige zichtbare kenmerken overeenkomen en er geen reden is om daaraan te twijfelen.","Ik noteer dat het vermoedelijk F3-vuurwerk is, maar alleen als de verdachte bevestigt dat de verpakking bij het vuurwerk hoort."],"juist":2,"uitleg":"Het etiket is belangrijke informatie. Leg letterlijk vast wat erop staat. Het is geen eindconclusie, maar ook niet waardeloos.","casus":true,"foto":"assets/images/eind-f3-sporttas.webp?v=vw261005c","fotoAlt":"Een boa in handhavingsuniform zit gehurkt bij een open sporttas en bekijkt een doos vuurwerk met het etiket F3."},{"thema":"Onbekend vuurwerk","vraag":"In een tas liggen losse, grote voorwerpen met tape, zonder etiket. Wat schrijf je in je proces-verbaal over de categorie?","opties":["«Categorie F4», want ze zijn groot.","«Categorie F3», want dat is de middelste categorie.","Dat de categorie niet kon worden vastgesteld, met een beschrijving van vorm, grootte, aantal, tape en het ontbreken van een etiket.","Niets, want zonder etiket kun je niets vastleggen."],"juist":2,"uitleg":"«Onbekend vuurwerk» is geen wettelijke categorie. Je gokt niet. Je beschrijft wat je waarneemt, zodat een ander later kan beoordelen wat het is.","casus":true},{"thema":"De wet","vraag":"Wat verbiedt art. 9.2.2.1a, eerste lid, Wet milieubeheer?","opties":["Het afsteken van vuurwerk na 02.00 uur.","Alleen de verkoop van F4.","Het bezit en gebruik van F1 en F2 voor iedereen.","Het bezit en gebruik van F2 en F3 voor anderen dan personen met gespecialiseerde kennis."],"juist":3,"uitleg":"Lid 1: «Het bezit en het gebruik van vuurwerk van de categorieën F2 en F3 is verboden voor anderen dan personen met gespecialiseerde kennis.» F1 en F4 staan niet in dit verbod. Het vierde lid maakt een ontheffing van de burgemeester mogelijk voor aangewezen F2-vuurwerk tijdens de jaarwisseling. Deze ontheffing geldt niet voor F3.","casus":false,"foto":"assets/images/eind-wm-artikel.webp?v=vw261005e","fotoAlt":"Een boa in handhavingsuniform zit aan een bureau, leest in een boek over de Wet milieubeheer en maakt aantekeningen; naast hem staat een doos vuurwerk.","klasse":"ex-wm"},{"thema":"Ontheffing","vraag":"31 december, 19.00 uur. Een stichting steekt op een afgezet terrein vuurwerk af. Op de dozen staat «F2». Wat controleer je?","opties":["Niets: op oudejaarsavond is alles toegestaan.","Of het vuurwerk met een auto is vervoerd.","Of er een ontheffing van de burgemeester is, met een afschrift op het terrein.","Of de stichting een APV-vergunning heeft."],"juist":2,"uitleg":"De burgemeester kan ontheffing verlenen voor het afsteken van aangewezen F2 tijdens de jaarwisseling (art. 9.2.2.1a lid 4 Wm). Een afschrift hoort op het afsteekterrein te zijn (art. 2.3.2a Vuurwerkbesluit).","casus":true},{"thema":"Ontheffing","vraag":"Het is 1 januari, 03.00 uur. Een stichting heeft een ontheffing van de burgemeester voor aangewezen F2-vuurwerk. Op het aangewezen terrein wordt nog vuurwerk afgestoken. Welke conclusie is juist?","opties":["Het afsteken is toegestaan, zolang dit gebeurt op het terrein dat in de ontheffing is aangewezen.","Het afsteken is toegestaan, omdat een ontheffing van de burgemeester ook na 02.00 uur blijft gelden.","Het afsteken is toegestaan, zolang alleen het F2-vuurwerk wordt gebruikt waarvoor de ontheffing is verleend.","Het afsteken is niet toegestaan. Ook met een ontheffing eindigt de toegestane afsteektijd op 1 januari om 02.00 uur."],"juist":3,"uitleg":"Een ontheffing van de burgemeester geeft geen toestemming om de hele nacht vuurwerk af te steken. Aan deze ontheffing wordt het voorschrift verbonden dat het vuurwerk uitsluitend tussen 31 december 18.00 uur en 1 januari 02.00 uur tot ontbranding wordt gebracht. Om 03.00 uur valt het afsteken dus buiten de toegestane afsteektijd. Dat het om het aangewezen F2-vuurwerk gaat en dat op het juiste terrein wordt afgestoken, verandert dit niet.","casus":true,"foto":"assets/images/eind-ontheffing-0300.webp?v=vw261006a","fotoAlt":"Een boa in handhavingsuniform maakt ’s nachts aantekeningen bij een afgezet afsteekterrein, waar achter hekken nog vuurwerk wordt afgestoken.","klasse":"ex-onth"},{"thema":"Bevoegdheid","vraag":"Een collega zegt: “Art. 9.2.2.1a Wet milieubeheer staat in mijn domeinlijst. Daarom mag ik bij ieder vuurwerkincident zelfstandig optreden.” Welke reactie is juist?","opties":["Dat klopt. De vermelding in de domeinlijst betekent dat je voor art. 9.2.2.1a Wet milieubeheer bevoegd bent, ongeacht je concrete taakstelling.","Dat klopt niet. Je moet nagaan of je bevoegd bent, of het optreden binnen je taakstelling past en of aan de voorwaarden voor de gebruikte bevoegdheden is voldaan.","Dat klopt, zolang het incident binnen je werkgebied plaatsvindt en het gaat om F2- of F3-vuurwerk.","Dat klopt niet. Je mag alleen zelfstandig optreden als in lokaal beleid expliciet staat dat je bij vuurwerkincidenten handhavend optreedt."],"juist":1,"uitleg":"De domeinlijst geeft geen onbeperkte bevoegdheid. Je optreden moet passen binnen je opsporingsbevoegdheid en taakstelling. Daarnaast gelden voor iedere bevoegdheid afzonderlijke voorwaarden. Alleen de vermelding van een wetsartikel in de domeinlijst is dus niet voldoende.","casus":true,"foto":"assets/images/eind-domeinlijst.webp?v=vw261006b","fotoAlt":"Twee boa’s in handhavingsuniform bekijken samen de domeinlijst.","klasse":"ex-domein"},{"thema":"Bevoegdheid","vraag":"Bij een controle zie je in een doos meerdere mortierbommen (shells) met de aanduiding ‘F4’. Je bent boa in Domein I en hebt geen opdracht van de officier van justitie. Wat is juist?","opties":["Je bent bevoegd, omdat professioneel vuurwerk (F4) ook in de vuurwerkbepaling in de domeinlijst staat.","Je bent niet bevoegd. De vuurwerkbepaling in de domeinlijst gaat alleen over F2- en F3-vuurwerk, niet over professioneel vuurwerk (F4).","Je bent bevoegd, omdat de mortierbommen illegaal zijn en je altijd mag optreden tegen illegaal vuurwerk.","Je bent bevoegd, omdat je in je werkgebied en in je taakstelling controles op vuurwerk mag uitvoeren."],"juist":1,"uitleg":"De vuurwerkbepaling in de domeinlijst ziet op art. 9.2.2.1a Wet milieubeheer en daarmee op F2- en F3-vuurwerk. Professioneel vuurwerk van categorie F4 valt daar niet onder. Zonder een andere wettelijke grondslag of een concrete opdracht van de officier van justitie ligt de opsporing daarvan niet bij jou.\n\nOnder professioneel vuurwerk (F4) kunnen bijvoorbeeld shells/mortierbommen, zwaar knalvuurwerk, lawinepijlen en ander professioneel siervuurwerk vallen. Let op: alleen aan de vorm kun je niet altijd vaststellen dat iets F4 is; kijk naar de categorie-aanduiding en overige kenmerken en laat bij twijfel nader onderzoek plaatsvinden.\n\nBronnen: Regeling domeinlijsten buitengewoon opsporingsambtenaar, Domein I, vuurwerkbepaling; Wet milieubeheer, art. 9.2.2.1a; Vuurwerkbesluit, categorie F4 (professioneel vuurwerk).","casus":true,"foto":"assets/images/eind-f4-professioneel.webp?v=vw261007a","fotoAlt":"Een boa in handhavingsuniform zit gehurkt bij een open doos met mortierbommen (shells) met de aanduiding F4; ernaast staan dozen professioneel vuurwerk.","klasse":"ex-f4"},{"thema":"Samenloop","vraag":"Iemand zonder gespecialiseerde kennis heeft een doos met op het etiket «F3» in zijn rugzak. Voor welk feit kan onderdeel 9 jou als boa in domein I bevoegd maken?","opties":["Overtreding van art. 1.2.2 Vuurwerkbesluit.","Overtreding van art. 9.2.2.1a Wet milieubeheer (bezit van F3).","Overtreding van art. 1.2.5 Vuurwerkbesluit (vervoer).","Geen enkel feit, want F3 is professioneel vuurwerk."],"juist":1,"uitleg":"Het bezit kan meerdere regels overtreden. Onderdeel 9 noemt art. 9.2.2.1a Wm jo. art. 1a WED. Voor dat feit kun je bevoegd zijn, binnen je akte, functie en taak. De regels uit het Vuurwerkbesluit staan niet in onderdeel 9. Het etiket is informatie; het blijft onderdeel van je onderzoek.","casus":true},{"thema":"Bevoegdheden","vraag":"Je ziet iemand een doos met «F2» uit zijn tas pakken en aansteken. Je wilt weten wie hij is. Welke grondslag gebruik je?","opties":["Art. 23 WED.","Art. 26 WED.","Art. 52 Sv.","Art. 94 Sv."],"juist":2,"uitleg":"Art. 52 Sv: iedere opsporingsambtenaar mag de identiteit van een verdachte vaststellen en hem daarvoor staande houden. Art. 23 WED gaat over vervoermiddelen, art. 26 WED over het weigeren van een vordering, art. 94 Sv over inbeslagneming.","casus":true},{"thema":"Bevoegdheden","vraag":"Je onderzoekt de lading van een auto (art. 23 WED). Je vordert dat de bestuurder de kofferbak opent. Hij weigert opzettelijk. Welke uitspraak is juist?","opties":["Art. 24a lid 1 WED is de bevoegdheid waarmee jij hem dwingt.","Het opzettelijk niet voldoen aan je vordering is zelf strafbaar (art. 26 WED).","Je vordering vervalt, want hij hoeft niet mee te werken.","Hij pleegt alleen een overtreding van de APV."],"juist":1,"uitleg":"Art. 24a lid 1 WED is een plicht voor de burger om mee te werken, geen bevoegdheid. Art. 26 WED maakt het opzettelijk niet voldoen aan de vordering strafbaar. Daarnaast geeft art. 24a lid 3 WED een bevoegdheid tot feitelijk handelen, voor zover redelijkerwijs nodig.","casus":true},{"thema":"Aanhouden","vraag":"Je ziet een man een doos met «F2» afsteken. Hij loopt weg. Een uur later zie je hem terug. Wat geldt nu?","opties":["Het is geen heterdaad meer. Aanhouden kan alleen onder de voorwaarden van art. 54 Sv, in beginsel op bevel van de (hulp)officier.","Je mag hem net als bij heterdaad gewoon zelf aanhouden.","Je mag hem vasthouden tot de politie er is.","Je mag niets meer doen, ook niet staande houden."],"juist":0,"uitleg":"Heterdaad is er alleen terwijl het feit wordt gepleegd of meteen daarna (art. 128 Sv). Daarna geldt art. 54 Sv: alleen bij een misdrijf waarvoor voorlopige hechtenis is toegelaten, en in beginsel op bevel. Staande houden (art. 52 Sv) blijft mogelijk.","casus":true},{"thema":"Inbeslagneming","vraag":"Je vordert de uitlevering van drie dozen met «F2» en neemt ze in beslag. Wat hoort daarna?","opties":["Een kennisgeving van inbeslagneming, zo mogelijk een bewijs van ontvangst, en de kennisgeving zo snel mogelijk naar de hulpofficier.","Alleen een mondelinge melding aan je leidinggevende.","De dozen teruggeven aan het eind van de dienst.","Een verzoek aan de burgemeester om ontheffing."],"juist":0,"uitleg":"Art. 94 lid 3 Sv: van elke inbeslagneming maakt de opsporingsambtenaar een kennisgeving, geeft zoveel mogelijk een bewijs van ontvangst en stelt de kennisgeving zo spoedig mogelijk in handen van de hulpofficier. De grondslag voor het beslag is art. 18 WED.","casus":true},{"thema":"Veiligheid","vraag":"Je bent bevoegd. Het vuurwerk is groot, zonder etiket en met tape omwikkeld. Wat doe je?","opties":["Je maakt het open om de categorie vast te stellen.","Je neemt het mee in je dienstauto.","Je houdt afstand, houdt omstanders weg en schakelt de politie in.","Je vraagt een omstander het weg te leggen."],"juist":2,"uitleg":"Bevoegd zijn is geen plicht en betekent niet dat zelf handelen veilig is. Bij onbekend of mogelijk zwaar vuurwerk raak je niets aan en maak je niets open.","casus":true},{"thema":"Politie","vraag":"Je bent gemeentelijk boa in domein I. Op oudejaarsavond gooit een groep zwaar vuurwerk naar voorbijgangers op het stationsplein. De groep wordt agressief. Welke aanpak past bij jouw taakstelling?","opties":["Ik treed zelf op tegen de groep. Mijn opsporingsbevoegdheid voor vuurwerk is daarvoor voldoende.","Ik herstel samen met mijn collega de orde. Met twee boa’s valt dit binnen onze taakstelling.","Ik treed zelf op als ik geweldsmiddelen heb. Die middelen maken ordehandhaving onderdeel van mijn taak.","Ik schakel de politie in, houd veilige afstand en geef mijn waarnemingen door. Het ordeherstel is hier een politietaak."],"juist":3,"uitleg":"De Beleidsregels Buitengewoon Opsporingsambtenaar koppelen het optreden van de boa aan zijn bevoegdheden en taakstelling. Bij grote gevaarzetting is het uitgangspunt dat de boa zich niet in de situatie mengt of zich terugtrekt. Het herstellen van de openbare orde is een politietaak. In deze casus past het daarom om de politie in te schakelen, een veilige positie in te nemen en de waarnemingen door te geven. De aanwezigheid van een collega of toegekende geweldsmiddelen verruimt de taakstelling van de boa niet.","casus":true,"foto":"assets/images/eind-station-politie.webp?v=vw261005g","fotoAlt":"Een boa in handhavingsuniform staat ’s avonds op een stationsplein; op de achtergrond steekt een groep zwaar vuurwerk af tussen rook en vonken."},{"thema":"Proces-verbaal","vraag":"Welke zin hoort in een goed proces-verbaal?","opties":["«Verdachte had illegaal vuurwerk bij zich.»","«Het was duidelijk zwaar vuurwerk.»","«Op de doos in zijn hand las ik de opdruk F2.»","«Ik vermoedde dat het F4 was, dus heb ik het afgepakt.»"],"juist":2,"uitleg":"In een proces-verbaal beschrijf je feitelijk wat je zag, hoorde en las. De andere zinnen geven alleen een conclusie of vermoeden zonder onderbouwing.","casus":false}],"eindtoetsDrempel":80,"kaderLabel":"Vuurwerk · boa domein I","opleiding":"Vuurwerk","peildatum":"23 september 2026","subtitel":"VUURWERK — E-LEARNING VOOR BOA'S IN DOMEIN I","topics":[{"icoon":"megafoon","id":"m0","kader":"Start","nr":0,"pages":[{"kind":"casus","titel":"Een knal op het plein","html":"<span class=\"q-soort\">Praktijk</span><p class=\"i1-k\">Introductie</p><h2 class=\"ptitle\">Een knal op het plein</h2><p class=\"i1-intro\">In deze cursus leer je hoe je als boa veilig, juridisch juist en binnen je bevoegdheden optreedt bij vuurwerk.</p><div class=\"i1-casus\"><p>Het is zaterdagavond. Je loopt samen met een collega surveillance in het centrum. Dan komt er een melding binnen van het Operationeel Centrum: harde knallen op het plein.</p><p>Als je op het plein aankomt, zie je vier jongvolwassenen. Eén van hen gooit iets op de grond. Voor de groep staat een open sporttas. In en rond de tas zie je verschillende soorten vuurwerk: een deel in dozen en een deel los.</p></div><div class=\"i1-zie\"><h3>Wat zie je?</h3><ul><li>Vier jongvolwassenen bij een open sporttas</li><li>Verschillende soorten vuurwerk, los en in verpakkingen</li><li>Eén persoon gooit iets op de grond</li></ul></div><div class=\"i1-leer\"><h3>Dit leer je in deze cursus</h3><ul><li>De situatie veilig beoordelen</li><li>Vaststellen met welk vuurwerk je te maken hebt</li><li>Bepalen welke wettelijke regels gelden</li><li>Controleren of je als boa voor het strafbare feit bevoegd bent</li><li>Bepalen welke bevoegdheden je kunt en mag inzetten</li><li>Je bevindingen goed vastleggen</li></ul></div><p class=\"i1-vraag\">Wat tref je hier aan? Is er sprake van een strafbaar feit? Ben je bevoegd om op te treden? En wat doe je nu?</p>"},{"kind":"lo","titel":"Na deze cursus weet je wat je moet doen","html":"<p class=\"i2-k\">Introductie · Dit ga je leren</p><h2 class=\"ptitle\">Na deze cursus weet je wat je moet doen</h2><p class=\"pintro\">In deze e-learning leer je vuurwerksituaties herkennen, juridisch beoordelen en veilig afhandelen. Je werkt met praktijkvoorbeelden en oefenvragen en past je kennis toe in een doorlopende praktijksituatie.</p><p class=\"i2-na\">Na deze cursus:</p><ul class=\"i2-lo\"><li><span class=\"i2-ic\" data-i=\"vuurwerk\"></span><div><b>Vuurwerk herkennen</b><span>Je herkent verschillende categorieën vuurwerk en weet waar je op moet letten.</span></div></li><li><span class=\"i2-ic\" data-i=\"hamer\"></span><div><b>Strafbaar feit beoordelen</b><span>Je kunt beoordelen of er sprake is van een strafbaar feit.</span></div></li><li><span class=\"i2-ic\" data-i=\"document\"></span><div><b>Regels toepassen</b><span>Je weet welke regels gelden voor het bezit en gebruik van vuurwerk.</span></div></li><li><span class=\"i2-ic\" data-i=\"persoon\"></span><div><b>Bevoegdheid</b><span>Je kunt bepalen of jij als boa bevoegd bent om op te treden.</span></div></li><li><span class=\"i2-ic\" data-i=\"schild\"></span><div><b>Veilig optreden</b><span>Je weet wanneer je zelf optreedt en wanneer je de politie inschakelt.</span></div></li><li><span class=\"i2-ic\" data-i=\"pv\"></span><div><b>Goed vastleggen</b><span>Je legt je waarnemingen en optreden goed vast in een proces-verbaal.</span></div></li></ul><figure class=\"i2-img\"><img src=\"assets/images/00-02-boa-park.webp?v=vw260924b\" alt=\"Twee boa’s in donkerblauw handhavingsuniform met HANDHAVING op de rug spreken 's avonds in een stadspark vier volwassenen aan. Op de bank ligt vuurwerk en staat een open tas met vuurwerk.\" width=\"707\" height=\"700\" loading=\"eager\" decoding=\"async\"></figure>"},{"kind":"theory","titel":"De vier vragen","html":"<h2 class=\"ptitle\">De vier vragen</h2><p class=\"pintro\">Bij elke situatie met vuurwerk stel je dezelfde vier vragen, in deze volgorde.</p><ol class=\"i3-vragen\" aria-label=\"De vier vragen, in vaste volgorde\"><li class=\"i3-v i3-v1\"><span class=\"i3-n\">1</span><span class=\"i3-vi\" data-i=\"oog\"></span><b>Wat tref ik aan?</b></li><li class=\"i3-v i3-v2\"><span class=\"i3-n\">2</span><span class=\"i3-vi\" data-i=\"wet\"></span><b>Is dit strafbaar?</b></li><li class=\"i3-v i3-v3\"><span class=\"i3-n\">3</span><span class=\"i3-vi\" data-i=\"schild\"></span><b>Ben ik bevoegd?</b></li><li class=\"i3-v i3-v4\"><span class=\"i3-n\">4</span><span class=\"i3-vi\" data-i=\"route\"></span><b>Wat doe ik nu?</b></li></ol><ul class=\"i3-lo\"><li><span class=\"i3-ic\" data-i=\"vuurwerk\"></span><div><b>Vuurwerk herkennen</b><span>Je herkent verschillende categorieën vuurwerk en weet waar je op moet letten.</span></div></li><li><span class=\"i3-ic\" data-i=\"boek\"></span><div><b>Strafbaar feit beoordelen</b><span>Je kunt beoordelen of er sprake is van een strafbaar feit.</span></div></li><li><span class=\"i3-ic\" data-i=\"document\"></span><div><b>Regels toepassen</b><span>Je weet welke regels gelden voor het bezit en gebruik van vuurwerk.</span></div></li><li><span class=\"i3-ic\" data-i=\"persoon\"></span><div><b>Bevoegdheid</b><span>Je kunt bepalen of jij als boa bevoegd bent om op te treden.</span></div></li><li><span class=\"i3-ic\" data-i=\"schild\"></span><div><b>Veilig optreden</b><span>Je weet wanneer je zelf optreedt en wanneer je de politie inschakelt.</span></div></li><li><span class=\"i3-ic\" data-i=\"pv\"></span><div><b>Goed vastleggen</b><span>Je legt je waarnemingen en optreden goed vast in een proces-verbaal.</span></div></li></ul><figure class=\"i3-img\"><img src=\"assets/images/00-03-vier-vragen.png?v=vw260924d\" width=\"1672\" height=\"941\" alt=\"Twee boa’s in donkerblauw handhavingsuniform met HANDHAVING op de rug spreken ’s avonds op een plein vier jongeren aan. Een van hen houdt een doos vuurwerk vast; voor hen staat een open tas met vuurwerk.\" loading=\"eager\" decoding=\"async\"></figure><section class=\"i3-t i3-boa\" aria-labelledby=\"i3-boa-h\"><h3 id=\"i3-boa-h\"><span class=\"i3-ti\" data-i=\"boa\"></span>Taakstelling boa’s</h3><ul><li><span class=\"i3-m\" data-i=\"vink\"></span><span>Preventie en toezicht</span></li><li><span class=\"i3-m\" data-i=\"vink\"></span><span>Optreden tegen vuurwerkoverlast<br>(in de openbare ruimte)</span></li><li><span class=\"i3-m\" data-i=\"vink\"></span><span>Handhaven bij vuurwerk<br>categorie <b>F2 en F3</b></span></li><li><span class=\"i3-m\" data-i=\"vink\"></span><span>Werken volgens lokaal beleid<br>en afspraken</span></li></ul></section><section class=\"i3-t i3-pol\" aria-labelledby=\"i3-pol-h\"><h3 id=\"i3-pol-h\"><span class=\"i3-ti\" data-i=\"politie\"></span>Taakstelling politie</h3><ul><li><span class=\"i3-m\" data-i=\"uitroep\"></span><span>Categorie F4 en illegaal vuurwerk<br>(zwaar vuurwerk, nitraten e.d.)</span></li><li><span class=\"i3-m\" data-i=\"uitroep\"></span><span>Vuurwerkhandel en grootschalige opslag</span></li><li><span class=\"i3-m\" data-i=\"uitroep\"></span><span>Grote hoeveelheden en vervoer</span></li><li><span class=\"i3-m\" data-i=\"uitroep\"></span><span>Ernstige gevaarzetting, geweld en<br>openbare-ordeproblematiek</span></li><li><span class=\"i3-m\" data-i=\"uitroep\"></span><span>Georganiseerde criminaliteit</span></li></ul></section><div class=\"i3-onthoud\"><div class=\"i3-o-lab\"><span class=\"i3-o-ic\" data-i=\"lamp\"></span><span>Onthoud</span></div><div class=\"i3-o-tekst\"><p><b>Bevoegdheid betekent niet dat je altijd zelf moet optreden.</b></p><p>Bevoegdheid bepaalt wat je juridisch mág. Taakstelling, beleid, veiligheid en de lokale afspraken bepalen wat je <b>daadwerkelijk doet.</b></p></div><div class=\"i3-bron\"><span class=\"i3-b-ic\" data-i=\"boek\"></span><p><b>Bron:</b><br>Landelijk Handhavingsplan<br>Jaarwisseling 2026/2027<br><small>Ministerie van Justitie en Veiligheid, maart 2026</small></p></div></div>"}],"titel":"Introductie","type":"intro","vragen":[]},{"icoon":"vuurwerk","id":"m1","kader":"Herkennen","nr":1,"pages":[{"kind":"kader","titel":"Wie bepaalt de categorie?","html":"<h2 class=\"ptitle\">Wie bepaalt de categorie?</h2><div class=\"wc\"><div class=\"wc-top\"><div class=\"wc-kop\"><div class=\"wc-label\"><span class=\"wc-chip\" data-i=\"oog\">Herkennen</span><span class=\"wc-art\">Artikel 1A.1.3 <b>Vuurwerkbesluit</b></span></div><div class=\"wc-titel\"></div><p class=\"wc-intro\">De categorie staat niet vast omdat jij iets ziet. De fabrikant deelt het vuurwerk in.</p></div><div class=\"wc-boek\"></div></div><div class=\"wc-body\"><section class=\"wc-cats\" aria-labelledby=\"wc-cats-t\"><div class=\"wc-cats-h\"><span class=\"wc-ic\" data-i=\"lagen\"></span><div><h3 id=\"wc-cats-t\">De vier categorieën</h3><p>Elke categorie heeft een eigen gevaar en gebruik.</p></div></div><ol class=\"wc-rijen\">\n<li class=\"wc-rij wc-f1\"><div class=\"wc-code\"><b>F1</b><span>Zeer weinig gevaar</span></div><ul class=\"wc-kenm\"><li>Zeer weinig gevaar</li><li>Te verwaarlozen geluidsniveau</li><li>Voor een besloten ruimte, ook binnenshuis</li></ul><img class=\"wc-foto\" src=\"assets/images/wet-f1.webp?v=vw260924a\" alt=\"Brandende sterretjes\" width=\"320\" height=\"240\" loading=\"eager\" decoding=\"async\"></li>\n<li class=\"wc-rij wc-f2\"><div class=\"wc-code\"><b>F2</b><span>Weinig gevaar</span></div><ul class=\"wc-kenm\"><li>Weinig gevaar</li><li>Laag geluidsniveau</li><li>Buitenshuis, op een afgebakende plaats</li></ul><img class=\"wc-foto\" src=\"assets/images/wet-f2.webp?v=vw260924a\" alt=\"Rode vuurwerkrollen\" width=\"320\" height=\"240\" loading=\"eager\" decoding=\"async\"></li>\n<li class=\"wc-rij wc-f3\"><div class=\"wc-code\"><b>F3</b><span>Middelmatig gevaar</span></div><ul class=\"wc-kenm\"><li>Middelmatig gevaar</li><li>Geluid niet schadelijk voor de gezondheid</li><li>Buitenshuis, in een grote open ruimte</li></ul><img class=\"wc-foto\" src=\"assets/images/wet-f3.webp?v=vw260924a\" alt=\"Vuurwerk dat in de lucht uiteenspat\" width=\"320\" height=\"240\" loading=\"eager\" decoding=\"async\"></li>\n<li class=\"wc-rij wc-f4\"><div class=\"wc-code\"><b>F4</b><span>Veel gevaar</span></div><ul class=\"wc-kenm\"><li>Veel gevaar</li><li>Geluid niet schadelijk voor de gezondheid</li><li>Alleen voor personen met gespecialiseerde kennis</li></ul><img class=\"wc-foto\" src=\"assets/images/wet-f4.webp?v=vw260924a\" alt=\"Zwaar vuurwerk en vuurpijlen\" width=\"320\" height=\"240\" loading=\"eager\" decoding=\"async\"></li>\n</ol><p class=\"wc-noot\">De foto’s zijn voorbeelden. De vorm van vuurwerk bepaalt de categorie niet.</p></section><div class=\"wc-rechts\"><section class=\"wc-wet\" aria-label=\"Wettekst artikel 1A.1.3 Vuurwerkbesluit\"><div class=\"wc-wet-h\"><span class=\"wc-ic wc-ic-d\" data-i=\"boek\"></span><span class=\"wc-wet-l\">Wettekst</span><span class=\"wc-wet-a\">Art. 1A.1.3 Vuurwerkbesluit</span></div><blockquote class=\"wc-quote\"><p>«1 De fabrikant brengt het vuurwerk of het pyrotechnische artikel voor theatergebruik in een bepaalde categorie onder op grond van toepassing, doel en gevaar, met inbegrip van hun geluidniveau.<br>2 Een aangemelde instantie bevestigt de categorisering als onderdeel van de conformiteitsbeoordelingsprocedure.»</p><footer>Artikel 1A.1.3, eerste en tweede lid</footer></blockquote></section><section class=\"wc-kaart wc-boa\"><span class=\"wc-ic\" data-i=\"schild\"></span><div><h3>Wat betekent dit voor jou als boa?</h3><p>Jij bepaalt de categorie niet op straat. Je leest hem meestal op de verpakking. Dat is belangrijke informatie, maar nog geen bewijs. Een etiket kan ontbreken, beschadigd of vals zijn.</p></div></section><section class=\"wc-kaart wc-bron\"><span class=\"wc-ic\" data-i=\"boek\"></span><div><h3>Bron</h3><p><a href=\"https://wetten.overheid.nl/BWBR0013360/2026-08-01\" target=\"_blank\" rel=\"noopener\">Vuurwerkbesluit</a>, artikel 1A.1.3</p></div></section></div></div><section class=\"wc-kaart wc-gewoon\"><span class=\"wc-ic\" data-i=\"ballon\"></span><div><h3>In gewone taal</h3><p>De fabrikant kiest de categorie. Een erkende keuringsinstantie (aangemelde instantie) bevestigt die. F1 is het lichtst. F4 is het zwaarst en alleen voor vakmensen.</p></div></section></div>"},{"kind":"kader","titel":"F1 – Zeer licht vuurwerk","html":"<div class=\"f1p cat-f1\"><header class=\"f1-banner\"><span class=\"cat-code\" aria-hidden=\"true\">F1</span><div class=\"f1-bt\"><p class=\"ck-k\">Categorie 1 van 4</p><h2 class=\"f1-t\">F1 – Zeer licht vuurwerk</h2><p class=\"f1-sub\">Zeer weinig gevaar. Voor een besloten ruimte, ook binnenshuis.</p></div><div class=\"f1-sfeer\" aria-hidden=\"true\"><img src=\"assets/images/01-02-f1-sfeer.webp?v=vw260924e\" alt=\"\" width=\"1624\" height=\"969\" loading=\"eager\" decoding=\"async\" onerror=\"this.parentNode.classList.add('leeg');this.remove()\"></div></header><div class=\"f1-body\"><section class=\"f1-vb\" aria-labelledby=\"f1-vbh\"><h3 class=\"f1-vbh\" id=\"f1-vbh\"><span class=\"f1-vbh-ic\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2.5\"/><circle cx=\"9\" cy=\"10\" r=\"1.8\"/><path d=\"m21 16-5-5-9 9\"/></svg></span>Voorbeelden van F1</h3><div class=\"f1-fotos\"><figure class=\"f1-foto\"><img src=\"assets/images/cat-f1-sterretjes.webp?v=vw260924a\" alt=\"Sterretjes\" width=\"200\" height=\"300\" loading=\"eager\" decoding=\"async\"><figcaption>Sterretjes</figcaption></figure><figure class=\"f1-foto f1-foto-kn\"><img src=\"assets/images/cat-f1-knalerwten.webp?v=vw260924a\" alt=\"Knalerwten\" width=\"200\" height=\"300\" loading=\"eager\" decoding=\"async\"><figcaption>Knalerwten</figcaption></figure><figure class=\"f1-foto f1-foto-tt\"><img src=\"assets/images/cat-f1-trektouwtjes.webp?v=vw260924f\" alt=\"Trektouwtjes\" width=\"1536\" height=\"1024\" loading=\"eager\" decoding=\"async\"><figcaption>Trektouwtjes</figcaption></figure><figure class=\"f1-foto f1-foto-fo\"><img src=\"assets/images/cat-f1-ijsfontein.webp?v=vw260924a\" alt=\"Kleine fonteintjes\" width=\"200\" height=\"300\" loading=\"eager\" decoding=\"async\"><figcaption>Kleine fonteintjes</figcaption></figure></div></section><div class=\"f1-kaarten\"><article class=\"f1-k f1-k-wat\"><span class=\"f1-k-ic\" data-i=\"schild\"></span><div class=\"f1-k-tx\"><h4>Wat is F1?</h4><p>Vuurwerk met zeer weinig gevaar. F1 is bedoeld voor een besloten ruimte, ook binnenshuis.</p></div></article><article class=\"f1-k f1-k-waar\"><span class=\"f1-k-ic\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 11.5 12 4l9 7.5\"/><path d=\"M5.5 9.8V20h13V9.8\"/><path d=\"M10 20v-5.5h4V20\"/></svg></span><div class=\"f1-k-tx\"><h4>Waar mag je het gebruiken?</h4><p>Voor een besloten ruimte, ook binnenshuis.</p></div><span class=\"f1-k-deco\" aria-hidden=\"true\"><svg viewBox=\"0 0 96 72\"><circle cx=\"48\" cy=\"38\" r=\"34\" fill=\"#e3edfb\"/><path d=\"M22 40 48 18l26 22\" fill=\"none\" stroke=\"#1b3a7a\" stroke-width=\"5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><path d=\"M28 36v24h40V36L48 21z\" fill=\"#5d7fc0\"/><rect x=\"43\" y=\"46\" width=\"10\" height=\"14\" rx=\"1.5\" fill=\"#e6a133\"/><rect x=\"33\" y=\"41\" width=\"7\" height=\"7\" rx=\"1\" fill=\"#fff4dd\"/><circle cx=\"80\" cy=\"50\" r=\"8\" fill=\"#1b9657\"/><rect x=\"79\" y=\"54\" width=\"2.4\" height=\"8\" fill=\"#137443\"/><rect x=\"18\" y=\"60\" width=\"66\" height=\"3.5\" rx=\"1.75\" fill=\"#1b3a7a\"/></svg></span></article><article class=\"f1-k f1-k-vb\"><span class=\"f1-k-ic\" data-i=\"vink\"></span><div class=\"f1-k-tx\"><h4>Voorbeelden:</h4><p>Sterretjes, knalerwten, trektouwtjes en kleine fonteintjes.</p></div><span class=\"f1-k-deco\" aria-hidden=\"true\"><svg viewBox=\"0 0 96 72\" fill=\"none\" stroke-linecap=\"round\"><path d=\"M34 70 50 26M62 70 70 24\" stroke=\"#8a6a3a\" stroke-width=\"2.4\"/><g stroke=\"#e6a133\" stroke-width=\"2\"><path d=\"M50 26l-9-9M50 26l10-10M50 26l-12 1M50 26l12 2M50 26l-4 12M50 26l1-13M50 26l8 10\"/><path d=\"M70 24l-8-8M70 24l9-9M70 24l-11 1M70 24l11 2M70 24l-2 12M70 24l1-12M70 24l7 9\"/></g><g fill=\"#f7c948\"><circle cx=\"50\" cy=\"26\" r=\"3\"/><circle cx=\"70\" cy=\"24\" r=\"3\"/></g></svg></span></article><article class=\"f1-k f1-k-let\"><span class=\"f1-k-ic\" aria-hidden=\"true\"><b>!</b></span><div class=\"f1-k-tx\"><h4>Overlast</h4><p>Zorgt categorie F1 vuurwerk afgestoken door personen voor overlast? Denk dan aan een overtreding van de APV of aan baldadigheid volgens het Wetboek van Strafrecht.</p></div></article></div></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0013360/2026-08-01\" target=\"_blank\" rel=\"noopener\">Vuurwerkbesluit</a> <span class=\"bb-toel\">art. 1.1.1, 1A.1.3, 1A.4.1 (CE-markering), 2.1.3 en 2.3.5</span></li></ol></div>"},{"kind":"kader","titel":"F2 – Vuurwerk met weinig gevaar","html":"<div class=\"f2p cat-f2\"><header class=\"f2-banner\"><span class=\"cat-code\" aria-hidden=\"true\">F2</span><div class=\"f2-bt\"><p class=\"ck-k\">Categorie 2 van 4</p><h2 class=\"f2-t\">F2 – Vuurwerk met weinig gevaar</h2></div><div class=\"f2-sfeer\" aria-hidden=\"true\"><img src=\"assets/images/01-03-f2-sfeer.webp?v=vw260924i\" alt=\"\" width=\"2048\" height=\"768\" loading=\"eager\" decoding=\"async\" onerror=\"this.parentNode.classList.add('leeg');this.remove()\"></div></header><div class=\"f2-body\"><div class=\"f2-links\"><section class=\"f2-vb\" aria-labelledby=\"f2-vbh\"><h3 class=\"f2-vbh\" id=\"f2-vbh\"><span class=\"f2-vbh-ic\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2.5\"/><circle cx=\"9\" cy=\"10\" r=\"1.8\"/><path d=\"m21 16-5-5-9 9\"/></svg></span>Voorbeelden van F2</h3><div class=\"f2-fotos\"><figure class=\"f2-foto\"><img src=\"assets/images/cat-f2-fontein.webp?v=vw260924a\" alt=\"Fontein met het etiket F2\" width=\"200\" height=\"300\" loading=\"eager\" decoding=\"async\"><figcaption>Fonteinen</figcaption></figure><figure class=\"f2-foto\"><img src=\"assets/images/cat-f2-cake.webp?v=vw260924a\" alt=\"Cake met het etiket F2\" width=\"200\" height=\"300\" loading=\"eager\" decoding=\"async\"><figcaption>Cakes</figcaption></figure><figure class=\"f2-foto\"><img src=\"assets/images/cat-f2-compoundbox.webp?v=vw260924a\" alt=\"Compoundbox met het etiket F2\" width=\"200\" height=\"300\" loading=\"eager\" decoding=\"async\"><figcaption>Compound­boxen</figcaption></figure></div></section><article class=\"f2-vbk\"><span class=\"f2-k-ic\" data-i=\"boek\"></span><div><h4>Voorbeelden</h4><p>Fonteinen, cakes en compoundboxen.<br>Alleen als ze echt als F2 zijn ingedeeld.</p></div></article></div><div class=\"f2-kaarten\"><article class=\"f2-k f2-k-tip\"><span class=\"f2-k-ic\" aria-hidden=\"true\"><b>i</b></span><div><h4>Tip</h4><p>De tekst “Geschikt voor particulier gebruik” zegt iets over het product. Of iemand het nu mag hebben, is een andere vraag (hoofdstuk 2).</p></div></article><article class=\"f2-k f2-k-or\"><span class=\"f2-k-ic\" data-i=\"wet\"></span><div><h4>Wat is F2?</h4><p>Vuurwerk met weinig gevaar.<br>Bedoeld voor buiten, op een afgebakende plaats.</p></div></article><article class=\"f2-k f2-k-or\"><span class=\"f2-k-ic\" data-i=\"oog\"></span><div><h4>Wat kun je waarnemen?</h4><p>De categorie F2 op het etiket. Soms ook “Geschikt voor particulier gebruik”.<br>Voorbeelden: fonteinen, cakes en compoundboxen.</p></div></article><article class=\"f2-k f2-k-straf\"><span class=\"f2-k-ic f2-hamer\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\"><g transform=\"rotate(-45 12 12)\" fill=\"currentColor\"><rect x=\"6\" y=\"3.2\" width=\"12\" height=\"5.6\" rx=\"1.3\"/><rect x=\"4.6\" y=\"2.4\" width=\"2.4\" height=\"7.2\" rx=\"1\"/><rect x=\"17\" y=\"2.4\" width=\"2.4\" height=\"7.2\" rx=\"1\"/><rect x=\"10.9\" y=\"8.4\" width=\"2.2\" height=\"11.5\" rx=\"1.1\"/></g><rect x=\"12.5\" y=\"19\" width=\"9\" height=\"2.6\" rx=\"1.3\" fill=\"currentColor\"/></svg></span><div><h4>Wat is <span>strafbaar?</span></h4><p>Een consument mag F2-vuurwerk niet bezitten of gebruiken.</p><p>Dit is strafbaar op grond van:</p><ul><li>artikel 9.2.2.1a Wet milieubeheer</li><li>in samenhang met artikel 1a, onderdeel 1°, Wet op de economische delicten (WED).</li></ul></div></article><article class=\"f2-k f2-k-onth\"><span class=\"f2-k-ic\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z\" fill=\"currentColor\" fill-opacity=\".14\"/><path d=\"M14 3v5h5\"/><path d=\"M9 12h6M9 15.5h6M9 19h3\"/></svg></span><div><h4>Ontheffing burgemeester</h4><p>De burgemeester kan voor de jaarwisseling onder voorwaarden ontheffing verlenen voor het afsteken van aangewezen F2-vuurwerk.</p><p>Dit geldt niet voor al het F2-vuurwerk.</p><p class=\"f2-k-ref\">Art. 9.2.2.1a lid 4 en 5 Wet milieubeheer · art. 2.3.2 e.v. Vuurwerkbesluit.</p></div></article></div></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0013360/2026-08-01\" target=\"_blank\" rel=\"noopener\">Vuurwerkbesluit</a> <span class=\"bb-toel\">art. 1.1.1 (consumentenvuurwerk), 1A.1.3, 2.1.3 en 2.3.2 e.v.</span></li><li><a href=\"https://wetten.overheid.nl/BWBR0003245/2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet milieubeheer</a> <span class=\"bb-toel\">art. 9.2.2.1a lid 1, 4 en 5</span></li><li><a href=\"https://wetten.overheid.nl/BWBR0002063/2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet op de economische delicten</a> <span class=\"bb-toel\">art. 1a onder 1°</span></li></ol></div>"},{"kind":"kader","titel":"F3 – Vuurwerk met middelmatig gevaar","html":"<div class=\"f3p cat-f3\"><header class=\"f3-banner\"><span class=\"cat-code\" aria-hidden=\"true\">F3</span><div class=\"f3-bt\"><p class=\"ck-k\">Categorie 3 van 4</p><h2 class=\"f3-t\">F3 – Vuurwerk met middelmatig gevaar</h2><p class=\"f3-sub\">Voor gebruik buitenshuis in een grote open ruimte</p></div><div class=\"f3-sfeer\" aria-hidden=\"true\"><img src=\"assets/images/01-04-f3-sfeer.webp?v=vw260924k\" alt=\"\" width=\"1086\" height=\"724\" loading=\"eager\" decoding=\"async\" onerror=\"this.parentNode.classList.add('leeg');this.remove()\"></div></header><div class=\"f3-body\"><div class=\"f3-links\"><section class=\"f3-vb\" aria-labelledby=\"f3-vbh\"><h3 class=\"f3-vbh\" id=\"f3-vbh\"><span class=\"f3-vbh-ic\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2.5\"/><circle cx=\"9\" cy=\"10\" r=\"1.8\"/><path d=\"m21 16-5-5-9 9\"/></svg></span>Voorbeelden van F3</h3><div class=\"f3-fotos\"><figure class=\"f3-foto\"><img src=\"assets/images/cat-f3-cake.webp?v=vw260924a\" alt=\"Grote cake\" width=\"200\" height=\"300\" loading=\"eager\" decoding=\"async\"><figcaption>Cake</figcaption></figure><figure class=\"f3-foto\"><img src=\"assets/images/cat-f3-vuurpijlen.webp?v=vw260924a\" alt=\"Vuurpijlen\" width=\"200\" height=\"300\" loading=\"eager\" decoding=\"async\"><figcaption>Vuurpijlen</figcaption></figure><figure class=\"f3-foto\"><img src=\"assets/images/cat-f3-batterij.webp?v=vw260924a\" alt=\"Batterij\" width=\"200\" height=\"300\" loading=\"eager\" decoding=\"async\"><figcaption>Batterij</figcaption></figure></div></section><article class=\"f3-vbk\"><span class=\"f3-k-ic\" data-i=\"boek\"></span><div><h4>Voorbeelden</h4><p>Cakes, vuurpijlen en batterijen kunnen als F3 zijn ingedeeld.</p><p><strong>Controleer altijd het etiket.</strong></p></div><p class=\"f3-noot\">De afbeeldingen zijn voorbeelden. De vorm of naam bepaalt de categorie niet.</p></article></div><div class=\"f3-kaarten\"><article class=\"f3-k f3-k-tip\"><span class=\"f3-k-ic\" aria-hidden=\"true\"><b>i</b></span><div><h4>Tip</h4><p>Groot of hard is niet hetzelfde als F3.<br>Begin altijd bij het etiket en controleer de CE-markering.</p></div></article><article class=\"f3-k f3-k-hoe\"><span class=\"f3-k-ic\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><circle cx=\"10.5\" cy=\"10.5\" r=\"6.5\"/><path d=\"m15.5 15.5 5 5\"/></svg></span><div><h4>Hoe herken je F3?</h4><ol class=\"f3-stappen\"><li><b>Kijk naar het etiket.</b><span>Staat op het vuurwerk F3? Dan is dat je uitgangspunt.</span></li><li><b>Controleer de CE-markering.</b><span>Kijk of de CE-markering aanwezig is en of het etiket compleet en betrouwbaar oogt.</span></li><li><b>Twijfel je?</b><span>Ontbreekt informatie, lijkt het etiket gewijzigd of heb je een andere reden om te twijfelen?</span><strong>Dan is eventueel verder onderzoek nodig.</strong></li></ol></div><div class=\"f3-onthoud\"><span class=\"f3-on-ic\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 18h6M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.4 1.1 2.2h5c0-.8.4-1.6 1.1-2.2A6 6 0 0 0 12 3z\" fill=\"currentColor\" fill-opacity=\".2\"/></svg></span><div><h5>Onthoud:</h5><p>Je bepaalt de categorie niet zelf aan de hand van de vorm, grootte of knal.</p><p><strong>Begin bij de categorie op het etiket.</strong></p></div></div></article><article class=\"f3-k f3-k-straf\"><span class=\"f3-k-ic f3-hamer\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\"><g transform=\"rotate(-45 12 12)\" fill=\"currentColor\"><rect x=\"6\" y=\"3.2\" width=\"12\" height=\"5.6\" rx=\"1.3\"/><rect x=\"4.6\" y=\"2.4\" width=\"2.4\" height=\"7.2\" rx=\"1\"/><rect x=\"17\" y=\"2.4\" width=\"2.4\" height=\"7.2\" rx=\"1\"/><rect x=\"10.9\" y=\"8.4\" width=\"2.2\" height=\"11.5\" rx=\"1.1\"/></g><rect x=\"12.5\" y=\"19\" width=\"9\" height=\"2.6\" rx=\"1.3\" fill=\"currentColor\"/></svg></span><div><h4>Wat is <span>strafbaar?</span></h4><p>Een consument mag F3-vuurwerk niet bezitten of gebruiken.</p><p>Dit is strafbaar op grond van:</p><ul><li>artikel 9.2.2.1a Wet milieubeheer</li><li>in samenhang met artikel 1a, onderdeel 1°, Wet op de economische delicten (WED).</li></ul></div></article></div></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0013360/2026-08-01\" target=\"_blank\" rel=\"noopener\">Vuurwerkbesluit</a> <span class=\"bb-toel\">art. 1.1.1 (professioneel vuurwerk) en 1A.1.3</span></li><li><a href=\"https://wetten.overheid.nl/BWBR0003245/2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet milieubeheer</a> <span class=\"bb-toel\">art. 9.2.2.1a</span></li><li><a href=\"https://wetten.overheid.nl/BWBR0002063/2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet op de economische delicten</a> <span class=\"bb-toel\">art. 1a onder 1°</span></li></ol></div>"},{"kind":"kader","titel":"F4 – Professioneel vuurwerk","html":"<div class=\"f4p cat-f4\"><header class=\"f4-banner\"><span class=\"cat-code\" data-i=\"waarschuwing\" aria-hidden=\"true\"></span><div class=\"f4-bt\"><p class=\"ck-k\">Categorie 4 van 4</p><h2 class=\"f4-t\">F4 – Professioneel vuurwerk</h2><p class=\"f4-sub\">Veel gevaar, alleen voor personen met gespecialiseerde kennis</p></div><div class=\"f4-sfeer\" aria-hidden=\"true\"><img src=\"assets/images/01-04-f3-sfeer.webp?v=vw260924k\" alt=\"\" width=\"1086\" height=\"724\" loading=\"eager\" decoding=\"async\"></div></header><div class=\"f4-body\"><div class=\"f4-links\"><section class=\"f4-vb\" aria-labelledby=\"f4-vbh\"><h3 class=\"f4-vbh\" id=\"f4-vbh\"><span class=\"f4-vbh-ic\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2.5\"/><circle cx=\"9\" cy=\"10\" r=\"1.8\"/><path d=\"m21 16-5-5-9 9\"/></svg></span>Voorbeelden van F4</h3><div class=\"f4-fotos\"><figure class=\"f4-foto\"><img src=\"assets/images/cat-f4-cobra.webp?v=vw260924a\" alt=\"Zwaar knalvuurwerk dat in de praktijk cobra wordt genoemd\" width=\"200\" height=\"300\" loading=\"eager\" decoding=\"async\"><figcaption>Cobra (shell)</figcaption></figure><figure class=\"f4-foto\"><img src=\"assets/images/cat-f4-nitraten.webp?v=vw260924a\" alt=\"Zwaar knalvuurwerk dat in de praktijk nitraat wordt genoemd\" width=\"200\" height=\"300\" loading=\"eager\" decoding=\"async\"><figcaption>Nitraat (shells)</figcaption></figure><figure class=\"f4-foto\"><img src=\"assets/images/cat-f4-vlinder.webp?v=vw260924a\" alt=\"Vuurwerk dat in de praktijk vlinder wordt genoemd\" width=\"200\" height=\"300\" loading=\"eager\" decoding=\"async\"><figcaption>Vlinder (professioneel)</figcaption></figure></div></section><article class=\"f4-vbk\"><span class=\"f4-k-ic\" data-i=\"boek\"></span><div><h4>Voorbeelden</h4><p>Op straat hoor je namen als cobra, nitraat, vlinder, lawinepijl of mortier.</p><p><strong>Dat zijn praktijknamen. De categorie moet apart worden vastgesteld.</strong></p></div><p class=\"f4-noot\">De afbeeldingen zijn voorbeelden. De vorm of naam bepaalt de categorie niet.</p></article></div><div class=\"f4-kaarten\"><article class=\"f4-k f4-k-tip\"><span class=\"f4-k-ic\" aria-hidden=\"true\"><b>i</b></span><div><h4>Tip</h4><p>Praktijknamen zoals «cobra» of «nitraat» zijn geen wettelijke categorie.</p></div></article><article class=\"f4-k f4-k-hoe\"><span class=\"f4-k-ic\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><circle cx=\"10.5\" cy=\"10.5\" r=\"6.5\"/><path d=\"m15.5 15.5 5 5\"/></svg></span><div><h4>Herkenning in de praktijk</h4><p class=\"f4-hoe-sub\">Let op de volgende algemene kenmerken:</p><ol class=\"f4-stappen\"><li><b>Soort vuurwerk</b><span>Vaak gaat het om shells, grote mortieren, grote vuurpijlen en andere zwaardere, professionele producten.</span></li><li><b>Uiterlijk en afwerking</b><span>Meestal groter en zwaarder uitgevoerd dan consumentenvuurwerk.</span><span>Vaak stevig en professioneel verpakt.</span></li><li><b>Context</b><span>Komt regelmatig voor bij grootschalige vuurwerkshows en professionele gebruikers.</span></li></ol></div></article><article class=\"f4-k f4-k-weet\"><span class=\"f4-k-ic\" data-i=\"vraag\"></span><div><h4>Wat weet je nog niet?</h4><p>Dat zwaar vuurwerk F4 is.<br>Een naam, vorm of knal bewijst de categorie niet.</p></div></article><article class=\"f4-k f4-k-straf\"><span class=\"f4-k-ic f4-hamer\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\"><g transform=\"rotate(-45 12 12)\" fill=\"currentColor\"><rect x=\"6\" y=\"3.2\" width=\"12\" height=\"5.6\" rx=\"1.3\"/><rect x=\"4.6\" y=\"2.4\" width=\"2.4\" height=\"7.2\" rx=\"1\"/><rect x=\"17\" y=\"2.4\" width=\"2.4\" height=\"7.2\" rx=\"1\"/><rect x=\"10.9\" y=\"8.4\" width=\"2.2\" height=\"11.5\" rx=\"1.1\"/></g><rect x=\"12.5\" y=\"19\" width=\"9\" height=\"2.6\" rx=\"1.3\" fill=\"currentColor\"/></svg></span><div><h4>Wat is <span>strafbaar?</span></h4><p>Een consument mag F4-vuurwerk niet bezitten of gebruiken.</p><p>Dit is strafbaar op grond van:</p><ul><li>artikel 1.2.2, derde lid, Vuurwerkbesluit (F4 is professioneel vuurwerk, artikel 1.1.1 Vuurwerkbesluit)</li><li>gesteld krachtens artikel 9.2.2.1 Wet milieubeheer</li><li>in samenhang met artikel 1a, onderdeel 1°, Wet op de economische delicten (WED).</li></ul></div></article></div></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0013360/2026-08-01\" target=\"_blank\" rel=\"noopener\">Vuurwerkbesluit</a> <span class=\"bb-toel\">art. 1.1.1 (professioneel vuurwerk), 1.2.2 lid 3, 1A.1.3 en 5.4.0</span></li><li><a href=\"https://wetten.overheid.nl/BWBR0003245/2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet milieubeheer</a> <span class=\"bb-toel\">art. 9.2.2.1</span></li><li><a href=\"https://wetten.overheid.nl/BWBR0002063/2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet op de economische delicten</a> <span class=\"bb-toel\">art. 1a onder 1°</span></li></ol></div>"},{"kind":"kader","titel":"Verpakking en etiket","html":"<div class=\"etp\"><header class=\"et-banner\"><span class=\"et-badge\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2.5 3.5 7v10l8.5 4.5 8.5-4.5V7z\"/><path d=\"M3.5 7 12 11.5 20.5 7M12 11.5v10M7.8 4.7l8.5 4.6\"/></svg></span><div class=\"et-bt\"><p class=\"ck-k\">Verpakking en etiket</p><h2 class=\"et-t\">Wat vertelt de verpakking je?</h2><p class=\"et-sub\">Op de verpakking staat belangrijke informatie. Die helpt je om het vuurwerk te herkennen en te beoordelen.</p></div><div class=\"et-sfeer\" aria-hidden=\"true\"><img src=\"assets/images/01-06-etiket-sfeer.webp?v=vw260925a\" alt=\"\" width=\"712\" height=\"168\" loading=\"eager\" decoding=\"async\" onerror=\"this.parentNode.classList.add('leeg');this.remove()\"></div></header><div class=\"et-body\"><div class=\"et-kol\"><section class=\"et-kaart et-check\" aria-labelledby=\"et-check-t\"><div class=\"et-kop\"><span class=\"et-kop-ic\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><circle cx=\"10.5\" cy=\"10.5\" r=\"6.5\"/><path d=\"m15.5 15.5 5 5\"/></svg></span><div><h3 id=\"et-check-t\">Wat kun je op het etiket controleren?</h3><p>Bij consumentenvuurwerk vind je onder meer de volgende gegevens (artikel 2.1.3 Vuurwerkbesluit):</p></div></div><ul class=\"et-tegels\"><li class=\"et-tegel\"><span class=\"et-ico et-ico-cat\" aria-hidden=\"true\"><b>F</b><i></i><i></i><i></i><i></i></span><h4>Categorie</h4><p>F1, F2, F3 of F4</p></li><li class=\"et-tegel\"><span class=\"et-ico et-ico-lft\" aria-hidden=\"true\"><svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"24\" cy=\"24\" r=\"20\" stroke-width=\"3.4\"/><circle cx=\"21\" cy=\"17.5\" r=\"4.2\" stroke-width=\"2.6\"/><path d=\"M13 34c0-5 3.6-8.5 8-8.5s8 3.5 8 8.5\" stroke-width=\"2.6\"/><path d=\"M34 19v8M30 23h8\" stroke-width=\"2.8\"/></svg></span><h4>Minimum&shy;leeftijd</h4><p>Vanaf welke leeftijd het vuurwerk mag worden verkocht of verstrekt.</p></li><li class=\"et-tegel\"><span class=\"et-ico et-ico-nem\" aria-hidden=\"true\"><svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"3\"><path d=\"M18 14a6 6 0 1 1 12 0\"/><path d=\"M12.5 15h23l5 25h-33z\"/><text x=\"24\" y=\"34\" text-anchor=\"middle\" font-family=\"Outfit,sans-serif\" font-weight=\"800\" font-size=\"13\" fill=\"currentColor\" stroke=\"none\">g</text></svg></span><h4>NEM</h4><p>Netto explosieve massa: de hoeveelheid kruit.</p></li><li class=\"et-tegel\"><span class=\"et-ico et-ico-boek\" aria-hidden=\"true\"><svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M24 12c-4-3-10-4-18-3.5v28c8-.5 14 .5 18 3.5 4-3 10-4 18-3.5v-28c-8-.5-14 .5-18 3.5z\"/><path d=\"M24 12v28M11 16h8M11 21h8M11 26h8M29 16h8M29 21h8M29 26h8\"/></svg></span><h4>Gebruiks&shy;aanwijzing</h4><p>Hoe het vuurwerk veilig moet worden gebruikt.</p></li></ul><div class=\"et-info\"><span class=\"et-info-ic\" aria-hidden=\"true\"><b>i</b></span><div><p class=\"et-info-h\">Bij klein vuurwerk kunnen deze gegevens op de kleinste verpakkingseenheid staan.</p><p class=\"et-info-s\">Voor consumentenvuurwerk bestemd voor Nederland moeten de voorgeschreven gegevens in het Nederlands staan.</p></div></div></section><section class=\"et-wet\" aria-labelledby=\"et-wet-t\"><div class=\"et-wet-kop\"><span class=\"et-wet-ic\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 6.5C10 5 7 4.5 3 4.8v13.5c4-.3 7 .2 9 1.7 2-1.5 5-2 9-1.7V4.8c-4-.3-7 .2-9 1.7z\"/><path d=\"M12 6.5V20\"/></svg></span><h3 id=\"et-wet-t\">Wat zegt de wet?</h3><span class=\"et-wet-badge\">Art. 2.1.3 Vuurwerkbesluit</span></div><blockquote class=\"et-wet-q\"><p class=\"et-wet-in\">«1 Consumentenvuurwerk is voorzien van:</p><ol class=\"et-wet-l\"><li><b>a.</b><span>de aanduiding: Geschikt voor particulier gebruik;</span></li><li class=\"et-wet-gap\"><span>(…)</span></li><li><b>g.</b><span>de minimumleeftijd voor het verkopen of anderszins ter beschikking stellen van het vuurwerk, bedoeld in artikel 2.3.5;</span></li><li><b>h.</b><span>de categorie, bedoeld in artikel 1A.1.3, waartoe het vuurwerk behoort;</span></li><li><b>i.</b><span>de NEM;</span></li><li><b>j.</b><span>een gebruiksaanwijzing (…).»</span></li></ol><footer>Artikel 2.1.3, eerste lid (fragment)</footer></blockquote></section></div><div class=\"et-kol\"><section class=\"et-kaart et-cat\" aria-labelledby=\"et-cat-t\"><div class=\"et-kop\"><span class=\"et-kop-ic\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3v17M7 20h10M5 6.5h14M12 4.5l-7 2M12 4.5l7 2\"/><path d=\"M5 7 2.5 13a2.6 2.6 0 0 0 5 0zM19 7l-2.5 6a2.6 2.6 0 0 0 5 0z\"/></svg></span><div><h3 id=\"et-cat-t\">Wat betekent de categorie?</h3><p>De categorie bepaalt welke regels gelden voor bezit en gebruik.</p></div></div><ol class=\"et-cats\"><li class=\"et-c et-c-ok\"><span class=\"et-code\">F1</span><div><h4>In beginsel toegestaan</h4><p>Een consument mag F1-vuurwerk in beginsel bezitten en gebruiken.</p></div></li><li class=\"et-c et-c-nee\"><span class=\"et-code\">F2</span><div><h4>Verboden</h4><p>Een consument mag F2-vuurwerk niet bezitten of gebruiken.</p><p class=\"et-uitz\"><b>Uitzondering:</b> voor aangewezen F2-vuurwerk kan de burgemeester onder voorwaarden een ontheffing verlenen. Dit geldt niet voor al het F2-vuurwerk.</p></div></li><li class=\"et-c et-c-nee\"><span class=\"et-code\">F3</span><div><h4>Verboden</h4><p>Een consument mag F3-vuurwerk niet bezitten of gebruiken.</p></div></li><li class=\"et-c et-c-nee\"><span class=\"et-code\">F4</span><div><h4>Niet voor consumenten</h4><p>F4-vuurwerk is uitsluitend bestemd voor gebruik door personen met gespecialiseerde kennis.</p></div></li></ol></section><section class=\"et-boa\" aria-labelledby=\"et-boa-t\"><span class=\"et-boa-ic\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2.5 20 5.5v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10v-6z\"/><path d=\"m8.3 12 2.6 2.6 4.9-5.2\"/></svg></span><div><h3 id=\"et-boa-t\">Wat betekent dit voor jou als boa?</h3><ul class=\"et-vink\"><li>Controleer het etiket en leg vast wat je aantreft.</li><li>Kijk eerst naar de <strong>categorie</strong>: F1, F2, F3 of F4.</li><li>Controleer ook de <strong>minimumleeftijd</strong>, <strong>NEM</strong> en <strong>gebruiksaanwijzing</strong>.</li><li>Ontbreekt informatie of heb je reden om aan het etiket te twijfelen? Dan is eventueel verder onderzoek nodig.</li></ul></div></section></div></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0013360/2026-08-01\" target=\"_blank\" rel=\"noopener\">Vuurwerkbesluit</a> <span class=\"bb-toel\">art. 1.1.1 (NEM), 1A.1.3, 2.1.3 en 2.3.2 e.v.</span></li><li><a href=\"https://wetten.overheid.nl/BWBR0003245/2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet milieubeheer</a> <span class=\"bb-toel\">art. 9.2.2.1a lid 1, 4 en 5 (F2 en F3)</span></li></ol></div>"},{"kind":"theory","titel":"Onbekend vuurwerk en veelgebruikte namen","html":"<div class=\"obp\"><div class=\"ob-top\"><div class=\"ob-kop\"><span class=\"ob-chip\"><span data-i=\"schild\"></span>Herkennen</span><h2 class=\"ob-t\">Onbekend vuurwerk en veelgebruikte namen</h2><p class=\"ob-intro\">Soms kun je niet betrouwbaar vaststellen wat je ziet. Er is geen verpakking of etiket, of het vuurwerk is beschadigd, aangepast of zelfgemaakt. Dat noemen we “onbekend vuurwerk”. Dit is geen wettelijke categorie.</p></div><figure class=\"ob-foto\"><img src=\"assets/images/01-07-onbekend-vuurwerk.webp?v=vw260925o\" alt=\"Een kartonnen rol, omwikkeld met zwarte tape, met een lont. Er is geen verpakking of etiket.\" width=\"685\" height=\"454\" loading=\"eager\" decoding=\"async\"></figure><div class=\"ob-kaarten\"><article class=\"ob-k\"><span class=\"ob-k-ic\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9.5\"/><path d=\"M9.3 9.2a2.8 2.8 0 1 1 4 2.6c-.9.4-1.3 1-1.3 2v.4\"/><path d=\"M12 17.2v.1\"/></svg></span><div><h3>Geen verpakking of etiket</h3><p>Zonder verpakking of etiket kun je de categorie niet altijd betrouwbaar vaststellen. “Onbekend vuurwerk” is geen wettelijke categorie.</p></div></article><article class=\"ob-k\"><span class=\"ob-k-ic\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"7.5\" r=\"3\"/><circle cx=\"5.5\" cy=\"9.5\" r=\"2.2\"/><circle cx=\"18.5\" cy=\"9.5\" r=\"2.2\"/><path d=\"M6.5 19.5v-1a5.5 5.5 0 0 1 11 0v1M1.8 18v-.6a3.7 3.7 0 0 1 4.7-3.5M22.2 18v-.6a3.7 3.7 0 0 0-4.7-3.5\"/></svg></span><div><h3>Namen die je op straat hoort</h3><p>Woorden als <em class=\"ob-naam\">nitraat</em>, <em class=\"ob-naam\">cobra</em> of <em class=\"ob-naam\">mortier</em> worden in de praktijk gebruikt. Dit zijn geen wettelijke categorieën. Een naam als “cobra” betekent dus niet automatisch F4.</p></div></article><article class=\"ob-k\"><span class=\"ob-k-ic\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 2.5H6.5a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V8z\"/><path d=\"M14 2.5V8h5.5M8 12.5h5M8 16h3.5\"/><path d=\"m15.2 19.8 4.9-4.9a1.3 1.3 0 0 0-1.9-1.9l-4.9 4.9-.6 2.5z\"/></svg></span><div><h3>Beschrijf wat je ziet</h3><p>Kun je de categorie niet betrouwbaar vaststellen? Vul dan niet zelf F1, F2, F3 of F4 in. Beschrijf wat je daadwerkelijk waarneemt: vorm, grootte, kleur, aantal, opschriften, verpakking (of dat die ontbreekt) en andere dingen die opvallen.</p></div></article><article class=\"ob-k\"><span class=\"ob-k-ic\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.3 3.9 2 18.2a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z\"/><path d=\"M12 9.5v4.5M12 17.3v.1\"/></svg></span><div><h3>Let op de veiligheid</h3><p>Is het vuurwerk aangepast, zelfgemaakt of mogelijk gevaarlijk? Ga het niet zelf openen of onderzoeken. Raak het niet aan en schakel zo nodig de politie in.</p></div></article></div></div><section class=\"ob-onthoud\" aria-label=\"Onthoud\"><div class=\"ob-on-links\"><span class=\"ob-on-ic\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 18h6M10 21.5h4\"/><path d=\"M12 2.5a6.5 6.5 0 0 0-4 11.6c.6.5 1 1.3 1 2.1v.3h6v-.3c0-.8.4-1.6 1-2.1a6.5 6.5 0 0 0-4-11.6z\"/></svg></span><div><span class=\"ob-on-lab\">Onthoud</span><p class=\"ob-on-h\">Kun je de categorie niet betrouwbaar vaststellen? <strong>Niet gokken.</strong></p><p class=\"ob-on-s\">Schrijf op wat je daadwerkelijk ziet en leest, niet wat je denkt.</p></div></div><div class=\"ob-on-rechts\"><span class=\"ob-vg-ic\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2.5 20 5.5v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10v-6z\"/><path d=\"m8.3 12 2.6 2.6 4.9-5.2\"/></svg></span><p>Lijkt het vuurwerk aangepast, zelfgemaakt, beschadigd of mogelijk gevaarlijk? Raak het niet aan. <strong>Veiligheid gaat voor.</strong></p></div></section></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0013360/2026-08-01\" target=\"_blank\" rel=\"noopener\">Vuurwerkbesluit</a> <span class=\"bb-toel\">art. 1A.1.3 (categorieën)</span></li></ol></div>"}],"titel":"Vuurwerk herkennen","type":"content","vragen":[{"vraag":"In een open tas zie je vuurwerk. Er liggen ook losse voorwerpen zonder etiket. Je weet niet wat deze voorwerpen zijn. Wat doe je als eerste?","beeld":{"src":"assets/images/01-q2-tas-boa.webp","alt":"Een boa in handhavingsuniform bij een open tas met vuurwerkverpakkingen en losse voorwerpen zonder etiket.","w":1672,"h":941},"opties":["Je pakt de losse voorwerpen op om te kijken wat erop staat.","Je opent een voorwerp om te onderzoeken welk vuurwerk het is.","Je noemt de losse voorwerpen F4 omdat ze er zwaar uitzien.","Je raakt de onbekende voorwerpen niet aan, houdt afstand en beoordeelt eerst of je veilig verder kunt handelen."],"juist":3,"uitleg":"Bij onbekend of mogelijk gevaarlijk vuurwerk gaat veiligheid voor. Raak het niet zomaar aan en open het niet om de categorie vast te stellen. Kijk eerst wat je veilig kunt waarnemen en schakel zo nodig de politie in. Kan het veilig? Dan leg je daarna vast wat je ziet, bijvoorbeeld met foto's.","soort":"Praktijkcasus","artikel":"—","wet":"—","kernregel":"Eerst veilig handelen. Daarna pas verder onderzoeken.","voetnoten":[],"stijl":"v2"},{"vraag":"Wie bepaalt in welke categorie vuurwerk valt?","beeld":{"src":"assets/images/01-q3-verpakkingen.webp","alt":"Enkele vuurwerkverpakkingen bij een tas op een plein. Op één doos staat F2.","w":780,"h":438},"situatie":"Je ziet op een plein verschillende vuurwerkverpakkingen. Op één van de dozen staat «F2». Je wilt weten wie het vuurwerk in deze categorie indeelt.","opties":["De boa die het vuurwerk op straat aantreft.","De fabrikant. Een aangemelde instantie bevestigt die indeling.","De burgemeester van de gemeente.","De politie, nadat het vuurwerk in beslag is genomen."],"juist":1,"uitleg":"De fabrikant deelt het vuurwerk in een categorie in. Een aangemelde instantie (een erkende keuringsinstantie) bevestigt die indeling bij de keuring van het product. De boa bepaalt de categorie dus niet zelf. De boa kijkt onder andere naar de categorie op het etiket. [[1]]","soort":"Kennisvraag","artikel":"Art. 1A.1.3 Vuurwerkbesluit","wet":"Vuurwerkbesluit","kernregel":"De boa leest en controleert wat er op het etiket staat, maar deelt het vuurwerk niet zelf in een categorie in.","voetnoten":["Vuurwerkbesluit, art. 1A.1.3, eerste en tweede lid."],"stijl":"v2"},{"vraag":"Een jongen laat een doos zien met «Geschikt voor particulier gebruik». Wat kun je uit dat opschrift afleiden?","opties":["Dat hij het vuurwerk altijd mag bezitten.","Dat het vuurwerk tot categorie F1 behoort.","Dat het vuurwerk tot categorie F4 behoort.","Dat het F1 of aangewezen F2 kan zijn. Controleer de categorie en of bezit in deze situatie is toegestaan."],"juist":3,"uitleg":"Dit opschrift staat op consumentenvuurwerk: F1 of aangewezen F2. Het zegt iets over het product. Het zegt niet dat bezit nu mag. Sinds 1 augustus 2026 is bezit en gebruik van F2 verboden voor personen zonder gespecialiseerde kennis. Voor aangewezen F2 kan de burgemeester onder voorwaarden een ontheffing verlenen. [[1]]","soort":"Praktijkcasus","artikel":"—","wet":"—","kernregel":"Een opschrift zegt iets over het product. Of bezit mag, beoordeel je apart.","voetnoten":["Vuurwerkbesluit, art. 1.1.1 en 2.1.3; Wet milieubeheer, art. 9.2.2.1a, eerste en vierde lid."],"stijl":"v2"}]},{"icoon":"wet","id":"m2","kader":"Wet","nr":2,"pages":[{"kind":"theory","titel":"De Wet veilige jaarwisseling","html":"<div class=\"vpp vp-wvj\"><header class=\"vp-kop\"><div class=\"vp-kop-t\"><span class=\"vp-chip\"><span data-i=\"schild\"></span>Wet</span><h2 class=\"vp-t\">De Wet veilige jaarwisseling</h2></div></header><div class=\"wvj-body\"><div class=\"wvj-links\"><section class=\"wvj-rij\"><span class=\"wvj-nr\">1</span><span class=\"wvj-ic\" data-i=\"kalender\"></span><div><h3>Sinds 1 augustus 2026</h3><p>De Wet veilige jaarwisseling geldt sinds 1 augustus 2026.</p></div></section><section class=\"wvj-rij\"><span class=\"wvj-nr\">2</span><span class=\"wvj-ic\" data-i=\"document\"></span><div><h3>Wat veranderde er?</h3><p>De wet voegde artikel 9.2.2.1a toe aan de Wet milieubeheer (Wm) en wijzigde de Wet op de economische delicten (WED). Het Besluit veilige jaarwisseling wijzigde vervolgens het Vuurwerkbesluit.</p></div></section><section class=\"wvj-rij\"><span class=\"wvj-nr\">3</span><span class=\"wvj-ic\" data-i=\"mensen\"></span><div><h3>Wat betekent dit voor de praktijk?</h3><p>Wie geen gespecialiseerde kennis heeft, mag geen F2- en F3-vuurwerk bezitten of gebruiken.</p></div></section><div class=\"wvj-onthoud\"><div class=\"wvj-o-kop\"><span class=\"vp-o-ic\" data-i=\"lamp\"></span><b>Onthoud</b></div><div class=\"wvj-o-r\"><div class=\"wvj-tag wvj-ok\"><span class=\"wvj-t-ic\" data-i=\"knal\"></span><b>F1<br>toegestaan</b><span class=\"wvj-t-st\" data-i=\"vink\"></span></div><div class=\"wvj-tag wvj-nee\"><span class=\"wvj-t-ic\" data-i=\"vuurwerk\"></span><b>F2 en F3<br>verboden</b><span class=\"wvj-t-st\" data-i=\"kruis\"></span></div><p class=\"wvj-let\"><span class=\"wvj-l-ic\" aria-hidden=\"true\">!</span><span>Voor <b>F2</b> kan de burgemeester een ontheffing verlenen aan een vereniging of stichting.</span></p></div></div></div><figure class=\"vp-foto wvj-foto\"><img src=\"assets/images/02-01-wet-veilige-jaarwisseling.webp?v=vw261001b\" alt=\"Een boa in handhavingsuniform, van achteren gezien, staat tijdens de jaarwisseling op een druk plein met vuurwerk in de lucht.\" width=\"780\" height=\"625\" loading=\"eager\" decoding=\"async\"></figure></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://zoek.officielebekendmakingen.nl/stb-2026-7.html\" target=\"_blank\" rel=\"noopener\">Wet veilige jaarwisseling</a> <span class=\"bb-toel\">Wet van 16 december 2025, Stb. 2026, 7 (wet)</span></li><li><a href=\"https://zoek.officielebekendmakingen.nl/stb-2026-169.html\" target=\"_blank\" rel=\"noopener\">Besluit inwerkingtreding Wet veilige jaarwisseling</a> <span class=\"bb-toel\">Besluit van 25 juni 2026, Stb. 2026, 169: in werking met ingang van 1 augustus 2026</span></li><li><a href=\"https://zoek.officielebekendmakingen.nl/stb-2026-168.html\" target=\"_blank\" rel=\"noopener\">Besluit veilige jaarwisseling</a> <span class=\"bb-toel\">Stb. 2026, 168 (AMvB tot wijziging van het Vuurwerkbesluit, met nota van toelichting)</span></li><li><a href=\"https://wetten.overheid.nl/BWBR0003245/2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet milieubeheer</a> <span class=\"bb-toel\">art. 9.2.2.1a</span></li></ol></div>"},{"kind":"kader","titel":"Artikel 9.2.2.1a Wm: bezit, gebruik en verkoop","html":"<h2 class=\"ptitle\">Artikel 9.2.2.1a Wm: bezit, gebruik en verkoop</h2><div class=\"kaart k-kader law-card\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><span class=\"kaart-lab\">Wet</span></div><div class=\"kaart-t\">Artikel 9.2.2.1a · Wet milieubeheer</div><div class=\"kaart-b\"><p class=\"law-intro\">Dit is het belangrijkste artikel van de cursus.</p><div class=\"law-quote\"><div class=\"law-quote-head\"><span class=\"law-quote-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/></svg></span><span>Wettekst</span></div><p class=\"wet law-text\">«1 Het bezit en het gebruik van vuurwerk van de categorieën F2 en F3 is verboden voor anderen dan personen met gespecialiseerde kennis.<br>2 De verkoop van vuurwerk van de categorieën F2 en F3 aan anderen dan personen met gespecialiseerde kennis is verboden.<br>3 Bij algemene maatregel van bestuur worden personen met gespecialiseerde kennis aangewezen.» <em>(lid 1 tot en met 3)</em></p></div><div class=\"law-grid\"><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><span>In gewone taal</span></div><div class=\"law-rows\"><div class=\"lr lr-f2\"><span class=\"lr-lab\">F2</span><div class=\"lr-t\"><p>Bezit en gebruik zijn verboden voor anderen dan personen met gespecialiseerde kennis.</p><p>Voor aangewezen F2-vuurwerk kan de burgemeester onder voorwaarden een ontheffing verlenen.</p><p class=\"lr-nadruk\">Met die ontheffing kan het aangewezen F2-vuurwerk onder de wettelijke voorwaarden ook worden gekocht.</p></div></div><div class=\"lr lr-f3\"><span class=\"lr-lab\">F3</span><div class=\"lr-t\"><p>Bezit en gebruik zijn verboden voor anderen dan personen met gespecialiseerde kennis.</p><p class=\"lr-nadruk\">De ontheffing van de burgemeester geldt niet voor F3.</p></div></div><div class=\"lr lr-vk\"><span class=\"lr-lab\">Verkoop</span><div class=\"lr-t\"><p>De verkoop van F2 en F3 aan anderen dan personen met gespecialiseerde kennis is verboden.</p><p class=\"lr-nadruk\">Voor aangewezen F2 geldt een uitzondering voor de ontheffinghouder.</p></div></div><div class=\"lr lr-f14\"><span class=\"lr-lab\">F1 en F4</span><div class=\"lr-t\"><p>F1 en F4 staan niet in dit artikel.</p></div></div></div></section><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><span>Wat betekent dit voor jou als boa?</span></div><p><b>Bezit</b>: je hebt het vuurwerk bij je of onder je beheer, bijvoorbeeld in je hand, tas of auto. <b>Gebruik</b>: vooral afsteken. De wetgever noemt het zelf een verbod op het «voorhanden hebben en afsteken van vuurwerk door consumenten».</p></section></div></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0003245/2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet milieubeheer</a> <span class=\"bb-toel\">art. 9.2.2.1a</span><ul class=\"bb-leden\"><li><b>lid 1</b> – verbod op bezit en gebruik van F2 en F3</li><li><b>lid 2</b> – verbod op verkoop van F2 en F3</li><li><b>lid 3</b> – personen met gespecialiseerde kennis</li><li><b>lid 4 en 5</b> – ontheffing burgemeester voor aangewezen F2</li><li><b>lid 6</b> – uitzondering op het verkoopverbod voor de ontheffinghouder</li></ul></li><li><a href=\"https://zoek.officielebekendmakingen.nl/stb-2026-7.html\" target=\"_blank\" rel=\"noopener\">Wet veilige jaarwisseling</a> <span class=\"bb-toel\">Wet van 16 december 2025, Stb. 2026, 7 (wet; de aangehaalde woorden staan in de aanhef)</span></li></ol></div>"},{"kind":"kader","titel":"Personen met gespecialiseerde kennis","html":"<div class=\"pgp\"><header class=\"pg-top\"><div class=\"pg-kop\"><div class=\"pg-titelrij\"><h2 class=\"pg-t\">Personen met gespecialiseerde kennis</h2><span class=\"pg-chip\"><span data-i=\"wet\"></span>Wet</span><span class=\"pg-art\">Artikel 1.1.2a · Vuurwerkbesluit</span></div><p class=\"pg-intro\">Het verbod voor F2 en F3 geldt niet voor personen met gespecialiseerde kennis. Het Vuurwerkbesluit bepaalt wie dat zijn.</p></div><div class=\"pg-boek\"></div></header><div class=\"pg-body\"><div class=\"pg-links\"><section class=\"pg-wie\" aria-labelledby=\"pg-wie-t\"><div class=\"pg-wie-h\"><span class=\"pg-wie-ic\" data-i=\"mensen\"></span><h3 id=\"pg-wie-t\">Wie zijn dit?</h3><span class=\"pg-badge\">Art. 1.1.2a Vuurwerkbesluit</span></div><div class=\"pg-rij\"><span class=\"pg-ic\" data-i=\"akte\"></span><div><h4>Met vergunning</h4><ul><li>Personen met de vereiste vergunning voor professioneel vuurwerk.</li><li>Houders van de in het Vuurwerkbesluit genoemde vergunning.</li></ul></div></div><div class=\"pg-rij\"><span class=\"pg-ic\" data-i=\"schild\"></span><div><h4>Vanuit hun functie</h4><ul class=\"pg-functie\"><li><b>Politie</b> – tijdens het werk</li><li><b>Brandweer</b> – tijdens het werk</li><li><b>Krijgsmacht</b> – tijdens het werk</li><li>Personen die voor hun werk vuurwerk of pyrotechnische artikelen tot ontbranding brengen voor onderzoek.</li></ul></div></div><div class=\"pg-rij\"><span class=\"pg-ic\" data-i=\"wereld\"></span><div><h4>Ook aangewezen in een ander EU-land?</h4><p>Is iemand in een ander EU-land als persoon met gespecialiseerde kennis aangewezen? Dan kan die aanwijzing ook meetellen. <span class=\"pg-ref\">art. 1.1.2a lid 2 Vuurwerkbesluit</span></p></div></div></section><section class=\"pg-onth\" aria-labelledby=\"pg-onth-t\"><div class=\"pg-onth-h\"><span class=\"pg-ic\" data-i=\"document\"></span><div><span class=\"pg-apart\">Aparte uitzondering</span><h3 id=\"pg-onth-t\">Ontheffing van de burgemeester – alleen F2</h3></div></div><ul><li>Voor aangewezen F2-vuurwerk kan de burgemeester onder voorwaarden een ontheffing verlenen.</li><li>Met deze ontheffing kan het aangewezen F2-vuurwerk onder de wettelijke voorwaarden worden gekocht, bezeten en gebruikt.</li></ul><p class=\"pg-ref\">art. 9.2.2.1a lid 4, 5 en 6 Wet milieubeheer</p></section></div><div class=\"pg-rechts\"><section class=\"pg-boa\" aria-labelledby=\"pg-boa-t\"><div class=\"pg-boa-h\"><span class=\"pg-ic\" data-i=\"boa\"></span><h3 id=\"pg-boa-t\">Wat betekent dit voor jou als boa?</h3></div><p>Zegt iemand dat hij een professional is, een ontheffing heeft of vanuit zijn functie onder een uitzondering valt?</p><p class=\"pg-nadruk\">Ga daar niet alleen van uit.</p><div class=\"pg-check\"><span class=\"pg-check-l\">Controleer:</span><ol><li>Waarom valt deze persoon onder de uitzondering?</li><li>Welke vergunning, ontheffing of functie hoort daarbij?</li><li>Leg vast wat je hebt gecontroleerd.</li></ol></div></section><section class=\"pg-onthoud\" aria-label=\"Onthoud\"><span class=\"pg-ic\" data-i=\"lamp\"></span><div><h3>Onthoud</h3><p>Veel kennis van vuurwerk maakt iemand nog <strong>niet automatisch</strong> een persoon met gespecialiseerde kennis.</p><p class=\"pg-klein\">Een burgemeestersontheffing voor aangewezen F2 is een aparte uitzondering.</p></div></section></div></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0013360/2026-08-01\" target=\"_blank\" rel=\"noopener\">Vuurwerkbesluit</a> <span class=\"bb-toel\">art. 1.1.2a</span><ul class=\"bb-leden\"><li><b>lid 1 en 2</b> – aanwijzing personen met gespecialiseerde kennis</li></ul></li><li><a href=\"https://wetten.overheid.nl/BWBR0003245/2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet milieubeheer</a> <span class=\"bb-toel\">art. 9.2.2.1a</span><ul class=\"bb-leden\"><li><b>lid 1</b> – hoofdregel bezit en gebruik F2 en F3</li><li><b>lid 4 en 5</b> – ontheffing burgemeester voor aangewezen F2</li><li><b>lid 6</b> – uitzondering op het verkoopverbod voor de ontheffinghouder</li></ul></li></ol></div>"},{"kind":"lijst","titel":"De ontheffing van de burgemeester","html":"<div class=\"ohp\"><header class=\"oh-top\"><div class=\"oh-titelrij\"><h2 class=\"oh-t\">De ontheffing van de burgemeester</h2><span class=\"oh-chip\"><span data-i=\"wet\"></span>Wet</span><span class=\"oh-art\">Artikel 9.2.2.1a lid 4 · Wet milieubeheer</span></div><p class=\"oh-intro\">De burgemeester kan onder voorwaarden een ontheffing verlenen voor het afsteken van aangewezen F2-vuurwerk tijdens de jaarwisseling. Wordt er afgestoken met een ontheffing? Controleer dan:</p></header><div class=\"oh-body\"><div class=\"oh-kaarten\"><article class=\"oh-k\"><div class=\"oh-k-h\"><span class=\"oh-ic\" data-i=\"akte\"></span><span class=\"oh-n\">1</span><h3>Is er een ontheffing?</h3></div><div class=\"oh-k-b\"><img src=\"assets/images/02-04-01.webp?v=vw260926c\" alt=\"Close-up van een document met de tekst Ontheffing burgemeester\" loading=\"eager\" decoding=\"async\"><div class=\"oh-k-t\"><p>Een afschrift van de ontheffing moet op het afsteekterrein aanwezig zijn.</p><p class=\"oh-ref\">(art. 2.3.2a lid 1 onder e Vb)</p></div></div></article><article class=\"oh-k\"><div class=\"oh-k-h\"><span class=\"oh-ic\" data-i=\"mensen\"></span><span class=\"oh-n\">2</span><h3>Voor wie?</h3></div><div class=\"oh-k-b\"><img src=\"assets/images/02-04-02.webp?v=vw260926c\" alt=\"De burgemeester overhandigt de ontheffing aan een vertegenwoordiger van een vereniging in gewone kleding\" loading=\"eager\" decoding=\"async\"><div class=\"oh-k-t\"><p>De ontheffing wordt afgegeven aan een vereniging of stichting met lokale binding.</p><p class=\"oh-ref\">(art. 2.3.2 onder a Vb)</p></div></div></article><article class=\"oh-k\"><div class=\"oh-k-h\"><span class=\"oh-ic\" data-i=\"locatie\"></span><span class=\"oh-n\">3</span><h3>Welke plek?</h3></div><div class=\"oh-k-b\"><img src=\"assets/images/02-04-03.webp?v=vw260926c\" alt=\"Een afgebakend afsteekterrein met hekken\" loading=\"eager\" decoding=\"async\"><div class=\"oh-k-t\"><p>Het afsteekterrein uit de ontheffing.</p></div></div></article><article class=\"oh-k\"><div class=\"oh-k-h\"><span class=\"oh-ic\" data-i=\"klok\"></span><span class=\"oh-n\">4</span><h3>Welke tijd?</h3></div><div class=\"oh-k-b\"><img src=\"assets/images/02-04-04.webp?v=vw260926c\" alt=\"Vuurwerk en een klok\" loading=\"eager\" decoding=\"async\"><div class=\"oh-k-t\"><p>Afsteken mag alleen van 31 december 18.00 uur tot 1 januari 02.00 uur.</p><p class=\"oh-ref\">(art. 2.3.2a lid 3 onder a Vb)</p></div></div></article><article class=\"oh-k\"><div class=\"oh-k-h\"><span class=\"oh-ic\" data-i=\"vuurwerk\"></span><span class=\"oh-n\">5</span><h3>Welk vuurwerk?</h3></div><div class=\"oh-k-b\"><img src=\"assets/images/02-04-05.webp?v=vw260926c\" alt=\"Dozen vuurwerk met de aanduiding F2\" loading=\"eager\" decoding=\"async\"><div class=\"oh-k-t\"><p>Alleen aangewezen F2-vuurwerk, maximaal 200 kg verpakt.</p><p class=\"oh-ref\">(art. 2.3.2 onder d Vb)</p><p>Voor F3 bestaat geen ontheffing.</p></div></div></article><article class=\"oh-k\"><div class=\"oh-k-h\"><span class=\"oh-ic\" data-i=\"lijst\"></span><span class=\"oh-n\">6</span><h3>Klopt iets niet?</h3></div><div class=\"oh-k-b\"><img src=\"assets/images/02-04-06.webp?v=vw260926c\" alt=\"Een boa legt iets vast op een klembord\" loading=\"eager\" decoding=\"async\"><div class=\"oh-k-t\"><p>Leg vast wat je ziet en overleg.</p><p>Bij een ontheffing gelden specifieke voorschriften.</p><p>Behandel dit niet als algemene regel.</p></div></div></article></div><div class=\"oh-rechts\"><figure class=\"oh-foto\"><img src=\"assets/images/02-04-praktijk.webp?v=vw260926c\" alt=\"Twee boa's in handhavingsuniform controleren de ontheffing die een vertegenwoordiger van een vereniging in gewone kleding laat zien. Op de achtergrond een afgezet terrein en vuurwerk.\" loading=\"eager\" decoding=\"async\"></figure><section class=\"oh-boa\"><div class=\"oh-boa-h\"><span class=\"oh-ic\" data-i=\"schild\"></span><h3>Wat betekent dit voor jou als boa?</h3></div><p>Zegt iemand dat hij een ontheffing heeft of namens een vereniging afsteekt?</p><p class=\"oh-nadruk\">Ga daar niet alleen van uit.</p><div class=\"oh-check\"><span class=\"oh-check-l\">Controleer:</span><ol><li>Is er een geldige ontheffing?</li><li>Klopt de vereniging of stichting met lokale binding?</li><li>Wordt er afgestoken op de juiste plek, tijd en met aangewezen F2-vuurwerk?</li><li>Leg vast wat je hebt gecontroleerd.</li></ol></div></section><section class=\"oh-onthoud\" aria-label=\"Onthoud\"><span class=\"oh-ic\" data-i=\"lamp\"></span><div><h3>Onthoud</h3><p>Een ontheffing van de burgemeester geldt alleen voor aangewezen F2-vuurwerk. Voor F3 bestaat geen ontheffing.</p><p class=\"oh-nadruk\">De ontheffing wordt afgegeven aan een vereniging of stichting met lokale binding, niet aan een boa.</p></div></section></div></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0003245/2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet milieubeheer</a> <span class=\"bb-toel\">art. 9.2.2.1a lid 4</span></li><li><a href=\"https://wetten.overheid.nl/BWBR0013360/2026-08-01\" target=\"_blank\" rel=\"noopener\">Vuurwerkbesluit</a> <span class=\"bb-toel\">art. 2.3.2 en 2.3.2a</span></li></ol></div>"},{"kind":"kader","titel":"Economisch delict: overtreding of misdrijf?","html":"<div class=\"edp\"><header class=\"ed-top\"><span class=\"ed-chip\"><span data-i=\"wet\"></span>Wet · Economisch delict</span><h2 class=\"ed-t\">Economisch delict: overtreding of misdrijf?</h2></header><div class=\"ed-body\"><figure class=\"ed-foto\"><img src=\"assets/images/02-05-auto-f3.webp?v=vw260926g\" alt=\"Twee boa's in handhavingsuniform bij de open kofferbak van een auto met dozen F3-vuurwerk.\" loading=\"eager\" decoding=\"async\"></figure><div class=\"ed-rechts\"><section class=\"ed-wet\"><span class=\"ed-ic\" data-i=\"boek\"></span><div><h3>Wat zegt de wet?</h3><p>Het verboden bezit of gebruik van F2 en F3 is een economisch delict.</p><ul><li>Het verbod staat in <b>artikel 9.2.2.1a Wet milieubeheer</b>.</li><li>Het is een economisch delict door <b>artikel 1a Wet op de economische delict

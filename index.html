<script>window.__DATA__={"aantalOnderwerpen":6,"drempel":70,"eindtoets":[{"casus":false,"juist":1,"opties":["Ben ik bevoegd? – Wat tref ik aan? – Wat doe ik nu? – Is dit strafbaar?","Wat tref ik aan? – Is dit strafbaar? – Ben ik bevoegd? – Wat doe ik nu?","Wat doe ik nu? – Ben ik bevoegd? – Is dit strafbaar? – Wat tref ik aan?","Is dit strafbaar? – Wat tref ik aan? – Wat doe ik nu? – Ben ik bevoegd?"],"thema":"Vier vragen","uitleg":"Juist is B. Je begint bij wat je aantreft. Daarna volgen strafbaarheid, bevoegdheid en wat je nu doet.","vraag":"Wat is de juiste volgorde van de vier vragen?"},{"casus":true,"juist":2,"opties":["Als bewijs. Je hoeft niets meer te controleren.","Niet. Een etiket is nooit betrouwbaar.","Als informatie. Je legt letterlijk vast wat er staat.","Alleen als de eigenaar bevestigt dat het klopt."],"thema":"Soorten vuurwerk","uitleg":"Juist is C. Wat op de verpakking staat, is informatie. Het is nog geen vaststelling.","vraag":"Je vindt een verpakking met op het etiket «F3». Hoe gebruik je die informatie?"},{"casus":false,"juist":0,"opties":["F4, F3 en F2 dat niet is aangewezen voor particulier gebruik.","Alleen vuurwerk van categorie F4.","Al het vuurwerk dat harder knalt dan F1.","Vuurwerk dat door een vereniging wordt afgestoken."],"thema":"Soorten vuurwerk","uitleg":"Juist is A. Professioneel vuurwerk is vuurwerk ingedeeld in F4 of F3, en F2 dat niet is aangewezen als vuurwerk voor particulier gebruik (artikel 1.1.1 Vuurwerkbesluit).","vraag":"Wat is volgens het Vuurwerkbesluit «professioneel vuurwerk»?"},{"casus":false,"juist":3,"opties":["Omdat onbekend vuurwerk altijd legaal is.","Omdat alleen de politie dit woord mag gebruiken.","Omdat onbekend vuurwerk altijd F4 is.","Omdat het geen wettelijke vuurwerkcategorie is."],"thema":"Soorten vuurwerk","uitleg":"Juist is D. Met «onbekend vuurwerk» bedoelen we vuurwerk waarvan de categorie nog niet betrouwbaar is vastgesteld. Dit is geen wettelijke categorie.","vraag":"Waarom is «onbekend vuurwerk» in deze e-learning geen juridische conclusie?"},{"casus":false,"juist":1,"opties":["Het bezit en gebruik van F1 en F2 voor iedereen.","Het bezit en gebruik van F2 en F3 voor anderen dan personen met gespecialiseerde kennis.","Alleen de verkoop van F4-vuurwerk.","Het afsteken van vuurwerk na 02.00 uur."],"thema":"De wet","uitleg":"Juist is B. Lid 1: «Het bezit en het gebruik van vuurwerk van de categorieën F2 en F3 is verboden voor anderen dan personen met gespecialiseerde kennis.»","vraag":"Wat verbiedt artikel 9.2.2.1a, eerste lid, Wet milieubeheer?"},{"casus":true,"juist":2,"opties":["Niets, op oudejaarsavond is alles toegestaan.","Of het vuurwerk in een auto is vervoerd.","Of er een ontheffing van de burgemeester is.","Of de stichting een APV-vergunning heeft."],"thema":"De wet","uitleg":"Juist is C. De burgemeester kan ontheffing verlenen voor aangewezen F2-vuurwerk tijdens de jaarwisseling (artikel 9.2.2.1a, vierde lid, Wm).","vraag":"Op 31 december om 19.00 uur steekt een stichting op een afgezet terrein F2-vuurwerk af. Wat controleer je?"},{"casus":true,"juist":0,"opties":["Er is geen heterdaad meer; aanhouden kan alleen onder de voorwaarden van art. 54 Sv.","Je mag hem net als op heterdaad zelf aanhouden.","Je mag hem vasthouden totdat de politie er is.","Je mag niets meer doen, ook niet staande houden."],"thema":"Aanhouden","uitleg":"Juist is A. Heterdaad is er alleen terwijl het feit wordt begaan of terstond daarna (art. 128 Sv). Daarna geldt art. 54 Sv: misdrijf waarvoor voorlopige hechtenis is toegelaten, in beginsel op bevel van de (hulp)officier van justitie. Staande houden (art. 52 Sv) blijft mogelijk bij een verdachte.","vraag":"Je ziet een man vuurwerk afsteken. Op de verpakking staat «F2». Hij loopt weg. Een uur later zie je hem terug. Wat geldt nu?"},{"casus":true,"juist":3,"opties":["Je bent bevoegd, want vuurwerk staat in je domeinlijst.","Je bent bevoegd, als het na 1 augustus 2026 is.","Je neemt het zelf mee naar het bureau.","Onderdeel 9 dekt dit niet; je schakelt de politie in."],"thema":"Bevoegdheid","uitleg":"Juist is D. Domein I, onderdeel 9 noemt alleen art. 9.2.2.1a Wm (F2 en F3). F4 valt onder het Vuurwerkbesluit. Daarvoor ben je op grond van onderdeel 9 niet opsporingsbevoegd.","vraag":"Bij een controle zie je een doos met op het etiket «F4». Je bent domein I-boa. Wat is juist?"},{"casus":true,"juist":1,"opties":["Ja, de domeinlijst geeft een onbeperkte bevoegdheid.","Nee, het geldt voor zover nodig voor je functie en taakomschrijving.","Ja, maar alleen tijdens de jaarwisseling.","Nee, de domeinlijst geldt alleen voor de politie."],"thema":"Bevoegdheid","uitleg":"Juist is B. Domein I geldt voor zover noodzakelijk voor een goede uitoefening van de functie en de daaraan gekoppelde taakomschrijving. Per bevoegdheid gelden daarnaast eigen voorwaarden.","vraag":"Een collega zegt: «Omdat het in de domeinlijst staat, mag ik als boa in elke situatie alles.» Klopt dat?"},{"casus":true,"juist":2,"opties":["Artikel 23 WED.","Artikel 26 WED.","Artikel 52 Sv.","Artikel 94 Sv."],"thema":"Bevoegdheden","uitleg":"Juist is C. Artikel 52 Sv: iedere opsporingsambtenaar is bevoegd de identiteit van de verdachte vast te stellen en hem daartoe staande te houden.","vraag":"Je wilt een verdachte van vuurwerkbezit laten stoppen om zijn identiteit vast te stellen. Welke grondslag?"},{"casus":true,"juist":3,"opties":["Artikel 24 WED.","Artikel 26 WED.","Artikel 18 WED.","Artikel 24a WED."],"thema":"Bevoegdheden","uitleg":"Juist is D. Medewerking vorderen is gebaseerd op artikel 24a WED. Artikel 24 WED gaat over regels voor stilhouden en versperringen.","vraag":"Je wilt dat de bestuurder van een auto meewerkt aan het onderzoek van de lading. Op welk artikel baseer je die vordering?"},{"casus":true,"juist":0,"opties":["Artikel 18 WED.","Artikel 26 WED.","Artikel 23 WED.","Artikel 24a WED."],"thema":"Inbeslagneming","uitleg":"Juist is A. Artikel 18, eerste lid, WED: bevoegdheid tot inbeslagneming van daarvoor vatbare voorwerpen; «Zij kunnen daartoe hun uitlevering vorderen.»","vraag":"Welk artikel geeft de bevoegdheid tot inbeslagneming én de mogelijkheid om daartoe uitlevering te vorderen?"},{"casus":true,"juist":1,"opties":["Jij treedt als boa zelf op, want je bent bevoegd.","De politie is verantwoordelijk; jij meldt, houdt afstand en legt vast.","Je vraagt omstanders om de groep te stoppen.","Je wacht af tot de groep uit zichzelf stopt."],"thema":"Taakverdeling","uitleg":"Juist is B. Het bestrijden van verstoring van de openbare orde is wettelijk opgedragen aan de politie (Beleidsregels boa). Het Handhavingsplan: bij openbare orde tijdens de jaarwisseling hebben boa’s geen rol.","vraag":"Op oudejaarsavond loopt een groep met zwaar vuurwerk uit de hand op een plein. Wat past bij wet en beleid?"},{"casus":true,"juist":2,"opties":["Je maakt het open om de categorie vast te stellen.","Je neemt het mee in je dienstauto.","Je houdt afstand en schakelt de politie in.","Je vraagt een omstander het weg te leggen."],"thema":"Veiligheid","uitleg":"Juist is C. Bevoegd zijn betekent niet automatisch dat het veilig is om zelf te handelen. Bij onbekend of mogelijk zwaar vuurwerk ga je niet zelf verder.","vraag":"Je bent bevoegd, maar het vuurwerk is groot, zonder etiket en met tape omwikkeld. Wat doe je?"},{"casus":false,"juist":3,"opties":["«Verdachte had illegaal vuurwerk bij zich.»","«Het was duidelijk zwaar vuurwerk.»","«Ik vermoedde dat het F4 was, dus heb ik het afgepakt.»","«Op de verpakking las ik de categorieaanduiding F2.»"],"thema":"Proces-verbaal","uitleg":"Juist is D. Je beschrijft feitelijk wat je zag en las. Conclusies zonder onderbouwing horen niet in het proces-verbaal.","vraag":"Welke zin hoort in een goed proces-verbaal?"}],"eindtoetsDrempel":80,"kaderLabel":"Vuurwerk","opleiding":"Vuurwerk","peildatum":"20 september 2026","subtitel":"VUURWERK — E-LEARNING VOOR BOA'S","topics":[{"icoon":"megafoon","id":"m1","kader":"Opleiding","nr":1,"pages":[{"kind":"lo","titel":"Leerdoelen","html":"<h2 class=\"ptitle\">Leerdoelen<\/h2><p class=\"pintro\">Wat je na de hele opleiding kunt.<\/p><ul class=\"lo\"><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je waarom vuurwerk belangrijk is voor jouw werk als boa;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>ken je de hoofdlijn van de Wet veilige jaarwisseling;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je dat een categorie nog geen juridische conclusie is;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>maak je onderscheid tussen wet, bevoegdheid, domein, beleid en veiligheid;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>ken je de vier vragen die je bij elke vuurwerksituatie stelt.<\/span><\/li><\/ul>"},{"kind":"casus","titel":"Een harde knal op het plein","html":"<span class=\"q-soort\">Voorbeeld<\/span><h2 class=\"ptitle\">Een harde knal op het plein<\/h2><p class=\"lees\">Je loopt surveillance. Het is begin van de avond. Opeens hoor je een harde knal.<\/p><p class=\"lees\">Op een plein staan een paar jongeren bij elkaar. Eén jongere heeft vuurwerk in zijn hand. Naast de groep staat een tas. Daarin zit vuurwerk van verschillende soorten.<\/p><p class=\"lees\">Wat doe je nu? Deze situatie komt in de opleiding vaker terug.<\/p>"},{"kind":"casus","titel":"Een harde knal op het plein — wat gaat er door je heen?","html":"<span class=\"q-soort\">Voorbeeld<\/span><h2 class=\"ptitle\">Een harde knal op het plein — wat gaat er door je heen?<\/h2><div class=\"kaart k-voorbeeld\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3v18M7 21h10\"/><path d=\"M12 6 5 8m7-2 7 2\"/><path d=\"M5 8 2.5 13a3 3 0 0 0 5 0L5 8Zm14 0-2.5 5a3 3 0 0 0 5 0L19 8Z\"/><\/svg><\/span><span class=\"kaart-lab\">Voorbeeld<\/span><\/div><div class=\"kaart-t\">Eerst denken, dan doen<\/div><div class=\"kaart-b\"><p>Misschien denk je meteen: dit is verboden. Maar weet je dat al zeker? Je hebt alleen een knal gehoord en vuurwerk gezien.<\/p><p>Je hebt nog veel vragen. Wat voor vuurwerk is het? Is het strafbaar? Mag jij hier als boa iets aan doen? En is het veilig om dichterbij te komen?<\/p><p>In deze opleiding leer je die vragen stap voor stap te beantwoorden.<\/p><\/div><\/div>"},{"kind":"theory","titel":"Waarom vuurwerk bij jouw werk hoort","html":"<h2 class=\"ptitle\">Waarom vuurwerk bij jouw werk hoort<\/h2><div class=\"main\"><p><b>Nieuwe regels sinds 1 augustus 2026<\/b><br>Sinds 1 augustus 2026 geldt de Wet veilige jaarwisseling. Het bezit en gebruik van F2- en F3-vuurwerk is verboden voor personen zonder gespecialiseerde kennis. Voor aangewezen F2-vuurwerk kan onder voorwaarden een ontheffing worden verleend.<\/p><p><b>Boa domein I mag optreden sinds 8 september 2026<\/b><br>Artikel 9.2.2.1a Wet milieubeheer staat sinds 8 september 2026 in de domeinlijst van domein I. Daardoor kan de boa domein I binnen zijn taak optreden tegen strafbare feiten op grond van dit artikel.<\/p><p><b>Eerst onderzoek doen<\/b><br>Hoor je een knal of tref je vuurwerk aan? Stel dan eerst onderzoek in. Beoordeel de feiten en omstandigheden, welk vuurwerk het kan zijn, welk strafbaar feit mogelijk is gepleegd en of jij bevoegd bent om verder op te treden.<\/p><\/div><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-b\"><p>De categorie van het vuurwerk hoeft bij de eerste waarneming nog niet vast te staan. Dat kan onderdeel zijn van je onderzoek.<\/p><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0003245/2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet veilige jaarwisseling — artikel 9.2.2.1a Wet milieubeheer<\/a> — in werking 1 augustus 2026<br><\/li><li><a href=\"https://zoek.officielebekendmakingen.nl/stb-2026-168.html\" target=\"_blank\" rel=\"noopener\">Besluit veilige jaarwisseling<\/a> — Stb. 2026, 168<br><\/li><li><a href=\"https://zoek.officielebekendmakingen.nl/stcrt-2026-31362.html\" target=\"_blank\" rel=\"noopener\">Regeling domeinlijsten buitengewoon opsporingsambtenaar<\/a> — Domein I, geldend vanaf 8 september 2026 (Stcrt. 2026, 31362)<br><\/li><\/ol><\/div>"},{"kind":"theory","titel":"Categorie is nog geen conclusie","html":"<span class=\"q-soort\">Wet<\/span><h2 class=\"ptitle\">Categorie is nog geen conclusie<\/h2><div class=\"main\"><p>De categorie zegt veel, maar niet alles. Een simpele regel als «F1 mag, F2 en F3 niet» is te grof.<\/p><ul class=\"opsom\"><li><b>F1<\/b> valt niet onder het verbod van artikel 9.2.2.1a, eerste lid, Wm. Voor F1 kunnen wel andere regels gelden, zoals een minimumleeftijd bij verkoop.<\/li><li><b>F2 en F3<\/b>: bezit en gebruik zijn verboden voor anderen dan personen met gespecialiseerde kennis. Er bestaat een ontheffing voor aangewezen F2-vuurwerk tijdens de jaarwisseling.<\/li><li><b>F4<\/b>: hiervoor gelden de regels van het Vuurwerkbesluit, niet artikel 9.2.2.1a Wm.<\/li><li><b>Onbekend<\/b>: In deze e-learning noemen we vuurwerk waarvan je de soort of categorie nog niet betrouwbaar hebt vastgesteld ‘onbekend vuurwerk’. Dit is geen wettelijke vuurwerkcategorie.<\/li><\/ul><p>Je kijkt dus steeds naar: het product, de categorie, voor wie het is, wat ermee gebeurt, welke regel geldt, of er een uitzondering is en of jij bevoegd bent.<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wet milieubeheer, art. 9.2.2.1a, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0003245/2026-08-01 (ingevoerd bij de Wet veilige jaarwisseling, Stb. 2026, 7).<\/li><li>Vuurwerkbesluit, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0013360/2026-08-01<\/li><\/ol><\/div>"},{"kind":"theory","titel":"De vier vragen","html":"<h2 class=\"ptitle\">De vier vragen<\/h2><div class=\"main\"><p>Bij elke situatie met vuurwerk stel je dezelfde vier vragen. Ze helpen je om rustig en in de goede volgorde te denken.<\/p><p>«Wat tref ik aan?» Welk soort vuurwerk is dit? «Is dit strafbaar?» Welke wettelijke bepaling is van toepassing? «Ben ik bevoegd?» Mag ik als boa voor dit feit optreden? «Wat doe ik nu?» Zelf optreden, nader onderzoeken, veiligstellen, overleggen of politie inschakelen?<\/p><p>Deze vier vragen komen in elk onderwerp terug. Na de opleiding stel je ze automatisch.<\/p><\/div>"},{"kind":"theory","titel":"Vijf soorten vragen, niet door elkaar","html":"<h2 class=\"ptitle\">Vijf soorten vragen, niet door elkaar<\/h2><div class=\"main\"><p>In deze opleiding zie je steeds een label bovenaan de pagina. Zo weet je over welk soort vraag het gaat.<\/p><ul class=\"opsom\"><li><b>Wet<\/b> — wat is juridisch toegestaan of verboden?<\/li><li><b>Bevoegdheid<\/b> — welke handeling mag een opsporingsambtenaar wettelijk verrichten?<\/li><li><b>Domein<\/b> — voor welke strafbare feiten ben jij als boa opsporingsbevoegd?<\/li><li><b>Beleid<\/b> — hoe verdelen boa en politie het werk in de praktijk?<\/li><li><b>Veiligheid<\/b> — is zelf handelen in deze situatie verantwoord?<\/li><\/ul><p><b>Bevoegd zijn betekent niet automatisch dat het veilig is om zelf te handelen.<\/b><\/p><\/div>"},{"kind":"figuur","titel":"Opzet van de opleiding","html":"<div class=\"figcap\">Opzet van de opleiding<\/div><figure class=\"illu\"><svg viewBox=\"0 0 560 60\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>Opzet van de opleiding<\/title><desc>De route: introductie, zes inhoudelijke onderwerpen, samenvatting, de eindtoets (ten minste tachtig procent) en het certificaat. De voortgang wordt bewaard, zodat je later kunt verdergaan.<\/desc><\/svg><\/figure>"},{"kind":"onthoud","titel":"Kort samengevat","html":"<h2 class=\"ptitle\">Kort samengevat<\/h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-b\"><ul class=\"punten\"><li>Sinds 1 augustus 2026 is het bezit en gebruik van F2- en F3-vuurwerk verboden voor anderen dan personen met gespecialiseerde kennis.<\/li><li>Categorie is nog geen conclusie. Onbekend vuurwerk is geen wettelijke categorie.<\/li><li>Je stelt steeds vier vragen: wat tref ik aan, is dit strafbaar, ben ik bevoegd en wat doe ik nu?<\/li><\/ul><\/div><\/div>"}],"titel":"Vuurwerk en jouw werk als boa","type":"intro","vragen":[]},{"icoon":"list","id":"m2","kader":"Vuurwerkcategorieën","nr":2,"pages":[{"kind":"lo","titel":"Leerdoelen","html":"<h2 class=\"ptitle\">Leerdoelen<\/h2><p class=\"pintro\">Wat je na dit onderwerp kunt.<\/p><ul class=\"lo\"><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>ken je de wettelijke betekenis van de categorieën F1, F2, F3 en F4;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je wat professioneel vuurwerk en fop- en schertsvuurwerk zijn;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je wie personen met gespecialiseerde kennis zijn;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je waar je op let bij verpakking en etiket;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>maak je onderscheid tussen waarneming, informatie, onderzoek en juridische conclusie.<\/span><\/li><\/ul>"},{"kind":"theory","titel":"Waarom categorieën?","html":"<h2 class=\"ptitle\">Waarom categorieën?<\/h2><div class=\"main\"><p>Vuurwerk is er in veel soorten. Er is licht vuurwerk en zwaar vuurwerk. Daarom is vuurwerk wettelijk ingedeeld in categorieën: F1, F2, F3 en F4.<\/p><p>De categorie zegt iets over het gevaar en het gebruik. En het helpt jou bij de eerste vraag: «Wat tref ik aan?»<\/p><\/div>"},{"kind":"kader","titel":"Wettekst: indeling in categorieën","html":"<h2 class=\"ptitle\">Wettekst: indeling in categorieën<\/h2><div class=\"kaart k-kader law-card\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span class=\"kaart-lab\">Juridisch kader<\/span><\/div><div class=\"kaart-t\">Artikel 1A.1.3 · Vuurwerkbesluit<\/div><div class=\"kaart-b\"><p class=\"law-intro\">Het Vuurwerkbesluit beschrijft wie de categorie bepaalt en welke categorieën er zijn.<\/p><div class=\"law-quote\"><div class=\"law-quote-head\"><span class=\"law-quote-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/><\/svg><\/span><span>Wettekst<\/span><\/div><p class=\"wet law-text\">«1 De fabrikant brengt het vuurwerk of het pyrotechnische artikel voor theatergebruik in een bepaalde categorie onder op grond van toepassing, doel en gevaar, met inbegrip van hun geluidniveau.<br>2 Een aangemelde instantie bevestigt de categorisering als onderdeel van de conformiteitsbeoordelingsprocedure.<br>3 De categorieën luiden als volgt:<br>a. vuurwerk Categorie F1: vuurwerk dat zeer weinig gevaar en een te verwaarlozen geluidsniveau oplevert en bestemd is voor gebruik in een besloten ruimte, inclusief vuurwerk dat bestemd is voor gebruik binnenshuis; Categorie F2: vuurwerk dat weinig gevaar en een laag geluidsniveau oplevert en bestemd is voor gebruik buitenshuis in een afgebakende plaats; Categorie F3: vuurwerk dat middelmatig gevaar oplevert en bestemd is voor gebruik buitenshuis in een grote open ruimte, en waarvan het geluidsniveau niet schadelijk is voor de menselijke gezondheid; Categorie F4: vuurwerk dat veel gevaar oplevert en uitsluitend bestemd is voor gebruik door personen met gespecialiseerde kennis, en waarvan het geluidsniveau niet schadelijk is voor de menselijke gezondheid.»<\/p><\/div><div class=\"law-grid\"><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>In gewone taal<\/span><\/div><p>De fabrikant bepaalt in welke categorie het vuurwerk valt. Een aangemelde instantie controleert en bevestigt dat. F1 is het lichtste vuurwerk. F4 levert veel gevaar op en is alleen voor personen met gespecialiseerde kennis.<\/p><\/section><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>Wat betekent dit voor jou als boa?<\/span><\/div><p>De categorie wordt niet op straat bepaald. Hij staat vast bij de fabrikant. Jij ziet de categorie meestal alleen op de verpakking. Of die aanduiding klopt, weet je daarmee nog niet zeker.<\/p><\/section><\/div><div class=\"law-definition\"><span class=\"law-definition-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><p><strong>Aangemelde instantie<\/strong>: een erkende organisatie die controleert of een product aan de Europese veiligheidseisen voldoet.<\/p><\/div><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0013360/2026-08-01\" target=\"_blank\" rel=\"noopener\">Vuurwerkbesluit, geldend vanaf 1 augustus 2026<\/a><\/li><\/ol><\/div>"},{"kind":"figuur","titel":"Overzicht van de categorieën","html":"<div class=\"figcap\">Overzicht van de categorieën<\/div><figure class=\"illu\"><svg viewBox=\"0 0 560 60\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>Overzicht van de categorieën<\/title><desc>Vier categorieën: F1 zeer weinig gevaar; F2 weinig gevaar; F3 middelmatig gevaar; F4 veel gevaar, alleen voor personen met gespecialiseerde kennis.<\/desc><\/svg><\/figure>"},{"kind":"theory","titel":"Soorten vuurwerk en de categorieën","html":"<h2 class=\"ptitle\">Soorten vuurwerk en de categorieën<\/h2><p class=\"pintro\">De categorie van het vuurwerk bepaalt welke regels gelden. Kijk altijd naar de verpakking. De vorm alleen is niet altijd betrouwbaar.<\/p><aside class=\"cat-info\"><span class=\"cat-info-i\" aria-hidden=\"true\">i<\/span><p>Op de verpakking staat de categorie (F1, F2, F3 of F4). Controleer dit waar mogelijk.<\/p><\/aside><div class=\"cat-grid\"><section class=\"cat cat-f1\" aria-labelledby=\"t-cat-f1\"><header class=\"cat-h\"><span class=\"cat-code\" aria-hidden=\"true\">F1<\/span><div><h3 class=\"cat-t\" id=\"t-cat-f1\">F1 – Zeer licht vuurwerk<\/h3><p class=\"cat-sub\">Zeer weinig gevaar<\/p><\/div><\/header><div class=\"cat-fotos\"><figure class=\"cat-foto\"><img src=\"assets/images/cat-f1-sterretjes.webp?v=vw260921c\" alt=\"Twee brandende sterretjes\" width=\"200\" height=\"300\" loading=\"eager\" decoding=\"async\"><figcaption>Sterretjes<\/figcaption><\/figure><figure class=\"cat-foto\"><img src=\"assets/images/cat-f1-knalerwten.webp?v=vw260921c\" alt=\"Doosje knalerwten met losse knalerwten\" width=\"200\" height=\"300\" loading=\"eager\" decoding=\"async\"><figcaption>Knalerwten<\/figcaption><\/figure><figure class=\"cat-foto\"><img src=\"assets/images/cat-f1-ijsfontein.webp?v=vw260921c\" alt=\"Kleine fontein die vonken spuit\" width=\"200\" height=\"300\" loading=\"eager\" decoding=\"async\"><figcaption>Kleine fontein<\/figcaption><\/figure><\/div><div class=\"cat-blok cat-vb\"><span class=\"cat-bi\" data-i=\"boek\"><\/span><div><h4 class=\"cat-bh\">Voorbeelden<\/h4><p>Sterretjes, knalerwten, trektouwtjes en kleine fonteintjes.<\/p><\/div><\/div><div class=\"cat-blok cat-wm\"><span class=\"cat-bi cat-bi-vink\" data-i=\"vink\"><\/span><div><h4 class=\"cat-bh\">Wat moet je weten?<\/h4><ul class=\"cat-l\"><li>F1 valt niet onder het verbod van artikel 9.2.2.1a, eerste lid, Wet milieubeheer.<\/li><li>Voor F1 kunnen wel andere regels gelden, bijvoorbeeld over verkoop, leeftijd en veilig gebruik.<\/li><li>Controleer altijd de verpakking en de gebruiksvoorschriften.<\/li><\/ul><\/div><\/div><\/section><section class=\"cat cat-f2\" aria-labelledby=\"t-cat-f2\"><header class=\"cat-h\"><span class=\"cat-code\" aria-hidden=\"true\">F2<\/span><div><h3 class=\"cat-t\" id=\"t-cat-f2\">F2 – Vuurwerk met beperkt gevaar<\/h3><p class=\"cat-sub\">Weinig gevaar<\/p><\/div><\/header><div class=\"cat-fotos\"><figure class=\"cat-foto\"><img src=\"assets/images/cat-f2-fontein.webp?v=vw260921c\" alt=\"Fontein met het etiket F2\" width=\"200\" height=\"300\" loading=\"eager\" decoding=\"async\"><figcaption>Fontein<\/figcaption><\/figure><figure class=\"cat-foto\"><img src=\"assets/images/cat-f2-cake.webp?v=vw260921c\" alt=\"Cake met het etiket F2\" width=\"200\" height=\"300\" loading=\"eager\" decoding=\"async\"><figcaption>Cake<\/figcaption><\/figure><figure class=\"cat-foto\"><img src=\"assets/images/cat-f2-compoundbox.webp?v=vw260921c\" alt=\"Compoundbox met het etiket F2\" width=\"200\" height=\"300\" loading=\"eager\" decoding=\"async\"><figcaption>Compoundbox<\/figcaption><\/figure><\/div><div class=\"cat-blok cat-vb\"><span class=\"cat-bi\" data-i=\"boek\"><\/span><div><h4 class=\"cat-bh\">Voorbeelden<\/h4><p>Fonteinen, cakes en compoundboxen. <span class=\"cat-voorbehoud\">Alleen als deze daadwerkelijk als F2 zijn geclassificeerd.<\/span><\/p><\/div><\/div><div class=\"cat-blok cat-wm\"><span class=\"cat-bi cat-bi-uitroep\" data-i=\"uitroep\"><\/span><div><h4 class=\"cat-bh\">Wat moet je weten?<\/h4><ul class=\"cat-l\"><li>Het bezit en het gebruik van F2-vuurwerk is verboden voor anderen dan personen met gespecialiseerde kennis (art. 9.2.2.1a Wm).<\/li><li>Voor aangewezen F2-vuurwerk kan de burgemeester onder voorwaarden een ontheffing verlenen voor de jaarwisseling.<\/li><li>Boa’s in domein I zijn bevoegd om op te treden tegen overtredingen van dit verbod.<\/li><li>Controleer altijd zelf of het feit binnen jouw domein, taakomschrijving en bevoegdheid valt.<\/li><\/ul><\/div><\/div><\/section><section class=\"cat cat-f3\" aria-labelledby=\"t-cat-f3\"><header class=\"cat-h\"><span class=\"cat-code\" aria-hidden=\"true\">F3<\/span><div><h3 class=\"cat-t\" id=\"t-cat-f3\">F3 – Vuurwerk met middelmatig gevaar<\/h3><p class=\"cat-sub\">Middelmatig gevaar<\/p><\/div><\/header><div class=\"cat-fotos\"><figure class=\"cat-foto\"><img src=\"assets/images/cat-f3-cake.webp?v=vw260921c\" alt=\"Zware cake met het etiket F3\" width=\"200\" height=\"300\" loading=\"eager\" decoding=\"async\"><figcaption>Zwaardere cake<\/figcaption><\/figure><figure class=\"cat-foto\"><img src=\"assets/images/cat-f3-vuurpijlen.webp?v=vw260921c\" alt=\"Vuurpijlen met het etiket F3\" width=\"200\" height=\"300\" loading=\"eager\" decoding=\"async\"><figcaption>Vuurpijlen<\/figcaption><\/figure><figure class=\"cat-foto\"><img src=\"assets/images/cat-f3-batterij.webp?v=vw260921c\" alt=\"Batterij met het etiket F3\" width=\"200\" height=\"300\" loading=\"eager\" decoding=\"async\"><figcaption>Grote batterij<\/figcaption><\/figure><\/div><div class=\"cat-blok cat-vb\"><span class=\"cat-bi\" data-i=\"boek\"><\/span><div><h4 class=\"cat-bh\">Voorbeelden<\/h4><p>Zwaardere cakes, vuurpijlen en batterijen. <span class=\"cat-voorbehoud\">Alleen als deze daadwerkelijk als F3 zijn geclassificeerd.<\/span><\/p><\/div><\/div><div class=\"cat-blok cat-wm\"><span class=\"cat-bi cat-bi-uitroep\" data-i=\"uitroep\"><\/span><div><h4 class=\"cat-bh\">Wat moet je weten?<\/h4><ul class=\"cat-l\"><li>Het bezit en het gebruik van F3-vuurwerk is verboden voor anderen dan personen met gespecialiseerde kennis (art. 9.2.2.1a Wm).<\/li><li>Voor F3 geldt niet de ontheffingsmogelijkheid van de burgemeester die voor aangewezen F2-vuurwerk bestaat.<\/li><li>Boa’s in domein I zijn bevoegd om op te treden tegen overtredingen van dit verbod.<\/li><li>Controleer altijd zelf of het feit binnen jouw domein, taakomschrijving en bevoegdheid valt.<\/li><\/ul><\/div><\/div><\/section><section class=\"cat cat-f4\" aria-labelledby=\"t-cat-f4\"><header class=\"cat-h\"><span class=\"cat-code\" aria-hidden=\"true\">!<\/span><div><h3 class=\"cat-t\" id=\"t-cat-f4\">F4 / zwaar of illegaal vuurwerk<\/h3><p class=\"cat-sub\">Veel gevaar<\/p><\/div><\/header><div class=\"cat-fotos\"><figure class=\"cat-foto\"><img src=\"assets/images/cat-f4-cobra.webp?v=vw260921c\" alt=\"Kartonnen huls van zwaar knalvuurwerk met lont\" width=\"200\" height=\"300\" loading=\"eager\" decoding=\"async\"><figcaption>Cobra<\/figcaption><\/figure><figure class=\"cat-foto\"><img src=\"assets/images/cat-f4-nitraten.webp?v=vw260921c\" alt=\"Drie kartonnen hulzen van zwaar knalvuurwerk\" width=\"200\" height=\"300\" loading=\"eager\" decoding=\"async\"><figcaption>Nitraat<\/figcaption><\/figure><figure class=\"cat-foto\"><img src=\"assets/images/cat-f4-vlinder.webp?v=vw260921c\" alt=\"Zwaar knalvuurwerk met lont op een verpakking\" width=\"200\" height=\"300\" loading=\"eager\" decoding=\"async\"><figcaption>Vlinder / strijker<\/figcaption><\/figure><\/div><div class=\"cat-blok cat-vb\"><span class=\"cat-bi\" data-i=\"boek\"><\/span><div><h4 class=\"cat-bh\">Voorbeelden<\/h4><p>Nitraten, Cobra’s, vlinders/strijkers, lawinepijlen, shells/mortierbommen en ander zwaar of illegaal vuurwerk. Dit zijn praktijknamen.<\/p><\/div><\/div><div class=\"cat-blok cat-wm\"><span class=\"cat-bi cat-bi-uitroep\" data-i=\"uitroep\"><\/span><div><h4 class=\"cat-bh\">Wat moet je weten?<\/h4><ul class=\"cat-l\"><li>F4 is een afzonderlijke wettelijke vuurwerkcategorie.<\/li><li>F4-vuurwerk levert veel gevaar op en is uitsluitend bestemd voor personen met gespecialiseerde kennis.<\/li><li>De aanvullende bevoegdheid van boa’s in domein I voor artikel 9.2.2.1a Wm ziet op F2 en F3, niet op F4 of ander zwaar/illegaal vuurwerk.<\/li><li>Bij F4 of ander zwaar/illegaal vuurwerk waarvoor je niet bevoegd bent, ligt <strong class=\"cat-politie\">de verdere opsporing bij de politie<\/strong>.<\/li><li>Een praktijknaam zoals nitraat of Cobra bepaalt niet automatisch de wettelijke categorie.<\/li><\/ul><\/div><\/div><\/section><\/div><p class=\"cat-fotonoot\">De foto’s zijn voorbeelden. De vorm of naam van een product bewijst de wettelijke categorie niet.<\/p><section class=\"cat-onthoud\" aria-labelledby=\"t-onthoud\"><div class=\"cat-on-l\"><span class=\"cat-on-ic\" data-i=\"lamp\"><\/span><div><h3 class=\"cat-on-t\" id=\"t-onthoud\">Onthoud<\/h3><ul class=\"cat-check\"><li>De vorm of naam van vuurwerk bepaalt niet automatisch de categorie.<\/li><li>Controleer waar mogelijk het etiket op de verpakking (F1, F2, F3 of F4).<\/li><li>Boa’s in domein I zijn bevoegd voor de strafbaarstelling van F2 en F3 op grond van artikel 9.2.2.1a Wm jo. artikel 1a WED.<\/li><li>Controleer altijd zelf of het feit binnen jouw domein, taakomschrijving en bevoegdheid valt.<\/li><li>Bij F4 of ander zwaar/illegaal vuurwerk waarvoor je niet bevoegd bent, ligt de verdere opsporing bij de politie.<\/li><\/ul><\/div><\/div><div class=\"cat-samen\"><span class=\"cat-sa-ic\" data-i=\"document\"><\/span><div><h3 class=\"cat-samen-t\">Kort samengevat<\/h3><dl class=\"cat-sv\"><div class=\"sv-f1\"><dt>F1<\/dt><dd><span>niet onder het verbod van art. 9.2.2.1a Wm<\/span><span>wel andere regels mogelijk<\/span><\/dd><\/div><div class=\"sv-f2\"><dt>F2<\/dt><dd><span>boa bevoegd voor deze strafbaarstelling<\/span><span>voor aangewezen F2 kan ontheffing burgemeester gelden<\/span><span>controleer eigen bevoegdheid<\/span><\/dd><\/div><div class=\"sv-f3\"><dt>F3<\/dt><dd><span>boa bevoegd voor deze strafbaarstelling<\/span><span>geen ontheffing zoals bij aangewezen F2<\/span><span>controleer eigen bevoegdheid<\/span><\/dd><\/div><div class=\"sv-f4\"><dt>F4 / zwaar-illegaal<\/dt><dd><span>verdere opsporing ligt bij de politie als de boa daarvoor niet bevoegd is<\/span><\/dd><\/div><\/dl><\/div><\/div><\/section><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0003245/2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet milieubeheer, artikel 9.2.2.1a<\/a> — lid 1: verbod; lid 4: ontheffing; geldend vanaf 1 augustus 2026 (Wet veilige jaarwisseling, Stb. 2026, 7)<br><\/li><li><a href=\"https://wetten.overheid.nl/BWBR0013360/2026-08-01\" target=\"_blank\" rel=\"noopener\">Vuurwerkbesluit<\/a> — artikel 1A.1.3: categorieën; artikel 2.3.2 en 2.3.2a: ontheffing aangewezen F2; geldend vanaf 1 augustus 2026<br><\/li><li><a href=\"https://zoek.officielebekendmakingen.nl/stcrt-2026-31362.html\" target=\"_blank\" rel=\"noopener\">Regeling domeinlijsten buitengewoon opsporingsambtenaar<\/a> — Domein I, onderdeel 9, geldend vanaf 8 september 2026 (Stcrt. 2026, 31362)<br><\/li><\/ol><\/div>"},{"kind":"theory","titel":"Categorie F1","html":"<span class=\"q-soort\">Wet<\/span><h2 class=\"ptitle\">Categorie F1<\/h2><div class=\"main\"><p><b>Wettelijke betekenis:<\/b> vuurwerk dat zeer weinig gevaar en een te verwaarlozen geluidsniveau oplevert. Het is bestemd voor gebruik in een besloten ruimte, ook binnenshuis. F1 valt onder <i>fop- en schertsvuurwerk<\/i>.<\/p><p><b>Voor wie?<\/b> F1 valt niet onder het verbod van artikel 9.2.2.1a, eerste lid, Wm. Voor de verkoop geldt een minimumleeftijd van 12 jaar (artikel 2.3.5 Vuurwerkbesluit).<\/p><p><b>Productsoort:<\/b> aan de vorm of het soort product zie je de categorie niet. Bepalend is de indeling door de fabrikant en de aanduiding op de verpakking.<\/p><p><b>Wat kun je zelf waarnemen?<\/b> de verpakking, het etiket met de categorie, de aanduiding «Geschikt voor particulier gebruik» en de CE-markering.<\/p><p><b>Wat kun je daaruit nog niet automatisch concluderen?<\/b> dat het product echt F1 is. Een etiket kan beschadigd, nagemaakt of verkeerd zijn.<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0013360/2026-08-01\" target=\"_blank\" rel=\"noopener\">Vuurwerkbesluit, geldend vanaf 1 augustus 2026<\/a><\/li><li><a href=\"https://wetten.overheid.nl/BWBR0003245/2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet milieubeheer, art. 9.2.2.1a, geldend vanaf 1 augustus 2026<\/a> (ingevoerd bij de Wet veilige jaarwisseling, Stb. 2026, 7).<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Categorie F2","html":"<span class=\"q-soort\">Wet<\/span><h2 class=\"ptitle\">Categorie F2<\/h2><div class=\"main\"><p><b>Wettelijke betekenis:<\/b> vuurwerk dat weinig gevaar en een laag geluidsniveau oplevert. Het is bestemd voor gebruik buitenshuis in een afgebakende plaats.<\/p><p><b>Voor wie?<\/b> sinds 1 augustus 2026 is bezit en gebruik verboden voor anderen dan personen met gespecialiseerde kennis. Uitzondering: een ontheffinghouder met ontheffing van de burgemeester, voor aangewezen F2-vuurwerk tijdens de jaarwisseling.<\/p><p><b>Productsoort:<\/b> aan de vorm (bijvoorbeeld een fontein, cakebox of pijl) zie je de categorie niet. De fabrikant deelt het vuurwerk in op grond van toepassing, doel en gevaar (artikel 1A.1.3 Vuurwerkbesluit). Kijk dus naar de aanduiding.<\/p><p><b>Wat kun je zelf waarnemen?<\/b> de categorie «F2» op het etiket. Oudere verpakkingen kunnen nog de tekst «Geschikt voor particulier gebruik» dragen.<\/p><p><b>Wat kun je daaruit nog niet automatisch concluderen?<\/b> dat bezit toegestaan is omdat er «Geschikt voor particulier gebruik» op staat. Het verbod van artikel 9.2.2.1a Wm geldt toch. Controleer wel of er een ontheffing is.<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0013360/2026-08-01\" target=\"_blank\" rel=\"noopener\">Vuurwerkbesluit, geldend vanaf 1 augustus 2026<\/a><\/li><li><a href=\"https://wetten.overheid.nl/BWBR0003245/2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet milieubeheer, art. 9.2.2.1a, geldend vanaf 1 augustus 2026<\/a> (ingevoerd bij de Wet veilige jaarwisseling, Stb. 2026, 7).<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Categorie F3","html":"<span class=\"q-soort\">Wet<\/span><h2 class=\"ptitle\">Categorie F3<\/h2><div class=\"main\"><p><b>Wettelijke betekenis:<\/b> vuurwerk dat middelmatig gevaar oplevert. Het is bestemd voor gebruik buitenshuis in een grote open ruimte.<\/p><p><b>Voor wie?<\/b> bezit en gebruik zijn verboden voor anderen dan personen met gespecialiseerde kennis (artikel 9.2.2.1a Wm). F3 is ook <i>professioneel vuurwerk<\/i> in de zin van het Vuurwerkbesluit.<\/p><p><b>Productsoort:<\/b> groot of hard knallend vuurwerk is niet vanzelf F3. Het Handhavingsplan gebruikt de praktijkterm «Cobra’s» voor zwaar vuurwerk in F3 en F4, maar een praktijkterm is geen categorie.<\/p><p><b>Wat kun je zelf waarnemen?<\/b> de categorie «F3» op het etiket, als er een etiket is.<\/p><p><b>Wat kun je daaruit nog niet automatisch concluderen?<\/b> dat vuurwerk F3 is alleen omdat het groot is of hard knalt. Grootte en geluid zijn geen wettelijk bewijs van de categorie.<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0013360/2026-08-01\" target=\"_blank\" rel=\"noopener\">Vuurwerkbesluit, geldend vanaf 1 augustus 2026<\/a><\/li><li><a href=\"https://wetten.overheid.nl/BWBR0003245/2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet milieubeheer, art. 9.2.2.1a, geldend vanaf 1 augustus 2026<\/a> (ingevoerd bij de Wet veilige jaarwisseling, Stb. 2026, 7).<\/li><li><a href=\"https://www.rijksoverheid.nl/documenten/2026/03/16/tk-bijlage-geactualiseerd-handhavingsplan-jaarwisseling-feb-2026\" target=\"_blank\" rel=\"noopener\">Handhavingsplan jaarwisseling, Ministerie van Justitie en Veiligheid, maart 2026 (beleid)<\/a><\/li><\/ol><\/div>"},{"kind":"theory","titel":"Categorie F4 / professioneel vuurwerk","html":"<span class=\"q-soort\">Wet<\/span><h2 class=\"ptitle\">Categorie F4 / professioneel vuurwerk<\/h2><div class=\"main\"><p><b>Wettelijke betekenis:<\/b> vuurwerk dat veel gevaar oplevert en uitsluitend bestemd is voor gebruik door personen met gespecialiseerde kennis. Professioneel vuurwerk is: F4, F3 en F2 dat niet is aangewezen voor particulier gebruik.<\/p><p><b>Voor wie?<\/b> alleen personen met gespecialiseerde kennis. Het Vuurwerkbesluit verbiedt anderen om professioneel vuurwerk op te slaan, voorhanden te hebben of af te steken (artikel 1.2.2, derde lid).<\/p><p><b>Productsoort:<\/b> professioneel vuurwerk herken je vooral aan de aanduiding en de verpakking, niet aan de vorm.<\/p><p><b>Wat kun je zelf waarnemen?<\/b> een etiket met «F4», als dat er is. Professioneel vuurwerk op straat is een bijzondere en mogelijk gevaarlijke situatie.<\/p><p><b>Wat kun je daaruit nog niet automatisch concluderen?<\/b> dat jij hier als domein I-boa voor bevoegd bent. Artikel 9.2.2.1a Wm noemt F4 niet, en domein I noemt alleen artikel 9.2.2.1a. Zie onderwerp 4.<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0013360/2026-08-01\" target=\"_blank\" rel=\"noopener\">Vuurwerkbesluit, geldend vanaf 1 augustus 2026<\/a><\/li><li><a href=\"https://www.rijksoverheid.nl/documenten/2026/03/16/tk-bijlage-geactualiseerd-handhavingsplan-jaarwisseling-feb-2026\" target=\"_blank\" rel=\"noopener\">Handhavingsplan jaarwisseling, Ministerie van Justitie en Veiligheid, maart 2026 (beleid)<\/a><\/li><\/ol><\/div>"},{"kind":"kader","titel":"Personen met gespecialiseerde kennis","html":"<h2 class=\"ptitle\">Personen met gespecialiseerde kennis<\/h2><div class=\"kaart k-kader law-card\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span class=\"kaart-lab\">Juridisch kader<\/span><\/div><div class=\"kaart-t\">Artikel 1.1.2a · Vuurwerkbesluit<\/div><div class=\"kaart-b\"><p class=\"law-intro\">Het verbod van artikel 9.2.2.1a Wm geldt niet voor personen met gespecialiseerde kennis. Het Vuurwerkbesluit zegt wie dat zijn.<\/p><div class=\"law-quote\"><div class=\"law-quote-head\"><span class=\"law-quote-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/><\/svg><\/span><span>Wettekst<\/span><\/div><p class=\"wet law-text\">«1 Als een persoon met gespecialiseerde kennis worden aangewezen:<br>a. Een persoon die over een omgevingsvergunning beschikt voor het opslaan, herverpakken en bewerken van pyrotechnische artikelen voor theatergebruik of vuurwerk van categorie F4, bedoeld in artikel 3.31, eerste lid, onder c, van het Besluit activiteiten leefomgeving;<br>b. een houder van een vergunning als bedoeld in artikel 3B.1, eerste lid;<br>c. medewerkers van de politie in de uitoefening van hun functie;<br>d. medewerkers van de brandweer in de uitoefening van hun functie;<br>e. personen die in de uitoefening van hun functie vuurwerk of pyrotechnische artikelen voor theatergebruik tot ontbranding brengen bij een instelling die de genoemde producten bedrijfsmatig en uitsluitend ten behoeve van onderzoek tot ontbranding brengt;<br>f. medewerkers van de krijgsmacht in de uitoefening van hun functie.»<\/p><\/div><div class=\"law-grid\"><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>In gewone taal<\/span><\/div><p>Dit zijn vooral vakmensen met een vergunning, en medewerkers van politie, brandweer en krijgsmacht tijdens hun werk. Een gewone burger is geen persoon met gespecialiseerde kennis.<\/p><\/section><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>Wat betekent dit voor jou als boa?<\/span><\/div><p>Zegt iemand dat hij vakman is? Vraag dan naar een bewijs, zoals een vergunning. Boa’s staan zelf niet in deze lijst.<\/p><\/section><\/div><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0013360/2026-08-01\" target=\"_blank\" rel=\"noopener\">Vuurwerkbesluit, geldend vanaf 1 augustus 2026<\/a><\/li><\/ol><\/div>"},{"kind":"kader","titel":"Verpakking en etiket","html":"<h2 class=\"ptitle\">Verpakking en etiket<\/h2><div class=\"kaart k-kader law-card\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span class=\"kaart-lab\">Juridisch kader<\/span><\/div><div class=\"kaart-t\">Artikel 2.1.3 · Vuurwerkbesluit<\/div><div class=\"kaart-b\"><p class=\"law-intro\">Consumentenvuurwerk moet bepaalde gegevens op de verpakking hebben. Dat helpt jou bij het waarnemen.<\/p><div class=\"law-quote\"><div class=\"law-quote-head\"><span class=\"law-quote-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/><\/svg><\/span><span>Wettekst<\/span><\/div><p class=\"wet law-text\">«1 Consumentenvuurwerk is voorzien van:<br>a. de aanduiding: Geschikt voor particulier gebruik;<br>g. de minimumleeftijd voor het verkopen of anderszins ter beschikking stellen van het vuurwerk, bedoeld in artikel 2.3.5;<br>h. de categorie, bedoeld in artikel 1A.1.3, waartoe het vuurwerk behoort;<br>i. de NEM;<br>j. een gebruiksaanwijzing met zodanige aanwijzingen en waarschuwingen dat bij het dienovereenkomstig handelen geen letsel of schade bij de gebruiker en omstanders kan ontstaan.» <em>(fragment)<\/em><\/p><\/div><div class=\"law-grid\"><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>In gewone taal<\/span><\/div><p>Op de verpakking hoort onder meer te staan: «Geschikt voor particulier gebruik», de minimumleeftijd, de categorie, de hoeveelheid kruit (NEM) en een gebruiksaanwijzing.<\/p><\/section><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>Wat betekent dit voor jou als boa?<\/span><\/div><p>Schrijf letterlijk op wat er op de verpakking staat. Ontbreken deze gegevens? Schrijf dat ook op. Het etiket is informatie, geen bewijs.<\/p><\/section><\/div><div class=\"law-definition\"><span class=\"law-definition-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><p><strong>NEM<\/strong> betekent netto explosieve massa: de totale hoeveelheid pyrotechnische stof in het vuurwerk.<\/p><\/div><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0013360/2026-08-01\" target=\"_blank\" rel=\"noopener\">Vuurwerkbesluit, geldend vanaf 1 augustus 2026<\/a><\/li><\/ol><\/div>"},{"kind":"figuur","titel":"Zelfde tas, andere informatie","html":"<div class=\"figcap\">Zelfde tas, andere informatie<\/div><figure class=\"illu\"><svg viewBox=\"0 0 560 60\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>Zelfde tas, andere informatie<\/title><desc>Links vuurwerk in een verpakking met etiket en categorie: je hebt informatie. Rechts los vuurwerk zonder verpakking: de categorie is nog niet betrouwbaar vastgesteld.<\/desc><\/svg><\/figure>"},{"kind":"theory","titel":"Onbekend vuurwerk","html":"<h2 class=\"ptitle\">Onbekend vuurwerk<\/h2><div class=\"main\"><p>In deze e-learning noemen we vuurwerk waarvan je de soort of categorie nog niet betrouwbaar hebt vastgesteld ‘onbekend vuurwerk’. Dit is geen wettelijke vuurwerkcategorie.<\/p><p>Dat gebeurt bijvoorbeeld als er geen verpakking is, als het etiket ontbreekt of als het vuurwerk beschadigd of aangepast is.<\/p><p>Je weet dan wel wát je ziet: de vorm, de grootte, de kleur en de hoeveelheid. Je weet nog niet om welke categorie het gaat.<\/p><\/div>"},{"kind":"figuur","titel":"Van waarneming naar juridische conclusie","html":"<div class=\"figcap\">Van waarneming naar juridische conclusie<\/div><figure class=\"illu\"><svg viewBox=\"0 0 560 60\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>Van waarneming naar juridische conclusie<\/title><desc>Vier lagen: waarneming (wat zie ik), informatie (wat staat op verpakking of etiket), onderzoek (wat kan rechtmatig nader worden vastgesteld) en juridische conclusie (wat kan uiteindelijk worden bewezen of onderbouwd).<\/desc><\/svg><\/figure>"},{"kind":"kaart","titel":"Op straat weet je het niet altijd","html":"<h2 class=\"ptitle\">Op straat weet je het niet altijd<\/h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/><\/svg><\/span><span class=\"kaart-lab\">In de praktijk<\/span><\/div><div class=\"kaart-t\">Waarneming is nog geen vaststelling<\/div><div class=\"kaart-b\"><p>Op straat heb je weinig tijd en weinig informatie. Je kunt vaak niet meteen vaststellen welk vuurwerk het is.<\/p><p>Houd de vier lagen uit elkaar:<\/p><ul class=\"opsom\"><li><b>Waarneming<\/b> — wat zie ik?<\/li><li><b>Informatie<\/b> — wat staat op verpakking of etiket?<\/li><li><b>Onderzoek<\/b> — wat kan rechtmatig nader worden vastgesteld?<\/li><li><b>Juridische conclusie<\/b> — wat kan uiteindelijk worden bewezen?<\/li><\/ul><\/div><\/div>"},{"kind":"casus","titel":"Terug naar het plein: de tas","html":"<span class=\"q-soort\">Voorbeeld<\/span><h2 class=\"ptitle\">Terug naar het plein: de tas<\/h2><p class=\"lees\">Je kijkt vanaf een veilige afstand naar de tas naast de jongeren. Een deel van het vuurwerk zit in een verpakking met etiket. Op een verpakking lees je «F2». Een ander deel ligt los in de tas, zonder verpakking.<\/p><p class=\"lees\">Wat weet je nu? Bij het verpakte vuurwerk heb je informatie. Bij het losse vuurwerk is de categorie nog niet betrouwbaar vastgesteld.<\/p>"},{"kind":"figuur","titel":"Wat kun je wel en nog niet vaststellen?","html":"<div class=\"figcap\">Wat kun je wel en nog niet vaststellen?<\/div><figure class=\"illu\"><svg viewBox=\"0 0 560 60\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>Wat kun je wel en nog niet vaststellen?<\/title><desc>Links wat je op straat kunt zien: vorm, verpakking, etiket, hoeveelheid. Rechts wat vaak nog moet worden vastgesteld: de categorie en of het vuurwerk onder een verbod valt.<\/desc><\/svg><\/figure>"},{"kind":"figuur","titel":"Van product naar juridische conclusie","html":"<div class=\"figcap\">Van product naar juridische conclusie<\/div><figure class=\"illu\"><svg viewBox=\"0 0 560 60\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>Van product naar juridische conclusie<\/title><desc>Zeven stappen: wat is het voor product, welke categorie is vastgesteld, voor wie is het bestemd, wat gebeurt ermee, welke bepaling is van toepassing, is er een uitzondering of ontheffing, is de boa voor dit feit bevoegd.<\/desc><\/svg><\/figure>"},{"kind":"onthoud","titel":"Kort samengevat","html":"<h2 class=\"ptitle\">Kort samengevat<\/h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-t\">Categorieën<\/div><div class=\"kaart-b\"><ul class=\"punten\"><li>Er zijn vier categorieën: F1, F2, F3 en F4. De fabrikant bepaalt de categorie.<\/li><li>F1 is fop- en schertsvuurwerk. Professioneel vuurwerk is F4, F3 en niet-aangewezen F2.<\/li><li>Personen met gespecialiseerde kennis zijn vooral vakmensen, politie, brandweer en krijgsmacht.<\/li><\/ul><\/div><\/div>"},{"kind":"onthoud","titel":"Kort samengevat","html":"<h2 class=\"ptitle\">Kort samengevat<\/h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-t\">Waarnemen en vastleggen<\/div><div class=\"kaart-b\"><ul class=\"punten\"><li>Het etiket is informatie, geen bewijs.<\/li><li>«Onbekend vuurwerk» is geen wettelijke categorie.<\/li><li>Houd waarneming, informatie, onderzoek en juridische conclusie uit elkaar.<\/li><\/ul><\/div><\/div>"},{"kind":"theory","titel":"Vooruitblik: Wat zegt de wet?","html":"<h2 class=\"ptitle\">Vooruitblik: Wat zegt de wet?<\/h2><div class=\"main\"><p>Je weet nu hoe je naar vuurwerk kijkt. In het volgende onderwerp kijken we naar de wet.<\/p><p>Dan gaat het om de tweede vraag: «Is dit strafbaar?»<\/p><\/div>"}],"titel":"Welke soorten vuurwerk zijn er?","type":"content","vragen":[{"artikel":"Werkwijze","juist":1,"kernregel":"Het etiket is informatie, geen bewijs.","opties":["Het etiket bewijst de categorie. Je hoeft niets meer te controleren.","Het etiket is informatie. Je schrijft op wat er staat. Het is nog geen vaststelling.","Het etiket zegt niets. Je kijkt alleen naar de grootte van het vuurwerk.","Het etiket telt pas mee als de eigenaar bevestigt dat het klopt."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is B. Een verpakking kan beschadigd, nagemaakt of verkeerd zijn. Wat op het etiket staat, is informatie. Je legt het letterlijk vast, maar trekt nog geen harde conclusie. [[1]]","voetnoten":["Vuurwerkbesluit, artikel 1A.1.3 en 1.1.2a (geldend vanaf 1 augustus 2026)."],"vraag":"Je ziet vuurwerk in een verpakking. Op het etiket staat «F2». Wat kun je nu zeggen?","wet":"—"},{"artikel":"Art. 1A.1.3 Vuurwerkbesluit","juist":2,"kernregel":"De categorie wordt bepaald door de fabrikant, niet op straat.","opties":["De boa die het vuurwerk op straat aantreft.","De burgemeester van de gemeente waar het wordt verkocht.","De fabrikant; een aangemelde instantie bevestigt de indeling.","De politie, nadat het vuurwerk in beslag is genomen."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is C. Volgens artikel 1A.1.3 Vuurwerkbesluit brengt de fabrikant het vuurwerk onder in een categorie. Een aangemelde instantie bevestigt de categorisering. [[1]]","voetnoten":["Vuurwerkbesluit, artikel 1A.1.3 en 1.1.2a (geldend vanaf 1 augustus 2026)."],"vraag":"Wie bepaalt volgens het Vuurwerkbesluit in welke categorie vuurwerk valt?","wet":"Vuurwerkbesluit"},{"artikel":"Werkwijze","juist":0,"kernregel":"«Onbekend vuurwerk» is geen wettelijke categorie.","opties":["Onbekend vuurwerk. Dat is geen wettelijke categorie.","Verboden vuurwerk, omdat de verpakking ontbreekt.","Professioneel vuurwerk, omdat het etiket ontbreekt.","Categorie F4, omdat de categorie onbekend is."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is A. In deze e-learning noemen we vuurwerk waarvan je de soort of categorie nog niet betrouwbaar hebt vastgesteld «onbekend vuurwerk». Dit is geen wettelijke vuurwerkcategorie.","voetnoten":[],"vraag":"In een tas ligt vuurwerk zonder verpakking en zonder etiket. Hoe noem je dit vuurwerk in deze e-learning?","wet":"—"},{"artikel":"Werkwijze","juist":3,"kernregel":"Praktijkterm is geen wettelijke categorie.","opties":["Je neemt het over, want nitraten zijn altijd categorie F4.","Je schrijft «F3» op, want dat is de middelste categorie.","Je schrijft niets op, want zonder etiket kun je niets vastleggen.","Je beschrijft wat je ziet. Een praktijkterm is geen wettelijke categorie."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is D. Woorden als «nitraat» zijn praktijktermen. De wet kent de categorieën F1 tot en met F4. Zonder onderbouwing koppel je een praktijkterm niet aan een categorie. Beschrijf wat je ziet.","voetnoten":[],"vraag":"Een collega zegt: «Dit is een nitraat, dus het is F4.» Er zit geen etiket op. Hoe reageer je het best?","wet":"—"},{"artikel":"Art. 1.1.2a Vuurwerkbesluit","juist":1,"kernregel":"Personen met gespecialiseerde kennis staan limitatief in artikel 1.1.2a Vuurwerkbesluit.","opties":["Iedereen die ouder is dan 21 jaar.","Medewerkers van politie en brandweer tijdens hun werk.","Iedereen die het vuurwerk legaal heeft gekocht.","Iedereen met een verpakking met «Geschikt voor particulier gebruik»."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is B. Artikel 1.1.2a Vuurwerkbesluit noemt onder meer vergunninghouders en medewerkers van politie, brandweer en krijgsmacht in de uitoefening van hun functie. Vraag naar een bewijs. [[1]]","voetnoten":["Vuurwerkbesluit, artikel 1A.1.3 en 1.1.2a (geldend vanaf 1 augustus 2026)."],"vraag":"Een man zegt dat hij vuurwerk mag hebben omdat hij «persoon met gespecialiseerde kennis» is. Wie valt daar onder meer onder?","wet":"Vuurwerkbesluit"}]},{"icoon":"wet","id":"m3","kader":"Wet milieubeheer","nr":3,"pages":[{"kind":"lo","titel":"Leerdoelen","html":"<h2 class=\"ptitle\">Leerdoelen<\/h2><p class=\"pintro\">Wat je na dit onderwerp kunt.<\/p><ul class=\"lo\"><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>ken je artikel 9.2.2.1a Wet milieubeheer;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je wat verboden is: bezit, gebruik en verkoop van F2 en F3;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je wat een ontheffing van de burgemeester inhoudt;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je hoe een overtreding van artikel 9.2.2.1a Wm een economisch delict wordt;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>ken je de juridische keten van wet naar opsporingsbevoegdheid.<\/span><\/li><\/ul>"},{"kind":"theory","titel":"Van soort naar strafbaarheid","html":"<h2 class=\"ptitle\">Van soort naar strafbaarheid<\/h2><div class=\"main\"><p>In onderwerp 2 ging het over de vraag «Wat tref ik aan?» Nu gaat het over de volgende vraag: «Is dit strafbaar?»<\/p><p>Daarvoor kijk je naar de wet. In dit onderwerp leer je welke regels bij vuurwerk horen en hoe je zo’n regel leest.<\/p><\/div>"},{"kind":"theory","titel":"De Wet veilige jaarwisseling","html":"<h2 class=\"ptitle\">De Wet veilige jaarwisseling<\/h2><div class=\"main\"><p>De Wet veilige jaarwisseling is op 1 augustus 2026 in werking getreden. Deze wet heeft artikel 9.2.2.1a toegevoegd aan de Wet milieubeheer (Wm) en de Wet op de economische delicten (WED) aangepast.<\/p><p>Op dezelfde datum is het Besluit veilige jaarwisseling in werking getreden. Dat besluit wijzigt het Vuurwerkbesluit en werkt onder meer de ontheffing uit.<\/p><p>De kern: het bezit en het gebruik van F2- en F3-vuurwerk is verboden voor anderen dan personen met gespecialiseerde kennis. F1 valt niet onder dit verbod.<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wet milieubeheer, art. 9.2.2.1a, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0003245/2026-08-01 (ingevoerd bij de Wet veilige jaarwisseling, Stb. 2026, 7).<\/li><li>Besluit veilige jaarwisseling, Stb. 2026, 168 – https://zoek.officielebekendmakingen.nl/stb-2026-168.html<\/li><\/ol><\/div>"},{"kind":"kader","titel":"Wettekst: artikel 9.2.2.1a Wet milieubeheer","html":"<h2 class=\"ptitle\">Wettekst: artikel 9.2.2.1a Wet milieubeheer<\/h2><div class=\"kaart k-kader law-card\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span class=\"kaart-lab\">Juridisch kader<\/span><\/div><div class=\"kaart-t\">Artikel 9.2.2.1a · Wet milieubeheer<\/div><div class=\"kaart-b\"><p class=\"law-intro\">Dit artikel heeft een centrale plaats in deze opleiding. Het geldt sinds 1 augustus 2026.<\/p><div class=\"law-quote\"><div class=\"law-quote-head\"><span class=\"law-quote-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/><\/svg><\/span><span>Wettekst<\/span><\/div><p class=\"wet law-text\">«1 Het bezit en het gebruik van vuurwerk van de categorieën F2 en F3 is verboden voor anderen dan personen met gespecialiseerde kennis.<br>2 De verkoop van vuurwerk van de categorieën F2 en F3 aan anderen dan personen met gespecialiseerde kennis is verboden.<br>3 Bij algemene maatregel van bestuur worden personen met gespecialiseerde kennis aangewezen.<br>4 De burgemeester kan ontheffing verlenen van de in het eerste lid gestelde verboden ten behoeve van het tijdens de jaarwisseling tot ontbranding brengen van vuurwerk van categorie F2 dat bij of krachtens algemene maatregel van bestuur is aangewezen.<br>5 Bij algemene maatregel van bestuur worden regels gesteld over de voorwaarden waaronder door de burgemeester op aanvraag ontheffing kan worden verleend en de voorschriften die aan die ontheffing kunnen worden verbonden.<br>6 Het in het tweede lid gestelde verbod geldt niet op 29, 30 en 31 december indien de koper in het bezit is van een ontheffing als bedoeld in het vierde lid.<br>7 Bij algemene maatregel van bestuur worden regels gesteld over de verkoop van vuurwerk van categorie F2 dat bij of krachtens algemene maatregel van bestuur is aangewezen aan de koper die in het bezit is van een ontheffing als bedoeld in het vierde lid.»<\/p><\/div><div class=\"law-grid\"><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>In gewone taal<\/span><\/div><p>Bezit en gebruik van F2- en F3-vuurwerk zijn verboden, behalve voor personen met gespecialiseerde kennis (lid 1). Verkoop aan anderen is ook verboden (lid 2). De burgemeester kan een ontheffing geven voor aangewezen F2-vuurwerk tijdens de jaarwisseling (lid 4).<\/p><\/section><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>Wat betekent dit voor jou als boa?<\/span><\/div><p>Zie je iemand met F2- of F3-vuurwerk? Dan kan er sprake zijn van een overtreding van lid 1. Controleer eerst of het echt F2 of F3 is, en of de persoon een uitzondering heeft: gespecialiseerde kennis of een ontheffing.<\/p><\/section><\/div><div class=\"law-definition\"><span class=\"law-definition-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><p><strong>Wettekst<\/strong> is de officiële tekst. Die verander je niet. De uitleg ernaast is in gewone taal.<\/p><\/div><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wet milieubeheer, art. 9.2.2.1a, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0003245/2026-08-01 (ingevoerd bij de Wet veilige jaarwisseling, Stb. 2026, 7).<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Lid 1: bezit en gebruik","html":"<h2 class=\"ptitle\">Lid 1: bezit en gebruik<\/h2><div class=\"main\"><p>Lid 1 verbiedt twee dingen: het <b>bezit<\/b> en het <b>gebruik<\/b> van F2- en F3-vuurwerk.<\/p><p>Bezit betekent: je hebt het vuurwerk bij je of onder je beheer. Bijvoorbeeld in je hand, in je tas of in je auto. Gebruik betekent vooral: het vuurwerk afsteken.<\/p><p>Het verbod geldt niet voor personen met gespecialiseerde kennis. Wie dat zijn, staat in artikel 1.1.2a Vuurwerkbesluit (onderwerp 2).<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wet milieubeheer, art. 9.2.2.1a, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0003245/2026-08-01 (ingevoerd bij de Wet veilige jaarwisseling, Stb. 2026, 7).<\/li><li>Vuurwerkbesluit, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0013360/2026-08-01<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Lid 2, 6 en 7: verkoop","html":"<h2 class=\"ptitle\">Lid 2, 6 en 7: verkoop<\/h2><div class=\"main\"><p>Lid 2 verbiedt de verkoop van F2- en F3-vuurwerk aan anderen dan personen met gespecialiseerde kennis.<\/p><p>Er is één uitzondering. Op 29, 30 en 31 december mag aangewezen F2-vuurwerk worden verkocht aan een koper met een ontheffing van de burgemeester (lid 6 en 7).<\/p><p>Het Vuurwerkbesluit werkt dit uit. Een ontheffinghouder mag het vuurwerk op 31 december tussen 12.00 en 18.00 uur krijgen (maximaal 200 kg verpakt aangewezen F2). De verkoper controleert de ontheffing en bewaart een kopie (artikel 2.3.3).<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wet milieubeheer, art. 9.2.2.1a, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0003245/2026-08-01 (ingevoerd bij de Wet veilige jaarwisseling, Stb. 2026, 7).<\/li><li>Vuurwerkbesluit, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0013360/2026-08-01<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Ontheffing van de burgemeester","html":"<h2 class=\"ptitle\">Ontheffing van de burgemeester<\/h2><div class=\"main\"><p>De burgemeester kan ontheffing verlenen van de verboden van lid 1. Dat kan alleen voor het afsteken van aangewezen F2-vuurwerk tijdens de jaarwisseling (lid 4).<\/p><p>Het Vuurwerkbesluit stelt voorwaarden. Onder meer: de aanvrager is een vereniging of stichting met lokale binding, en het gaat om maximaal 200 kg verpakt aangewezen F2-vuurwerk (artikel 2.3.2).<\/p><p>Het vuurwerk mag alleen worden afgestoken tussen 31 december 18.00 uur en 1 januari 02.00 uur. Op het afsteekterrein moet een afschrift van de ontheffing aanwezig zijn (artikel 2.3.2a).<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wet milieubeheer, art. 9.2.2.1a, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0003245/2026-08-01 (ingevoerd bij de Wet veilige jaarwisseling, Stb. 2026, 7).<\/li><li>Besluit veilige jaarwisseling, Stb. 2026, 168 – https://zoek.officielebekendmakingen.nl/stb-2026-168.html<\/li><li>Vuurwerkbesluit, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0013360/2026-08-01<\/li><\/ol><\/div>"},{"kind":"casus","titel":"Ontheffing — voorbeeld uit de praktijk","html":"<span class=\"q-soort\">Voorbeeld<\/span><h2 class=\"ptitle\">Ontheffing — voorbeeld uit de praktijk<\/h2><div class=\"kaart k-voorbeeld\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3v18M7 21h10\"/><path d=\"M12 6 5 8m7-2 7 2\"/><path d=\"M5 8 2.5 13a3 3 0 0 0 5 0L5 8Zm14 0-2.5 5a3 3 0 0 0 5 0L19 8Z\"/><\/svg><\/span><span class=\"kaart-lab\">Voorbeeld<\/span><\/div><div class=\"kaart-t\">F2 is niet altijd verboden<\/div><div class=\"kaart-b\"><p>Het is 31 december, 19.00 uur. Op een afgezet sportveld steekt een groep mensen vuurwerk af. Op de verpakkingen staat «F2».<\/p><p>Denk niet automatisch: «Ik zie F2, dus dit is verboden.» Vraag eerst naar de ontheffing. Een afschrift moet op het afsteekterrein aanwezig zijn.<\/p><p>Is er een ontheffing? Dan controleer je of de situatie er ook echt binnen past. Pas dan weet je of het verbod hier geldt.<\/p><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wet milieubeheer, art. 9.2.2.1a, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0003245/2026-08-01 (ingevoerd bij de Wet veilige jaarwisseling, Stb. 2026, 7).<\/li><li>Vuurwerkbesluit, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0013360/2026-08-01<\/li><\/ol><\/div>"},{"kind":"lijst","titel":"Controlekaart: ontheffing aangetroffen","html":"<h2 class=\"ptitle\">Controlekaart: ontheffing aangetroffen<\/h2><div class=\"main\"><p>Laat iemand een ontheffing zien? Loop dan deze zeven vragen na. Ga niet uit van aannames.<\/p><ul class=\"opsom\"><li><b>Is er echt een ontheffing verleend?<\/b> — door de burgemeester (art. 9.2.2.1a lid 4 Wm);<\/li><li><b>Voor wie?<\/b> — een vereniging of stichting met lokale binding (art. 2.3.2 onder a Vuurwerkbesluit);<\/li><li><b>Voor welke locatie?<\/b> — het afsteekterrein uit de aanvraag (art. 2.3.2 onder c);<\/li><li><b>Voor welke periode?<\/b> — afsteken tussen 31 december 18.00 uur en 1 januari 02.00 uur (art. 2.3.2a lid 3 onder a);<\/li><li><b>Voor welk vuurwerk?<\/b> — aangewezen F2-vuurwerk, maximaal 200 kg verpakt (art. 2.3.2 onder d);<\/li><li><b>Welke voorschriften gelden?<\/b> — onder meer: terrein afgezet, veiligheidsafstand, supervisor en ontbranders, afschrift aanwezig (art. 2.3.2a);<\/li><li><b>Past de situatie binnen de ontheffing?<\/b> — vergelijk wat je ziet met de ontheffing en de voorschriften.<\/li><\/ul><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wet milieubeheer, art. 9.2.2.1a, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0003245/2026-08-01 (ingevoerd bij de Wet veilige jaarwisseling, Stb. 2026, 7).<\/li><li>Vuurwerkbesluit, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0013360/2026-08-01<\/li><\/ol><\/div>"},{"kind":"kaart","titel":"Artikel 9.2.2.1a Wm — let op","html":"<h2 class=\"ptitle\">Artikel 9.2.2.1a Wm — let op<\/h2><div class=\"kaart k-letop\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17h.01\"/><\/svg><\/span><span class=\"kaart-lab\">Let op<\/span><\/div><div class=\"kaart-t\">Artikel 9.2.2.1a Wm — let op<\/div><div class=\"kaart-b\"><p>F1 valt niet onder het verbod van lid 1.<\/p><p>De tekst «Geschikt voor particulier gebruik» op een oude verpakking betekent niet dat bezit nu is toegestaan.<\/p><p>Artikel 9.2.2.1a Wm noemt F4 niet. Voor F4 en ander professioneel vuurwerk gelden de regels van het Vuurwerkbesluit, zoals artikel 1.2.2.<\/p><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wet milieubeheer, art. 9.2.2.1a, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0003245/2026-08-01 (ingevoerd bij de Wet veilige jaarwisseling, Stb. 2026, 7).<\/li><li>Vuurwerkbesluit, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0013360/2026-08-01<\/li><\/ol><\/div>"},{"kind":"kader","titel":"Wettekst: artikel 1a en artikel 2 WED","html":"<h2 class=\"ptitle\">Wettekst: artikel 1a en artikel 2 WED<\/h2><div class=\"kaart k-kader law-card\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span class=\"kaart-lab\">Juridisch kader<\/span><\/div><div class=\"kaart-t\">Artikel 1a en artikel 2 · WED<\/div><div class=\"kaart-b\"><p class=\"law-intro\">Artikel 1a WED bepaalt welke overtredingen een economisch delict zijn. Artikel 9.2.2.1a Wm staat in die lijst.<\/p><div class=\"law-quote\"><div class=\"law-quote-head\"><span class=\"law-quote-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/><\/svg><\/span><span>Wettekst<\/span><\/div><p class=\"wet law-text\">«Economische delicten zijn eveneens:<br>1°. overtredingen van voorschriften, gesteld bij of krachtens:<br>(…) de Wet milieubeheer, de artikelen 2.5, 8.40, eerste lid, 9.2.1.2, 9.2.1.5, 9.2.2.1, 9.2.2.1a, (…)»<br><br>«1 De economische delicten, bedoeld in artikel 1, onder 1° en 2°, en artikel 1a, onder 1° en 2°, zijn misdrijven, voor zover zij opzettelijk zijn begaan; voor zover deze economische delicten geen misdrijven zijn, zijn zij overtredingen.» <em>(fragment)<\/em><\/p><\/div><div class=\"law-grid\"><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>In gewone taal<\/span><\/div><p>Overtreding van artikel 9.2.2.1a Wm is een economisch delict. Is het met opzet gedaan? Dan is het een misdrijf. Anders is het een overtreding.<\/p><\/section><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>Wat betekent dit voor jou als boa?<\/span><\/div><p>Het feit valt onder de WED. Daarom kunnen de bijzondere opsporingsbevoegdheden van de WED van belang zijn (onderwerp 5).<\/p><\/section><\/div><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wet op de economische delicten, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0002063/2026-08-01<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Straffen","html":"<h2 class=\"ptitle\">Straffen<\/h2><div class=\"main\"><p>De WED bepaalt ook de maximale straffen. Voor een economisch delict uit artikel 1a, onder 1°, geldt:<\/p><ul class=\"opsom\"><li><b>misdrijf<\/b> (opzettelijk): gevangenisstraf van ten hoogste zes jaren, taakstraf of geldboete van de vijfde categorie;<\/li><li><b>overtreding<\/b>: hechtenis van ten hoogste een jaar, taakstraf of geldboete van de vierde categorie.<\/li><\/ul><p>Dit zijn maximumstraffen. De officier van justitie en de rechter bepalen wat er in een concrete zaak gebeurt.<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>Wet op de economische delicten, geldend vanaf 1 augustus 2026 – https://wetten.overheid.nl/BWBR0002063/2026-08-01<\/li><\/ol><\/div>"},{"kind":"figuur","titel":"Van regel naar opsporingsbevoegdheid","html":"<div class=\"figcap\">Van regel naar opsporingsbevoegdheid<\/div><figure class=\"illu\"><svg viewBox=\"0 0 560 60\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>Van regel naar opsporingsbevoegdheid<\/title><desc>De juridische keten: artikel 9.2.2.1a Wet milieubeheer, artikel 1a WED, economisch delict, opsporingsbevoegdheid, algemene en bijzondere opsporingsbevoegdheden.<\/desc><\/svg><\/figure>"},{"kind":"onthoud","titel":"Kort samengevat","html":"<h2 class=\"ptitle\">Kort samengevat<\/h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-t\">Artikel 9.2.2.1a Wm<\/div><div class=\"kaart-b\"><ul class=\"punten\"><li>Sinds 1 augustus 2026 zijn bezit, gebruik en verkoop van F2 en F3 verboden voor anderen dan personen met gespecialiseerde kennis.<\/li><li>De burgemeester kan een ontheffing geven voor aangewezen F2-vuurwerk tijdens de jaarwisseling.<\/li><\/ul><\/div><\/div>"},{"kind":"onthoud","titel":"Kort samengevat","html":"<h2 class=\"ptitle\">Kort samengevat<\/h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-t\">WED en werkwijze<\/div><div class=\"kaart-b\"><ul class=\"punten\"><li>Overtreding van artikel 9.2.2.1a Wm is een economisch delict (artikel 1a WED).<\/li><li>Opzettelijk is het een misdrijf, anders een overtreding (artikel

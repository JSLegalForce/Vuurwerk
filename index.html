t-b\"><p class=\"law-intro\">Je bent geen algemene opsporingsambtenaar. Je bevoegdheid staat in je akte.</p><div class=\"law-quote\"><div class=\"law-quote-head\"><span class=\"law-quote-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/></svg></span><span>Wettekst</span></div><p class=\"wet law-text\">«1 Met de opsporing van strafbare feiten zijn als buitengewoon opsporingsambtenaar belast:<br>a. de personen aan wie door Onze Minister van Veiligheid en Justitie, onderscheidenlijk het College van procureurs-generaal een akte van opsporingsbevoegdheid is verleend; (…)<br>2 De opsporingsbevoegdheid, bedoeld in het eerste lid, onder a en b, strekt zich uit tot de in de akte of aanwijzing aangeduide strafbare feiten. De akte of aanwijzing kan daartoe verwijzen naar een bij regeling van Onze Minister van Justitie en Veiligheid vastgesteld domein. (…)» <em>(fragment)</em></p></div><div class=\"law-grid\"><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><span>In gewone taal</span></div><p>Je bent boa door een akte of aanwijzing. Je bent alleen bevoegd voor de strafbare feiten die daarin staan. De akte kan verwijzen naar een domein.</p></section><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><span>Wat betekent dit voor jou als boa?</span></div><p>Een strafbaar feit zien is dus iets anders dan ervoor bevoegd zijn. Deze cursus gaat uit van domein I, Openbare ruimte.</p></section></div></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0001903/2026-07-01\" target=\"_blank\" rel=\"noopener\">Wetboek van Strafvordering</a> <span class=\"bb-toel\">art. 142, geldend vanaf 1 juli 2026</span></li></ol></div>"},{"kind":"kader","titel":"Domein I, onderdeel 9","html":"<h2 class=\"ptitle\">Domein I, onderdeel 9</h2><div class=\"kaart k-kader law-card\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><span class=\"kaart-lab\">Wettelijk bevoegd</span></div><div class=\"kaart-t\">Regeling domeinlijsten buitengewoon opsporingsambtenaar</div><div class=\"kaart-b\"><p class=\"law-intro\">Sinds 8 september 2026 luidt onderdeel 9 van domein I zo (Stcrt. 2026, 31362).</p><div class=\"law-quote\"><div class=\"law-quote-head\"><span class=\"law-quote-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/></svg></span><span>Wettekst</span></div><p class=\"wet law-text\">«De boa Openbare ruimte is belast met de opsporing van de strafbare feiten in de volgende wettelijke voorschriften voor zover noodzakelijk voor een goede uitoefening van de functie en de daaraan gekoppelde taakomschrijving, tenzij de wet zich daartegen verzet.<br>(…)<br>9. Artikel 9.2.2.1a Wet Milieubeheer juncto artikel 1a Wet op de economische delicten;» <em>(aanhef en onderdeel 9)</em></p></div><div class=\"law-grid\"><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><span>In gewone taal</span></div><p>Verwijst je akte naar domein I, dan mag je overtredingen van art. 9.2.2.1a Wm opsporen, voor zover dat nodig is voor je functie en taakomschrijving. «Juncto» betekent: in samenhang met.</p></section><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><span>Wat betekent dit voor jou als boa?</span></div><p>Volgens de toelichting kunnen boa’s zo «blijven optreden tegen het afsteken en het voorhanden hebben van vuurwerk». Het Handhavingsplan (maart 2026) zegt nog dat boa’s in domein I niet bevoegd zijn voor bezit. Die passage is ouder dan de nieuwe domeinlijst.</p></section></div></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0041447/2026-09-08\" target=\"_blank\" rel=\"noopener\">Regeling domeinlijsten buitengewoon opsporingsambtenaar</a> <span class=\"bb-toel\">Domein I, geldend vanaf 8 september 2026 (ministeriële regeling)</span></li><li><a href=\"https://zoek.officielebekendmakingen.nl/stcrt-2026-31362.html\" target=\"_blank\" rel=\"noopener\">Wijziging Regeling domeinlijsten</a> <span class=\"bb-toel\">Stcrt. 2026, 31362, met toelichting (ministeriële regeling)</span></li><li><a href=\"https://www.rijksoverheid.nl/documenten/rapporten/2026/03/16/tk-bijlage-geactualiseerd-handhavingsplan-jaarwisseling-feb-2026\" target=\"_blank\" rel=\"noopener\">Handhavingsplan jaarwisseling</a> <span class=\"bb-toel\">Ministerie van Justitie en Veiligheid, maart 2026 (beleid, geen bevoegdheidsgrondslag)</span></li></ol></div>"},{"kind":"theory","titel":"Wat volgt wél en wat níet uit onderdeel 9?","html":"<span class=\"q-soort\">Wettelijk bevoegd</span><h2 class=\"ptitle\">Wat volgt wél en wat níet uit onderdeel 9?</h2><div class=\"main\"><p><b>Wél:</b> verwijst je akte naar domein I, dan mag je overtredingen van art. 9.2.2.1a Wm opsporen: bezit, gebruik en verkoop van F2 en F3. Dat geldt voor zover het nodig is voor jouw functie en taakomschrijving.</p><p><b>Níet:</b> dat je bevoegd bent voor alle vuurwerkfeiten. Ook niet dat je elke dwangmaatregel mag gebruiken: elke bevoegdheid heeft eigen voorwaarden (hoofdstuk 4). En ook niet dat je moet optreden, of dat optreden veilig is (hoofdstuk 5).</p><p>Onderdeel 9 is niet het enige onderdeel dat bij vuurwerk een rol kan spelen. Denk aan een APV-bepaling waarvoor je bent aangewezen (dat verschilt per gemeente) of een opdracht van de officier van justitie (onderdeel 21). Kijk steeds naar je akte, je taak en het concrete feit.</p><p>Twijfel je of iets bij je functie en taak hoort? Vraag het je werkgever of leidinggevende.</p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0041447/2026-09-08\" target=\"_blank\" rel=\"noopener\">Regeling domeinlijsten buitengewoon opsporingsambtenaar</a> <span class=\"bb-toel\">Domein I, geldend vanaf 8 september 2026 (ministeriële regeling)</span></li></ol></div>"},{"kind":"kader","titel":"WED-opsporingsambtenaar: artikel 17 WED","html":"<h2 class=\"ptitle\">WED-opsporingsambtenaar: artikel 17 WED</h2><div class=\"kaart k-kader law-card\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><span class=\"kaart-lab\">Wettelijk bevoegd</span></div><div class=\"kaart-t\">Artikel 17 · Wet op de economische delicten</div><div class=\"kaart-b\"><p class=\"law-intro\">De WED heeft eigen bevoegdheden. Die gelden voor «de opsporingsambtenaren» uit artikel 17.</p><div class=\"law-quote\"><div class=\"law-quote-head\"><span class=\"law-quote-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/></svg></span><span>Wettekst</span></div><p class=\"wet law-text\">«1 Met de opsporing van economische delicten zijn belast: (…)<br>2°. de door Onze Minister van Veiligheid en Justitie, in overeenstemming met Onze andere Ministers, wie het aangaat, aangewezen ambtenaren; (…)<br>3 Artikel 142, tweede en vierde lid, van het Wetboek van Strafvordering is van overeenkomstige toepassing op de in het eerste lid, onder 2° en 3°, bedoelde opsporingsambtenaren.» <em>(fragment)</em></p></div><div class=\"law-grid\"><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><span>In gewone taal</span></div><p>De minister kan ambtenaren aanwijzen voor de opsporing van economische delicten (lid 1 onder 2°). Die aanwijzing mag verwijzen naar een domein (lid 3).</p></section><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><span>Wat betekent dit voor jou als boa?</span></div><p>De WED-bevoegdheden kun je alleen gebruiken als je voor dit economische delict bent aangewezen als opsporingsambtenaar in de zin van art. 17 WED. De Regeling domeinlijsten is mede vastgesteld «gelet op (…) artikel 17, derde lid» WED. Of jouw akte die aanwijzing voor onderdeel 9 omvat, staat in je akte: controleer je akte. De bevoegdheden gelden dan alleen voor dat feit en onder hun eigen voorwaarden.</p></section></div><div class=\"law-definition\"><span class=\"law-definition-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><p>De Beleidsregels boa beschrijven dit ook. Maar beleidsregels zijn beleid: ze geven zelf geen bevoegdheid.</p></div></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0002063/2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet op de economische delicten</a> <span class=\"bb-toel\">art. 17, geldend vanaf 1 augustus 2026</span></li><li><a href=\"https://wetten.overheid.nl/BWBR0041447/2026-09-08\" target=\"_blank\" rel=\"noopener\">Regeling domeinlijsten buitengewoon opsporingsambtenaar</a> <span class=\"bb-toel\">aanhef, geldend vanaf 8 september 2026</span></li><li><a href=\"https://wetten.overheid.nl/BWBR0039766/2026-09-01\" target=\"_blank\" rel=\"noopener\">Beleidsregels buitengewoon opsporingsambtenaar</a> <span class=\"bb-toel\">geldend vanaf 1 september 2026 (beleid, geen bevoegdheidsgrondslag)</span></li></ol></div>"},{"kind":"kader","titel":"Welk feit? De categorie is nog geen conclusie","html":"<span class=\"q-soort\">Wettelijk bevoegd</span><h2 class=\"ptitle\">Welk feit? De categorie is nog geen conclusie</h2><div class=\"cc\"><div class=\"cc-vis\"><div class=\"cc-ring\" aria-hidden=\"true\"></div><figure class=\"cc-doos\"><img src=\"assets/images/concl-verpakking.webp?v=vw260924a\" alt=\"Vuurwerkverpakking met een etiket waarop de categorie staat\" width=\"230\" height=\"280\" loading=\"eager\" decoding=\"async\"></figure><figure class=\"cc-item cc-f1\"><span class=\"cc-foto\"><img src=\"assets/images/concl-f1.webp?v=vw260924a\" alt=\"Brandend sterretje in een hand\" width=\"240\" height=\"240\" loading=\"eager\" decoding=\"async\"></span><span class=\"cc-badge\" aria-hidden=\"true\">F1</span><figcaption><b>F1</b><span>Zeer licht vuurwerk</span></figcaption></figure><figure class=\"cc-item cc-f2\"><span class=\"cc-foto\"><img src=\"assets/images/concl-f2.webp?v=vw260924a\" alt=\"Rood vuurwerk met een brandend lontje\" width=\"240\" height=\"240\" loading=\"eager\" decoding=\"async\"></span><span class=\"cc-badge\" aria-hidden=\"true\">F2</span><figcaption><b>F2</b><span>Weinig gevaar</span></figcaption></figure><figure class=\"cc-item cc-f3\"><span class=\"cc-foto\"><img src=\"assets/images/concl-f3.webp?v=vw260924a\" alt=\"Vonkenregen van een fontein\" width=\"240\" height=\"240\" loading=\"eager\" decoding=\"async\"></span><span class=\"cc-badge\" aria-hidden=\"true\">F3</span><figcaption><b>F3</b><span>Middelmatig gevaar</span></figcaption></figure><figure class=\"cc-item cc-f4\"><span class=\"cc-foto\"><img src=\"assets/images/concl-f4.webp?v=vw260924a\" alt=\"Vuurpijlen\" width=\"240\" height=\"240\" loading=\"eager\" decoding=\"async\"></span><span class=\"cc-badge\" aria-hidden=\"true\">F4</span><figcaption><b>F4</b><span>Veel gevaar</span></figcaption></figure><figure class=\"cc-item cc-onbekend\"><span class=\"cc-foto\"><img src=\"assets/images/concl-onbekend.webp?v=vw260924a\" alt=\"Vuurwerkobject zonder etiket of zichtbare categorie\" width=\"240\" height=\"240\" loading=\"eager\" decoding=\"async\"></span><span class=\"cc-badge\" aria-hidden=\"true\">?</span><figcaption><b>Niet vast te stellen</b><span>geen wettelijke categorie</span></figcaption></figure><p class=\"cc-hint\">Eerst het feit, dan de bevoegdheid.</p><p class=\"cc-noot\">De foto’s zijn voorbeelden. Het uiterlijk bewijst de categorie niet.</p></div><div class=\"cc-tekst\"><div class=\"cc-intro\"><span class=\"cc-intro-ic\" data-i=\"lijst\"></span><p>Dit hoort bij de vier vragen. Vraag 1: wat zie je en welke categorie kun je betrouwbaar vaststellen? Vraag 2: welke gedraging zie je en welk strafbaar feit hoort daarbij? Vraag 3: ben je voor <b>dát</b> feit bevoegd?</p></div><div class=\"cc-kaarten\"><article class=\"cc-kaart cc-k-f1\"><span class=\"cc-kb\" aria-hidden=\"true\">F1</span><div><h3>F1</h3><p>Is het echt F1, dan valt het niet onder art. 9.2.2.1a Wm. Onderdeel 9 speelt dan niet.</p></div></article><article class=\"cc-kaart cc-k-f23\"><span class=\"cc-kb\" aria-hidden=\"true\"><span>F2</span><span>F3</span></span><div><h3>F2 en F3</h3><p>Zie je bezit, gebruik of verkoop en geldt geen uitzondering? Dan kan art. 9.2.2.1a Wm zijn overtreden. Voor dát feit geeft onderdeel 9 bevoegdheid, binnen je akte, functie en taak.</p></div></article><article class=\"cc-kaart cc-k-f4\"><span class=\"cc-kb\" aria-hidden=\"true\">F4</span><div><h3>F4</h3><p>Onderdeel 9 geeft geen algemene bevoegdheid voor feiten uit het Vuurwerkbesluit over F4. Dat kan anders zijn als de officier van justitie je voor een concreet onderzoek of project met andere feiten belast (onderdeel 21).</p></div></article><article class=\"cc-kaart cc-k-onb\"><span class=\"cc-kb\" aria-hidden=\"true\">?</span><div><h3>Categorie niet vast te stellen</h3><p>«Onbekend vuurwerk» is geen wettelijke categorie. Voor een verdenking is een redelijk vermoeden genoeg, geen zekerheid (art. 27 Sv). Beoordeel je bevoegdheid op wat je echt kunt vaststellen.</p></div></article></div><div class=\"cc-etiket\"><span class=\"cc-intro-ic\" data-i=\"document\"></span><p><b>Samenloop:</b> F3 in een tas is ook strijdig met het Vuurwerkbesluit. Jij spoort het feit op waarvoor jij bevoegd bent: art. 9.2.2.1a Wm.</p></div><div class=\"cc-conclusie\"><span class=\"cc-intro-ic\" data-i=\"vink\"></span><p>Dus nooit: «Het is F3, dus ik ben bevoegd.» En ook niet: «Het is F4, dus ik ben nooit bevoegd.» Boa’s in domein II hebben andere bevoegdheden.</p></div></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0041447/2026-09-08\" target=\"_blank\" rel=\"noopener\">Regeling domeinlijsten buitengewoon opsporingsambtenaar</a> <span class=\"bb-toel\">Domein I, onderdelen 9 en 21, geldend vanaf 8 september 2026</span></li><li><a href=\"https://wetten.overheid.nl/BWBR0003245/2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet milieubeheer</a> <span class=\"bb-toel\">art. 9.2.2.1a, geldend vanaf 1 augustus 2026</span></li><li><a href=\"https://wetten.overheid.nl/BWBR0013360/2026-08-01\" target=\"_blank\" rel=\"noopener\">Vuurwerkbesluit</a> <span class=\"bb-toel\">art. 1.2.2, geldend vanaf 1 augustus 2026</span></li><li><a href=\"https://wetten.overheid.nl/BWBR0001903/2026-07-01\" target=\"_blank\" rel=\"noopener\">Wetboek van Strafvordering</a> <span class=\"bb-toel\">art. 27, geldend vanaf 1 juli 2026</span></li></ol></div>"}],"titel":"Wanneer ben jij als boa bevoegd?","type":"content","vragen":[{"vraag":"Je bent boa in domein I. Je taak is vooral parkeertoezicht. Je ziet iemand een doos met «F2» afsteken. Wat is juist?","opties":["Je bent altijd bevoegd, want onderdeel 9 staat in domein I.","Je bent nooit bevoegd, want vuurwerk is geen parkeerfeit.","Je gaat na of opsporen past bij je functie en taakomschrijving.","Je bent alleen bevoegd tijdens de jaarwisseling."],"juist":2,"uitleg":"Domein I geldt «voor zover noodzakelijk voor een goede uitoefening van de functie en de daaraan gekoppelde taakomschrijving». Je bent dus niet automatisch bevoegd, maar ook niet automatisch onbevoegd. Check je functie en taak bij je werkgever. [[1]]","soort":"Praktijkcasus","artikel":"Domein I","wet":"Regeling domeinlijsten","voetnoten":["Regeling domeinlijsten boa, Domein I (geldend vanaf 8 september 2026)."]},{"vraag":"Bij een controle zie je in een kofferbak een doos met «F4». Je bent boa in domein I en hebt geen opdracht van de officier van justitie. Geeft onderdeel 9 jou bevoegdheid voor dit F4-feit?","opties":["Ja, al het vuurwerk valt onder onderdeel 9.","Nee. Onderdeel 9 gaat over art. 9.2.2.1a Wm (F2 en F3), niet over feiten uit het Vuurwerkbesluit over F4.","Ja, maar alleen op 31 december.","Nee, want F4-vuurwerk is nooit strafbaar."],"juist":1,"uitleg":"Art. 9.2.2.1a Wm noemt F4 niet. Regels over F4 staan in het Vuurwerkbesluit (bijv. art. 1.2.2) en zijn strafbaar via art. 9.2.2.1 Wm en art. 1a WED. Dat feit staat niet in onderdeel 9. Een opdracht van de officier voor een concreet onderzoek of project (onderdeel 21) kan dat veranderen. [[1]]","soort":"Praktijkcasus","artikel":"—","wet":"—","kernregel":"Eerst het feit, dan de bevoegdheid.","voetnoten":["Regeling domeinlijsten boa, Domein I, onderdelen 9 en 21 (geldend vanaf 8 september 2026)."]},{"vraag":"Een collega wijst op het Handhavingsplan (maart 2026): «Boa’s in domein I zijn niet bevoegd voor bezit van vuurwerk.» Wat is juist?","opties":["Dat klopt: het Handhavingsplan gaat voor de domeinlijst.","Dat klopt, maar alleen buiten de jaarwisseling.","Die passage is ouder dan de domeinlijst van 8 september 2026. Voor bevoegdheid kijk je naar de geldende domeinlijst.","Een handhavingsplan geldt nooit voor boa’s."],"juist":2,"uitleg":"Het Handhavingsplan is beleid en geeft of neemt geen bevoegdheid. Sinds 8 september 2026 staat art. 9.2.2.1a Wm jo. art. 1a WED in domein I, onderdeel 9. Dat omvat ook het bezit. [[1]]","soort":"Praktijkcasus","artikel":"—","wet":"—","kernregel":"Beleid is geen bevoegdheidsgrondslag.","voetnoten":["Regeling domeinlijsten boa, Domein I, onderdeel 9, zoals gewijzigd bij Stcrt. 2026, 31362."]},{"vraag":"Je ziet een jongen iets afsteken. Er is een harde knal. Een verpakking vind je niet. Welke uitspraak is juist?","opties":["Je mag pas iets doen als de categorie zeker vaststaat.","Je gaat ervan uit dat het F2 was, want dan ben je bevoegd.","Je gaat ervan uit dat het F4 was.","Voor een verdenking is een redelijk vermoeden genoeg. Leg vast waarop dat vermoeden rust en gok niet naar de categorie."],"juist":3,"uitleg":"Verdachte is degene tegen wie uit feiten of omstandigheden een redelijk vermoeden van schuld volgt (art. 27 Sv). Zekerheid over de categorie is dan niet nodig. Maar je vult niet zelf een categorie in. Je beschrijft wat je hebt waargenomen. [[1]]","soort":"Praktijkcasus","artikel":"Art. 27 Sv","wet":"Wetboek van Strafvordering","voetnoten":["Wetboek van Strafvordering, art. 27 (geldend vanaf 1 juli 2026)."]}]},{"icoon":"route","id":"m4","kader":"Wettelijk bevoegd","nr":4,"pages":[{"kind":"figuur","titel":"Bevoegdheid, verplichting of strafbaarstelling?","html":"<div class=\"figcap\">Bevoegdheid, verplichting of strafbaarstelling?</div><figure class=\"illu\"><svg viewBox=\"0 0 560 60\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>Bevoegdheid, verplichting of strafbaarstelling?</title><desc>Bevoegdheid: staande houden (art. 52 Sv), aanhouden op heterdaad (art. 53 Sv), aanhouden buiten heterdaad als aan de voorwaarden is voldaan (art. 54 Sv), inbeslagneming en uitlevering vorderen (art. 18 WED), vervoermiddel stilhouden en onderzoeken (art. 23 WED), feitelijk handelen bij niet meewerken (art. 24a lid 3 WED). Verplichting: iedereen moet meewerken aan een redelijke vordering (art. 24a lid 1 WED). Strafbaarstelling: opzettelijk niet voldoen aan een vordering (art. 26 WED).</desc></svg></figure>"},{"kind":"kader","titel":"Aanspreken en staande houden","html":"<h2 class=\"ptitle\">Aanspreken en staande houden</h2><div class=\"kaart k-kader law-card\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><span class=\"kaart-lab\">Wettelijk bevoegd</span></div><div class=\"kaart-t\">Artikel 27 en 52 · Wetboek van Strafvordering</div><div class=\"kaart-b\"><p class=\"law-intro\">Staande houden mag alleen bij een verdachte.</p><div class=\"law-quote\"><div class=\"law-quote-head\"><span class=\"law-quote-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/></svg></span><span>Wettekst</span></div><p class=\"wet law-text\">«Als verdachte wordt vóórdat de vervolging is aangevangen, aangemerkt degene te wiens aanzien uit feiten of omstandigheden een redelijk vermoeden van schuld aan een strafbaar feit voortvloeit.» (art. 27 lid 1)<br>«Iedere opsporingsambtenaar is bevoegd de identiteit van de verdachte vast te stellen op de wijze, bedoeld in artikel 27a, eerste lid, eerste volzin, en hem daartoe staande te houden.» (art. 52)</p></div><div class=\"law-grid\"><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><span>In gewone taal</span></div><p>Een verdachte is iemand tegen wie een redelijk vermoeden bestaat, gebaseerd op feiten of omstandigheden. Een verdachte mag je laten stoppen. Je vraagt naar naam, geboorteplaats, geboortedatum en adressen (art. 27a Sv).</p></section><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><span>Wat betekent dit voor jou als boa?</span></div><p>Je eigen waarneming telt: zie je iemand een doos met «F2» vasthouden, dan kan dat een redelijk vermoeden opleveren. Een gevoel is niet genoeg. Nog geen verdenking? Dan kun je alleen aanspreken. Dat is een gewoon gesprek; de persoon mag doorlopen.</p></section></div></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0001903/2026-07-01\" target=\"_blank\" rel=\"noopener\">Wetboek van Strafvordering</a> <span class=\"bb-toel\">art. 27, 27a en 52, geldend vanaf 1 juli 2026</span></li></ol></div>"},{"kind":"kader","titel":"Aanhouden op heterdaad","html":"<h2 class=\"ptitle\">Aanhouden op heterdaad</h2><div class=\"kaart k-kader law-card\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><span class=\"kaart-lab\">Wettelijk bevoegd</span></div><div class=\"kaart-t\">Artikel 53 en 128 · Wetboek van Strafvordering</div><div class=\"kaart-b\"><p class=\"law-intro\">Heterdaad: je ontdekt het feit terwijl het gebeurt of meteen daarna.</p><div class=\"law-quote\"><div class=\"law-quote-head\"><span class=\"law-quote-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/></svg></span><span>Wettekst</span></div><p class=\"wet law-text\">«1 In geval van ontdekking op heterdaad van een strafbaar feit is een ieder bevoegd de verdachte aan te houden.<br>2 De opsporingsambtenaar die een verdachte bij ontdekking op heterdaad aanhoudt, brengt deze ten spoedigste over naar de plaats voor verhoor ter voorgeleiding aan de hulpofficier van justitie of de officier van justitie.» (art. 53)<br>«1 Ontdekking op heeter daad heeft plaats, wanneer het strafbare feit ontdekt wordt, terwijl het begaan wordt of terstond nadat het begaan is.» (art. 128) <em>(fragmenten)</em></p></div><div class=\"law-grid\"><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><span>In gewone taal</span></div><p>Bij heterdaad mag iedereen de verdachte aanhouden. Jij brengt hem dan zo snel mogelijk naar de plaats voor verhoor, voor de (hulp)officier van justitie.</p></section><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><span>Wat betekent dit voor jou als boa?</span></div><p>Aanhouden is een zware maatregel. Vaak is staande houden en een proces-verbaal genoeg. Welke middelen jij daarbij mag gebruiken, hangt af van wat jou is toegekend (taak/werkgever).</p></section></div></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0001903/2026-07-01\" target=\"_blank\" rel=\"noopener\">Wetboek van Strafvordering</a> <span class=\"bb-toel\">art. 53 en 128, geldend vanaf 1 juli 2026</span></li></ol></div>"},{"kind":"kader","titel":"Aanhouden buiten heterdaad","html":"<h2 class=\"ptitle\">Aanhouden buiten heterdaad</h2><div class=\"kaart k-kader law-card\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><span class=\"kaart-lab\">Wettelijk bevoegd</span></div><div class=\"kaart-t\">Artikel 54 en 67 · Wetboek van Strafvordering</div><div class=\"kaart-b\"><p class=\"law-intro\">Is het geen heterdaad meer? Dan gelden strengere regels.</p><div class=\"law-quote\"><div class=\"law-quote-head\"><span class=\"law-quote-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/></svg></span><span>Wettekst</span></div><p class=\"wet law-text\">«1 Buiten het geval van ontdekking op heterdaad is de opsporingsambtenaar op bevel van de officier van justitie bevoegd de verdachte van een misdrijf waarvoor voorlopige hechtenis is toegelaten, aan te houden (…).<br>(…)<br>4 Indien het bevel van de officier van justitie of de hulpofficier van justitie niet kan worden afgewacht, is de opsporingsambtenaar bevoegd de verdachte aan te houden (…).» (art. 54) <em>(fragment)</em></p></div><div class=\"law-grid\"><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><span>In gewone taal</span></div><p>Buiten heterdaad mag alleen worden aangehouden bij een misdrijf waarvoor voorlopige hechtenis is toegelaten. In beginsel op bevel van de officier van justitie, of van de hulpofficier als dat bevel niet kan worden afgewacht (lid 3). Pas als ook dat niet kan, mag jij zelf aanhouden (lid 4).</p></section><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><span>Wat betekent dit voor jou als boa?</span></div><p>Opzettelijke overtreding van art. 9.2.2.1a Wm is een misdrijf met maximaal zes jaar gevangenisstraf. Dan is voorlopige hechtenis toegelaten (art. 67 lid 1 onder a Sv: vier jaar of meer). Zonder opzet is het een overtreding: dan kan het niet. Twijfel? Leg vast en overleg.</p></section></div></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0001903/2026-07-01\" target=\"_blank\" rel=\"noopener\">Wetboek van Strafvordering</a> <span class=\"bb-toel\">art. 54 en 67, geldend vanaf 1 juli 2026</span></li><li><a href=\"https://wetten.overheid.nl/BWBR0002063/2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet op de economische delicten</a> <span class=\"bb-toel\">art. 2 en 6, geldend vanaf 1 augustus 2026</span></li></ol></div>"},{"kind":"kader","titel":"Vervoermiddel: stilhouden, onderzoeken, meewerken","html":"<h2 class=\"ptitle\">Vervoermiddel: stilhouden, onderzoeken, meewerken</h2><div class=\"kaart k-kader law-card\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><span class=\"kaart-lab\">Wettelijk bevoegd</span></div><div class=\"kaart-t\">Artikel 23, 24a en 26 · Wet op de economische delicten</div><div class=\"kaart-b\"><p class=\"law-intro\">Voor een economisch delict mag je een voertuig laten stoppen en onderzoeken.</p><div class=\"law-quote\"><div class=\"law-quote-head\"><span class=\"law-quote-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/></svg></span><span>Wettekst</span></div><p class=\"wet law-text\">«2 Zij zijn bevoegd in het belang van de opsporing vervoermiddelen waarmee naar hun redelijk oordeel zaken worden vervoerd op hun lading te onderzoeken (…), voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is. (…)<br>4 Zij zijn bevoegd (…) van de bestuurder van een voertuig (…) te vorderen dat deze zijn vervoermiddel stilhoudt (…).» (art. 23) <em>(fragment)</em></p></div><div class=\"law-grid\"><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><span>In gewone taal</span></div><p>Je mag vorderen dat de bestuurder stilhoudt (lid 4). Je mag het voertuig en de lading onderzoeken (lid 1 en 2). Steeds alleen voor zover dat redelijkerwijs nodig is.</p></section><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><span>Wat betekent dit voor jou als boa?</span></div><p><b>Art. 24a lid 1</b> is een plicht: iedereen moet meewerken aan wat jij redelijkerwijs vordert. <b>Art. 24a lid 3</b> is een bevoegdheid: werkt iemand niet mee, dan mag je zelf feitelijk handelen, voor zover redelijkerwijs nodig. <b>Art. 26</b> maakt het opzettelijk niet voldoen aan je vordering strafbaar.</p></section></div><div class=\"law-definition\"><span class=\"law-definition-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><p>Of jij in de praktijk zelf feitelijk optreedt, hangt ook af van je instructie en de veiligheid (hoofdstuk 5).</p></div></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0002063/2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet op de economische delicten</a> <span class=\"bb-toel\">art. 23, 24a en 26, geldend vanaf 1 augustus 2026</span></li></ol></div>"},{"kind":"kader","titel":"Inbeslagneming en uitlevering","html":"<h2 class=\"ptitle\">Inbeslagneming en uitlevering</h2><div class=\"kaart k-kader law-card\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><span class=\"kaart-lab\">Wettelijk bevoegd</span></div><div class=\"kaart-t\">Artikel 18 · Wet op de economische delicten</div><div class=\"kaart-b\"><p class=\"law-intro\">Aantreffen is iets anders dan in beslag nemen.</p><div class=\"law-quote\"><div class=\"law-quote-head\"><span class=\"law-quote-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/></svg></span><span>Wettekst</span></div><p class=\"wet law-text\">«1 De opsporingsambtenaren zijn in het belang van de opsporing bevoegd tot inbeslagneming van daarvoor vatbare voorwerpen voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is. Zij kunnen daartoe hun uitlevering vorderen.» <em>(eerste lid)</em></p></div><div class=\"law-grid\"><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><span>In gewone taal</span></div><p>Je mag voorwerpen in beslag nemen die daarvoor vatbaar zijn, als dat nodig is voor de opsporing. Je mag eisen dat iemand ze afgeeft: uitlevering vorderen.</p></section><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><span>Wat betekent dit voor jou als boa?</span></div><p>Houd je een verdachte staande, dan kan beslag ook op grond van art. 95 Sv. Maak altijd een kennisgeving van inbeslagneming en geef zo mogelijk een bewijs van ontvangst. De kennisgeving gaat zo snel mogelijk naar de hulpofficier (art. 94 lid 3 Sv).</p></section></div></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0002063/2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet op de economische delicten</a> <span class=\"bb-toel\">art. 18, geldend vanaf 1 augustus 2026</span></li><li><a href=\"https://wetten.overheid.nl/BWBR0001903/2026-07-01\" target=\"_blank\" rel=\"noopener\">Wetboek van Strafvordering</a> <span class=\"bb-toel\">art. 94 en 95, geldend vanaf 1 juli 2026</span></li></ol></div>"},{"kind":"kaart","titel":"Grenzen en vastleggen","html":"<h2 class=\"ptitle\">Grenzen en vastleggen</h2><div class=\"kaart k-letop\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17h.01\"/></svg></span><span class=\"kaart-lab\">Let op</span></div><div class=\"kaart-t\">Drie grenzen</div><div class=\"kaart-b\"><p>WED-bevoegdheden gelden alleen «voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is». Kan het lichter? Doe het lichter.</p><p>«Veiligstellen» is geen aparte bevoegdheid. Benoem steeds de handeling en de grondslag, bijvoorbeeld inbeslagneming (art. 18 WED).</p><p>Leg elke bevoegdheid vast in je proces-verbaal: wat deed je, waarom, en op welke grondslag?</p></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0002063/2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet op de economische delicten</a> <span class=\"bb-toel\">art. 18, 23 en 24a, geldend vanaf 1 augustus 2026</span></li><li><a href=\"https://wetten.overheid.nl/BWBR0001903/2026-07-01\" target=\"_blank\" rel=\"noopener\">Wetboek van Strafvordering</a> <span class=\"bb-toel\">geldend vanaf 1 juli 2026</span></li></ol></div>"}],"titel":"Wat kun je als boa doen?","type":"content","vragen":[{"vraag":"Je spreekt een jongen aan die naast een tas staat. Je hebt nog geen aanwijzing voor een strafbaar feit. Mag je hem staande houden?","opties":["Ja, een boa mag iedereen staande houden.","Ja, als hij in de buurt van vuurwerk staat.","Nee, je kunt wel aanspreken. Staande houden kan bij een verdachte.","Nee, staande houden mag alleen de politie."],"juist":2,"uitleg":"Art. 52 Sv geeft de bevoegdheid om de identiteit van de verdachte vast te stellen en hem daartoe staande te houden. Zonder redelijk vermoeden (art. 27 Sv) kun je alleen aanspreken. [[1]]","soort":"Praktijkcasus","artikel":"Art. 52 Sv","wet":"Wetboek van Strafvordering","voetnoten":["Wetboek van Strafvordering, art. 27 en 52 (geldend vanaf 1 juli 2026)."]},{"vraag":"Je onderzoekt de lading van een auto (art. 23 WED). De bestuurder weigert opzettelijk de kofferbak te openen. Welk artikel maakt die weigering strafbaar?","opties":["Art. 24a lid 1 WED.","Art. 26 WED.","Art. 23 lid 4 WED.","Art. 52 Sv."],"juist":1,"uitleg":"Art. 26 WED maakt het opzettelijk niet voldoen aan een WED-vordering strafbaar. Art. 24a lid 1 WED is de plicht om mee te werken, geen strafbaarstelling. Art. 24a lid 3 WED geeft je de bevoegdheid om zelf feitelijk te handelen, voor zover redelijkerwijs nodig. [[1]]","soort":"Praktijkcasus","artikel":"Art. 26 WED","wet":"Wet op de economische delicten","kernregel":"Lid 1 = plicht · lid 3 = bevoegdheid · art. 26 = strafbaar.","voetnoten":["Wet op de economische delicten, art. 24a en 26 (geldend vanaf 1 augustus 2026)."]},{"vraag":"Je hebt twee dozen met «F2» in beslag genomen. Wat moet je daarna doen?","opties":["Niets, de verdachte weet het al.","Een kennisgeving van inbeslagneming maken, zo mogelijk een bewijs van ontvangst geven en de kennisgeving zo snel mogelijk naar de hulpofficier sturen.","De dozen teruggeven als de verdachte belooft ze niet af te steken.","Een verzoek om ontheffing indienen bij de burgemeester."],"juist":1,"uitleg":"Van elke inbeslagneming maakt de opsporingsambtenaar een kennisgeving. Zoveel mogelijk krijgt de betrokkene een bewijs van ontvangst. De kennisgeving gaat zo spoedig mogelijk naar de hulpofficier van justitie (art. 94 lid 3 Sv). [[1]]","soort":"Praktijkcasus","artikel":"Art. 94 Sv","wet":"Wetboek van Strafvordering","voetnoten":["Wetboek van Strafvordering, art. 94 (geldend vanaf 1 juli 2026)."]},{"vraag":"Een collega zag gisteren dat een jongen opzettelijk F3-vuurwerk afstak. Vandaag zie je de jongen op straat. Wat is juist?","opties":["Je mag hem nu zelf aanhouden, net als bij heterdaad.","Aanhouden kan nooit, want vuurwerk is altijd een overtreding.","In beginsel houd je hem alleen aan op bevel van de officier of hulpofficier. Overleg dus eerst.","Je mag hem aanhouden als hij zijn naam niet wil geven."],"juist":2,"uitleg":"Dit is geen heterdaad meer (art. 128 Sv). Buiten heterdaad kan alleen worden aangehouden bij een misdrijf waarvoor voorlopige hechtenis is toegelaten (art. 54 en 67 Sv). Dat is in beginsel op bevel van de officier of hulpofficier. Alleen als dat bevel niet kan worden afgewacht, mag de opsporingsambtenaar zelf aanhouden. [[1]]","soort":"Praktijkcasus","artikel":"Art. 54 Sv","wet":"Wetboek van Strafvordering","voetnoten":["Wetboek van Strafvordering, art. 54, 67 en 128 (geldend vanaf 1 juli 2026)."]}]},{"icoon":"waarschuwing","id":"m5","kader":"Veiligheid en taak","nr":5,"pages":[{"kind":"kaart","titel":"Veiligheid: stop met zelf onderzoeken","html":"<span class=\"q-soort\">Veiligheid</span><h2 class=\"ptitle\">Veiligheid: stop met zelf onderzoeken</h2><div class=\"kaart k-letop\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17h.01\"/></svg></span><span class=\"kaart-lab\">Veiligheid</span></div><div class=\"kaart-t\">Onbekend of mogelijk zwaar vuurwerk</div><div class=\"kaart-b\"><p>Een bevoegdheid is geen plicht. Art. 21 WED geeft je zelfs de bevoegdheid om verpakkingen te openen. Bij onbekend of mogelijk zwaar vuurwerk doe je dat niet.</p><ul class=\"opsom\"><li>Raak het niet aan.</li><li>Maak het niet open en haal het niet uit elkaar.</li><li>Houd afstand en vraag omstanders weg te blijven.</li><li>Meld wat je ziet en schakel de politie in.</li></ul><p>Deze cursus noemt geen afstanden in meters. Volg de instructies van je werkgever en de politie.</p></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0002063/2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet op de economische delicten</a> <span class=\"bb-toel\">art. 21, geldend vanaf 1 augustus 2026</span></li></ol></div>"},{"kind":"theory","titel":"Taak en beleid: wat wordt van jou verwacht?","html":"<span class=\"q-soort\">Taak/beleid</span><h2 class=\"ptitle\">Taak en beleid: wat wordt van jou verwacht?</h2><div class=\"main\"><p>Wat jij moet doen, staat niet in de wet. Het staat in je taakomschrijving, in afspraken van je werkgever en in beleid.</p><p>Handhavingsplan jaarwisseling (maart 2026): «De inzet van boa’s blijft gericht op preventie, toezicht en het beperken van overlast in de openbare ruimte.»</p><p>Nota van toelichting bij het Besluit veilige jaarwisseling: «De gemeentelijke boa richt zich in aanloop naar de jaarwisseling op de strafrechtelijke handhaving van kleinschalig bezit en het gebruik van vuurwerk.»</p><p>Lokale afspraken kunnen dit invullen. Maar beleid maakt je nooit bevoegd voor iets waarvoor de wet je geen bevoegdheid geeft.</p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://www.rijksoverheid.nl/documenten/rapporten/2026/03/16/tk-bijlage-geactualiseerd-handhavingsplan-jaarwisseling-feb-2026\" target=\"_blank\" rel=\"noopener\">Handhavingsplan jaarwisseling</a> <span class=\"bb-toel\">Ministerie van Justitie en Veiligheid, maart 2026 (beleid, geen bevoegdheidsgrondslag)</span></li><li><a href=\"https://zoek.officielebekendmakingen.nl/stb-2026-168.html\" target=\"_blank\" rel=\"noopener\">Besluit veilige jaarwisseling</a> <span class=\"bb-toel\">Stb. 2026, 168, nota van toelichting (officiële toelichting, geen bevoegdheidsgrondslag)</span></li><li><a href=\"https://wetten.overheid.nl/BWBR0039766/2026-09-01\" target=\"_blank\" rel=\"noopener\">Beleidsregels buitengewoon opsporingsambtenaar</a> <span class=\"bb-toel\">geldend vanaf 1 september 2026 (beleid, geen bevoegdheidsgrondslag)</span></li></ol></div>"},{"kind":"kaart","titel":"Politie: wanneer schakel je in?","html":"<span class=\"q-soort\">Politie</span><h2 class=\"ptitle\">Politie: wanneer schakel je in?</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg></span><span class=\"kaart-lab\">Politie</span></div><div class=\"kaart-t\">Overleg, ondersteuning of overdracht</div><div class=\"kaart-b\"><ul class=\"opsom\"><li>Er is gevaar, of er is onbekend of mogelijk zwaar vuurwerk.</li><li>De openbare orde is in het geding. Volgens het Handhavingsplan hebben boa’s dan tijdens de jaarwisseling «sowieso geen rol».</li><li>Er zijn signalen van zwaar of crimineel vuurwerk of van illegale handel. De politie «blijft verantwoordelijk» voor de opsporing daarvan (Handhavingsplan).</li><li>Je bent niet bevoegd voor het strafbare feit.</li><li>Je hebt dwang nodig die jou niet is toegekend.</li></ul><p>Twijfel je? Overleg eerst met je leidinggevende of de politie.</p></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://www.rijksoverheid.nl/documenten/rapporten/2026/03/16/tk-bijlage-geactualiseerd-handhavingsplan-jaarwisseling-feb-2026\" target=\"_blank\" rel=\"noopener\">Handhavingsplan jaarwisseling</a> <span class=\"bb-toel\">Ministerie van Justitie en Veiligheid, maart 2026 (beleid, geen bevoegdheidsgrondslag)</span></li></ol></div>"},{"kind":"casus","titel":"Zelf, overleggen of politie?","html":"<span class=\"q-soort\">Praktijk</span><h2 class=\"ptitle\">Zelf, overleggen of politie?</h2><p class=\"lees\"><b>1. Zelf afhandelen.</b> Oktober, een woonstraat. Een man steekt een fontein af. Op de verpakking staat «F2». Er is geen ontheffing en niets wijst op gespecialiseerde kennis. Voor dit feit (art. 9.2.2.1a Wm) ben je bevoegd, het past bij je taak en het is rustig en veilig.</p><p class=\"lees\"><b>2. Overleggen.</b> In een park staat een tas zonder eigenaar. Een deel is verpakt «F2», een deel ligt los zonder etiket. Raak niets aan en overleg.</p><p class=\"lees\"><b>3. Politie.</b> Oudejaarsavond bij het station. Een groep met zwaar vuurwerk, de sfeer wordt grimmig. Gevaar en openbare orde: politie. Jij meldt, houdt afstand en legt vast.</p>"},{"kind":"lijst","titel":"Een goede overdracht","html":"<span class=\"q-soort\">Politie</span><h2 class=\"ptitle\">Een goede overdracht</h2><div class=\"main\"><p>Draag je over aan de politie? Geef in elk geval door:</p><ul class=\"opsom\"><li>wat je zelf zag en deed;</li><li>welke bevoegdheden je al gebruikte, met grondslag;</li><li>wie de betrokkenen zijn, voor zover bekend;</li><li>waar het vuurwerk ligt en of die plek veilig is;</li><li>wat je in beslag nam en waar de kennisgeving is.</li></ul></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0001903/2026-07-01\" target=\"_blank\" rel=\"noopener\">Wetboek van Strafvordering</a> <span class=\"bb-toel\">art. 94 (kennisgeving van inbeslagneming), geldend vanaf 1 juli 2026</span></li></ol></div>"}],"titel":"Wanneer doe je het niet zelf?","type":"content","vragen":[{"vraag":"Je bent bevoegd. Het vuurwerk is groot, met tape omwikkeld en heeft geen etiket. Wat is juist?","opties":["Omdat je bevoegd bent, onderzoek je het zelf verder.","Je maakt het open om de categorie te zien.","Bevoegd zijn betekent niet dat zelf handelen veilig is. Afstand houden en de politie inschakelen.","Omdat het zelfgemaakt is, ben je nooit bevoegd."],"juist":2,"uitleg":"Een bevoegdheid is geen plicht. Bij onbekend of mogelijk zwaar vuurwerk raak je niets aan en maak je niets open. Je houdt afstand, houdt omstanders weg en schakelt de politie in. [[1]]","soort":"Praktijkcasus","artikel":"—","wet":"—","kernregel":"Veiligheid gaat voor.","voetnoten":["Wet op de economische delicten, art. 21 (geldend vanaf 1 augustus 2026); Handhavingsplan jaarwisseling, maart 2026 (beleid)."]},{"vraag":"In je gemeente is afgesproken dat boa’s ook zwaar vuurwerk in beslag nemen. Voor dat feit ben jij volgens je akte niet bevoegd. Wat geldt?","opties":["De afspraak gaat voor: je bent dan toch bevoegd.","Je bent bevoegd als je leidinggevende akkoord geeft.","Een afspraak of beleid geeft je geen bevoegdheid die je volgens de wet niet hebt.","Je bent bevoegd als de politie niet kan komen."],"juist":2,"uitleg":"Taak en beleid gaan over wat van je wordt verwacht. Ze maken je niet bevoegd. Je bevoegdheid volgt uit je akte en de domeinlijst. [[1]]","soort":"Praktijkcasus","artikel":"—","wet":"—","kernregel":"Beleid is geen bevoegdheidsgrondslag.","voetnoten":["Wetboek van Strafvordering, art. 142 (geldend vanaf 1 juli 2026)."]}]},{"icoon":"pv","id":"m6","kader":"Praktijk","nr":6,"pages":[{"kind":"casus","titel":"De melding","html":"<span class=\"q-soort\">Praktijk</span><h2 class=\"ptitle\">De melding</h2><p class=\"lees\">Zaterdag 21 november, 21.05 uur. Je bent met je collega op het plein. Je hoort een harde knal en ziet rook bij een groep van vier jongeren.</p><p class=\"lees\">Een jongen in een rode jas gooit een lege kartonnen huls op de grond. Daarna pakt hij een doos uit een open zwarte sporttas die voor zijn voeten staat. Niemand anders raakt de tas aan.</p><p class=\"lees\">In de tas zie je verpakt en los vuurwerk. Het is rustig; niemand loopt weg. Je lost de situatie op met de vier vragen.</p>"},{"kind":"theory","titel":"Vraag 1 — Wat tref ik aan?","html":"<h2 class=\"ptitle\">Vraag 1 — Wat tref ik aan?</h2><div class=\"main\"><p>Je kijkt vanaf een veilige afstand. De jongen houdt een doos vast. Op de doos lees je «F2» en «Geschikt voor particulier gebruik».</p><p>In de tas zie je drie gesloten dozen met «F2». Daarnaast liggen vijf losse, grote voorwerpen met grijze tape, zonder etiket.</p><p>De dozen: je hebt informatie. De losse voorwerpen: onbekend vuurwerk. Je gokt niet naar de categorie (hoofdstuk 1).</p></div>"},{"kind":"theory","titel":"Vraag 2 — Is dit strafbaar?","html":"<h2 class=\"ptitle\">Vraag 2 — Is dit strafbaar?</h2><div class=\"main\"><p>Welke gedraging zie je? De knal en de lege huls wijzen op gebruik, maar je weet niet wát hij afstak. De doos met «F2» in zijn hand is bezit. Hij pakte die uit de tas voor zijn voeten: een aanwijzing dat de tas ook van hem is.</p><p>Het is november, dus een ontheffing speelt niet. Niets wijst op gespecialiseerde kennis. Dan kan art. 9.2.2.1a lid 1 Wm zijn overtreden (hoofdstuk 2).</p><p>Voor de losse voorwerpen weet je nog niet welk feit kan spelen.</p></div>"},{"kind":"theory","titel":"Vraag 3 — Ben ik bevoegd?","html":"<h2 class=\"ptitle\">Vraag 3 — Ben ik bevoegd?</h2><div class=\"main\"><p>Het feit is bezit van F2: art. 9.2.2.1a Wm. Dat staat in domein I, onderdeel 9. In deze casus hoort toezicht in de openbare ruimte bij jouw functie en taak.</p><p>Voor de WED-bevoegdheden moet je akte je ook voor dit economische delict aanwijzen (art. 17 WED, hoofdstuk 3). In deze casus gaan we ervan uit dat dat zo is. Controleer dat in je eigen akte.</p><p>Voor de losse voorwerpen is je bevoegdheid onzeker. Je weet niet wat het is.</p></div>"},{"kind":"theory","titel":"Vraag 4 — Wat doe ik nu?","html":"<h2 class=\"ptitle\">Vraag 4 — Wat doe ik nu?</h2><div class=\"main\"><p><b>Veiligheid.</b> De groep is rustig. De losse voorwerpen raak je niet aan. Je collega houdt omstanders op afstand.</p><p><b>Bevoegdheden.</b> Je houdt de jongen staande en stelt zijn identiteit vast (art. 52 Sv). Je vordert de uitlevering van de vier dozen met «F2» en neemt ze in beslag (art. 18 WED). Je maakt een kennisgeving en geeft een bewijs van ontvangst (art. 94 lid 3 Sv).</p><p><b>Politie.</b> Voor de losse voorwerpen schakel je de politie in. Je draagt over met alles wat je deed (hoofdstuk 5).</p></div>"},{"kind":"kaart","titel":"Het proces-verbaal — zo niet","html":"<span class=\"q-soort\">Praktijk</span><h2 class=\"ptitle\">Het proces-verbaal — zo niet</h2><div class=\"kaart k-letop\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17h.01\"/></svg></span><span class=\"kaart-lab\">Let op</span></div><div class=\"kaart-t\">Alleen een conclusie is niet genoeg</div><div class=\"kaart-b\"><p>Een slecht voorbeeld: «Verdachte had illegaal vuurwerk bij zich. Het is in beslag genomen.»</p><p>Wat ontbreekt? Wat je zelf zag, waar en wanneer. Wat er op de verpakking stond. Waarom het bezit bij hem lag. Welke bevoegdheden je gebruikte, met grondslag. En wat er met het vuurwerk gebeurde.</p><p>Schrijf eerst de feiten. De juridische conclusie komt daarna en moet uit die feiten blijken.</p></div></div>"},{"kind":"theory","titel":"Het proces-verbaal — zo wel","html":"<h2 class=\"ptitle\">Het proces-verbaal — zo wel</h2><div class=\"main\"><p>Op zaterdag 21 november 2026 omstreeks 21.05 uur bevond ik, verbalisant [naam], mij in uniform en in surveillance op het [naam plein] te [plaats], samen met collega [naam].</p><p>Ik hoorde een harde knal en zag direct daarna rook opstijgen bij een groep van vier personen. Ik zag dat een van hen, een man in een rode jas, later genoemd [verdachte], een lege kartonnen huls op de grond gooide. Daarna zag ik dat hij uit een open zwarte sporttas, die direct voor zijn voeten stond, een doos pakte en die in zijn hand hield. Van [tijd] tot [tijd] had ik de groep onafgebroken in het zicht. In die tijd zag ik niet dat iemand anders de tas aanraakte.</p><p>Op de doos in zijn hand las ik de opdrukken «F2» en «Geschikt voor particulier gebruik». Toen ik bij de tas stond, zag ik daarin drie gesloten dozen met op het etiket «F2» en vijf losse voorwerpen zonder verpakking of etiket, omwikkeld met grijze tape, elk ongeveer [afmeting]. Ik zag geen aanwijzingen dat [verdachte] een persoon met gespecialiseerde kennis was, zoals een dienstuniform van politie, brandweer of krijgsmacht.</p><p>Op grond van deze waarnemingen heb ik [verdachte] aangemerkt als verdachte van het bezit van vuurwerk van categorie F2, in strijd met artikel 9.2.2.1a, eerste lid, Wet milieubeheer. Om [tijd] heb ik hem staande gehouden (artikel 52 Sv) en zijn identiteit vastgesteld aan de hand van zijn [soort en nummer identiteitsbewijs]: [achternaam, voornamen, geboortedatum, geboorteplaats].</p><p>Ik heb van hem de uitlevering gevorderd van de doos in zijn hand en de drie dozen met «F2» uit de tas (artikel 18 WED). Hij gaf deze aan mij af. Ik heb ze in beslag genomen, een kennisgeving van inbeslagneming opgemaakt en hem een bewijs van ontvangst gegeven. De kennisgeving heb ik om [tijd] in handen gesteld van hulpofficier van justitie [naam]. De dozen heb ik overgebracht naar [plaats volgens instructie] en daar geregistreerd onder [registratienummer].</p><p>De losse voorwerpen heb ik niet aangeraakt. Mijn collega hield omstanders op afstand. Om [tijd] heb ik de situatie en de losse voorwerpen overgedragen aan [politie-eenheid, naam].</p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li><a href=\"https://wetten.overheid.nl/BWBR0001903/2026-07-01\" target=\"_blank\" rel=\"noopener\">Wetboek van Strafvordering</a> <span class=\"bb-toel\">art. 52, 94 en 95, geldend vanaf 1 juli 2026</span></li><li><a href=\"https://wetten.overheid.nl/BWBR0002063/2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet op de economische delicten</a> <span class=\"bb-toel\">art. 18, geldend vanaf 1 augustus 2026</span></li><li><a href=\"https://wetten.overheid.nl/BWBR0003245/2026-08-01\" target=\"_blank\" rel=\"noopener\">Wet milieubeheer</a> <span class=\"bb-toel\">art. 9.2.2.1a, geldend vanaf 1 augustus 2026</span></li></ol></div>"},{"kind":"figuur","titel":"De vier vragen op straat","html":"<div class=\"figcap\">De vier vragen op straat</div><figure class=\"illu\"><svg viewBox=\"0 0 560 60\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>De vier vragen op straat</title><desc>Vier vragen na elkaar: wat tref ik aan, is dit strafbaar, ben ik bevoegd voor dit feit, wat doe ik nu. Is alles helder, handel dan binnen je bevoegdheid en taak. Twijfel je, overleg dan of schakel de politie in. Veiligheid weegt altijd mee. Leg feiten vast, geen conclusies.</desc></svg></figure>"}],"titel":"Praktijkcasus: van melding tot proces-verbaal","type":"samenvatting","vragen":[]}],"totaalVragen":18,"version":"0.9.2"};window.__ICONS__={"megafoon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 11v2a1 1 0 0 0 1 1h2l3.5 3.5V6.5L6 10H4a1 1 0 0 0-1 1Z\"/><path d=\"M12 8a4 4 0 0 1 0 8\"/></svg>","balans":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3v18M7 21h10\"/><path d=\"M12 6 5 8m7-2 7 2\"/><path d=\"M5 8 2.5 13a3 3 0 0 0 5 0L5 8Zm14 0-2.5 5a3 3 0 0 0 5 0L19 8Z\"/></svg>","wet":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 3h9l3 3v15H6z\"/><path d=\"M9 8h6M9 12h6M9 16h4\"/></svg>","oog":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z\"/><circle cx=\"12\" cy=\"12\" r=\"2.5\"/></svg>","book":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/></svg>","document":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M1

/p><\/div>"}],"titel":"Wat mag je als boa doen?","type":"content","vragen":[{"artikel":"Werkwijze","juist":1,"kernregel":"Situatie → wat wil je doen → mag dat → grondslag → vervolg.","opties":["Wat wil je doen – situatie – grondslag – mag dat – vervolg.","Situatie – wat wil je doen – mag dat – wettelijke grondslag – vervolg.","Grondslag – situatie – vervolg – mag dat – wat wil je doen.","Mag dat – situatie – wat wil je doen – vervolg – grondslag."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is B. Je begint bij de situatie. Dan bepaal je wat je wilt doen, of dat mag, op welke grondslag en wat je daarna doet.","voetnoten":[],"vraag":"Wat is de juiste volgorde van de vijf stappen bij een bevoegdheid?","wet":"—"},{"artikel":"Werkwijze","juist":3,"kernregel":"Elke bevoegdheid vraagt een wettelijke grondslag.","opties":["Of hij er vriendelijk en rustig uitziet.","Of er camera's in de buurt van het plein hangen.","Of je collega het ook met eigen ogen heeft gezien.","Of je hem mag staande houden en op welke grondslag."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is D. Elke bevoegdheid vraagt een wettelijke grondslag. Voordat je iemand staande houdt, ga je na of dat mag. De grondslag wordt nog aangeleverd.","voetnoten":[],"vraag":"Een jongere met vuurwerk loopt weg. Je wilt weten wie hij is. Wat vraag je je eerst af?","wet":"—"},{"artikel":"Werkwijze","juist":0,"kernregel":"In het proces-verbaal schrijf je feiten, geen conclusies.","opties":["Een feitelijke beschrijving van wat je zag, zoals vorm en verpakking.","Alleen je conclusie, bijvoorbeeld: \"Het was verboden vuurwerk.\"","Alleen wat de verdachte zelf over het vuurwerk heeft gezegd.","Alleen de categorie die je zelf op het oog hebt geschat."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is A. In het proces-verbaal schrijf je feiten, geen conclusies. Beschrijf wat je zag. Overige verplichte onderdelen worden nog aangeleverd.","voetnoten":[],"vraag":"Wat hoort in het proces-verbaal over het vuurwerk?","wet":"—"},{"artikel":"Werkwijze","juist":2,"kernregel":"Veiligstellen: zorgen dat niets verdwijnt en niets gevaar oplevert.","opties":["Het vuurwerk direct zelf onschadelijk maken.","Het vuurwerk teruggeven aan de eigenaar.","Zorgen dat iets niet verdwijnt en geen gevaar oplevert.","Het vuurwerk laten liggen en de plek verlaten."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is C. Veiligstellen betekent: je zorgt dat iets niet verdwijnt en geen gevaar oplevert, tot het goed is afgehandeld. Hoe je dat bij vuurwerk veilig doet, staat in de veiligheidsrichtlijn die nog wordt aangeleverd.","voetnoten":[],"vraag":"Wat betekent veiligstellen?","wet":"—"},{"artikel":"Werkwijze","juist":1,"kernregel":"Ook als je bevoegd bent: is het nodig en kan het lichter?","opties":["Of je collega's het in deze situatie ook zo zouden doen.","Of het nodig is en of er geen lichtere manier is.","Of de betrokkene het eens is met wat je gaat doen.","Of je er later tegen iemand over moet vertellen."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is B. Ook als je bevoegd bent, gelden er algemene eisen voor hoe je optreedt. Je vraagt je steeds af of wat je doet nodig is en of het lichter kan. De juridische eisen worden nog aangeleverd.","voetnoten":[],"vraag":"Je bent bevoegd om iets te doen. Welke vraag stel je jezelf daarna nog?","wet":"—"}]},{"icoon":"waarschuwing","id":"m6","kader":"Veiligheid en bevoegdheid","nr":6,"pages":[{"kind":"lo","titel":"Leerdoelen","html":"<h2 class=\"ptitle\">Leerdoelen<\/h2><p class=\"pintro\">Centrale vraag: zelf optreden of politie inschakelen?<\/p><ul class=\"lo\"><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>herken je situaties met onbekend of zwaar illegaal vuurwerk;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je wat bedoeld wordt met nitraten en professioneel vuurwerk, voor zover dat voor jou belangrijk is;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>ken je het verschil tussen bevoegd zijn, veilig kunnen handelen en de afgesproken taakverdeling;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je wanneer je niet zelf verder gaat en de politie inschakelt.<\/span><\/li><\/ul>"},{"kind":"casus","titel":"Een tas zonder etiketten","html":"<span class=\"q-soort\">Voorbeeld<\/span><h2 class=\"ptitle\">Een tas zonder etiketten<\/h2><p class=\"lees\">Je ziet een tas op de grond. Er zit vuurwerk in. Niets heeft een verpakking of etiket. Een paar stukken zijn groot en zien er zelfgemaakt uit.<\/p><p class=\"lees\">De eigenaar is weg. Omstanders kijken toe. Wat doe je?<\/p>"},{"kind":"theory","titel":"Onbekend vuurwerk: wat weet je wel en niet?","html":"<h2 class=\"ptitle\">Onbekend vuurwerk: wat weet je wel en niet?<\/h2><div class=\"main\"><p>Bij onbekend vuurwerk weet je niet wat het is. Je weet dus ook niet hoe gevaarlijk het is.<\/p><p>Je weet wel wat je ziet: de vorm, de grootte, de hoeveelheid en waar het ligt. Dat schrijf je op.<\/p><p>Wat je niet weet, vul je niet zelf in.<\/p><\/div>"},{"kind":"theory","titel":"Vuurwerk zonder duidelijke verpakking","html":"<h2 class=\"ptitle\">Vuurwerk zonder duidelijke verpakking<\/h2><div class=\"main\"><p>Ontbreekt de verpakking? Dan mis je belangrijke informatie. Denk aan de categorie en de gebruiksaanwijzing.<\/p><p>Of vuurwerk zonder verpakking verboden is: <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><p>Je kunt het in elk geval niet zomaar als veilig zien.<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B2 – Onderliggende vuurwerkregelgeving: welke regeling en welke bepalingen (categorieën, verboden, etikettering). Nog aan te leveren.<\/li><li>B9 – Definities: categorieën F1–F3, professioneel vuurwerk, zwaar illegaal vuurwerk, nitraten. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Zwaar illegaal vuurwerk","html":"<h2 class=\"ptitle\">Zwaar illegaal vuurwerk<\/h2><div class=\"main\"><p>Met zwaar illegaal vuurwerk bedoelen we vuurwerk dat extra gevaarlijk is. Wat hier juridisch onder valt: <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><p>Zwaar illegaal vuurwerk kan veel schade en letsel veroorzaken. Veiligheid staat daarom voorop.<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B9 – Definities: categorieën F1–F3, professioneel vuurwerk, zwaar illegaal vuurwerk, nitraten. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Nitraten","html":"<h2 class=\"ptitle\">Nitraten<\/h2><div class=\"main\"><p>De term nitraten hoor je vaak op straat. Wat ermee bedoeld wordt en of het juridisch een rol speelt: <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><p>Gebruik de term alleen in je proces-verbaal als die juist is. Beschrijf anders gewoon wat je ziet.<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B9 – Definities: categorieën F1–F3, professioneel vuurwerk, zwaar illegaal vuurwerk, nitraten. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Professioneel vuurwerk op straat","html":"<h2 class=\"ptitle\">Professioneel vuurwerk op straat<\/h2><div class=\"main\"><p>Professioneel vuurwerk hoort bij vakmensen. Tref je het op straat aan, dan is dat bijzonder.<\/p><p>Wat dit juridisch betekent: <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><p>Hoe je hier veilig mee omgaat: <strong>Veiligheidsrichtlijn nog aan te leveren.<\/strong><\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B8 – Veiligheidsrichtlijn voor onbekend en zwaar illegaal vuurwerk: bron en tekst. Nog aan te leveren.<\/li><li>B9 – Definities: categorieën F1–F3, professioneel vuurwerk, zwaar illegaal vuurwerk, nitraten. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"figuur","titel":"Drie aparte vragen","html":"<div class=\"figcap\">Drie aparte vragen<\/div><figure class=\"illu\"><svg viewBox=\"0 0 560 60\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>Drie aparte vragen<\/title><desc>Drie vragen die je los van elkaar beantwoordt: ben ik juridisch bevoegd, kan ik veilig handelen en wat is de afgesproken taakverdeling. Alle drie bepalen samen wat je doet.<\/desc><\/svg><\/figure>"},{"kind":"kaart","titel":"Wanneer stop je met zelf onderzoeken?","html":"<h2 class=\"ptitle\">Wanneer stop je met zelf onderzoeken?<\/h2><div class=\"kaart k-letop\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17h.01\"/><\/svg><\/span><span class=\"kaart-lab\">Let op<\/span><\/div><div class=\"kaart-t\">Wanneer stop je met zelf onderzoeken?<\/div><div class=\"kaart-b\"><p>Soms is het beter om niet zelf verder te gaan. Ook als je bevoegd bent.<\/p><p>Wanneer je stopt en het vuurwerk niet zelf hanteert: <strong>Veiligheidsrichtlijn nog aan te leveren.<\/strong><\/p><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B8 – Veiligheidsrichtlijn voor onbekend en zwaar illegaal vuurwerk: bron en tekst. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"kaart","titel":"Veilige afstand en handelwijze","html":"<h2 class=\"ptitle\">Veilige afstand en handelwijze<\/h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/><\/svg><\/span><span class=\"kaart-lab\">In de praktijk<\/span><\/div><div class=\"kaart-t\">Wat zegt de richtlijn?<\/div><div class=\"kaart-b\"><p>Welke afstand je houdt en wat je praktisch doet, staat in een veiligheidsrichtlijn. <strong>Veiligheidsrichtlijn nog aan te leveren.<\/strong><\/p><p>We vullen hier niets zelf in. Zo weet je zeker dat je met betrouwbare informatie werkt.<\/p><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B8 – Veiligheidsrichtlijn voor onbekend en zwaar illegaal vuurwerk: bron en tekst. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"casus","titel":"Zelf optreden of politie inschakelen?","html":"<span class=\"q-soort\">Voorbeeld<\/span><h2 class=\"ptitle\">Zelf optreden of politie inschakelen?<\/h2><p class=\"lees\">Terug naar de tas zonder etiketten. Je bent misschien bevoegd. Maar is het veilig? En wat is er afgesproken met de politie?<\/p><p class=\"lees\">Denk na over de drie vragen voordat je verdergaat.<\/p>"},{"kind":"casus","titel":"Zelf optreden of politie inschakelen? — betekenis","html":"<span class=\"q-soort\">Voorbeeld<\/span><h2 class=\"ptitle\">Zelf optreden of politie inschakelen? — betekenis<\/h2><div class=\"kaart k-voorbeeld\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3v18M7 21h10\"/><path d=\"M12 6 5 8m7-2 7 2\"/><path d=\"M5 8 2.5 13a3 3 0 0 0 5 0L5 8Zm14 0-2.5 5a3 3 0 0 0 5 0L19 8Z\"/><\/svg><\/span><span class=\"kaart-lab\">Voorbeeld<\/span><\/div><div class=\"kaart-t\">Betekenis voor de praktijk<\/div><div class=\"kaart-b\"><p><b>Bevoegd?<\/b> Dat hangt af van het feit en je domeinlijst. <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><p><b>Veilig?<\/b> Bij onbekend of mogelijk zwaar vuurwerk is voorzichtigheid nodig. <strong>Veiligheidsrichtlijn nog aan te leveren.<\/strong><\/p><p><b>Taakverdeling?<\/b> Wat er is afgesproken, lees je in onderwerp 7. <strong>Tekst uit het Handhavingsplan nog aan te leveren.<\/strong><\/p><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B4 – Grondslag opsporingsbevoegdheid boa en relevante onderdelen domeinlijst domein I. Nog aan te leveren.<\/li><li>B7 – Handhavingsplan: naam, versie en letterlijke passages. Nog aan te leveren.<\/li><li>B8 – Veiligheidsrichtlijn voor onbekend en zwaar illegaal vuurwerk: bron en tekst. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"onthoud","titel":"Kort samengevat","html":"<h2 class=\"ptitle\">Kort samengevat<\/h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-t\">Onbekend en zwaar vuurwerk<\/div><div class=\"kaart-b\"><ul class=\"punten\"><li>Bij onbekend vuurwerk weet je niet hoe gevaarlijk het is. Schrijf op wat je ziet.<\/li><li>Wat zwaar illegaal vuurwerk en nitraten juridisch zijn, volgt nog.<\/li><\/ul><\/div><\/div>"},{"kind":"onthoud","titel":"Kort samengevat","html":"<h2 class=\"ptitle\">Kort samengevat<\/h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-t\">Zelf optreden of politie?<\/div><div class=\"kaart-b\"><ul class=\"punten\"><li>Bevoegd, veilig en taakverdeling zijn drie aparte vragen.<\/li><li>Veiligheid staat voorop. De veiligheidsrichtlijn volgt nog.<\/li><li>Bij twijfel: niet zelf verder, maar overleggen of politie inschakelen.<\/li><\/ul><\/div><\/div>"},{"kind":"theory","titel":"Vooruitblik: Taakverdeling tussen boa en politie","html":"<h2 class=\"ptitle\">Vooruitblik: Taakverdeling tussen boa en politie<\/h2><div class=\"main\"><p>Je weet nu dat bevoegdheid en veiligheid niet hetzelfde zijn. Er is nog een derde vraag: wat is er afgesproken?<\/p><p>Daarover gaat het volgende onderwerp.<\/p><\/div>"}],"titel":"Onbekend en zwaar illegaal vuurwerk","type":"content","vragen":[{"artikel":"Werkwijze","juist":0,"kernregel":"Bevoegd, veilig en taakverdeling zijn drie aparte vragen.","opties":["Ben ik bevoegd? Kan ik veilig handelen? Wat is de afgesproken taakverdeling?","Wie is de eigenaar? Hoeveel is het waard? Waar is het gekocht?","Is het donker? Zijn er omstanders? Is er een camera?","Is het legaal? Is het mooi? Is het duur?"],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is A. Bevoegdheid, veiligheid en taakverdeling zijn drie aparte vragen. Samen bepalen ze wat je doet.","voetnoten":[],"vraag":"Welke drie vragen beoordeel je los van elkaar bij onbekend of zwaar vuurwerk?","wet":"—"},{"artikel":"Werkwijze","juist":2,"kernregel":"Bevoegd zijn is iets anders dan veilig kunnen handelen.","opties":["Omdat je bevoegd bent, moet je het vuurwerk zelf onderzoeken.","Omdat het zelfgemaakt is, ben je niet meer bevoegd.","Bevoegd zijn betekent niet dat het veilig is om zelf verder te gaan.","Je wacht tot de eigenaar terugkomt en vraagt wat het is."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is C. Je kunt bevoegd zijn, terwijl het niet veilig is om zelf verder te gaan. Wanneer je stopt, staat in de veiligheidsrichtlijn die nog wordt aangeleverd.","voetnoten":[],"vraag":"Je bent bevoegd, maar het vuurwerk ziet er zwaar en zelfgemaakt uit. Wat is juist?","wet":"—"},{"artikel":"Werkwijze","juist":3,"kernregel":"Beschrijf wat je ziet. Gebruik vaktermen alleen als ze juist zijn.","opties":["Je schrijft \"nitraten\", want zo noemt iedereen het.","Je schrijft \"nitraten\" tussen haakjes, dan is het altijd goed.","Je schrijft niets over het vuurwerk, want je weet het niet zeker.","Je beschrijft wat je ziet. De term gebruik je alleen als die juist is."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is D. De term nitraten hoor je vaak op straat. Gebruik hem alleen als die juist is. Beschrijf anders gewoon wat je ziet.","voetnoten":[],"vraag":"Een collega noemt het vuurwerk in de tas \"nitraten\". Wat doe je in je proces-verbaal?","wet":"—"},{"artikel":"Werkwijze","juist":1,"kernregel":"Leg vast wat je ziet. Vul niet zelf in wat je niet weet.","opties":["De categorie en hoe hard het vuurwerk kan knallen.","De vorm, de grootte, de hoeveelheid en waar het ligt.","Of het vuurwerk legaal of verboden is.","Waar en wanneer het vuurwerk is gekocht."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is B. Bij onbekend vuurwerk weet je niet wat het is. Maar je weet wel wat je ziet. Dat leg je vast. Wat je niet weet, vul je niet zelf in.","voetnoten":[],"vraag":"Bij onbekend vuurwerk weet je niet wat het is. Wat weet je wél en schrijf je op?","wet":"—"}]},{"icoon":"document","id":"m7","kader":"Handhavingsplan","nr":7,"pages":[{"kind":"lo","titel":"Leerdoelen","html":"<h2 class=\"ptitle\">Leerdoelen<\/h2><p class=\"pintro\">Wat je na dit onderwerp kunt.<\/p><ul class=\"lo\"><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>ken je het verschil tussen bevoegdheid en taakverdeling;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je wat het Handhavingsplan is;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je wat het Handhavingsplan van jou verwacht bij vuurwerk;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>kun je kiezen tussen zelf afhandelen, overleggen en politie inschakelen;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je hoe een overdracht aan de politie verloopt.<\/span><\/li><\/ul>"},{"kind":"theory","titel":"Mogen en doen zijn twee dingen","html":"<h2 class=\"ptitle\">Mogen en doen zijn twee dingen<\/h2><div class=\"main\"><p><b>Bevoegdheid<\/b> is wat je juridisch mág.<\/p><p><b>Taakverdeling<\/b> is wat in de praktijk van jou wordt verwacht.<\/p><p>Je kunt dus bevoegd zijn voor iets, terwijl de afspraak is dat de politie het oppakt. Andersom geldt: een afspraak geeft je geen bevoegdheid die je niet hebt.<\/p><\/div>"},{"kind":"figuur","titel":"Bevoegdheid naast taakverdeling","html":"<div class=\"figcap\">Bevoegdheid naast taakverdeling<\/div><figure class=\"illu\"><svg viewBox=\"0 0 560 60\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>Bevoegdheid naast taakverdeling<\/title><desc>Twee aparte vragen naast elkaar: bevoegdheid is wat je juridisch mag, taakverdeling is wat van je wordt verwacht. Samen bepalen ze wat je op straat doet.<\/desc><\/svg><\/figure>"},{"kind":"theory","titel":"Wat is het Handhavingsplan?","html":"<h2 class=\"ptitle\">Wat is het Handhavingsplan?<\/h2><div class=\"main\"><p>In het Handhavingsplan staan afspraken over wie wat doet bij vuurwerk. Welk plan het is en welke versie: <strong>Tekst uit het Handhavingsplan nog aan te leveren.<\/strong><\/p><p>In deze opleiding gebruiken we alleen de exacte tekst van het plan. We verzinnen geen eigen grenzen of hoeveelheden.<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B7 – Handhavingsplan: naam, versie en letterlijke passages. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"kader","titel":"Tekst uit het Handhavingsplan","html":"<h2 class=\"ptitle\">Tekst uit het Handhavingsplan<\/h2><div class=\"kaart k-kader law-card\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span class=\"kaart-lab\">Handhavingsplan<\/span><\/div><div class=\"kaart-t\">Afspraken over vuurwerk<\/div><div class=\"kaart-b\"><p class=\"law-intro\">Hieronder komt de letterlijke passage uit het Handhavingsplan over de taakverdeling bij vuurwerk.<\/p><div class=\"law-quote\"><div class=\"law-quote-head\"><span class=\"law-quote-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/><\/svg><\/span><span>Tekst Handhavingsplan<\/span><\/div><p class=\"wet law-text\"><strong>Tekst uit het Handhavingsplan nog aan te leveren.<\/strong> Hier komt de letterlijke passage.<\/p><\/div><div class=\"law-grid\"><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>In gewone taal<\/span><\/div><p>Uitleg volgt zodra de tekst is aangeleverd. <strong>Tekst uit het Handhavingsplan nog aan te leveren.<\/strong><\/p><\/section><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>Wat betekent dit voor jou als boa?<\/span><\/div><p><strong>Tekst uit het Handhavingsplan nog aan te leveren.<\/strong><\/p><\/section><\/div><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B7 – Handhavingsplan: naam, versie en letterlijke passages. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"kaart","titel":"Wat betekent dit voor jou?","html":"<h2 class=\"ptitle\">Wat betekent dit voor jou?<\/h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/><\/svg><\/span><span class=\"kaart-lab\">In de praktijk<\/span><\/div><div class=\"kaart-t\">Kleinschalig bezit en gebruik<\/div><div class=\"kaart-b\"><p>Volgens de taakverdeling richten boa's zich vooral op de daarvoor aangewezen vormen van kleinschalig bezit en gebruik.<\/p><p>Zwaardere of gevaarlijke situaties kunnen een reden zijn om de politie in te schakelen of over te dragen.<\/p><p>Waar precies de grens ligt: <strong>Tekst uit het Handhavingsplan nog aan te leveren.<\/strong><\/p><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B7 – Handhavingsplan: naam, versie en letterlijke passages. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"figuur","titel":"Zelf afhandelen, overleggen of politie inschakelen","html":"<div class=\"figcap\">Zelf afhandelen, overleggen of politie inschakelen<\/div><figure class=\"illu\"><svg viewBox=\"0 0 560 60\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>Zelf afhandelen, overleggen of politie inschakelen<\/title><desc>Drie routes: zelf afhandelen, overleggen, politie inschakelen. De criteria per route komen uit het Handhavingsplan en moeten nog worden aangeleverd.<\/desc><\/svg><\/figure>"},{"kind":"casus","titel":"Situatie 1: zelf afhandelen","html":"<span class=\"q-soort\">Voorbeeld<\/span><h2 class=\"ptitle\">Situatie 1: zelf afhandelen<\/h2><p class=\"lees\">Iemand steekt op straat vuurwerk af. Het vuurwerk zit in de verpakking. Het gaat om een kleine hoeveelheid.<\/p><p class=\"lees\">Past dit binnen wat jij volgens het Handhavingsplan zelf afhandelt? <strong>Tekst uit het Handhavingsplan nog aan te leveren.<\/strong><\/p><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B7 – Handhavingsplan: naam, versie en letterlijke passages. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"casus","titel":"Situatie 2: overleggen","html":"<span class=\"q-soort\">Voorbeeld<\/span><h2 class=\"ptitle\">Situatie 2: overleggen<\/h2><p class=\"lees\">Je vindt een tas met verschillend vuurwerk. Een deel is verpakt, een deel niet. Je twijfelt.<\/p><p class=\"lees\">Overleg je eerst, en met wie? <strong>Tekst uit het Handhavingsplan nog aan te leveren.<\/strong><\/p><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B7 – Handhavingsplan: naam, versie en letterlijke passages. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"casus","titel":"Situatie 3: politie inschakelen","html":"<span class=\"q-soort\">Voorbeeld<\/span><h2 class=\"ptitle\">Situatie 3: politie inschakelen<\/h2><p class=\"lees\">Je ziet vuurwerk dat er zwaar en zelfgemaakt uitziet. Er staan mensen omheen.<\/p><p class=\"lees\">Schakel je de politie in? <strong>Tekst uit het Handhavingsplan nog aan te leveren.<\/strong> <strong>Veiligheidsrichtlijn nog aan te leveren.<\/strong><\/p><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B7 – Handhavingsplan: naam, versie en letterlijke passages. Nog aan te leveren.<\/li><li>B8 – Veiligheidsrichtlijn voor onbekend en zwaar illegaal vuurwerk: bron en tekst. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"lijst","titel":"Zo verloopt een overdracht","html":"<h2 class=\"ptitle\">Zo verloopt een overdracht<\/h2><div class=\"main\"><p>Een goede overdracht zorgt dat er niets verloren gaat. Denk aan:<\/p><ul class=\"opsom\"><li>wat je hebt gezien en gedaan;<\/li><li>wie de betrokkenen zijn, voor zover bekend;<\/li><li>waar het vuurwerk is en of het veilig is gesteld;<\/li><li>welke afspraken gelden voor de overdracht: <strong>Tekst uit het Handhavingsplan nog aan te leveren.<\/strong><\/li><\/ul><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B7 – Handhavingsplan: naam, versie en letterlijke passages. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"onthoud","titel":"Kort samengevat","html":"<h2 class=\"ptitle\">Kort samengevat<\/h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-t\">Mogen en doen<\/div><div class=\"kaart-b\"><ul class=\"punten\"><li>Bevoegdheid is wat je juridisch mág. Taakverdeling is wat van je wordt verwacht.<\/li><li>Een afspraak geeft je geen extra bevoegdheid.<\/li><\/ul><\/div><\/div>"},{"kind":"onthoud","titel":"Kort samengevat","html":"<h2 class=\"ptitle\">Kort samengevat<\/h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-t\">Het Handhavingsplan<\/div><div class=\"kaart-b\"><ul class=\"punten\"><li>Boa's richten zich vooral op aangewezen vormen van kleinschalig bezit en gebruik.<\/li><li>Bij zwaardere of gevaarlijke situaties kan de politie het overnemen.<\/li><li>De exacte grenzen staan in het Handhavingsplan. Die volgen nog.<\/li><\/ul><\/div><\/div>"},{"kind":"theory","titel":"Vooruitblik: Van melding tot proces-verbaal","html":"<h2 class=\"ptitle\">Vooruitblik: Van melding tot proces-verbaal<\/h2><div class=\"main\"><p>Je hebt nu alle onderdelen gehad. In het laatste onderwerp brengen we alles samen in één praktijkcasus.<\/p><p>Daarna maak je de eindtoets.<\/p><\/div>"}],"titel":"Taakverdeling tussen boa en politie","type":"content","vragen":[{"artikel":"Werkwijze","juist":2,"kernregel":"Bevoegdheid = mogen. Taakverdeling = wat van je wordt verwacht.","opties":["Bevoegdheid is wat de politie mag. Taakverdeling is wat de boa mag.","Er is geen verschil. Het zijn twee woorden voor hetzelfde.","Bevoegdheid is wat je juridisch mag. Taakverdeling is wat van je wordt verwacht.","Bevoegdheid geldt overdag. Taakverdeling geldt tijdens de jaarwisseling."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is C. Bevoegdheid is wat je juridisch mág. Taakverdeling is wat in de praktijk van jou wordt verwacht.","voetnoten":[],"vraag":"Wat is het verschil tussen bevoegdheid en taakverdeling?","wet":"—"},{"artikel":"Werkwijze","juist":1,"kernregel":"Een afspraak geeft je geen extra bevoegdheid.","opties":["Ja, een afspraak in het Handhavingsplan gaat voor de regels.","Nee, een afspraak geeft je geen bevoegdheid die je niet hebt.","Ja, als je leidinggevende de afspraak ook heeft ondertekend.","Nee, tenzij de politie op dat moment niet beschikbaar is."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is B. Taakverdeling gaat over wat van je wordt verwacht. Het maakt je niet bevoegd voor iets waarvoor je volgens de regels niet bevoegd bent.","voetnoten":[],"vraag":"In het Handhavingsplan staat een afspraak. Geeft die afspraak je een bevoegdheid die je volgens de regels niet hebt?","wet":"—"},{"artikel":"Handhavingsplan","juist":0,"kernregel":"Boa's richten zich vooral op aangewezen vormen van kleinschalig bezit en gebruik.","opties":["Op de daarvoor aangewezen vormen van kleinschalig bezit en gebruik.","Op alle vuurwerkzaken, ongeacht hoe zwaar of gevaarlijk.","Alleen op de verkoop van vuurwerk in winkels.","Alleen op zwaar illegaal vuurwerk."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is A. Volgens de taakverdeling richten boa's zich vooral op de daarvoor aangewezen vormen van kleinschalig bezit en gebruik. De exacte grenzen staan in het Handhavingsplan, dat nog wordt aangeleverd.","voetnoten":[],"vraag":"Waar richten boa's zich volgens de taakverdeling vooral op bij vuurwerk?","wet":"—"},{"artikel":"Werkwijze","juist":3,"kernregel":"Bij zwaardere of gevaarlijke situaties kan de politie het overnemen.","opties":["Je handelt het altijd zelf af, omdat jij er als eerste was.","Je laat het aan omstanders over om de politie te bellen.","Je wacht af of het vanzelf ophoudt.","Dit kan een reden zijn om de politie in te schakelen of over te dragen."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is D. Zwaardere of gevaarlijke situaties kunnen een reden zijn om de politie in te schakelen of over te dragen. De precieze afspraken staan in het Handhavingsplan.","voetnoten":[],"vraag":"Je treft een gevaarlijke situatie met zwaar vuurwerk aan. Wat past het best bij de taakverdeling?","wet":"—"}]},{"icoon":"list","id":"m8","kader":"Terugblik","nr":8,"pages":[{"kind":"lo","titel":"Leerdoelen","html":"<h2 class=\"ptitle\">Leerdoelen<\/h2><p class=\"pintro\">Wat je na dit onderwerp kunt.<\/p><ul class=\"lo\"><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>kun je een vuurwerksituatie van begin tot eind doorlopen;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>stel je daarbij steeds de vier vragen;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je wat er in het proces-verbaal moet komen;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>ben je voorbereid op de eindtoets.<\/span><\/li><\/ul>"},{"kind":"theory","titel":"Terugblik","html":"<h2 class=\"ptitle\">Terugblik<\/h2><div class=\"main\"><p>In de vorige onderwerpen kwam dit na elkaar aan bod: soorten vuurwerk, de wet, bevoegdheid, bevoegdheden, onbekend en zwaar vuurwerk en de taakverdeling.<\/p><p>In dit onderwerp breng je alles samen in één casus. Er komt geen nieuwe juridische inhoud bij.<\/p><\/div>"},{"kind":"casus","titel":"De casus: een knal op de parkeerplaats","html":"<span class=\"q-soort\">Voorbeeld<\/span><h2 class=\"ptitle\">De casus: een knal op de parkeerplaats<\/h2><p class=\"lees\">Je loopt surveillance. Je hoort een harde knal. Op een parkeerplaats staan vier jongeren.<\/p><p class=\"lees\">Eén jongere heeft vuurwerk in zijn hand. Op de grond staat een tas met verschillende soorten vuurwerk. Een deel zit in een verpakking, een deel niet.<\/p><p class=\"lees\">We lopen deze situatie in tien stappen door.<\/p>"},{"kind":"theory","titel":"Stap 1 – Wat neem je waar?","html":"<h2 class=\"ptitle\">Stap 1 – Wat neem je waar?<\/h2><div class=\"main\"><p>Begin met kijken en luisteren. Wat heb je gehoord? Wat zie je?<\/p><p>Een knal. Vier jongeren. Eén jongere met vuurwerk in zijn hand. Een tas met verpakt en los vuurwerk.<\/p><p>Schrijf dit op zoals je het ziet. Nog zonder conclusie.<\/p><\/div>"},{"kind":"theory","titel":"Stap 2 – Is er mogelijk sprake van een strafbaar feit?","html":"<h2 class=\"ptitle\">Stap 2 – Is er mogelijk sprake van een strafbaar feit?<\/h2><div class=\"main\"><p>Nu stel je de vraag: «Is dit strafbaar?»<\/p><p>Denk aan de regels uit onderwerp 3. Welke regel kan hier spelen? <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B1 – Artikel 9.2.2.1a Wet milieubeheer: letterlijke tekst, geldend op de peildatum. Nog aan te leveren.<\/li><li>B2 – Onderliggende vuurwerkregelgeving: welke regeling en welke bepalingen (categorieën, verboden, etikettering). Nog aan te leveren.<\/li><li>B3 – Wet op de economische delicten: bepaling(en) over strafbaarheid en strafmaat. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Stap 3 – Welk vuurwerk kan dit zijn?","html":"<h2 class=\"ptitle\">Stap 3 – Welk vuurwerk kan dit zijn?<\/h2><div class=\"main\"><p>Kijk naar het verpakte vuurwerk. Staat er een categorie op?<\/p><p>Kijk naar het losse vuurwerk. Dat is onbekend. Je weet nog niet wat het is.<\/p><\/div>"},{"kind":"theory","titel":"Stap 4 – Welke informatie heb je nog nodig?","html":"<h2 class=\"ptitle\">Stap 4 – Welke informatie heb je nog nodig?<\/h2><div class=\"main\"><p>Wat weet je nog niet? Bijvoorbeeld de categorie van het losse vuurwerk. Of van wie de tas is.<\/p><p>Het vaststellen van die informatie kan onderdeel zijn van je onderzoek.<\/p><\/div>"},{"kind":"theory","titel":"Stap 5 – Ben je hiervoor opsporingsbevoegd?","html":"<h2 class=\"ptitle\">Stap 5 – Ben je hiervoor opsporingsbevoegd?<\/h2><div class=\"main\"><p>Nu stel je de vraag: «Ben ik bevoegd?»<\/p><p>Staat dit feit op jouw domeinlijst? <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B4 – Grondslag opsporingsbevoegdheid boa en relevante onderdelen domeinlijst domein I. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Stap 6 – Welke bevoegdheden kun je toepassen?","html":"<h2 class=\"ptitle\">Stap 6 – Welke bevoegdheden kun je toepassen?<\/h2><div class=\"main\"><p>Denk aan de vijf stappen uit onderwerp 5. Wat wil je doen, en mag dat?<\/p><p>Staande houden, onderzoek, inbeslagneming: welke grondslag geldt? <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B5 – Wettelijke grondslag per bevoegdheid (staande houden, aanhouden, onderzoek, inbeslagneming, veiligstellen). Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Stap 7 – Is het veilig om zelf verder te handelen?","html":"<h2 class=\"ptitle\">Stap 7 – Is het veilig om zelf verder te handelen?<\/h2><div class=\"main\"><p>Er zit los vuurwerk in de tas. Je weet niet wat het is.<\/p><p>Kun je veilig verder? <strong>Veiligheidsrichtlijn nog aan te leveren.<\/strong><\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B8 – Veiligheidsrichtlijn voor onbekend en zwaar illegaal vuurwerk: bron en tekst. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Stap 8 – Moet de politie worden ingeschakeld?","html":"<h2 class=\"ptitle\">Stap 8 – Moet de politie worden ingeschakeld?<\/h2><div class=\"main\"><p>Kijk naar de taakverdeling uit onderwerp 7. Past dit bij wat jij zelf afhandelt?<\/p><p>Of is overleggen of politie inschakelen nodig? <strong>Tekst uit het Handhavingsplan nog aan te leveren.<\/strong><\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B7 – Handhavingsplan: naam, versie en letterlijke passages. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Stap 9 – Wat neem je in beslag of draag je over?","html":"<h2 class=\"ptitle\">Stap 9 – Wat neem je in beslag of draag je over?<\/h2><div class=\"main\"><p>Wat neem je zelf in beslag? Wat draag je over aan de politie?<\/p><p><strong>Juridische inhoud nog aan te leveren/controleren.<\/strong> <strong>Tekst uit het Handhavingsplan nog aan te leveren.<\/strong><\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B5 – Wettelijke grondslag per bevoegdheid (staande houden, aanhouden, onderzoek, inbeslagneming, veiligstellen). Nog aan te leveren.<\/li><li>B7 – Handhavingsplan: naam, versie en letterlijke passages. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Stap 10 – Wat komt in het proces-verbaal?","html":"<h2 class=\"ptitle\">Stap 10 – Wat komt in het proces-verbaal?<\/h2><div class=\"main\"><p>«Op [datum] omstreeks [tijd] bevond ik, verbalisant, mij op de parkeerplaats aan de [straat] te [plaats]. Ik hoorde een harde knal. Ik zag vier personen staan. Ik zag dat één van hen, later genoemd [naam], [omschrijving vuurwerk] in zijn hand hield. Ik zag op de grond een tas. Daarin zag ik [omschrijving verpakt vuurwerk, met categorieaanduiding zoals vermeld op de verpakking] en [omschrijving los vuurwerk zonder verpakking].»<\/p><p>Verdere verplichte onderdelen: <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B6 – Eisen aan het proces-verbaal. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"onthoud","titel":"Kort samengevat","html":"<h2 class=\"ptitle\">Kort samengevat<\/h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-t\">2. Welke soorten vuurwerk zijn er?<\/div><div class=\"kaart-b\"><ul class=\"punten\"><li>Vuurwerk is ingedeeld in categorieën. De verpakking geeft aanwijzingen.<\/li><li>Zonder verpakking of etiket is vuurwerk onbekend.<\/li><\/ul><\/div><\/div>"},{"kind":"onthoud","titel":"Kort samengevat","html":"<h2 class=\"ptitle\">Kort samengevat<\/h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-t\">3. Wat zegt de wet?<\/div><div class=\"kaart-b\"><ul class=\"punten\"><li>Artikel 9.2.2.1a Wet milieubeheer heeft een centrale plaats.<\/li><li>Onder de wet liggen vuurwerkregels. De WED speelt een rol bij de strafbaarheid.<\/li><\/ul><\/div><\/div>"},{"kind":"onthoud","titel":"Kort samengevat","html":"<h2 class=\"ptitle\">Kort samengevat<\/h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-t\">4. Wanneer ben jij als boa bevoegd?<\/div><div class=\"kaart-b\"><ul class=\"punten\"><li>Een strafbaar feit zien is iets anders dan daarvoor bevoegd zijn.<\/li><li>Je bevoegdheid hangt af van domein I en de domeinlijst.<\/li><\/ul><\/div><\/div>"},{"kind":"onthoud","titel":"Kort samengevat","html":"<h2 class=\"ptitle\">Kort samengevat<\/h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-t\">5. Wat mag je als boa doen?<\/div><div class=\"kaart-b\"><ul class=\"punten\"><li>Volg vijf stappen: situatie, wat wil je doen, mag dat, grondslag, vervolg.<\/li><li>Leg alles vast in het proces-verbaal: feiten, geen conclusies.<\/li><\/ul><\/div><\/div>"},{"kind":"onthoud","titel":"Kort samengevat","html":"<h2 class=\"ptitle\">Kort samengevat<\/h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-t\">6. Onbekend en zwaar illegaal vuurwerk<\/div><div class=\"kaart-b\"><ul class=\"punten\"><li>Bevoegd, veilig en taakverdeling zijn drie aparte vragen.<\/li><li>Bij onbekend of zwaar vuurwerk staat veiligheid voorop.<\/li><\/ul><\/div><\/div>"},{"kind":"onthoud","titel":"Kort samengevat","html":"<h2 class=\"ptitle\">Kort samengevat<\/h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-t\">7. Taakverdeling tussen boa en politie<\/div><div class=\"kaart-b\"><ul class=\"punten\"><li>Bevoegdheid is wat je mág. Taakverdeling is wat van je wordt verwacht.<\/li><li>Het Handhavingsplan bepaalt de afspraken. Die volgen nog.<\/li><\/ul><\/div><\/div>"},{"kind":"theory","titel":"Beslishulp: de vier vragen op straat","html":"<h2 class=\"ptitle\">Beslishulp: de vier vragen op straat<\/h2><div class=\"main\"><p>De beslishulp zet de vier vragen op een rij. Je kunt hiermee elke vuurwerksituatie stap voor stap doorlopen.<\/p><\/div>"},{"kind":"figuur","titel":"Beslishulp: de vier vragen op straat","html":"<div class=\"figcap\">Beslishulp: de vier vragen op straat<\/div><figure class=\"illu\"><svg viewBox=\"0 0 560 60\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>Beslishulp: de vier vragen op straat<\/title><desc>Vier vragen na elkaar: wat tref ik aan, is dit strafbaar, ben ik bevoegd, wat doe ik nu. Is alles duidelijk, handel dan volgens de taakverdeling. Twijfel je, overleg dan of schakel de politie in.<\/desc><\/svg><\/figure>"},{"kind":"theory","titel":"Klaar voor de eindtoets","html":"<h2 class=\"ptitle\">Klaar voor de eindtoets<\/h2><div class=\"main\"><p>Met de vier vragen ben je voorbereid op de eindtoets. Daarin komen de soorten vuurwerk, de wet, bevoegdheid, veiligheid en taakverdeling terug.<\/p><p>Twijfel je? Kijk dan terug in de onderwerpen. Let op: een deel van de juridische inhoud wordt nog aangeleverd.<\/p><\/div>"}],"titel":"Van melding tot proces-verbaal","type":"samenvatting","vragen":[]}],"totaalVragen":27,"version":"0.1 (concept)"};window.__ICONS__={"megafoon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 11v2a1 1 0 0 0 1 1h2l3.5 3.5V6.5L6 10H4a1 1 0 0 0-1 1Z\"/><path d=\"M12 8a4 4 0 0 1 0 8\"/></svg>","balans":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3v18M7 21h10\"/><path d=\"M12 6 5 8m7-2 7 2\"/><path d=\"M5 8 2.5 13a3 3 0 0 0 5 0L5 8Zm14 0-2.5 5a3 3 0 0 0 5 0L19 8Z\"/></svg>","wet":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 3h9l3 3v15H6z\"/><path d=\"M9 8h6M9 12h6M9 16h4\"/></svg>","oog":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z\"/><circle cx=\"12\" cy=\"12\" r=\"2.5\"/></svg>","book":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/></svg>","document":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg>","list":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M8 6h12M8 12h12M8 18h12\"/><circle cx=\"4\" cy=\"6\" r=\"1\"/><circle cx=\"4\" cy=\"12\" r=\"1\"/><circle cx=\"4\" cy=\"18\" r=\"1\"/></svg>","target":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"8\"/><circle cx=\"12\" cy=\"12\" r=\"4\"/><circle cx=\"12\" cy=\"12\" r=\"1\"/></svg>","vink":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg>","kruis":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"/></svg>","waarschuwing":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17h.01\"/></svg>","ster":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg>","praktijk":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg>"};</script>

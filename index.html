<script>window.__DATA__={"aantalOnderwerpen":6,"drempel":70,"eindtoets":[{"casus":false,"juist":1,"opties":["Ben ik bevoegd? – Wat tref ik aan? – Wat doe ik nu? – Is dit strafbaar?","Wat tref ik aan? – Is dit strafbaar? – Ben ik bevoegd? – Wat doe ik nu?","Wat doe ik nu? – Ben ik bevoegd? – Is dit strafbaar? – Wat tref ik aan?","Is dit strafbaar? – Wat tref ik aan? – Wat doe ik nu? – Ben ik bevoegd?"],"thema":"Vier vragen","uitleg":"Juist is B. Je begint bij wat je aantreft. Daarna volgen strafbaarheid, bevoegdheid en wat je nu doet.","vraag":"Wat is de juiste volgorde van de vier vragen?"},{"casus":true,"juist":2,"opties":["Als bewijs. Je hoeft verder niets te controleren.","Niet. Een etiket is nooit betrouwbaar.","Als aanwijzing. Je legt vast wat er staat.","Alleen als de eigenaar bevestigt dat het klopt."],"thema":"Soorten vuurwerk","uitleg":"Juist is C. Wat op de verpakking staat, is een aanwijzing. Het is nog geen vaststelling.","vraag":"Je vindt vuurwerk met een etiket waarop een categorie staat. Hoe gebruik je die informatie?"},{"casus":true,"juist":0,"opties":["Onbekend vuurwerk.","Legaal vuurwerk.","Verboden vuurwerk.","Professioneel vuurwerk."],"thema":"Soorten vuurwerk","uitleg":"Juist is A. Zonder verpakking of etiket weet je niet wat het is. Daarom noem je het onbekend.","vraag":"Een jongere heeft vuurwerk zonder verpakking in zijn tas. Hoe noem je dit vuurwerk?"},{"casus":false,"juist":3,"opties":["Omdat een conclusie in het proces-verbaal nooit mag.","Omdat alleen de politie conclusies mag trekken.","Omdat een waarneming minder belangrijk is dan een conclusie.","Omdat je alleen conclusies trekt die je kunt onderbouwen."],"thema":"Soorten vuurwerk","uitleg":"Juist is D. Je schrijft op wat je ziet. Een conclusie trek je alleen als je die kunt onderbouwen.","vraag":"Waarom is het onderscheid tussen waarneming en conclusie belangrijk?"},{"casus":false,"juist":1,"opties":["De Wet wapens en munitie.","De Wet milieubeheer.","De Opiumwet.","De Wegenverkeerswet 1994."],"thema":"De wet","uitleg":"Juist is B. Artikel 9.2.2.1a van de Wet milieubeheer heeft een centrale plaats. De tekst en uitleg worden nog aangeleverd.","vraag":"In welke wet staat het artikel dat in deze opleiding een centrale plaats heeft?"},{"casus":true,"juist":2,"opties":["Ja, een harde knal is altijd strafbaar.","Ja, vuurwerk op straat is altijd strafbaar.","Nee, eerst moet je weten wat je aantreft.","Nee, vuurwerk is nooit strafbaar zonder schade."],"thema":"De wet","uitleg":"Juist is C. Zolang je niet weet om welk vuurwerk het gaat, trek je geen conclusie over strafbaarheid.","vraag":"Je hoort een knal en ziet vuurwerk. Je weet nog niet welk vuurwerk het is. Kun je al zeggen of het strafbaar is?"},{"casus":false,"juist":0,"opties":["Constateren is een feit zien. Bevoegd zijn is dat je ervoor mag optreden.","Er is geen verschil. Wie een feit ziet, mag optreden.","Constateren mag alleen de politie. Bevoegd zijn geldt voor iedereen.","Constateren is achteraf. Bevoegd zijn is vooraf."],"thema":"Bevoegdheid","uitleg":"Juist is A. Een feit zien is iets anders dan daarvoor bevoegd zijn. Je controleert steeds of het feit onder jouw bevoegdheid valt.","vraag":"Wat is het verschil tussen constateren en opsporingsbevoegd zijn?"},{"casus":false,"juist":3,"opties":["Het etiket op het vuurwerk.","De folder van de gemeente.","Wat omstanders zeggen.","De domeinlijst van domein I."],"thema":"Bevoegdheid","uitleg":"Juist is D. De domeinlijst bepaalt voor welke feiten je bevoegd bent. De relevante onderdelen worden nog aangeleverd.","vraag":"Waar kijk je om te weten voor welke feiten je in domein I bevoegd bent?"},{"casus":true,"juist":1,"opties":["Je mag niets doen tot een ander de categorie heeft vastgesteld.","Het vaststellen van de categorie kan onderdeel zijn van je onderzoek.","Je gaat uit van de zwaarste categorie.","Je gaat uit van de lichtste categorie."],"thema":"Bevoegdheid","uitleg":"Juist is B. Het vaststellen van de categorie kan onderdeel zijn van het onderzoek.","vraag":"Je weet de categorie van gevonden vuurwerk nog niet. Wat is juist?"},{"casus":true,"juist":2,"opties":["Of er genoeg mensen kijken.","Of hij meewerkt.","Of dat mag en op welke grondslag.","Of je het later kunt uitleggen."],"thema":"Bevoegdheden","uitleg":"Juist is C. Elke bevoegdheid vraagt een wettelijke grondslag. Die ga je eerst na.","vraag":"Je wilt iemand met vuurwerk staande houden. Wat ga je eerst na?"},{"casus":false,"juist":0,"opties":["Een feitelijke beschrijving van wat je zag.","Alleen je eindconclusie over het vuurwerk.","Alleen wat de verdachte erover zei.","Alleen de categorie die je zelf schat."],"thema":"Proces-verbaal","uitleg":"Juist is A. Je schrijft feiten, geen conclusies.","vraag":"Wat schrijf je in het proces-verbaal over het vuurwerk?"},{"casus":true,"juist":3,"opties":["Omdat je bevoegd bent, onderzoek je het zelf.","Omdat het zelfgemaakt is, ben je niet bevoegd.","Je vraagt omstanders om het op te ruimen.","Bevoegd zijn betekent niet dat het veilig is."],"thema":"Veiligheid","uitleg":"Juist is D. Bevoegdheid en veiligheid zijn aparte vragen. Wanneer je stopt, staat in de veiligheidsrichtlijn die nog wordt aangeleverd.","vraag":"Je bent bevoegd, maar het vuurwerk ziet er zwaar en zelfgemaakt uit. Wat is juist?"},{"casus":false,"juist":1,"opties":["Wat je juridisch mag.","Wat in de praktijk van jou wordt verwacht.","Wat de verdachte moet doen.","Wat in de wet over straffen staat."],"thema":"Taakverdeling","uitleg":"Juist is B. Bevoegdheid is wat je mág. Taakverdeling is wat van je wordt verwacht.","vraag":"Wat is taakverdeling?"},{"casus":true,"juist":2,"opties":["De afspraak gaat voor. Je bent dan toch bevoegd.","Je bent bevoegd als je leidinggevende akkoord is.","Een afspraak geeft je geen bevoegdheid die je niet hebt.","Je bent bevoegd als de politie niet kan komen."],"thema":"Taakverdeling","uitleg":"Juist is C. Taakverdeling maakt je niet bevoegd voor iets waarvoor je volgens de regels niet bevoegd bent.","vraag":"Een afspraak in het Handhavingsplan zegt dat jij iets oppakt, maar je bent er volgens de regels niet voor bevoegd. Wat geldt?"}],"eindtoetsDrempel":80,"kaderLabel":"Vuurwerk","opleiding":"Vuurwerk","peildatum":"nog vast te stellen","subtitel":"VUURWERK — E-LEARNING VOOR BOA'S","topics":[{"icoon":"megafoon","id":"m1","kader":"Opleiding","nr":1,"pages":[{"kind":"lo","titel":"Leerdoelen","html":"<h2 class=\"ptitle\">Leerdoelen<\/h2><p class=\"pintro\">Wat je na de hele opleiding kunt.<\/p><ul class=\"lo\"><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je waarom vuurwerk belangrijk is voor jouw werk als boa;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>ken je het verschil tussen legaal, verboden en onbekend vuurwerk;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je dat veiligheid, strafbaarheid en bevoegdheid drie aparte vragen zijn;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>ken je de vier vragen die je bij elke vuurwerksituatie stelt;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je hoe deze opleiding is opgebouwd en wat je nodig hebt voor het certificaat.<\/span><\/li><\/ul>"},{"kind":"casus","titel":"Een harde knal op het plein","html":"<span class=\"q-soort\">Voorbeeld<\/span><h2 class=\"ptitle\">Een harde knal op het plein<\/h2><p class=\"lees\">Je loopt surveillance. Het is begin van de avond. Opeens hoor je een harde knal.<\/p><p class=\"lees\">Op een plein staan een paar jongeren bij elkaar. Eén jongere heeft vuurwerk in zijn hand. Naast de groep staat een tas. Daarin zit vuurwerk van verschillende soorten.<\/p><p class=\"lees\">Wat doe je nu? Deze situatie komt in de opleiding vaker terug.<\/p>"},{"kind":"casus","titel":"Een harde knal op het plein — wat gaat er door je heen?","html":"<span class=\"q-soort\">Voorbeeld<\/span><h2 class=\"ptitle\">Een harde knal op het plein — wat gaat er door je heen?<\/h2><div class=\"kaart k-voorbeeld\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3v18M7 21h10\"/><path d=\"M12 6 5 8m7-2 7 2\"/><path d=\"M5 8 2.5 13a3 3 0 0 0 5 0L5 8Zm14 0-2.5 5a3 3 0 0 0 5 0L19 8Z\"/><\/svg><\/span><span class=\"kaart-lab\">Voorbeeld<\/span><\/div><div class=\"kaart-t\">Eerst denken, dan doen<\/div><div class=\"kaart-b\"><p>Misschien denk je meteen: dit is verboden. Maar weet je dat al zeker? Je hebt alleen een knal gehoord en vuurwerk gezien.<\/p><p>Je hebt op dit moment nog veel vragen. Wat voor vuurwerk is het? Is het strafbaar? Mag jij hier als boa iets aan doen? En is het veilig om dichterbij te komen?<\/p><p>In deze opleiding leer je die vragen stap voor stap te beantwoorden.<\/p><\/div><\/div>"},{"kind":"theory","titel":"Waarom vuurwerk jouw werk is","html":"<h2 class=\"ptitle\">Waarom vuurwerk jouw werk is<\/h2><div class=\"main\"><p>Vuurwerk hoort bij de jaarwisseling. Maar vuurwerk kan ook overlast geven en gevaarlijk zijn. Voor omstanders, voor de gebruiker en ook voor jou.<\/p><p>Als boa ben je vaak als eerste op straat aanwezig. Je hoort een knal of je ziet iemand met vuurwerk. Dan moet je snel een goede inschatting maken.<\/p><p>Daarvoor heb je kennis nodig. Over soorten vuurwerk, over de regels en over wat jij mag doen.<\/p><\/div>"},{"kind":"theory","titel":"Legaal, verboden en onbekend","html":"<h2 class=\"ptitle\">Legaal, verboden en onbekend<\/h2><div class=\"main\"><p>In deze opleiding maken we onderscheid tussen drie groepen vuurwerk.<\/p><ul class=\"opsom\"><li><b>Legaal vuurwerk<\/b>: vuurwerk dat onder voorwaarden mag. <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/li><li><b>Verboden vuurwerk<\/b>: vuurwerk dat niet mag. <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/li><li><b>Onbekend vuurwerk<\/b>: vuurwerk waarvan je nog niet weet wat het is. Bijvoorbeeld omdat een verpakking of etiket ontbreekt.<\/li><\/ul><p>Op straat weet je vaak niet meteen in welke groep het vuurwerk valt. Dat is normaal. Je leert in deze opleiding hoe je daarmee omgaat.<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B9 – Definities: categorieën F1–F3, professioneel vuurwerk, zwaar illegaal vuurwerk, nitraten. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"theory","titel":"De vier vragen","html":"<h2 class=\"ptitle\">De vier vragen<\/h2><div class=\"main\"><p>Bij elke situatie met vuurwerk stel je dezelfde vier vragen. Ze helpen je om rustig en in de goede volgorde te denken.<\/p><p>«Wat tref ik aan?» Welk soort vuurwerk is dit? «Is dit strafbaar?» Welke regel is van toepassing? «Ben ik bevoegd?» Mag ik als boa voor dit feit optreden? «Wat doe ik nu?» Zelf optreden, nader onderzoeken, veiligstellen, overleggen of politie inschakelen?<\/p><p>Deze vier vragen komen in elk onderwerp terug. Na de opleiding stel je ze automatisch.<\/p><\/div>"},{"kind":"theory","titel":"Drie aparte vragen: veilig, strafbaar, bevoegd","html":"<h2 class=\"ptitle\">Drie aparte vragen: veilig, strafbaar, bevoegd<\/h2><div class=\"main\"><p>Veiligheid, strafbaarheid en bevoegdheid zijn drie verschillende vragen. Je beoordeelt ze los van elkaar.<\/p><p>Een voorbeeld. Iets kan strafbaar zijn, terwijl jij er als boa niet voor bevoegd bent. Of je bent wel bevoegd, maar het is niet veilig om zelf verder te gaan.<\/p><p>Haal je deze vragen door elkaar? Dan kun je een verkeerde beslissing nemen. Daarom houden we ze in de hele opleiding uit elkaar.<\/p><\/div>"},{"kind":"figuur","titel":"Opzet van de opleiding","html":"<div class=\"figcap\">Opzet van de opleiding<\/div><figure class=\"illu\"><svg viewBox=\"0 0 560 60\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>Opzet van de opleiding<\/title><desc>De route: introductie, zes inhoudelijke onderwerpen, samenvatting, de eindtoets (ten minste tachtig procent) en het certificaat. De voortgang wordt bewaard, zodat je later kunt verdergaan.<\/desc><\/svg><\/figure>"},{"kind":"onthoud","titel":"Kort samengevat","html":"<h2 class=\"ptitle\">Kort samengevat<\/h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-b\"><ul class=\"punten\"><li>Vuurwerk kan overlast geven en gevaarlijk zijn. Als boa ben je vaak als eerste ter plaatse.<\/li><li>Je onderscheidt legaal, verboden en onbekend vuurwerk. Op straat weet je dat niet altijd meteen.<\/li><li>Je stelt steeds vier vragen: wat tref ik aan, is dit strafbaar, ben ik bevoegd en wat doe ik nu?<\/li><\/ul><\/div><\/div>"}],"titel":"Vuurwerk en jouw werk als boa","type":"intro","vragen":[]},{"icoon":"list","id":"m2","kader":"Vuurwerkcategorieën","nr":2,"pages":[{"kind":"lo","titel":"Leerdoelen","html":"<h2 class=\"ptitle\">Leerdoelen<\/h2><p class=\"pintro\">Wat je na dit onderwerp kunt.<\/p><ul class=\"lo\"><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>herken je de categorieën F1, F2 en F3;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je wat professioneel vuurwerk is, voor zover dat voor jou belangrijk is;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je waar je op let bij verpakking en categorieaanduiding;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je wanneer je vuurwerk onbekend noemt;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>kun je zeggen wat je op straat wel en nog niet kunt vaststellen.<\/span><\/li><\/ul>"},{"kind":"theory","titel":"Waarom categorieën?","html":"<h2 class=\"ptitle\">Waarom categorieën?<\/h2><div class=\"main\"><p>Vuurwerk is er in veel soorten. Er is licht vuurwerk en er is zwaar vuurwerk. Daarom is vuurwerk ingedeeld in categorieën.<\/p><p>De categorie zegt iets over het vuurwerk. En het helpt jou bij de eerste vraag: «Wat tref ik aan?»<\/p><\/div>"},{"kind":"theory","titel":"Waar komt de indeling vandaan?","html":"<h2 class=\"ptitle\">Waar komt de indeling vandaan?<\/h2><div class=\"main\"><p>De indeling in categorieën staat in de regels over vuurwerk. Welke regels dat precies zijn: <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><p>In deze opleiding gebruiken we alleen de officiële indeling. Zo praat je met collega's en politie over hetzelfde.<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B2 – Onderliggende vuurwerkregelgeving: welke regeling en welke bepalingen (categorieën, verboden, etikettering). Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"figuur","titel":"Overzicht van de categorieën","html":"<div class=\"figcap\">Overzicht van de categorieën<\/div><figure class=\"illu\"><svg viewBox=\"0 0 560 60\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>Overzicht van de categorieën<\/title><desc>Vier groepen: categorie F1, categorie F2, categorie F3 en professioneel vuurwerk. De kenmerken per categorie moeten nog worden aangeleverd en gecontroleerd.<\/desc><\/svg><\/figure>"},{"kind":"theory","titel":"Categorie F1","html":"<h2 class=\"ptitle\">Categorie F1<\/h2><div class=\"main\"><p><b>Wat zie je?<\/b> Kijk naar het vuurwerk en naar de verpakking. Staat er een categorie op? Is de verpakking heel?<\/p><p><b>Categorie:<\/b> F1. Kenmerken en voorbeelden: <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><p><b>Wat betekent dit?<\/b> Wat deze categorie voor jou betekent, leer je in de volgende onderwerpen. <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B2 – Onderliggende vuurwerkregelgeving: welke regeling en welke bepalingen (categorieën, verboden, etikettering). Nog aan te leveren.<\/li><li>B9 – Definities: categorieën F1–F3, professioneel vuurwerk, zwaar illegaal vuurwerk, nitraten. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Categorie F2","html":"<h2 class=\"ptitle\">Categorie F2<\/h2><div class=\"main\"><p><b>Wat zie je?<\/b> Kijk naar het vuurwerk en naar de verpakking. Staat er een categorie op? Is de verpakking heel?<\/p><p><b>Categorie:<\/b> F2. Kenmerken en voorbeelden: <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><p><b>Wat betekent dit?<\/b> Wat deze categorie voor jou betekent, leer je in de volgende onderwerpen. <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B2 – Onderliggende vuurwerkregelgeving: welke regeling en welke bepalingen (categorieën, verboden, etikettering). Nog aan te leveren.<\/li><li>B9 – Definities: categorieën F1–F3, professioneel vuurwerk, zwaar illegaal vuurwerk, nitraten. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Categorie F3","html":"<h2 class=\"ptitle\">Categorie F3<\/h2><div class=\"main\"><p><b>Wat zie je?<\/b> Kijk naar het vuurwerk en naar de verpakking. Staat er een categorie op? Is de verpakking heel?<\/p><p><b>Categorie:<\/b> F3. Kenmerken en voorbeelden: <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><p><b>Wat betekent dit?<\/b> Wat deze categorie voor jou betekent, leer je in de volgende onderwerpen. <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B2 – Onderliggende vuurwerkregelgeving: welke regeling en welke bepalingen (categorieën, verboden, etikettering). Nog aan te leveren.<\/li><li>B9 – Definities: categorieën F1–F3, professioneel vuurwerk, zwaar illegaal vuurwerk, nitraten. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Professioneel vuurwerk","html":"<h2 class=\"ptitle\">Professioneel vuurwerk<\/h2><div class=\"main\"><p>Professioneel vuurwerk wordt gebruikt door vakmensen. Bijvoorbeeld bij een vuurwerkshow.<\/p><p>Wat professioneel vuurwerk precies is en wat dit voor jou betekent: <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><p>Tref je professioneel vuurwerk aan op straat? Dan is dat een bijzondere situatie. Daarover lees je meer in onderwerp 6.<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B9 – Definities: categorieën F1–F3, professioneel vuurwerk, zwaar illegaal vuurwerk, nitraten. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Verpakking en categorieaanduiding","html":"<h2 class=\"ptitle\">Verpakking en categorieaanduiding<\/h2><div class=\"main\"><p>De verpakking geeft je veel informatie. Kijk of er een categorie op staat. Kijk ook of de verpakking heel is.<\/p><p>Welke gegevens verplicht op de verpakking moeten staan: <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><p>Let op: een verpakking kan ook beschadigd, nagemaakt of verkeerd zijn. Wat je ziet, is dus een aanwijzing. Het is nog geen vaststelling.<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B2 – Onderliggende vuurwerkregelgeving: welke regeling en welke bepalingen (categorieën, verboden, etikettering). Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"figuur","titel":"Zelfde tas, andere informatie","html":"<div class=\"figcap\">Zelfde tas, andere informatie<\/div><figure class=\"illu\"><svg viewBox=\"0 0 560 60\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>Zelfde tas, andere informatie<\/title><desc>Links vuurwerk in een verpakking met etiket en categorie: je hebt aanwijzingen. Rechts los vuurwerk zonder verpakking: je weet nog niet wat het is.<\/desc><\/svg><\/figure>"},{"kind":"theory","titel":"Legaal of verboden?","html":"<h2 class=\"ptitle\">Legaal of verboden?<\/h2><div class=\"main\"><p>Of vuurwerk mag of niet, hangt af van de regels. Die regels kijken we niet alleen op de categorie na.<\/p><p>Wanneer vuurwerk verboden is: <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><p>In onderwerp 3 kijken we naar wat de wet zegt. Nu gaat het er alleen om dat je goed kijkt en goed vastlegt.<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B2 – Onderliggende vuurwerkregelgeving: welke regeling en welke bepalingen (categorieën, verboden, etikettering). Nog aan te leveren.<\/li><li>B9 – Definities: categorieën F1–F3, professioneel vuurwerk, zwaar illegaal vuurwerk, nitraten. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Onbekend vuurwerk","html":"<h2 class=\"ptitle\">Onbekend vuurwerk<\/h2><div class=\"main\"><p>Soms weet je niet wat je voor je hebt. Er is geen verpakking. Er staat geen etiket op. Of het vuurwerk is beschadigd.<\/p><p>Dan noemen we het vuurwerk onbekend. Je weet wel wát je ziet: de vorm, de grootte, de kleur. Maar je weet nog niet om welke categorie het gaat.<\/p><p>Onbekend vuurwerk vraagt extra voorzichtigheid. Daarover gaat onderwerp 6.<\/p><\/div>"},{"kind":"kaart","titel":"Op straat weet je het niet altijd","html":"<h2 class=\"ptitle\">Op straat weet je het niet altijd<\/h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/><\/svg><\/span><span class=\"kaart-lab\">In de praktijk<\/span><\/div><div class=\"kaart-t\">Waarneming is nog geen vaststelling<\/div><div class=\"kaart-b\"><p>Op straat heb je weinig tijd en weinig informatie. Je kunt vaak niet meteen vaststellen welk vuurwerk het is.<\/p><p>Maak daarom onderscheid tussen wat je <b>ziet<\/b> en wat je <b>concludeert<\/b>. Schrijf op wat je ziet. Trek nog geen conclusie over de categorie als je die niet kunt onderbouwen.<\/p><ul class=\"opsom\"><li>Wat zie je precies?<\/li><li>Wat staat er op de verpakking?<\/li><li>Wat weet je nog niet?<\/li><\/ul><\/div><\/div>"},{"kind":"casus","titel":"Terug naar het plein: de tas","html":"<span class=\"q-soort\">Voorbeeld<\/span><h2 class=\"ptitle\">Terug naar het plein: de tas<\/h2><p class=\"lees\">Je kijkt in de tas naast de jongeren. Een deel van het vuurwerk zit in een verpakking met etiket. Een ander deel zit los in de tas, zonder verpakking.<\/p><p class=\"lees\">Wat weet je nu? Bij het verpakte vuurwerk heb je aanwijzingen. Bij het losse vuurwerk weet je nog niet wat het is.<\/p>"},{"kind":"figuur","titel":"Wat kun je wel en nog niet vaststellen?","html":"<div class=\"figcap\">Wat kun je wel en nog niet vaststellen?<\/div><figure class=\"illu\"><svg viewBox=\"0 0 560 60\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>Wat kun je wel en nog niet vaststellen?<\/title><desc>Links wat je op straat kunt zien: vorm, verpakking, etiket, hoeveelheid. Rechts wat vaak nog moet worden vastgesteld: de categorie en of het vuurwerk verboden is.<\/desc><\/svg><\/figure>"},{"kind":"onthoud","titel":"Kort samengevat","html":"<h2 class=\"ptitle\">Kort samengevat<\/h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-b\"><ul class=\"punten\"><li>Vuurwerk is ingedeeld in categorieën. De kenmerken per categorie worden nog aangeleverd.<\/li><li>De verpakking geeft aanwijzingen, maar is nog geen vaststelling.<\/li><li>Zonder verpakking of etiket noem je vuurwerk onbekend. Dan ben je extra voorzichtig.<\/li><li>Schrijf op wat je ziet. Trek geen conclusie die je niet kunt onderbouwen.<\/li><\/ul><\/div><\/div>"},{"kind":"theory","titel":"Vooruitblik: Wat zegt de wet?","html":"<h2 class=\"ptitle\">Vooruitblik: Wat zegt de wet?<\/h2><div class=\"main\"><p>Je weet nu hoe je naar vuurwerk kijkt. In het volgende onderwerp kijken we naar de wet.<\/p><p>Dan gaat het om de tweede vraag: «Is dit strafbaar?»<\/p><\/div>"}],"titel":"Welke soorten vuurwerk zijn er?","type":"content","vragen":[{"artikel":"Werkwijze","juist":1,"kernregel":"Wat je op de verpakking ziet, is een aanwijzing. Het is nog geen vaststelling.","opties":["Het etiket bewijst welke categorie het is. Je hoeft niets meer te controleren.","Het etiket is een aanwijzing. Je schrijft op wat er staat. Het is nog geen vaststelling.","Het etiket zegt niets. Je kijkt alleen naar de grootte van het vuurwerk.","Het etiket telt pas mee als de eigenaar zegt dat het klopt."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is B. Een verpakking kan beschadigd, nagemaakt of verkeerd zijn. Daarom is wat je op het etiket ziet een aanwijzing. Je legt het vast, maar je trekt nog geen harde conclusie.","voetnoten":[],"vraag":"Je ziet vuurwerk in een verpakking. Op het etiket staat een categorie. Wat kun je nu zeggen?","wet":"—"},{"artikel":"Werkwijze","juist":2,"kernregel":"Zonder verpakking of etiket noem je vuurwerk onbekend.","opties":["Legaal vuurwerk, omdat er niets op staat wat verboden is.","Verboden vuurwerk, omdat de verpakking en het etiket ontbreken.","Onbekend vuurwerk, omdat je nog niet weet wat het is.","Professioneel vuurwerk, omdat het niet in een winkelverpakking zit."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is C. Zonder verpakking of etiket weet je niet om welke categorie het gaat. Daarom noemen we het onbekend. Of het verboden is, stel je niet vast op basis van alleen een ontbrekende verpakking.","voetnoten":[],"vraag":"In een tas ligt vuurwerk zonder verpakking en zonder etiket. Hoe noem je dit vuurwerk in deze opleiding?","wet":"—"},{"artikel":"Werkwijze","juist":0,"kernregel":"De eerste vraag is altijd: wat tref ik aan?","opties":["Wat tref ik aan? Welk soort vuurwerk is dit?","Wat doe ik nu? Zelf optreden of de politie bellen?","Ben ik bevoegd? Mag ik als boa voor dit feit optreden?","Is dit strafbaar? Welke bepaling is van toepassing?"],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is A. De vier vragen hebben een vaste volgorde. Je begint met wat je aantreft. Daarna volgen strafbaarheid, bevoegdheid en wat je nu doet.","voetnoten":[],"vraag":"Welke vraag stel je als eerste bij een situatie met vuurwerk?","wet":"—"},{"artikel":"Werkwijze","juist":3,"kernregel":"Maak onderscheid tussen waarneming en conclusie. Leg per soort vast wat je ziet.","opties":["Je noemt al het vuurwerk verboden, omdat een deel geen verpakking heeft.","Je noemt al het vuurwerk legaal, omdat een deel wel een verpakking heeft.","Je laat de tas staan, omdat je de categorie toch niet kunt vaststellen.","Je schrijft per soort op wat je ziet en wat je nog niet weet."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is D. Je maakt onderscheid tussen wat je ziet en wat je concludeert. Het verpakte en het losse vuurwerk leveren verschillende informatie op. Die leg je apart vast.","voetnoten":[],"vraag":"Je kijkt in de tas op het plein. Een deel van het vuurwerk is verpakt, een deel ligt los. Wat is nu de beste stap?","wet":"—"},{"artikel":"Werkwijze","juist":1,"kernregel":"Schrijf op wat je ziet. Trek geen conclusie die je niet kunt onderbouwen.","opties":["Je neemt het over, want een ervaren collega ziet dit meestal goed.","Je schrijft op wat je zelf ziet. Een conclusie trek je alleen als je die kunt onderbouwen.","Je schrijft \"zwaar vuurwerk\" in het proces-verbaal, want dat is de snelste manier.","Je laat het vuurwerk liggen, want zonder verpakking kun je niets vastleggen."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is B. Ook zonder verpakking kun je veel vastleggen: vorm, grootte, hoeveelheid en plaats. Een conclusie over de soort trek je alleen als je die kunt onderbouwen.","voetnoten":[],"vraag":"Een collega zegt: \"Dit is duidelijk zwaar vuurwerk, dat zie je zo.\" Er zit geen verpakking omheen. Hoe reageer je het best?","wet":"—"}]},{"icoon":"wet","id":"m3","kader":"Wet milieubeheer","nr":3,"pages":[{"kind":"lo","titel":"Leerdoelen","html":"<h2 class=\"ptitle\">Leerdoelen<\/h2><p class=\"pintro\">Wat je na dit onderwerp kunt.<\/p><ul class=\"lo\"><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je welke rol artikel 9.2.2.1a Wet milieubeheer speelt bij vuurwerk;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je dat onder de wet nog andere vuurwerkregels liggen;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>kun je een wettekst lezen in vijf stappen: wettekst, gewone taal, betekenis voor jou, voorbeeld en let op;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je hoe een regel een strafbaar feit wordt.<\/span><\/li><\/ul>"},{"kind":"theory","titel":"Van soort naar strafbaarheid","html":"<h2 class=\"ptitle\">Van soort naar strafbaarheid<\/h2><div class=\"main\"><p>In onderwerp 2 ging het over de vraag «Wat tref ik aan?» Nu gaat het over de volgende vraag: «Is dit strafbaar?»<\/p><p>Daarvoor kijk je naar de wet. In dit onderwerp leer je welke regels bij vuurwerk horen. En hoe je zo'n regel leest.<\/p><\/div>"},{"kind":"theory","titel":"Hoe de regels in elkaar zitten","html":"<h2 class=\"ptitle\">Hoe de regels in elkaar zitten<\/h2><div class=\"main\"><p>Regels over vuurwerk staan niet op één plek. Er is een wet. Daaronder liggen andere regels met meer details.<\/p><p>Je kunt het zien als een trap. Bovenaan staat de wet. Daaronder staan regels die uitwerken wat de wet bedoelt.<\/p><p>Welke regels precies bij vuurwerk horen: <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B1 – Artikel 9.2.2.1a Wet milieubeheer: letterlijke tekst, geldend op de peildatum. Nog aan te leveren.<\/li><li>B2 – Onderliggende vuurwerkregelgeving: welke regeling en welke bepalingen (categorieën, verboden, etikettering). Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"kader","titel":"Wettekst: artikel 9.2.2.1a Wet milieubeheer","html":"<h2 class=\"ptitle\">Wettekst: artikel 9.2.2.1a Wet milieubeheer<\/h2><div class=\"kaart k-kader law-card\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span class=\"kaart-lab\">Juridisch kader<\/span><\/div><div class=\"kaart-t\">Artikel 9.2.2.1a · Wet milieubeheer<\/div><div class=\"kaart-b\"><p class=\"law-intro\">Dit artikel heeft een centrale plaats in deze opleiding. Hieronder komt de letterlijke tekst, zoals die geldt op de peildatum.<\/p><div class=\"law-quote\"><div class=\"law-quote-head\"><span class=\"law-quote-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/><\/svg><\/span><span>Wettekst<\/span><\/div><p class=\"wet law-text\"><strong>Juridische inhoud nog aan te leveren/controleren.<\/strong> Hier komt de letterlijke tekst van artikel 9.2.2.1a Wet milieubeheer.<\/p><\/div><div class=\"law-grid\"><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>In gewone taal<\/span><\/div><p>Wat dit artikel betekent, leggen we uit zodra de tekst is aangeleverd en gecontroleerd. <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><\/section><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>Wat betekent dit voor jou als boa?<\/span><\/div><p>Welke rol dit artikel speelt bij jouw werk op straat: <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><\/section><\/div><div class=\"law-definition\"><span class=\"law-definition-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><p><strong>Wettekst<\/strong> is de officiële tekst. Die verander je niet. De uitleg ernaast is in gewone taal.<\/p><\/div><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B1 – Artikel 9.2.2.1a Wet milieubeheer: letterlijke tekst, geldend op de peildatum. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"casus","titel":"Artikel 9.2.2.1a Wm — voorbeeld uit de praktijk","html":"<span class=\"q-soort\">Voorbeeld<\/span><h2 class=\"ptitle\">Artikel 9.2.2.1a Wm — voorbeeld uit de praktijk<\/h2><div class=\"kaart k-voorbeeld\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3v18M7 21h10\"/><path d=\"M12 6 5 8m7-2 7 2\"/><path d=\"M5 8 2.5 13a3 3 0 0 0 5 0L5 8Zm14 0-2.5 5a3 3 0 0 0 5 0L19 8Z\"/><\/svg><\/span><span class=\"kaart-lab\">Voorbeeld<\/span><\/div><div class=\"kaart-t\">Het plein en de wet<\/div><div class=\"kaart-b\"><p>Denk aan de jongeren op het plein. Eén van hen heeft vuurwerk in zijn hand. In de tas zit meer vuurwerk.<\/p><p>Speelt artikel 9.2.2.1a Wm hier een rol? Dat hangt af van de tekst van het artikel en van wat je hebt vastgesteld. <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B1 – Artikel 9.2.2.1a Wet milieubeheer: letterlijke tekst, geldend op de peildatum. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"kaart","titel":"Artikel 9.2.2.1a Wm — let op","html":"<h2 class=\"ptitle\">Artikel 9.2.2.1a Wm — let op<\/h2><div class=\"kaart k-letop\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17h.01\"/><\/svg><\/span><span class=\"kaart-lab\">Let op<\/span><\/div><div class=\"kaart-t\">Artikel 9.2.2.1a Wm — let op<\/div><div class=\"kaart-b\"><p>Aandachtspunten bij dit artikel: <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><p>Trek geen conclusie over strafbaarheid als je niet weet om welk vuurwerk het gaat. Dat heb je in onderwerp 2 geleerd.<\/p><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B1 – Artikel 9.2.2.1a Wet milieubeheer: letterlijke tekst, geldend op de peildatum. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"kader","titel":"Onderliggende vuurwerkregelgeving","html":"<h2 class=\"ptitle\">Onderliggende vuurwerkregelgeving<\/h2><div class=\"kaart k-kader law-card\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span class=\"kaart-lab\">Juridisch kader<\/span><\/div><div class=\"kaart-t\">Onderliggende vuurwerkregels<\/div><div class=\"kaart-b\"><p class=\"law-intro\">Onder de wet liggen regels die meer vertellen over vuurwerk. Bijvoorbeeld over categorieën, verboden en etiketten.<\/p><div class=\"law-quote\"><div class=\"law-quote-head\"><span class=\"law-quote-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/><\/svg><\/span><span>Wettekst<\/span><\/div><p class=\"wet law-text\"><strong>Juridische inhoud nog aan te leveren/controleren.<\/strong> Hier komen de relevante bepalingen letterlijk.<\/p><\/div><div class=\"law-grid\"><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>In gewone taal<\/span><\/div><p>Uitleg volgt zodra de bepalingen zijn aangeleverd en gecontroleerd. <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><\/section><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>Wat betekent dit voor jou als boa?<\/span><\/div><p><strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><\/section><\/div><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B2 – Onderliggende vuurwerkregelgeving: welke regeling en welke bepalingen (categorieën, verboden, etikettering). Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"kaart","titel":"Onderliggende regels — let op","html":"<h2 class=\"ptitle\">Onderliggende regels — let op<\/h2><div class=\"kaart k-letop\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17h.01\"/><\/svg><\/span><span class=\"kaart-lab\">Let op<\/span><\/div><div class=\"kaart-t\">Onderliggende regels — let op<\/div><div class=\"kaart-b\"><p>Aandachtspunten bij de onderliggende regels: <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><p>Gebruik altijd de versie die geldt op de dag van het feit.<\/p><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B2 – Onderliggende vuurwerkregelgeving: welke regeling en welke bepalingen (categorieën, verboden, etikettering). Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Van regel naar strafbaar feit","html":"<h2 class=\"ptitle\">Van regel naar strafbaar feit<\/h2><div class=\"main\"><p>Een regel zegt wat wel en niet mag. Maar wanneer is het overtreden van die regel strafbaar? Dat staat vaak in een andere wet.<\/p><p>Bij vuurwerk speelt de Wet op de economische delicten (WED) een rol. Hoe dat precies werkt en welke straffen er gelden: <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B3 – Wet op de economische delicten: bepaling(en) over strafbaarheid en strafmaat. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"figuur","titel":"Van regel naar strafbaar feit","html":"<div class=\"figcap\">Van regel naar strafbaar feit<\/div><figure class=\"illu\"><svg viewBox=\"0 0 560 60\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>Van regel naar strafbaar feit<\/title><desc>Drie stappen: de Wet milieubeheer met artikel 9.2.2.1a, de onderliggende vuurwerkregels en de Wet op de economische delicten. De precieze samenhang moet nog worden aangeleverd en gecontroleerd.<\/desc><\/svg><\/figure>"},{"kind":"onthoud","titel":"Kort samengevat","html":"<h2 class=\"ptitle\">Kort samengevat<\/h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-t\">Wettelijke regels<\/div><div class=\"kaart-b\"><ul class=\"punten\"><li>Bij de vraag «Is dit strafbaar?» kijk je naar de wet.<\/li><li>Artikel 9.2.2.1a Wet milieubeheer heeft een centrale plaats. De tekst en uitleg worden nog aangeleverd.<\/li><\/ul><\/div><\/div>"},{"kind":"onthoud","titel":"Kort samengevat","html":"<h2 class=\"ptitle\">Kort samengevat<\/h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-t\">Samenhang en werkwijze<\/div><div class=\"kaart-b\"><ul class=\"punten\"><li>Onder de wet liggen regels met meer details over vuurwerk.<\/li><li>De WED speelt een rol bij de strafbaarheid. Hoe precies, volgt nog.<\/li><li>Lees een wettekst altijd in vijf stappen: wettekst, gewone taal, betekenis voor jou, voorbeeld en let op.<\/li><\/ul><\/div><\/div>"},{"kind":"theory","titel":"Vooruitblik: Wanneer ben jij als boa bevoegd?","html":"<h2 class=\"ptitle\">Vooruitblik: Wanneer ben jij als boa bevoegd?<\/h2><div class=\"main\"><p>Je weet nu welke regels bij vuurwerk horen. Maar mag jij daar als boa ook iets mee?<\/p><p>In het volgende onderwerp gaat het om de derde vraag: «Ben ik bevoegd?»<\/p><\/div>"}],"titel":"Wat zegt de wet?","type":"content","vragen":[{"artikel":"Art. 9.2.2.1a Wm","juist":1,"kernregel":"Artikel 9.2.2.1a Wet milieubeheer heeft een centrale plaats.","opties":["De Wet wapens en munitie.","De Wet milieubeheer.","De Opiumwet.","De Wegenverkeerswet 1994."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is B. In deze opleiding krijgt artikel 9.2.2.1a Wet milieubeheer een duidelijke plaats. De letterlijke tekst en uitleg worden nog aangeleverd.","voetnoten":[],"vraag":"Welke wet heeft in deze opleiding een centrale plaats bij de vraag \"Is dit strafbaar?\"","wet":"Wet milieubeheer"},{"artikel":"Werkwijze","juist":2,"kernregel":"Lees een wettekst in vijf stappen: wettekst, gewone taal, betekenis voor jou, voorbeeld, let op.","opties":["Voorbeeld, let op, wettekst, gewone taal, betekenis voor jou.","Gewone taal, wettekst, voorbeeld, betekenis voor jou, let op.","Wettekst, gewone taal, betekenis voor jou, voorbeeld, let op.","Let op, betekenis voor jou, wettekst, voorbeeld, gewone taal."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is C. Je begint bij de officiële tekst. Daarna volgt de uitleg in gewone taal, wat het voor jou betekent, een voorbeeld en de aandachtspunten.","voetnoten":[],"vraag":"Je leest een wettekst over vuurwerk. In welke volgorde leer je zo'n tekst lezen?","wet":"—"},{"artikel":"Werkwijze","juist":3,"kernregel":"Trek geen conclusie over strafbaarheid als je niet weet om welk vuurwerk het gaat.","opties":["\"Ja, al het vuurwerk buiten de jaarwisseling is strafbaar.\"","\"Nee, zolang er geen schade is, is het niet strafbaar.\"","\"Ja, want het maakte een harde knal.\"","\"Dat weet ik nog niet. Eerst moet ik weten wat voor vuurwerk het is.\""],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is D. De vraag \"Is dit strafbaar?\" hangt samen met de vraag \"Wat tref ik aan?\" Zolang je niet weet om welk vuurwerk het gaat, trek je geen conclusie over strafbaarheid.","voetnoten":[],"vraag":"Je ziet op het plein vuurwerk, maar je weet nog niet welk vuurwerk het is. Een collega vraagt: \"Is dit strafbaar?\" Wat is het beste antwoord?","wet":"—"},{"artikel":"Werkwijze","juist":0,"kernregel":"Onder de wet liggen regels met meer details over vuurwerk.","opties":["Omdat daar meer details over vuurwerk staan.","Omdat die regels altijd strenger zijn dan de wet zelf.","Omdat de wet zelf voor boa's niet geldt.","Omdat die regels alleen tijdens de jaarwisseling gelden."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is A. Regels over vuurwerk staan niet op één plek. Onder de wet liggen regels die uitwerken wat de wet bedoelt, bijvoorbeeld over categorieën, verboden en etiketten.","voetnoten":[],"vraag":"Waarom kijk je bij vuurwerk ook naar regels onder de wet?","wet":"—"}]},{"icoon":"wet","id":"m4","kader":"Opsporingsbevoegdheid","nr":4,"pages":[{"kind":"lo","titel":"Leerdoelen","html":"<h2 class=\"ptitle\">Leerdoelen<\/h2><p class=\"pintro\">Centrale vraag: ben ik als boa bevoegd om voor dit feit op te treden?<\/p><ul class=\"lo\"><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je waar jouw opsporingsbevoegdheid vandaan komt;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je welke rol domein I en de domeinlijst spelen;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je hoe de Wet milieubeheer en de WED samenhangen met jouw bevoegdheid;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>ken je het verschil tussen een strafbaar feit zien en daarvoor bevoegd zijn;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je hoe je handelt als de categorie van het vuurwerk nog onbekend is.<\/span><\/li><\/ul>"},{"kind":"casus","titel":"Ben ik bevoegd?","html":"<span class=\"q-soort\">Voorbeeld<\/span><h2 class=\"ptitle\">Ben ik bevoegd?<\/h2><p class=\"lees\">Je staat weer bij de jongeren op het plein. Je denkt dat er misschien een strafbaar feit is gepleegd.<\/p><p class=\"lees\">Maar voordat je iets doet, stel je jezelf één vraag: ben ik als boa bevoegd om voor dit feit op te treden?<\/p>"},{"kind":"theory","titel":"Zien is iets anders dan bevoegd zijn","html":"<h2 class=\"ptitle\">Zien is iets anders dan bevoegd zijn<\/h2><div class=\"main\"><p>Je kunt een strafbaar feit zien. Dat heet constateren. Maar dat betekent nog niet dat jij er ook voor bevoegd bent.<\/p><p>Een boa heeft opsporingsbevoegdheid voor bepaalde feiten. Niet voor alle feiten. Daarom controleer je steeds: valt dit feit onder mijn bevoegdheid?<\/p><p>Ben je niet bevoegd? Dan kun je wel iets doen, bijvoorbeeld de politie inschakelen. Wat je dan precies mag: <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B4 – Grondslag opsporingsbevoegdheid boa en relevante onderdelen domeinlijst domein I. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Waar komt jouw opsporingsbevoegdheid vandaan?","html":"<h2 class=\"ptitle\">Waar komt jouw opsporingsbevoegdheid vandaan?<\/h2><div class=\"main\"><p>Je opsporingsbevoegdheid als boa is vastgelegd in regels. Die regels bepalen voor welke feiten jij bevoegd bent.<\/p><p>Welke regels dat zijn en hoe ze werken: <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B4 – Grondslag opsporingsbevoegdheid boa en relevante onderdelen domeinlijst domein I. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Domein I","html":"<h2 class=\"ptitle\">Domein I<\/h2><div class=\"main\"><p>Boa's werken in verschillende domeinen. In deze opleiding gaat het over domein I.<\/p><p>Wat domein I inhoudt en voor welke boa's het geldt: <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B4 – Grondslag opsporingsbevoegdheid boa en relevante onderdelen domeinlijst domein I. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"kader","titel":"Domeinlijst domein I","html":"<h2 class=\"ptitle\">Domeinlijst domein I<\/h2><div class=\"kaart k-kader law-card\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span class=\"kaart-lab\">Juridisch kader<\/span><\/div><div class=\"kaart-t\">Domeinlijst domein I — relevante onderdelen<\/div><div class=\"kaart-b\"><p class=\"law-intro\">Per domein is er een lijst met feiten waarvoor de boa bevoegd is. Dat heet de domeinlijst. Hieronder komen de onderdelen die over vuurwerk gaan.<\/p><div class=\"law-quote\"><div class=\"law-quote-head\"><span class=\"law-quote-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/><\/svg><\/span><span>Wettekst<\/span><\/div><p class=\"wet law-text\"><strong>Juridische inhoud nog aan te leveren/controleren.<\/strong> Hier komen de relevante onderdelen van de domeinlijst letterlijk.<\/p><\/div><div class=\"law-grid\"><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>In gewone taal<\/span><\/div><p>Uitleg volgt zodra de tekst is aangeleverd en gecontroleerd. <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><\/section><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><span>Wat betekent dit voor jou als boa?<\/span><\/div><p><strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><\/section><\/div><div class=\"law-definition\"><span class=\"law-definition-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/><\/svg><\/span><p><strong>Domeinlijst<\/strong>: een lijst met feiten waarvoor een boa in een bepaald domein opsporingsbevoegd is.<\/p><\/div><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B4 – Grondslag opsporingsbevoegdheid boa en relevante onderdelen domeinlijst domein I. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Wet milieubeheer en WED in jouw domeinlijst","html":"<h2 class=\"ptitle\">Wet milieubeheer en WED in jouw domeinlijst<\/h2><div class=\"main\"><p>In onderwerp 3 zag je dat de Wet milieubeheer en de WED een rol spelen bij vuurwerk.<\/p><p>Nu gaat het om de vraag: staan deze feiten ook op jouw domeinlijst? En zo ja, welke? <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><p>Pas als je dat weet, kun je de vraag «Ben ik bevoegd?» beantwoorden.<\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B3 – Wet op de economische delicten: bepaling(en) over strafbaarheid en strafmaat. Nog aan te leveren.<\/li><li>B4 – Grondslag opsporingsbevoegdheid boa en relevante onderdelen domeinlijst domein I. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"figuur","titel":"Van feit naar bevoegdheid","html":"<div class=\"figcap\">Van feit naar bevoegdheid<\/div><figure class=\"illu\"><svg viewBox=\"0 0 560 60\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>Van feit naar bevoegdheid<\/title><desc>Drie stappen: is er mogelijk een strafbaar feit, staat dit feit op mijn domeinlijst, ben ik dus opsporingsbevoegd. De juridische voorwaarden per stap moeten nog worden aangeleverd en gecontroleerd.<\/desc><\/svg><\/figure>"},{"kind":"casus","titel":"Je weet de categorie nog niet","html":"<span class=\"q-soort\">Voorbeeld<\/span><h2 class=\"ptitle\">Je weet de categorie nog niet<\/h2><p class=\"lees\">Je vindt in de tas vuurwerk zonder verpakking. Je weet niet welke categorie het is.<\/p><p class=\"lees\">Kun je dan al zeggen of je bevoegd bent? En mag je verder onderzoeken om daarachter te komen?<\/p>"},{"kind":"casus","titel":"Je weet de categorie nog niet — betekenis","html":"<span class=\"q-soort\">Voorbeeld<\/span><h2 class=\"ptitle\">Je weet de categorie nog niet — betekenis<\/h2><div class=\"kaart k-voorbeeld\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3v18M7 21h10\"/><path d=\"M12 6 5 8m7-2 7 2\"/><path d=\"M5 8 2.5 13a3 3 0 0 0 5 0L5 8Zm14 0-2.5 5a3 3 0 0 0 5 0L19 8Z\"/><\/svg><\/span><span class=\"kaart-lab\">Voorbeeld<\/span><\/div><div class=\"kaart-t\">Betekenis voor de praktijk<\/div><div class=\"kaart-b\"><p>Het vaststellen van de categorie kan onderdeel zijn van het onderzoek. Je hoeft dus niet alles al te weten voordat je begint.<\/p><p>Maar een definitieve juridische conclusie geven we hier nog niet. Die hangt af van de regels die nog worden aangeleverd. <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><p>Schrijf in elk geval op wat je ziet en wat je nog niet weet.<\/p><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B4 – Grondslag opsporingsbevoegdheid boa en relevante onderdelen domeinlijst domein I. Nog aan te leveren.<\/li><li>B5 – Wettelijke grondslag per bevoegdheid (staande houden, aanhouden, onderzoek, inbeslagneming, veiligstellen). Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"kaart","titel":"Let op bij bevoegdheid","html":"<h2 class=\"ptitle\">Let op bij bevoegdheid<\/h2><div class=\"kaart k-letop\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17h.01\"/><\/svg><\/span><span class=\"kaart-lab\">Let op<\/span><\/div><div class=\"kaart-t\">Let op bij bevoegdheid<\/div><div class=\"kaart-b\"><p>Aandachtspunten bij de bevoegdheid van de boa: <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><p>Twijfel je of je bevoegd bent? Neem dan contact op met je leidinggevende of met de politie. Wat daarover is afgesproken: <strong>Tekst uit het Handhavingsplan nog aan te leveren.<\/strong><\/p><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B4 – Grondslag opsporingsbevoegdheid boa en relevante onderdelen domeinlijst domein I. Nog aan te leveren.<\/li><li>B7 – Handhavingsplan: naam, versie en letterlijke passages. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"onthoud","titel":"Kort samengevat","html":"<h2 class=\"ptitle\">Kort samengevat<\/h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-t\">Bevoegdheid<\/div><div class=\"kaart-b\"><ul class=\"punten\"><li>Een strafbaar feit zien is iets anders dan daarvoor bevoegd zijn.<\/li><li>Jouw bevoegdheid hangt af van je domein en de domeinlijst.<\/li><\/ul><\/div><\/div>"},{"kind":"onthoud","titel":"Kort samengevat","html":"<h2 class=\"ptitle\">Kort samengevat<\/h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-t\">In de praktijk<\/div><div class=\"kaart-b\"><ul class=\"punten\"><li>Controleer of het feit op je domeinlijst staat. De precieze inhoud volgt nog.<\/li><li>Weet je de categorie nog niet? Dan kan het vaststellen daarvan onderdeel zijn van je onderzoek.<\/li><li>Leg vast wat je ziet en wat je nog niet weet.<\/li><\/ul><\/div><\/div>"},{"kind":"theory","titel":"Vooruitblik: Wat mag je als boa doen?","html":"<h2 class=\"ptitle\">Vooruitblik: Wat mag je als boa doen?<\/h2><div class=\"main\"><p>Je weet nu hoe je bepaalt of je bevoegd bent. In het volgende onderwerp kijken we naar wat je dan mag doen.<\/p><p>Dan gaat het om de vierde vraag: «Wat doe ik nu?»<\/p><\/div>"}],"titel":"Wanneer ben jij als boa bevoegd?","type":"content","vragen":[{"artikel":"Werkwijze","juist":2,"kernregel":"Constateren is iets anders dan opsporingsbevoegd zijn.","opties":["Ja. Als je een strafbaar feit ziet, ben je altijd bevoegd.","Ja, maar alleen als er getuigen zijn die het ook hebben gezien.","Nee. Je controleert eerst of dit feit onder jouw bevoegdheid valt.","Nee. Een boa is nooit bevoegd bij vuurwerk."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is C. Een strafbaar feit zien heet constateren. Dat is iets anders dan bevoegd zijn. Je controleert steeds of het feit onder jouw bevoegdheid valt.","voetnoten":[],"vraag":"Je ziet dat iemand een strafbaar feit pleegt. Betekent dit dat jij als boa bevoegd bent om op te treden?","wet":"—"},{"artikel":"Domeinlijst domein I","juist":0,"kernregel":"De domeinlijst bepaalt voor welke feiten je bevoegd bent.","opties":["De domeinlijst van domein I.","De folder van de gemeente over vuurwerk.","Wat de politie ter plaatse zegt.","Het etiket op de verpakking van het vuurwerk."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is A. Per domein is er een lijst met feiten waarvoor de boa bevoegd is. Dat is de domeinlijst. De relevante onderdelen voor vuurwerk worden nog aangeleverd.","voetnoten":[],"vraag":"Waar kijk je naar om te weten voor welke feiten je als boa in domein I bevoegd bent?","wet":"—"},{"artikel":"Werkwijze","juist":1,"kernregel":"Het vaststellen van de categorie kan onderdeel zijn van het onderzoek.","opties":["Je mag pas iets doen als iemand anders de categorie al heeft vastgesteld.","Het vaststellen van de categorie kan onderdeel zijn van je onderzoek.","Je gaat ervan uit dat het de zwaarste categorie is.","Je gaat ervan uit dat het de lichtste categorie is."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is B. Je hoeft niet alles al te weten voordat je begint. Het vaststellen van de categorie kan onderdeel zijn van het onderzoek. Een definitieve juridische conclusie volgt na aanlevering van de regels.","voetnoten":[],"vraag":"Je vindt vuurwerk zonder verpakking. Je weet de categorie niet. Wat is juist?","wet":"—"},{"artikel":"Werkwijze","juist":3,"kernregel":"Twijfel je over je bevoegdheid? Overleg dan.","opties":["Je treedt toch op. Achteraf wordt wel duidelijk of het mocht.","Je doet niets en loopt door. Twijfel betekent dat je niet bevoegd bent.","Je vraagt de betrokkene of hij het goed vindt dat je optreedt.","Je overlegt met je leidinggevende of met de politie."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is D. Bij twijfel over je bevoegdheid overleg je. Wat daarover precies is afgesproken, staat in het Handhavingsplan. Die tekst wordt nog aangeleverd.","voetnoten":[],"vraag":"Je twijfelt of een vuurwerkfeit op jouw domeinlijst staat. Wat doe je?","wet":"—"},{"artikel":"Werkwijze","juist":2,"kernregel":"Vraag drie: ben ik bevoegd?","opties":["Wat tref ik aan?","Is dit strafbaar?","Ben ik bevoegd?","Wat doe ik nu?"],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is C. De derde vraag is: ben ik bevoegd? Mag ik als boa voor dit feit optreden?","voetnoten":[],"vraag":"Welke vraag uit de vier vragen gaat over bevoegdheid?","wet":"—"}]},{"icoon":"list","id":"m5","kader":"Bevoegdheden","nr":5,"pages":[{"kind":"lo","titel":"Leerdoelen","html":"<h2 class=\"ptitle\">Leerdoelen<\/h2><p class=\"pintro\">Wat je na dit onderwerp kunt.<\/p><ul class=\"lo\"><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>ken je de vijf stappen van situatie tot vervolg;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je wat staande houden, aanhouden, onderzoek en inbeslagneming inhouden;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je wat veiligstellen is;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je wat er in het proces-verbaal moet staan;<\/span><\/li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>weet je wanneer je overdraagt aan de politie.<\/span><\/li><\/ul>"},{"kind":"figuur","titel":"Van mogen naar doen: vijf stappen","html":"<div class=\"figcap\">Van mogen naar doen: vijf stappen<\/div><figure class=\"illu\"><svg viewBox=\"0 0 560 60\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>Van mogen naar doen: vijf stappen<\/title><desc>Vijf stappen: situatie, wat wil je doen, mag dat, wettelijke grondslag, wat doe je vervolgens. Daarna leg je alles vast in het proces-verbaal.<\/desc><\/svg><\/figure>"},{"kind":"casus","titel":"Staande houden — situatie","html":"<span class=\"q-soort\">Voorbeeld<\/span><h2 class=\"ptitle\">Staande houden — situatie<\/h2><p class=\"lees\">De jongere met het vuurwerk in zijn hand loopt weg. Je wilt weten wie hij is.<\/p><p class=\"lees\">Staande houden betekent: je laat iemand stoppen om te vragen wie hij is. Wanneer dat mag: <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B5 – Wettelijke grondslag per bevoegdheid (staande houden, aanhouden, onderzoek, inbeslagneming, veiligstellen). Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"kaart","titel":"Staande houden — vijf stappen","html":"<h2 class=\"ptitle\">Staande houden — vijf stappen<\/h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/><\/svg><\/span><span class=\"kaart-lab\">Van mogen naar doen<\/span><\/div><div class=\"kaart-t\">Vijf stappen<\/div><div class=\"kaart-b\"><p>Bij elke bevoegdheid volg je dezelfde vijf stappen.<\/p><ul class=\"opsom\"><li><b>Situatie<\/b> — een jongere met vuurwerk loopt weg.<\/li><li><b>Wat wil je doen?<\/b> — hem laten stoppen en vragen wie hij is.<\/li><li><b>Mag dat?<\/b> — nog aan te leveren<\/li><li><b>Wettelijke grondslag<\/b> — nog aan te leveren<\/li><li><b>Wat doe je vervolgens?<\/b> — nog aan te leveren<\/li><\/ul><p>Stap 3 tot en met 5: <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B5 – Wettelijke grondslag per bevoegdheid (staande houden, aanhouden, onderzoek, inbeslagneming, veiligstellen). Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"casus","titel":"Aanhouden — situatie","html":"<span class=\"q-soort\">Voorbeeld<\/span><h2 class=\"ptitle\">Aanhouden — situatie<\/h2><p class=\"lees\">Stel dat de jongere niet wil meewerken. Je denkt eraan hem aan te houden.<\/p><p class=\"lees\">Aanhouden mag alleen als daarvoor een wettelijke grondslag is. Wanneer dat bij vuurwerk zo is: <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B5 – Wettelijke grondslag per bevoegdheid (staande houden, aanhouden, onderzoek, inbeslagneming, veiligstellen). Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"kaart","titel":"Aanhouden — vijf stappen","html":"<h2 class=\"ptitle\">Aanhouden — vijf stappen<\/h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/><\/svg><\/span><span class=\"kaart-lab\">Van mogen naar doen<\/span><\/div><div class=\"kaart-t\">Vijf stappen<\/div><div class=\"kaart-b\"><p>Bij elke bevoegdheid volg je dezelfde vijf stappen.<\/p><ul class=\"opsom\"><li><b>Situatie<\/b> — een verdachte werkt niet mee.<\/li><li><b>Wat wil je doen?<\/b> — hem aanhouden.<\/li><li><b>Mag dat?<\/b> — nog aan te leveren<\/li><li><b>Wettelijke grondslag<\/b> — nog aan te leveren<\/li><li><b>Wat doe je vervolgens?<\/b> — nog aan te leveren<\/li><\/ul><p>Stap 3 tot en met 5: <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B5 – Wettelijke grondslag per bevoegdheid (staande houden, aanhouden, onderzoek, inbeslagneming, veiligstellen). Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"casus","titel":"Onderzoek om het feit vast te stellen — situatie","html":"<span class=\"q-soort\">Voorbeeld<\/span><h2 class=\"ptitle\">Onderzoek om het feit vast te stellen — situatie<\/h2><p class=\"lees\">Je wilt weten wat er in de tas zit. Dan kun je beter bepalen welk vuurwerk het is.<\/p><p class=\"lees\">Welk onderzoek je mag doen en hoe ver dat mag gaan: <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B5 – Wettelijke grondslag per bevoegdheid (staande houden, aanhouden, onderzoek, inbeslagneming, veiligstellen). Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"kaart","titel":"Onderzoek — vijf stappen","html":"<h2 class=\"ptitle\">Onderzoek — vijf stappen<\/h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/><\/svg><\/span><span class=\"kaart-lab\">Van mogen naar doen<\/span><\/div><div class=\"kaart-t\">Vijf stappen<\/div><div class=\"kaart-b\"><p>Bij elke bevoegdheid volg je dezelfde vijf stappen.<\/p><ul class=\"opsom\"><li><b>Situatie<\/b> — er staat een tas met vuurwerk.<\/li><li><b>Wat wil je doen?<\/b> — de inhoud bekijken om het feit vast te stellen.<\/li><li><b>Mag dat?<\/b> — nog aan te leveren<\/li><li><b>Wettelijke grondslag<\/b> — nog aan te leveren<\/li><li><b>Wat doe je vervolgens?<\/b> — nog aan te leveren<\/li><\/ul><p>Stap 3 tot en met 5: <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B5 – Wettelijke grondslag per bevoegdheid (staande houden, aanhouden, onderzoek, inbeslagneming, veiligstellen). Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"casus","titel":"Inbeslagneming — situatie","html":"<span class=\"q-soort\">Voorbeeld<\/span><h2 class=\"ptitle\">Inbeslagneming — situatie<\/h2><p class=\"lees\">In de tas zit vuurwerk dat mogelijk verboden is. Je wilt het meenemen.<\/p><p class=\"lees\">Dat heet inbeslagneming. Wanneer dat mag en hoe je het doet: <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B5 – Wettelijke grondslag per bevoegdheid (staande houden, aanhouden, onderzoek, inbeslagneming, veiligstellen). Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"kaart","titel":"Inbeslagneming — vijf stappen","html":"<h2 class=\"ptitle\">Inbeslagneming — vijf stappen<\/h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/><\/svg><\/span><span class=\"kaart-lab\">Van mogen naar doen<\/span><\/div><div class=\"kaart-t\">Vijf stappen<\/div><div class=\"kaart-b\"><p>Bij elke bevoegdheid volg je dezelfde vijf stappen.<\/p><ul class=\"opsom\"><li><b>Situatie<\/b> — er ligt mogelijk verboden vuurwerk.<\/li><li><b>Wat wil je doen?<\/b> — het vuurwerk in beslag nemen.<\/li><li><b>Mag dat?<\/b> — nog aan te leveren<\/li><li><b>Wettelijke grondslag<\/b> — nog aan te leveren<\/li><li><b>Wat doe je vervolgens?<\/b> — nog aan te leveren<\/li><\/ul><p>Stap 3 tot en met 5: <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B5 – Wettelijke grondslag per bevoegdheid (staande houden, aanhouden, onderzoek, inbeslagneming, veiligstellen). Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Veiligstellen","html":"<h2 class=\"ptitle\">Veiligstellen<\/h2><div class=\"main\"><p>Veiligstellen betekent: je zorgt dat iets niet verdwijnt en geen gevaar oplevert. Tot het goed is afgehandeld.<\/p><p>Wat veiligstellen juridisch inhoudt: <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><p>Hoe je vuurwerk veilig bewaart of laat ophalen: <strong>Veiligheidsrichtlijn nog aan te leveren.<\/strong><\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B5 – Wettelijke grondslag per bevoegdheid (staande houden, aanhouden, onderzoek, inbeslagneming, veiligstellen). Nog aan te leveren.<\/li><li>B8 – Veiligheidsrichtlijn voor onbekend en zwaar illegaal vuurwerk: bron en tekst. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Proces-verbaal","html":"<h2 class=\"ptitle\">Proces-verbaal<\/h2><div class=\"main\"><p>Wat je doet, leg je vast in een proces-verbaal. Daarin staat wat je hebt gezien, gehoord en gedaan.<\/p><p>Het proces-verbaal gaat naar de officier van justitie. Die beslist over de zaak. Soms komt de zaak bij de rechter.<\/p><p>Welke eisen er aan het proces-verbaal worden gesteld: <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B6 – Eisen aan het proces-verbaal. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"lijst","titel":"Wat moet in het proces-verbaal?","html":"<h2 class=\"ptitle\">Wat moet in het proces-verbaal?<\/h2><div class=\"main\"><p>Schrijf feiten op, geen conclusies. Denk in elk geval aan:<\/p><ul class=\"opsom\"><li>de plaats en het tijdstip;<\/li><li>wat je zag en hoorde;<\/li><li>hoe het vuurwerk eruitzag en hoeveel het was;<\/li><li>wat er op de verpakking stond, of dat er geen verpakking was;<\/li><li>welke bevoegdheden je hebt gebruikt;<\/li><li>overige verplichte onderdelen: <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/li><\/ul><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B6 – Eisen aan het proces-verbaal. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"theory","titel":"Overdracht aan de politie","html":"<h2 class=\"ptitle\">Overdracht aan de politie<\/h2><div class=\"main\"><p>Soms draag je een zaak over aan de politie. Bijvoorbeeld als het te gevaarlijk is of als je niet bevoegd bent.<\/p><p>Wanneer je overdraagt en hoe dat gaat: <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong> <strong>Tekst uit het Handhavingsplan nog aan te leveren.<\/strong><\/p><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B5 – Wettelijke grondslag per bevoegdheid (staande houden, aanhouden, onderzoek, inbeslagneming, veiligstellen). Nog aan te leveren.<\/li><li>B7 – Handhavingsplan: naam, versie en letterlijke passages. Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"kaart","titel":"Let op: algemene eisen aan optreden","html":"<h2 class=\"ptitle\">Let op: algemene eisen aan optreden<\/h2><div class=\"kaart k-letop\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17h.01\"/><\/svg><\/span><span class=\"kaart-lab\">Let op<\/span><\/div><div class=\"kaart-t\">Let op: algemene eisen aan optreden<\/div><div class=\"kaart-b\"><p>Ook als je bevoegd bent, gelden er algemene eisen voor hoe je optreedt. <strong>Juridische inhoud nog aan te leveren/controleren.<\/strong><\/p><p>Stel je steeds de vraag: is wat ik doe nodig? En is er geen lichtere manier?<\/p><\/div><\/div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen<\/div><ol class=\"bb-l\"><li>B5 – Wettelijke grondslag per bevoegdheid (staande houden, aanhouden, onderzoek, inbeslagneming, veiligstellen). Nog aan te leveren.<\/li><\/ol><\/div>"},{"kind":"onthoud","titel":"Kort samengevat","html":"<h2 class=\"ptitle\">Kort samengevat<\/h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-t\">Bevoegdheden<\/div><div class=\"kaart-b\"><ul class=\"punten\"><li>Volg bij elke bevoegdheid vijf stappen: situatie, wat wil je doen, mag dat, grondslag, vervolg.<\/li><li>Staande houden, aanhouden, onderzoek en inbeslagneming vragen elk een wettelijke grondslag.<\/li><\/ul><\/div><\/div>"},{"kind":"onthoud","titel":"Kort samengevat","html":"<h2 class=\"ptitle\">Kort samengevat<\/h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/><\/svg><\/span><span class=\"kaart-lab\">Onthoud<\/span><\/div><div class=\"kaart-t\">Vastleggen en overdragen<\/div><div class=\"kaart-b\"><ul class=\"punten\"><li>Veiligstellen: zorgen dat niets verdwijnt en niets gevaar oplevert.<\/li><li>Leg alles vast in het proces-verbaal: feiten, geen conclusies.<\/li><li>Soms draag je over aan de politie. De afspraken volgen nog.<\/li><\/ul><\/div><\/div>"},{"kind":"theory","titel":"Vooruitblik: Onbekend en zwaar illegaal vuurwerk","html":"<h2 class=\"ptitle\">Vooruitblik: Onbekend en zwaar illegaal vuurwerk<\/h2><div class=\"main\"><p>Je weet nu hoe je van mogen naar doen gaat. Maar wat als het vuurwerk gevaarlijk kan zijn?<\/p><p>In het volgende onderwerp komen veiligheid en bevoegdheid samen.<\
